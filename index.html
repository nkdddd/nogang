<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 🔒 잘못 터치해도 화면이 확대되지 않게 (두 번 톡 · 두 손가락 벌리기) -->
<style>html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* 🔤 글꼴 역할: 본문 400 · 버튼 · 과목명 600 · 화면 제목 700 · 시간 숫자는 고정폭 */
  button:not(:has(*)){font-weight:var(--fw-semibold);}
  .subj-tag{font-weight:var(--fw-semibold);}
  h1,h2,.page-h h2,.drawer-head h3,.dl-head h2{font-weight:var(--fw-bold);}
  .timer-btn,.time-tag,.nu-prog,.goal-card,.task-sub,.dash-stat .big,.r-stat b,.fo-time,.rg small,.tm-cnt,.subj-bar-num,.cc-txt,.hb-t small,.bd small,.bd-best,.bd-month small,.paybar,.wstrip{font-variant-numeric:tabular-nums;}
</style>
<script>(function(){var no=function(e){e.preventDefault();};
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,no,{passive:false});});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});})();</script>

<title>우리집 학습플래너</title>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="학습플래너">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F2F7">
<meta name="color-scheme" content="light">
<script src="assets/device.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preload" href="assets/fonts/pretendard/woff2-dynamic-subset/PretendardVariable.subset.91.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/pretendard/pretendard.css">
<style>
  :root{
  /* 🔤 글꼴 토큰 — Pretendard (assets/fonts/pretendard, 못 불러오면 기기 한글 글꼴) */
  --font-sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
    --ink:#1E2A4A; --bg:#F5F6F8; --surface:#fff; --line:#E8EBF0; --line2:#EDF0F5;
    --blue:#6A58E6; --green:#0E9F6E; --amber:#F5A524; --red:#E5484D; --purple:#8E4EC6;
    --muted:#94A3B8; --muted2:#64748B; --slate:#475569;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--font-sans);font-weight:var(--fw-regular);
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
    padding-bottom:env(safe-area-inset-bottom);}
  input,textarea,button,select{font-family:inherit;font-size:16px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;}
  .hidden{display:none!important;}
  button{cursor:pointer;}

  /* ===== AUTH ===== */
  #auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;}
  .yt-banners{width:100%;max-width:390px;display:grid;grid-template-columns:1fr;gap:10px;}
  .yt-banner{display:flex;align-items:center;gap:8px;min-width:0;padding:11px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(30,42,74,.06);color:var(--ink);text-decoration:none;}
  .yt-banner:active{transform:scale(.98);}
  .yt-banner svg{width:26px;height:19px;flex:0 0 auto;}
  .yt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .yt-t b{font-size:12.5px;font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .yt-t small{font-size:11px;color:var(--muted);white-space:nowrap;}
  .yt-go{color:var(--muted);font-size:16px;flex:0 0 auto;}
  @media(max-width:360px){.yt-banners{grid-template-columns:1fr;}}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:390px;box-shadow:0 10px 40px rgba(30,42,74,.08);}
  .auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6A58E6,#8E4EC6);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}
  .auth-title{font-size:21px;font-weight:var(--fw-bold);text-align:center;letter-spacing:-.02em;}
  .auth-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:22px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:12.5px;font-weight:var(--fw-bold);color:var(--slate);margin-bottom:6px;}
  .inp{width:100%;padding:11px 13px;border:1px solid #E2E8F0;border-radius:10px;font-size:15px;outline:none;background:#fff;}
  .inp:focus{border-color:var(--blue);}
  .role-pick{display:flex;gap:8px;}
  .role-pick button{flex:1;padding:11px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;font-weight:var(--fw-semibold);font-size:14px;color:var(--slate);}
  .role-pick button.on{border-color:var(--blue);background:#EFECFD;color:var(--blue);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:var(--fw-semibold);font-size:15px;margin-top:6px;}
  .btn-primary:disabled{opacity:.5;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted2);}
  .auth-switch a{color:var(--blue);font-weight:var(--fw-bold);text-decoration:none;}
  .auth-err{background:#FFF5F6;color:var(--red);border:1px solid #FADADD;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
  .cfg-warn{background:#FFF8EC;color:#92610A;border:1px solid #F5D999;border-radius:9px;padding:11px 13px;font-size:12px;margin-bottom:14px;line-height:1.5;}

  /* ===== HEADER ===== */
  header{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;position:relative;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6A58E6,#8E4EC6);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .brand h1{font-size:16px;font-weight:var(--fw-bold);letter-spacing:-.02em;}
  .brand p{font-size:11px;color:var(--muted);}
  .who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .who-chip{display:flex;align-items:center;gap:7px;background:#F1F4F8;border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:var(--fw-semibold);color:var(--slate);}
  .who-chip .av{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:var(--fw-bold);}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid #E5E9F0;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:17px;}
  .icon-btn.sm{width:30px;height:30px;font-size:14px;}

  /* viewing-child banner */
  .child-banner{display:flex;align-items:center;gap:10px;background:#FBF7FF;border-bottom:1px solid #EFE3FB;padding:8px 16px;font-size:13px;color:#6D28A8;font-weight:600;}
  .child-banner button{margin-left:auto;border:1px solid #E4CDF7;background:#fff;color:#8E4EC6;border-radius:8px;padding:5px 11px;font-weight:var(--fw-semibold);font-size:12.5px;}

  /* ===== TOOLBAR ===== */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;flex-wrap:wrap;}
  .navg{display:flex;align-items:center;gap:7px;}
  .today-btn{padding:7px 13px;border:1px solid #D9DEE7;border-radius:9px;background:#fff;font-weight:var(--fw-semibold);font-size:13px;color:var(--slate);}
  .period{font-weight:var(--fw-bold);font-size:16px;margin-left:6px;letter-spacing:-.02em;}
  .vtoggle{display:flex;background:#EBEEF3;border-radius:10px;padding:3px;}
  .vtoggle button{padding:6px 15px;border:none;background:transparent;border-radius:8px;font-weight:var(--fw-semibold);font-size:13px;color:var(--muted2);}
  .vtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  main{padding:2px 16px 48px;}

  /* ===== MONTH ===== */
  .month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .wd-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2);}
  .wd-head div{padding:9px 0;text-align:center;font-size:12.5px;font-weight:var(--fw-bold);color:var(--muted2);}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,auto);}
  .mcell{border-right:1px solid #F1F4F8;border-bottom:1px solid #F1F4F8;padding:6px;position:relative;min-height:92px;overflow:hidden;}
  .mcell.out{background:#FAFBFC;opacity:.5;}
  .mcell-top{display:flex;align-items:center;gap:4px;min-width:0;padding-right:22px;}
  .daynum{font-size:13px;font-weight:var(--fw-bold);width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#334155;}
  .daynum.today{background:var(--blue);color:#fff;border-radius:50%;}
  .rate-badge{font-size:10px;font-weight:var(--fw-bold);color:#fff;padding:1px 6px;border-radius:999px;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;}
  .cell-add{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:6px;border:none;background:#F1F4F8;color:var(--muted2);font-size:12px;opacity:.7;}
  .dotrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

  /* ===== WEEK ===== */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .wcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px;display:flex;flex-direction:column;}
  .wcol.today{background:#F0F5FF;}
  .wcol-head{text-align:center;padding:9px 6px 7px;border-bottom:1px solid #F1F4F8;}
  .wcol-head .wd{font-size:12px;font-weight:var(--fw-bold);color:var(--muted2);}
  .wcol-head .num{font-size:17px;font-weight:var(--fw-bold);width:28px;height:28px;margin:2px auto 0;display:flex;align-items:center;justify-content:center;}
  .wcol-head .num.today{background:var(--blue);color:#fff;border-radius:50%;}
  .wcol-head .mini{font-size:11px;color:var(--green);font-weight:var(--fw-bold);margin-top:2px;}
  .wcol-body{padding:6px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .wcard{display:flex;gap:6px;align-items:flex-start;background:#F8FAFC;border-radius:9px;padding:6px 7px;}
  .wcard .chk{border:none;background:transparent;padding:0;font-size:15px;line-height:1;margin-top:1px;}
  .wcard .tt{font-size:12px;font-weight:var(--fw-bold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wcard .ss{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wadd{border:1px dashed #D1D9E4;background:transparent;border-radius:8px;padding:6px;font-size:12px;color:var(--muted);margin-top:auto;}

  /* ===== DAY ===== */
  .day{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start;}
  .day-side{display:flex;flex-direction:column;gap:11px;position:sticky;top:72px;}
  .sum-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .sum-title{font-size:13px;font-weight:var(--fw-bold);color:var(--muted2);margin-bottom:8px;}
  .sum-stat{margin-top:6px;font-size:14px;color:var(--slate);}
  .mini-row{display:flex;gap:9px;}
  .mini-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;}
  .mini-stat .v{font-size:15px;font-weight:var(--fw-bold);}
  .mini-stat .l{font-size:11px;color:var(--muted);}
  .goal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;}
  .goal-top{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:var(--fw-bold);color:var(--slate);margin-bottom:8px;}
  .bar-track{height:9px;background:#EDF0F5;border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#6A58E6,#0E9F6E);border-radius:999px;transition:width .4s;}
  .goal-num{font-size:12px;color:var(--muted2);margin-top:6px;text-align:right;}

  .day-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .dl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px;}
  .dl-head h2{font-size:16px;font-weight:var(--fw-bold);}
  .dl-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .add-btn{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:var(--fw-semibold);font-size:13.5px;}
  .empty{text-align:center;color:var(--muted);padding:38px 0;font-size:14px;}

  .task{border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;overflow:hidden;position:relative;transition:.25s;}
  /* 완료 상태: 확실히 구분되는 시각 보상 */
  .task.done{border:1.5px solid #7BD3A8;background:linear-gradient(135deg,#F3FBF7 0%,#EAF7F1 100%);
    box-shadow:0 2px 10px rgba(14,159,110,.10);}
  .task.done{background:#FAFCFB;}
  .task.done .done-mark{position:absolute;top:5px;right:6px;color:#fff;font-size:14px;font-weight:var(--fw-bold);z-index:1;}
  .task.done .task-title{color:#0E7A55;}
  .done-stamp{display:inline-flex;align-items:center;gap:5px;background:#0E9F6E;color:#fff;
    font-size:11.5px;font-weight:var(--fw-bold);padding:4px 10px;border-radius:999px;margin-top:7px;
    box-shadow:0 2px 6px rgba(14,159,110,.28);}
  @keyframes taskPop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
  .task.just-done{animation:taskPop .45s ease;}

  /* 참잘했어요 도장 */
  .stamp{position:absolute;right:12px;bottom:12px;width:74px;height:74px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:3px double #E5484D;color:#E5484D;background:rgba(255,255,255,.55);
    transform:rotate(-14deg);pointer-events:none;opacity:.92;z-index:2;
    box-shadow:inset 0 0 0 1px rgba(229,72,77,.25);}
  .stamp b{font-size:14px;font-weight:var(--fw-bold);letter-spacing:-.5px;line-height:1.1;}
  .stamp i{font-size:8.5px;font-style:normal;font-weight:var(--fw-bold);letter-spacing:.5px;opacity:.85;}
  .stamp.blue{border-color:#6A58E6;color:#6A58E6;box-shadow:inset 0 0 0 1px rgba(62,99,221,.25);}
  .stamp.gold{border-color:#B8891F;color:#B8891F;box-shadow:inset 0 0 0 1px rgba(184,137,31,.25);}
  @keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}
    60%{transform:rotate(-14deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.92}}
  .task.just-done .stamp{animation:stampIn .5s cubic-bezier(.3,1.4,.5,1);}
  @media(max-width:720px){ .stamp{width:62px;height:62px;right:8px;bottom:8px;} .stamp b{font-size:12px;} .stamp i{font-size:7.5px;} }

  /* 어제의 나 vs 오늘의 나 */
  .vs-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;}
  .vs-head{font-size:12.5px;font-weight:var(--fw-bold);color:#1E2A4A;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .vs-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .vs-lbl{font-size:11.5px;color:#94A3B8;width:52px;flex-shrink:0;font-weight:var(--fw-bold);}
  .vs-bar{flex:1;height:22px;background:#F1F4F8;border-radius:7px;overflow:hidden;position:relative;}
  .vs-bar>div{height:100%;border-radius:7px;transition:width .5s;display:flex;align-items:center;padding-left:8px;}
  .vs-bar span{font-size:11px;font-weight:var(--fw-bold);color:#fff;white-space:nowrap;}
  .vs-verdict{font-size:12.5px;font-weight:var(--fw-bold);padding:9px 12px;border-radius:9px;line-height:1.5;}
  .task-main{display:flex;gap:11px;padding:13px;}
  .big-chk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid #CBD5E1;background:#fff;padding:0;margin-top:2px;cursor:pointer;position:relative}
  .big-chk.on{background:#0E9F6E;border-color:#0E9F6E}
  .big-chk.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .task-sub{font-size:12.5px;color:#64748B;margin-top:3px}.task-sub.ok{color:#0E7A55;font-weight:var(--fw-bold)}
  .task-quick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .timer-btn.app{background:#F3FBF7;border-color:#BFE8D6;color:#0E7A55}
  .done-btn{border:1.5px solid #0E9F6E;background:#fff;color:#0E7A55;font-weight:var(--fw-semibold);font-size:13px;border-radius:10px;padding:7px 16px;cursor:pointer}
  .more-btn{border:0;background:none;color:#94A3B8;font-size:12px;font-weight:var(--fw-semibold);padding:8px 0 0;cursor:pointer}
  .task-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}.task-links .sp{flex:1}
  .task-links button{border:1px solid var(--line,#E4E4EA);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;color:#64748B;cursor:pointer}
  .task-links button.del{color:#E5484D}
  .link-btn{border:0;background:none;color:#6A58E6;font-weight:var(--fw-semibold);font-size:12px;cursor:pointer}
  .next-up{background:var(--surface,#fff);border:1px solid var(--line,#E4E4EA);border-radius:16px;padding:13px 14px;margin-bottom:12px}
  .nu-prog{display:flex;justify-content:space-between;font-size:13px;color:#64748B;margin-bottom:6px}.nu-prog b{color:var(--ink,#1C1B22);font-size:16px}
  .nu-lbl{font-size:11.5px;font-weight:var(--fw-bold);color:#94A3B8;margin:12px 0 6px}
  .nu-row{display:flex;gap:9px;align-items:flex-start}
  .nu-title{font-weight:var(--fw-bold);font-size:15.5px;min-width:0}.nu-title small{display:block;font-weight:600;font-size:12px;color:#94A3B8;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .subj-tag{color:#fff;font-size:12px;font-weight:var(--fw-semibold);padding:3px 10px;border-radius:7px;}
  .tb-tag{font-size:11.5px;color:var(--slate);background:#F1F4F8;padding:3px 8px;border-radius:7px;font-weight:var(--fw-semibold);}
  .unit-tag{font-size:11.5px;color:var(--purple);background:#F5EEFC;padding:3px 8px;border-radius:7px;font-weight:var(--fw-semibold);}
  .method-tag{font-size:11.5px;color:#334155;background:#EFECFD;padding:3px 8px;border-radius:7px;font-weight:var(--fw-semibold);}
  .time-tag{font-size:11.5px;color:var(--muted2);background:#F8FAFC;padding:3px 8px;border-radius:7px;}
  .planned-note{font-size:13px;color:var(--slate);margin-top:8px;}
  .exec-row{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap;}
  .exec-fld{display:flex;flex-direction:column;gap:4px;}
  .exec-fld.grow{flex:1;min-width:150px;}
  .exec-lbl{font-size:11px;color:var(--muted);font-weight:var(--fw-bold);}
  .exec-min{width:82px;padding:7px 9px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;}
  .exec-note{width:100%;padding:7px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;}

  /* ===== MODAL / DRAWER ===== */

  .drawer{background:#F7F8FB;height:100%;width:100%;max-width:420px;margin-left:auto;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);}

  .tab{padding:8px 14px;border:none;background:transparent;border-bottom:2px solid transparent;font-weight:var(--fw-semibold);font-size:13.5px;color:var(--muted);}

  .list-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:14px;font-weight:600;}
  .add-line{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border:1px dashed #CBD5E1;border-radius:10px;background:#fff;color:var(--blue);font-weight:var(--fw-bold);font-size:13.5px;margin-top:4px;}
  .section-lbl{font-size:12px;font-weight:var(--fw-bold);color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
  .code-box{background:linear-gradient(135deg,#6A58E6,#8E4EC6);border-radius:14px;padding:18px;color:#fff;text-align:center;margin-bottom:18px;}
  .code-box .lbl{font-size:12px;opacity:.85;}
  .code-box .code{font-size:32px;font-weight:var(--fw-bold);letter-spacing:.15em;margin:6px 0;font-variant-numeric:tabular-nums;}
  .code-box button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-weight:var(--fw-semibold);font-size:12.5px;}
  .share-note{display:flex;gap:8px;align-items:flex-start;background:#EFECFD;border-radius:10px;padding:12px;font-size:12.5px;color:var(--slate);margin-top:18px;line-height:1.5;}
  .child-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:11px;padding:12px 13px;margin-bottom:9px;}
  .child-item .av{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);font-size:14px;}
  .child-item .open{margin-left:auto;border:1px solid var(--blue);background:#EFECFD;color:var(--blue);border-radius:8px;padding:6px 12px;font-weight:var(--fw-bold);font-size:12.5px;}

  /* dashboard */

  .subj-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

  /* 용돈 */

  .paid-badge{background:#EAF7F1;color:#0E9F6E;border:1px solid #BFE8D6;border-radius:9px;padding:8px 13px;font-weight:var(--fw-bold);font-size:13px;}
  .pay-hist{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:7px;font-size:13px;width:100%;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:inherit;align-items:center;gap:8px}
  .pay-hist small{color:#94A3B8;font-weight:600}.pay-hist.on{border-color:#6A58E6;background:#F4F2FE}
  .allow-nav{display:flex;align-items:center;gap:8px;margin:0 0 10px}.allow-nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:var(--fw-semibold);cursor:pointer;color:#4B3FA6;white-space:nowrap}
  .allow-nav button:disabled{opacity:.35;cursor:default}.allow-nav .w{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.25}.allow-nav .w b{font-size:14.5px}.allow-nav .w small{font-size:11.5px;color:#94A3B8;font-weight:var(--fw-bold)}
  .allow-now{display:block;margin:-4px auto 10px;border:0;background:none;color:#6A58E6;font:inherit;font-size:12.5px;font-weight:var(--fw-bold);cursor:pointer}
  .crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

  .pay-ctrl .fld-lbl{font-size:11.5px;}
  .pay-ctrl .inp{padding:9px 10px;}

  .fld-lbl{display:block;font-size:12.5px;font-weight:var(--fw-bold);color:var(--slate);margin-bottom:6px;}

  /* 학습 카드 제목·기록 버튼 */
  .task-title{font-size:15px;font-weight:var(--fw-bold);color:#1E2A4A;margin:6px 0 2px;cursor:pointer;line-height:1.35;}
  .task-title:hover{color:#6A58E6;}
  .rec-btn{width:100%;margin:8px 0 2px;border:1.5px solid #DCD6F7;background:#F7F6FE;color:#6A58E6;
    border-radius:10px;padding:9px;font-size:13px;font-weight:var(--fw-semibold);cursor:pointer;font-family:inherit;}

    padding:16px;font-size:14px;font-weight:var(--fw-semibold);cursor:pointer;font-family:inherit;margin-top:4px;transition:.15s;}

  .hub-item{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s;}

  .timer-btn{border:1.5px solid #DCD6F7;background:#F7F6FE;color:#6A58E6;border-radius:9px;padding:6px 11px;font-weight:var(--fw-semibold);font-size:12px;cursor:pointer;}

  /* 주간 마감/계획 배너 */

  /* 주간 대결 · 챔피언 인증카드 */
  .rank-row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;}
  .rank-row .medal{font-size:20px;width:26px;text-align:center;}

  .cert{border-radius:16px;padding:18px;text-align:center;color:#3a2f00;margin-bottom:14px;
    background:linear-gradient(135deg,#FFF7DA,#FDEBC0);border:2px solid #E8C879;box-shadow:0 8px 24px rgba(184,137,31,.18);position:relative;overflow:hidden;}

  /* 파트너 몬스터 */
  .carry-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}

  .carry-row:has(input:checked){border-color:var(--accent,#6A58E6);background:color-mix(in srgb,var(--accent,#6A58E6) 7%,var(--surface,#fff))}
  .carry-row .cr-t{flex:1;min-width:0;font-weight:var(--fw-bold);font-size:13.5px;display:flex;flex-direction:column}

  /* 🐣 내 캐릭터 */
  .ver-bar{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:9500;display:flex;align-items:center;gap:10px;background:#1E2A4A;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;font-size:13.5px;font-weight:var(--fw-semibold);box-shadow:0 8px 24px rgba(0,0,0,.25)}

  /* 할 일 탭 '오늘' 카드 */

  .td-hero.full{border-color:#A7E3C8;background:linear-gradient(180deg,#F2FBF6,var(--surface))}

  .mon-xp{height:8px;background:#EDF0F5;border-radius:999px;overflow:hidden;margin-top:8px;}
  .mon-xp>div{height:100%;background:linear-gradient(90deg,#F5A524,#E5484D);border-radius:999px;transition:width .4s;}
  .mon-pick{display:flex;gap:10px;justify-content:center;}
  .mon-pick button{background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:10px;cursor:pointer;}
  .mon-pick button.on{border-color:#F5A524;background:#FFFBEF;}
  .mon-pick .pk-name{font-size:11.5px;font-weight:var(--fw-bold);color:#475569;margin-top:4px;}
  @keyframes monBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .tier-card{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--surface,#fff);border-color:var(--line,#E4E4EA);}
  .tier-card .mon-xp,.tier-card .mon-msg{grid-column:1/-1;}
  .tier-card .mon-msg{background:#F6F6FA;color:#64748B;}
  .tier-card .mon-xp>div{background:linear-gradient(90deg,#8F80FF,#6A58E6);}

  /* 동기부여 */
  .cheer{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(135deg,#EFECFD,#F3EEFF);border:1px solid #E6E1FB;border-radius:13px;padding:13px 15px;margin-bottom:13px;}
  .cheer .emo{font-size:26px;line-height:1;}
  .cheer .msg{font-weight:var(--fw-bold);font-size:14.5px;color:#35296E;}
  .cheer .tip{font-size:12px;color:#6B7280;margin-top:3px;line-height:1.5;}
  .rollover-btn{border:1px solid #E2E8F0;background:#fff;color:#64748B;border-radius:9px;padding:8px 12px;font-weight:var(--fw-semibold);font-size:12.5px;}
  .quick-praise{border:1px solid #E4CDF7;background:#FBF7FF;color:#8E4EC6;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:var(--fw-bold);}
  .badges{display:flex;flex-wrap:wrap;gap:9px;}
  .badge{display:flex;flex-direction:column;align-items:center;gap:3px;width:74px;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:center;}
  .badge.locked{opacity:.38;filter:grayscale(1);}
  .badge .b-emo{font-size:24px;line-height:1;}
  .badge .b-name{font-size:10.5px;font-weight:var(--fw-bold);color:var(--slate);line-height:1.25;}
  .toast-wrap{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;}
  .toast{background:#1E2A4A;color:#fff;padding:11px 18px;border-radius:12px;font-weight:var(--fw-bold);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:90%;animation:toastIn .22s ease;}
  .toast.good{background:#0E9F6E;} .toast.info{background:#6A58E6;} .toast.cheer{background:linear-gradient(135deg,#8E4EC6,#6A58E6);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  @media(max-width:720px){
    .day{grid-template-columns:1fr;}
    .day-side{position:static;flex-direction:column;}
    .week{grid-template-columns:1fr;}
    .wcol{min-height:auto;}
    .mgrid{grid-auto-rows:minmax(64px,auto);}
    .mcell{min-height:64px;padding:4px;}
    .mcell-top{padding-right:2px;gap:2px;}
    .cell-add{display:none;}
    .daynum{width:20px;height:20px;font-size:12px;}
    .rate-badge{font-size:9px;padding:1px 4px;}
    .dot{width:6px;height:6px;}
    .period{font-size:15px;}
    /* 헤더 축약 */
    header{padding:9px 11px;gap:8px;}
    header h1{font-size:15px;}
    #brandSub{display:none;}
    .logo{width:32px;height:32px;font-size:17px;}
    .who{gap:5px;}
    .who-chip{padding:4px 9px 4px 6px;font-size:12px;max-width:104px;overflow:hidden;white-space:nowrap;}
    .who-chip span:last-child{overflow:hidden;text-overflow:ellipsis;}
    .icon-btn{width:33px;height:33px;font-size:16px;}
    .more-menu{right:8px;top:52px;min-width:180px;}
    /* 툴바 줄바꿈 허용 */
    .toolbar{flex-wrap:wrap;gap:7px;}
    /* 드로어 내부 그리드: 인라인 4열·3열 지정도 2열로 강제 */
    .drawer-body .dash-cards{grid-template-columns:1fr 1fr !important;}
    .drawer-body .crit-grid{grid-template-columns:1fr !important;}
    .dash-stat .big{font-size:15px !important;}
    .drawer-body .cp-act .cp-btn{width:100%;}
    .allow-card .name{flex-wrap:wrap;}
  }
  @media(max-width:400px){
    header h1{font-size:14px;}
    .who-chip{max-width:78px;}
    #monHead{display:none !important;}
  }

  /* =====================================================================
   *  하루틀 UI 셸 — 아래쪽 메뉴(할 일 · 일정 · 학습 · 기록) + ✨ 빠른 계획
   *  (위의 기존 스타일을 덮어씁니다)
   * ===================================================================== */
  :root{
    --bg:#F3F2F7; --surface:#fff; --surface2:#E9E8F0; --line:#E4E2EC; --line2:#EDEBF3;
    --ink:#1C1B24; --muted:#8F8D9B; --muted2:#6D6B7A; --slate:#4A4858;
    --blue:#6A58E6; --accent:#6A58E6; --accent-2:#8F80FF; --accent-soft:#EFECFD;
    --shadow:0 10px 30px rgba(20,16,50,.10);
    --r:18px;
  }
  html{color-scheme:light;}
  body{background:var(--bg);color:var(--ink);padding-bottom:0;}
  #app{max-width:760px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom));}
  body.lapp-open{overflow:hidden;}

  /* ----- 로그인 ----- */
  #auth{background:var(--bg);}
  .auth-card{border-radius:24px;border:none;box-shadow:var(--shadow);}
  .auth-logo,.code-box{background:linear-gradient(135deg,#8F80FF,#6A58E6 55%,#5646D0);}
  .inp,.textarea{border-color:var(--line);border-radius:12px;}
  .btn-primary{border-radius:14px;background:var(--ink);}

  /* ----- 상단 바 ----- */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(243,242,247,.9);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .tb-chips{display:flex;gap:12px;align-items:center;font-weight:var(--fw-semibold);font-size:15px;font-variant-numeric:tabular-nums;}
  .tb-chips span{display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .tb-mon{display:none;}
  .paybar{flex:1;min-width:0;text-align:left;border:1px solid var(--line,#E4E4EA);background:var(--surface,#fff);border-radius:14px;padding:7px 11px 6px;cursor:pointer;font:inherit;color:inherit;}
  .paybar .pb-top{display:flex;align-items:baseline;gap:7px;white-space:nowrap;min-width:0}
  .paybar .pb-amt{font-size:18px;font-weight:var(--fw-bold);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .paybar .pb-today{font-size:12px;font-weight:var(--fw-bold);color:#64748B;overflow:hidden;text-overflow:ellipsis}
  .paybar .pb-today.up{color:#0E9F6E}.paybar .pb-today.down{color:#E5484D}
  .paybar .pb-dl{margin-left:auto;font-size:11px;font-weight:var(--fw-bold);color:#94A3B8;padding-left:4px}
  .paybar .pb-track{display:flex;height:5px;border-radius:99px;background:#EDEDF3;overflow:hidden;margin-top:5px}
  .paybar .pb-track i{display:block;height:100%}
  .paybar .pb-lbl{display:flex;gap:9px;font-size:11px;color:#64748B;margin-top:4px;white-space:nowrap;overflow:hidden}
  @media(max-width:520px){ .tb-who span:last-child{display:none;} .tb-who{padding:4px;} .paybar .pb-lbl{display:none;} }
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
  .tb-who{display:flex;align-items:center;gap:6px;border:none;background:var(--surface);border-radius:999px;
    padding:4px 12px 4px 4px;font-weight:var(--fw-bold);font-size:13px;color:var(--slate);max-width:150px;min-width:0;
    box-shadow:0 1px 2px rgba(20,16,50,.06);}
  .tb-who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;}
  .tb-who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-pill{display:flex;align-items:center;background:var(--surface2);border-radius:999px;padding:3px;}
  .tb-pill button{width:42px;height:36px;border:none;background:transparent;border-radius:999px;font-size:19px;
    color:var(--ink);font-weight:var(--fw-semibold);display:flex;align-items:center;justify-content:center;}
  .tb-pill button:active{background:var(--surface);}
  .tb-pill svg{width:20px;height:20px;}
  #menuBtn{position:relative;}
  #menuBtn.has-dot::after{content:"";position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 2px var(--surface2);}
  .badge-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E5484D;color:#fff;font-size:11px;font-weight:var(--fw-bold);vertical-align:1px;margin-left:4px;}
  .fam-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .fam-card .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);flex:0 0 auto;}
  .fam-card .tx{flex:1;min-width:0;}
  .fam-card .tx b{display:block;font-size:14px;}
  .fam-card .tx span{display:block;font-size:12px;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fam-btn{border:none;border-radius:999px;padding:8px 13px;font-weight:var(--fw-semibold);font-size:12.5px;background:var(--ink);color:#fff;white-space:nowrap;}
  .fam-btn.ghost{background:var(--surface2);color:var(--ink);}
  .fam-send{display:flex;gap:8px;}
  .fam-send .inp{flex:1;min-width:0;}

  .child-banner{background:var(--accent-soft);border:none;border-radius:14px;margin:0 16px 8px;color:#4B3FA6;}
  .child-banner button{border-color:#DCD6F7;color:var(--accent);border-radius:999px;}
  .week-banner{border-radius:14px;margin:0 16px 8px;border:none!important;}
  .share-note{display:block;}
  .week-banner button{border-radius:999px;}
  #examBanner>div{margin-left:16px!important;margin-right:16px!important;border-radius:14px!important;}

  /* ----- 페이지 머리 ----- */
  .page-h{display:flex;align-items:flex-end;gap:10px;padding:6px 16px 10px;flex-wrap:wrap;}
  .page-h h2{font-size:32px;font-weight:var(--fw-bold);letter-spacing:-.03em;line-height:1.15;}
  .page-h .h-sub{font-size:13px;color:var(--muted2);font-weight:600;margin-bottom:5px;}
  .h-nav{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--muted2);font-size:14px;font-weight:600;margin-bottom:4px;}
  .h-nav button{border:none;background:transparent;width:32px;height:32px;border-radius:50%;font-size:19px;color:var(--muted2);}
  .h-nav button:active{background:var(--surface2);}
  .h-nav .today-chip{width:auto;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:var(--fw-semibold);color:var(--accent);margin-right:4px;}
  .seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin:0 16px 12px;}
  .seg button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 0;font-weight:var(--fw-semibold);font-size:13px;color:var(--muted2);}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,16,50,.08);}

  /* 주간 날짜 줄 */
  .wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px 12px;}
  .wday{border:none;background:transparent;border-radius:16px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted2);}
  .wday .w{font-size:11.5px;font-weight:600;}
  .wday .n{font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25;}
  .wday .r{font-size:10px;font-weight:var(--fw-bold);color:var(--muted);min-height:14px;}
  .wday.sun .w{color:#E5484D;} .wday.sat .w{color:var(--accent);}
  .wday.today .n{color:var(--accent);font-weight:var(--fw-bold);}
  .wday.on{background:var(--surface2);}
  .wday.on .n{font-weight:var(--fw-bold);}
  .wday.full .r{color:var(--green);}

  main{padding:0 16px 24px;}

  /* ----- 할 일(일간) — 한 줄 레이아웃 ----- */
  .day{display:flex;flex-direction:column;gap:12px;}
  .day-side{position:static;order:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .day-side>*{min-width:0;}
  .day-side .mon-card,.day-side .goal-card:first-of-type{grid-column:1/-1;}
  .day-side .mini-row{grid-column:1/-1;}
  .day-list{background:transparent;border:none;padding:0;}
  /* 하루틀처럼 할 일 목록을 맨 위로, 응원·다이어리 같은 안내 카드는 그 아래로 */
  .day-list{display:flex;flex-direction:column;}
  .day>*,.day-list>*{min-width:0;max-width:100%;}
  .day-list>.next-up,.day-list>.td-hero{order:-5;}
  .day-list>.kp-banner{order:-6;}
  .day-list>.dl-head{order:-3;}
  .day-list>.task,.day-list>.empty{order:-2;}
  .day-list>.add-task-btn{order:-1;margin:0 0 16px;}
  .dl-head h2{font-size:18px;}
  .sum-card,.goal-card,.mini-stat,.mon-card,.vs-card,.cheer,.day-list .task{border-radius:var(--r);}
  .sum-card,.goal-card,.mini-stat,.vs-card{border:1px solid var(--line);}
  .task{background:var(--surface);border:1px solid var(--line);}
  .cheer{background:var(--surface);border:1px solid var(--line);}
  .add-task-btn{border-radius:var(--r);border:1.5px dashed #CFCDD9;background:transparent;color:var(--muted2);}
  .add-task-btn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .bar-fill{background:linear-gradient(90deg,#8F80FF,#6A58E6);}
  .add-btn{border-radius:12px;}
  .rollover-btn,.ghost-btn,.pick,.icon-btn{border-color:var(--line);}
  .pick.on{background:var(--ink);border-color:var(--ink);}
  @media(max-width:520px){ .day-side{grid-template-columns:1fr;} }

  /* ----- 일정(주간·월간) ----- */
  .week{grid-template-columns:1fr;gap:10px;}
  .wcol{min-height:auto;border-radius:var(--r);flex-direction:row;}
  .wcol.today{background:#F7F6FE;border-color:#DCD6F7;}
  .wcol-head{width:64px;flex:0 0 64px;border-bottom:none;border-right:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .wcol-body{padding:8px;}
  .wcard{border-radius:12px;background:var(--bg);}
  .wadd{border-radius:12px;margin-top:2px;}
  .month{border-radius:var(--r);}
  .mcell{min-height:74px;}
  .mgrid{grid-auto-rows:minmax(74px,auto);}
  .daynum.today{background:var(--accent);}

  /* ----- 학습 탭 ----- */
  .l-hero{background:linear-gradient(135deg,#8F80FF,#6A58E6 60%,#5646D0);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 26px rgba(106,88,230,.28);}
  .l-hero .t{font-size:13px;opacity:.9;font-weight:var(--fw-bold);}
  .l-hero .v{font-size:34px;font-weight:var(--fw-bold);letter-spacing:-.02em;margin:2px 0 8px;}
  .l-hero .v small{font-size:15px;opacity:.85;font-weight:var(--fw-bold);}
  .l-hero .bar{height:8px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;}
  .l-hero .bar>div{height:100%;background:#fff;border-radius:999px;}
  .l-hero .per{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:var(--fw-bold);opacity:.92;}
  .lcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;}
  .lcard-top{display:flex;align-items:center;gap:12px;}
  .lcard-ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
  .lcard-name{font-size:16.5px;font-weight:var(--fw-bold);letter-spacing:-.01em;}
  .lcard-sub{font-size:12.5px;color:var(--muted2);margin-top:1px;}
  .lcard-min{margin-left:auto;font-size:12px;font-weight:var(--fw-bold);padding:4px 10px;border-radius:999px;background:#EAF7F1;color:#0E7A55;white-space:nowrap;}
  .lcard-min.zero{background:var(--bg);color:var(--muted);}
  .lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px;}
  .lstat{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center;}
  .lstat b{display:block;font-size:17px;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;}
  .lstat span{font-size:11px;color:var(--muted2);font-weight:600;}
  .lprog{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;}
  .lprog>div{height:100%;border-radius:999px;}
  .lprog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);margin-top:6px;font-weight:600;}
  .lgo{width:100%;margin-top:12px;border:none;border-radius:14px;padding:13px;font-weight:var(--fw-bold);font-size:14.5px;background:var(--ink);color:#fff;}
  .lgo:active{transform:scale(.99);}
  .lnote{font-size:12px;color:var(--muted2);line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:4px;}

  /* 학습앱 전체 화면 */
  .lapp{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;}
  .lapp-h{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--surface);border-bottom:1px solid var(--line);}
  .lapp-h b{font-size:15px;font-weight:var(--fw-bold);}
  .lapp-back{border:none;background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:var(--fw-bold);font-size:13.5px;color:var(--ink);}
  .lapp-h .sp{flex:1;}
  .lapp iframe{flex:1;width:100%;border:0;background:#fff;}

  /* ----- 기록 탭 ----- */
  .r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .r-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center;}
  .r-stat .e{font-size:22px;}
  .r-stat b{display:block;font-size:22px;font-weight:var(--fw-bold);margin-top:2px;font-variant-numeric:tabular-nums;}
  .r-stat span{font-size:11.5px;color:var(--muted2);font-weight:600;}
  .r-sec{font-size:13px;font-weight:var(--fw-bold);color:var(--muted2);margin:18px 2px 10px;}
  .hub-item{border-radius:var(--r);border-color:var(--line);padding:15px;}
  .hub-item:hover{border-color:#D2CAF8;background:var(--surface);}
  .mon-card{border-color:var(--line);background:linear-gradient(160deg,#FFFDF7,#F4F2FF);}


  /* ----- 포커스 타이머 ----- */
  .fo-wrap{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#EFECFD,rgba(239,236,253,0) 70%);border-radius:24px;padding:14px 12px 18px;margin-bottom:12px;}
  .fo-dial{width:min(76vw,280px);aspect-ratio:1;touch-action:none;user-select:none;cursor:pointer;outline:none;}
  .fo-dial.paused .fo-glass{animation-play-state:paused;}
  .fo-glass{transform-box:fill-box;transform-origin:50% 50%;animation:foFlip 6s ease-in-out infinite;}
  @keyframes foFlip{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
  .fo-time{font-size:52px;font-weight:var(--fw-bold);letter-spacing:1px;font-variant-numeric:tabular-nums;margin:8px 0 2px;}
  .fo-sub{font-size:13px;color:var(--muted2);margin:6px 0 2px;text-align:center;}
  .fo-ctrl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
  .fo-btn{border:none;border-radius:999px;padding:12px 22px;font-weight:var(--fw-semibold);font-size:14.5px;background:var(--ink);color:#fff;}
  .fo-btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .fo-presets{display:flex;gap:8px;margin-top:6px;}
  .fo-presets button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:var(--fw-semibold);font-size:13px;color:var(--muted2);}
  .fo-presets button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .fo-done{text-align:center;padding:26px 6px 8px;}
  .fo-big-emo{font-size:56px;}
  .fo-done-t{font-size:24px;font-weight:var(--fw-bold);margin-top:6px;}
  .fo-done-s{font-size:13px;color:var(--muted2);margin-top:4px;line-height:1.5;}
  .fo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;}
  .fo-card-h{font-weight:var(--fw-bold);font-size:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
  .fo-card-h span{font-weight:600;font-size:12px;color:var(--muted2);}
  .fo-sounds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .fo-sounds button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 8px;font-weight:var(--fw-semibold);font-size:13.5px;color:var(--ink);}
  .fo-sounds button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .fo-vol{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .fo-vol input{flex:1;accent-color:var(--accent);}
  .fo-hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .pay-break{background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .pb-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--slate);}
  .pb-row.minus b{color:#A5323A;}
  .pb-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-size:13px;}
  .pb-total>b{font-size:18px;color:#0E7A55;}
  .pb-ref{font-size:11.5px;color:var(--muted);margin:0 2px 8px;line-height:1.5;}
  .pb-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:var(--fw-bold);font-size:13.5px;margin-bottom:4px;}
  .pb-head span{font-size:11.5px;color:var(--muted2);font-weight:600;}
  .pb-sub{font-size:11.5px;color:var(--muted2);margin:2px 0 4px;line-height:1.5;}
  .pb-sub.warn{color:#A5323A;}
  .pb-total em{font-style:normal;font-size:11px;color:#8A6516;}
  .pb-formula{font-size:12.5px;color:var(--slate);text-align:right;margin:10px 2px 0;font-weight:var(--fw-bold);}
  .mock-det{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;}
  .mock-det summary{cursor:pointer;font-weight:var(--fw-bold);font-size:13px;}
  .mock-range{display:grid;gap:6px;margin-top:8px;}
  .mock-range div{display:flex;gap:8px;font-size:12.5px;line-height:1.5;}
  .mock-range b{flex:0 0 auto;min-width:44px;}
  .mock-range span{color:var(--muted2);}
  .mock-entry{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;}
  .me-row{display:flex;align-items:center;gap:6px;}
  .me-row .inp{flex:1;min-width:0;padding:8px 10px;}
  .pb-note{font-size:11.5px;color:#8A6516;margin:6px 2px 0;}
  .amt-inp{font-size:20px;font-weight:var(--fw-bold);color:#0E7A55;padding:6px 10px;margin-top:3px;}
  .pay-terms{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .pay-terms div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .pay-terms span{font-size:11.5px;color:var(--muted2);font-weight:600;}
  .pay-terms b{font-size:16px;}
  .notice-card{background:linear-gradient(135deg,#FFFBEF,#FFF4DA);border:1.5px solid #F5DFA6;border-radius:20px;padding:14px 16px;margin-bottom:14px;cursor:pointer;}
  .notice-card .nc-top{display:flex;align-items:center;gap:10px;}
  .notice-card .nc-emo{font-size:26px;}
  .notice-card .nc-top b{display:block;font-size:15px;}
  .notice-card .nc-top span{display:block;font-size:12px;color:#8A6516;}
  .notice-card .nc-new{background:#E5484D;color:#fff;font-size:10.5px;font-weight:var(--fw-bold);border-radius:999px;padding:3px 8px;}
  .notice-card .nc-rows{display:grid;gap:6px;margin-top:10px;}
  .notice-card .nc-rows div{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;font-size:13.5px;}
  .notice-card .nc-rows b{margin-left:auto;font-size:15px;}
  .notice-card .nc-rows em{font-style:normal;font-size:11.5px;color:#8F8D9B;}
  .fo-card .warn{color:#A5323A;} .fo-card .ok{color:#0E7A55;font-weight:var(--fw-bold);}
  .fam-btn[disabled]{opacity:.45;}
  .fo-awake{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:var(--fw-bold);color:var(--slate);}
  .fo-awake input{width:18px;height:18px;accent-color:var(--accent);}
  .bnav-pill button .lbl{font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* ----- 아래쪽 메뉴 ----- */
  .bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;
    display:flex;align-items:center;gap:10px;width:min(560px,calc(100% - 24px));}
  .bnav-pill{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);}
  .bnav-pill button{flex:1;height:50px;border:none;background:transparent;border-radius:999px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;color:var(--muted2);font-size:10.5px;font-weight:var(--fw-semibold);}
  .bnav-pill button svg{width:22px;height:22px;}
  .bnav-pill button.on{background:var(--surface2);color:var(--ink);}
  .fab{width:62px;height:62px;border-radius:50%;border:none;flex:0 0 auto;color:#fff;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%,#A597FF,#6A58E6 60%,#5646D0);box-shadow:0 8px 22px rgba(106,88,230,.45);}
  .fab svg{width:26px;height:26px;}
  .time-tag.carry{color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;font-weight:var(--fw-semibold)}
  .time-tag.by-parent{color:#92400E;background:#FEF3C7;border:1px solid #FCD34D;font-weight:var(--fw-semibold)}
  .fab:active{transform:scale(.96);}
  .toast-wrap{bottom:calc(92px + env(safe-area-inset-bottom));}
  .toast{border-radius:999px;background:var(--ink);}
  .toast.good{background:#0E9F6E;} .toast.info{background:var(--accent);}

  /* ----- 시트(드로어·모달) ----- */
  .overlay{background:rgba(20,16,40,.38);z-index:60;}
  .drawer,.drawer.wide{max-width:600px;height:auto;max-height:92vh;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--bg);box-shadow:0 -10px 40px rgba(20,16,50,.18);animation:sheetUp .22s ease;}
  .drawer-head{background:transparent;border-bottom:none;padding:16px 18px 6px;}
  .drawer-head h3{font-size:19px;}
  .drawer-body{padding:10px 16px calc(22px + env(safe-area-inset-bottom));}
  .tab-row{background:transparent;}
  .list-item,.child-item{border-radius:14px;}
  .modal{border-radius:24px;}
  @media(max-width:600px){
    .overlay{align-items:flex-end;}
    .modal{margin:auto 0 0;max-width:none;border-radius:24px 24px 0 0;max-height:94vh;animation:sheetUp .22s ease;}
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

  /* 빠른 계획(✨) */
  .q-orb{width:84px;height:84px;border-radius:50%;margin:6px auto 12px;background:radial-gradient(circle at 32% 28%,#fff 0 6%,#A597FF 22%,#6A58E6 60%,#4B3CC4);
    box-shadow:0 12px 30px rgba(106,88,230,.35);display:flex;align-items:center;justify-content:center;color:#fff;}
  .q-orb svg{width:34px;height:34px;}
  .q-lead{text-align:center;font-size:15.5px;font-weight:var(--fw-bold);line-height:1.55;}
  .q-ex{text-align:center;font-size:12.5px;color:var(--muted2);margin:6px 0 14px;line-height:1.5;}
  .q-box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:20px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);}
  .q-box textarea{flex:1;border:none;outline:none;resize:none;font-size:15px;min-height:46px;max-height:160px;padding:6px 0;background:transparent;}
  .q-box button{border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:var(--fw-semibold);padding:12px 16px;font-size:14px;white-space:nowrap;}
  .q-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;}
  .q-row select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13.5px;background:#fff;max-width:112px;}
  .q-row .q-t{flex:1;min-width:0;font-size:13.5px;font-weight:var(--fw-bold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-row .q-m{font-size:12px;color:var(--muted2);white-space:nowrap;}
  .q-row input[type=number]{width:62px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:13.5px;}

  /* =====================================================================
   *  PC 레이아웃 (html[data-device="pc"]) — assets/device.js 가 판별
   *  왼쪽 사이드바 메뉴 + 넓은 여러 칸 화면. 모바일은 위의 기본 레이아웃 그대로.
   * ===================================================================== */
  .side-brand,.fab-t{display:none;}
  html[data-device="pc"] body{--side:248px;}
  html[data-device="pc"] #app{max-width:none;margin:0 0 0 var(--side);padding:0 32px 48px;}
  html[data-device="pc"] #app>*:not(.bnav){max-width:1200px;margin-left:auto;margin-right:auto;}
  html[data-device="pc"] .topbar{padding:18px 0 12px;background:rgba(243,242,247,.92);}
  html[data-device="pc"] .child-banner,html[data-device="pc"] .week-banner{margin:0 auto 10px;}
  html[data-device="pc"] #examBanner>div{margin-left:0!important;margin-right:0!important;}
  html[data-device="pc"] .page-h{padding:6px 0 14px;}
  html[data-device="pc"] .page-h h2{font-size:36px;}
  html[data-device="pc"] main{padding:0 0 24px;}
  html[data-device="pc"] .seg{margin:0 0 16px;max-width:360px;}
  html[data-device="pc"] .wstrip{padding:0 0 16px;gap:8px;}
  html[data-device="pc"] .wday{padding:10px 0 8px;}

  /* 사이드바 메뉴 */
  html[data-device="pc"] .bnav{left:0;top:0;bottom:0;transform:none;width:var(--side);max-width:none;height:100vh;
    flex-direction:column;align-items:stretch;gap:14px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);}
  html[data-device="pc"] .side-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid var(--line2);}
  html[data-device="pc"] .side-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8F80FF,#6A58E6 55%,#5646D0);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;}
  html[data-device="pc"] .side-brand b{display:block;font-size:15px;letter-spacing:-.02em;}
  html[data-device="pc"] .side-brand span{display:block;font-size:11.5px;color:var(--muted);}
  html[data-device="pc"] .bnav-pill{flex:0 0 auto;flex-direction:column;gap:4px;padding:0;background:transparent;border:none;box-shadow:none;border-radius:0;}
  html[data-device="pc"] .bnav-pill button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:14px;font-size:14.5px;font-weight:var(--fw-semibold);}
  html[data-device="pc"] .bnav-pill button:hover{background:var(--bg);color:var(--ink);}
  html[data-device="pc"] .bnav-pill button.on{background:var(--accent-soft);color:var(--accent);}
  html[data-device="pc"] .fab{width:100%;height:48px;border-radius:14px;gap:8px;font-weight:var(--fw-bold);font-size:14.5px;box-shadow:0 6px 16px rgba(106,88,230,.3);}
  html[data-device="pc"] .fab svg{width:20px;height:20px;}
  html[data-device="pc"] .fab-t{display:inline;}
  html[data-device="pc"] .toast-wrap{left:var(--side);bottom:28px;}

  /* 할 일: 목록(왼쪽) + 요약 카드(오른쪽 고정) */
  html[data-device="pc"] .day{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;}
  html[data-device="pc"] .day-list{grid-column:1;grid-row:1;}
  html[data-device="pc"] .day-side{grid-column:2;grid-row:1;order:0;position:sticky;top:84px;grid-template-columns:1fr;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:4px;}

  /* 일정: 주간 7칸 */
  html[data-device="pc"] .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
  html[data-device="pc"] .wcol{flex-direction:column;min-height:420px;}
  html[data-device="pc"] .wcol-head{width:auto;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line2);padding:10px 4px 8px;}
  html[data-device="pc"] .wcol-body{padding:8px;}
  html[data-device="pc"] .wcard .tt{white-space:normal;}
  html[data-device="pc"] .mgrid{grid-auto-rows:minmax(112px,auto);}
  html[data-device="pc"] .mcell{min-height:112px;padding:8px;}
  html[data-device="pc"] .cell-add{display:block;}

  /* 학습: 앱 카드 3칸 */
  html[data-device="pc"] .l-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;}
  html[data-device="pc"] .l-grid .lcard{margin-bottom:0;}
  html[data-device="pc"] .l-hero{margin-bottom:18px;}
  html[data-device="pc"] .lnote{margin-top:16px;}

  /* 타이머: 다이얼(왼쪽) + 과제·사운드(오른쪽) */
  html[data-device="pc"] .fo-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start;}
  html[data-device="pc"] .fo-grid .fo-wrap{margin-bottom:0;padding:28px 16px 32px;}
  html[data-device="pc"] .fo-dial{width:320px;}

  /* 기록: 요약·파트너(왼쪽) + 메뉴(오른쪽) */
  html[data-device="pc"] .rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;}
  html[data-device="pc"] .rec-grid .r-sec:first-child{margin-top:0;}

  /* 시트 → 오른쪽 패널 / 가운데 창 */
  html[data-device="pc"] .overlay{align-items:stretch;}
  html[data-device="pc"] .drawer,html[data-device="pc"] .drawer.wide{margin:0 0 0 auto;width:520px;max-width:92vw;height:100vh;max-height:none;border-radius:24px 0 0 24px;animation:panelIn .2s ease;}
  html[data-device="pc"] .modal{margin:auto;max-width:560px;border-radius:24px;animation:none;}
  @keyframes panelIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

  /* 작은 PC(노트북) 화면: 사이드바·요약 칸을 좁게 */
  @media (max-width:1200px){
    html[data-device="pc"] body{--side:216px;}
    html[data-device="pc"] #app{padding:0 22px 40px;}
    html[data-device="pc"] .day{grid-template-columns:minmax(0,1fr) 290px;gap:16px;}
    html[data-device="pc"] .l-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  /* 학습앱 전체 화면: 사이드바는 그대로 두고 오른쪽에 */
  html[data-device="pc"] .lapp{left:var(--side);border-left:1px solid var(--line);}
.pw-wrap{position:relative}.pw-wrap .inp{padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:17px;cursor:pointer;padding:6px;opacity:.7}
.pw-warn{margin-top:6px;font-size:12px;color:#C2410C;background:#FFF7ED;border-radius:8px;padding:7px 9px;line-height:1.45}
  .lapp-pay{flex:1;min-width:0;position:relative;margin-left:10px;line-height:1.25}
  .lapp-pay .lp-top{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .lapp-pay .lp-top b{font-size:16px;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
  .lapp-pay .lp-top span{font-size:12px;font-weight:var(--fw-bold);color:#64748B}.lapp-pay .lp-top span.up{color:#0E9F6E}
  .lapp-pay .lp-sub{font-size:11.5px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-flash{position:absolute;right:0;top:0;font-weight:var(--fw-bold);font-size:15px;animation:lpUp 1.2s ease-out forwards}
  .lp-flash.up{color:#0E9F6E}.lp-flash.down{color:#E5484D}
  @keyframes lpUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}

  /* 할 일 추가 · 카드형 */
  .modal.tm{max-width:560px;background:#fff}
  .tm .modal-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#fff}
  .tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){ .tm-grid{grid-template-columns:1fr} }
  .tm-card{background:#F6F6FC;border-radius:16px;padding:13px;min-width:0}
  .tm-card.warm{background:#FFF8E9}
  .tm-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}.tm-h b{font-size:15px;font-weight:var(--fw-bold)}
  .tm-ic{width:22px;height:22px;color:#6A58E6;display:inline-flex}.tm-ic svg{width:22px;height:22px}
  .tm-card.warm .tm-ic{color:#F59E0B}
  .tm-h .tm-ex-btn{margin-left:auto}
  .tm-chips{display:flex;flex-wrap:wrap;gap:7px}
  .tm-chips.three{display:grid;grid-template-columns:repeat(3,1fr)}
  .tm-chips.five{display:grid;grid-template-columns:repeat(5,1fr)}
  .tm-chip{border:1px solid #E4E4EE;background:#fff;border-radius:11px;padding:9px 6px;font-weight:var(--fw-semibold);font-size:14px;color:#334155;cursor:pointer;min-width:0;white-space:nowrap}
  .tm-chip.on{background:#3F35B5;border-color:#3F35B5;color:#fff}
  .tm-chips.three .tm-chip.on{background:#5B4DF0;border-color:#5B4DF0}
  .tm-chip.wide{grid-column:span 2;display:flex;justify-content:space-between;padding:9px 12px}
  .tm-inp{border:1px solid #E4E4EE;background:#fff;border-radius:11px;padding:9px 11px;font-size:14px;min-width:0;font-family:inherit;color:inherit}
  .tm-date{flex:1;min-width:130px}
  .tm-unit{position:relative;margin-top:8px}.tm-unit .tm-inp{width:100%;padding-right:34px}.tm-unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#64748B;font-size:13px}
  .tm-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tm-sub .tm-chip{padding:6px 10px;font-size:12.5px}
  .tm-days{display:flex;gap:4px;margin-top:8px}.tm-days .tm-chip{flex:1;padding:7px 0}
  .tm-mini{display:block;font-size:12px;color:#64748B;font-weight:var(--fw-bold);margin:9px 0 5px}
  .tm-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}.tm-row .tm-mini{margin:0 4px 0 0}
  .tm-area{position:relative;background:#fff;border:1px solid #E4E4EE;border-radius:12px}
  .tm-area textarea,.tm-area input{width:100%;border:0;outline:none;background:transparent;resize:none;padding:11px 12px 22px;font-size:14.5px;font-family:inherit;color:inherit;border-radius:12px}
  .tm-area.one input{padding:12px 64px 12px 12px}
  .tm-cnt{position:absolute;right:11px;bottom:6px;font-size:11.5px;color:#94A3B8}

async function saveCharacter(how){
  const ch=charOf(), tot=charReady(), el=charPickEl||ch.el||"fire";
  const name=((document.getElementById("charName")||{}).value||"").trim().slice(0,12);
  let next={...state.settings.character, el:ch.el, name:ch.name, changes:ch.changes, start:ch.start, done:ch.done};
  if(how==="start") next={el, name, changes:0, start:ch.start||fmt(new Date()), v2:1, done:ch.done};
  else if(how==="change"){
    if(ch.changes>=CHAR_CHANGES || charNow().stage>=CHAR_MAX) return;
    if(!confirm(`${charElOf(el).name}(으)로 바꿀까요? 바꾸기는 한 번만 할 수 있어요.`)) return;
    next={...next, el, name:name||ch.name, changes:ch.changes+1};
  }else if(how==="new"){
    if(charNow().stage<CHAR_MAX) return;
    next={el, name, changes:0, start:fmt(addDays(new Date(),1)), floor:0, v2:1, done:[...ch.done, {el:ch.el, name:ch.name, at:new Date().toISOString()}]};   // 새 캐릭터는 내일부터 0일
  }else next.name=name;
  await saveSettings({...state.settings, character:next});
  charPickEl=""; toast(how==="new"? "🐣 새 캐릭터를 키우기 시작했어요!" : "캐릭터를 저장했어요","good"); drawCharacter(); render(); updateCharBtn();
}
/* ============================================================
 *  🌱 66일 습관 · ⭕ 오늘의 공부 링 · 🏅 나의 뱃지
 *  - 재촉하지 않아요: 하루 빠져도 괜찮고, 약속은 "이틀 연속만 안 빠지기"
 *  - 습관은 아이가 스스로 정하고 혼자 보는 기록이에요 (부모님 화면은 보기만) · 캐릭터 · 명예의 장과는 따로예요
 * ============================================================ */
const HABIT_DAYS=66, HABIT_MAX=3, HABIT_PTS=10;
const HABIT_PHASE=[{to:21,name:"뿌리 내리기",emo:"🌱"},{to:44,name:"줄기 자라기",emo:"🌿"},{to:66,name:"열매 맺기",emo:"🍎"}];
const HABIT_MILES={7:"일주일을 해냈어요",21:"뿌리를 내렸어요",44:"줄기가 튼튼해졌어요"};
const HABIT_IDEAS=[["📖","아침에 영단어 10개"],["📝","공부 전에 오늘 계획 쓰기"],["🔁","자기 전 10분 복습"],["✏️","문제집 하루 한 장"],["📚","책 20분 읽기"],["🧘","공부 전 1분 숨 고르기"]];
async function loadHabits(){
  const uid=state.ownerUid;
  if(state.habits && state.habits.uid===uid) return state.habits;
  let list=[];
  try{ const d=await plannerRef().collection("meta").doc("habits").get(); if(d.exists) list=d.data().list||[]; }catch(e){ console.warn("습관", e); }
  state.habits={uid, list};
  return state.habits;
}
async function saveHabits(){ if(state.habits) await plannerRef().collection("meta").doc("habits").set({list:state.habits.list}); }
const habitCount=h=>Object.keys(h.checks||{}).length;
const habitsReady=()=> state.habits && state.habits.uid===state.ownerUid ? state.habits : null;
const habitActive=()=>{ const H=habitsReady(); return H? H.list.filter(h=>h.status!=="done") : []; };
const habitPhase=n=>HABIT_PHASE.find(p=>n<=p.to)||HABIT_PHASE[2];
// 어제 · 그저께 둘 다 빠졌는지 (오늘 아직 안 했을 때만 살짝 알려 줘요)
function habitWobble(h){
  const c=h.checks||{}, t=fmt(new Date()), y=fmt(addDays(new Date(),-1)), y2=fmt(addDays(new Date(),-2));
  return !c[t] && !c[y] && !c[y2] && h.start<=y2;
}
function habitSub(h){
  const n=habitCount(h);
  if(h.status==="keep") return `유지 모드 · 지금까지 ${n}일`;
  const P=habitPhase(n);
  return `${P.emo} ${P.name} · ${Math.min(n,HABIT_DAYS)}/${HABIT_DAYS}일 · D-${Math.max(0,HABIT_DAYS-n)}`;
}
async function toggleHabit(id, ds){
  if(state.viewingChild) return;
  const H=await loadHabits(), h=H.list.find(x=>x.id===id); if(!h) return;
  ds=ds||fmt(new Date());
  h.checks=h.checks||{};
  const was=!!h.checks[ds];
  if(was) delete h.checks[ds]; else h.checks[ds]=1;
  const n=habitCount(h);
  let finished=false;
  if(!was && h.status!=="keep" && n>=HABIT_DAYS && !h.doneAt){ h.doneAt=fmt(new Date()); finished=true; }
  try{ await saveHabits(); }catch(e){ toast("저장하지 못했어요","info"); return; }
  render();
  if(document.querySelector(".hb-drawer")) drawHabits();
  if(was) return;
  try{ window.SFX && SFX.play("ok"); }catch(_){}
  if(finished) setTimeout(()=>habitDoneShow(h.id), 400);
  else if(h.status!=="keep" && HABIT_MILES[n]) toast(`${h.emo} ${esc(h.name)} ${n}일째! ${HABIT_MILES[n]}`,"cheer");
  else toast(`${h.emo} 체크! ${h.status==="keep"? `유지 ${n}일` : `${n}/${HABIT_DAYS}일`}`,"good");
}
async function addHabit(name, emo){
  name=(name||"").trim().slice(0,24); if(!name){ toast("어떤 습관인지 적어 주세요","info"); return; }
  const H=await loadHabits();
  if(habitActive().length>=HABIT_MAX){ toast(`습관은 한 번에 ${HABIT_MAX}개까지예요`,"info"); return; }
  H.list.push({id:"h"+Date.now().toString(36), name, emo:emo||"🌱", start:fmt(new Date()), checks:{}, status:"active"});
  await saveHabits(); toast(`🌱 '${esc(name)}' 시작! 오늘이 1일째예요`,"good");
  drawHabits(); render();
}
async function habitStop(id){
  const H=await loadHabits(), h=H.list.find(x=>x.id===id); if(!h) return;

  await saveHabits(); drawHabits(); render();

async function habitAfter(id, how){
  const H=await loadHabits(), h=H.list.find(x=>x.id===id); if(!h) return;
  if(how==="keep"){ h.status="keep"; }

    h.status="done"; h.endAt=fmt(new Date());
    if(how==="up"){
      const nm=prompt("한 단계 올린 습관을 적어 주세요", h.name);
      if(nm && nm.trim()) H.list.push({id:"h"+Date.now().toString(36), name:nm.trim().slice(0,24), emo:h.emo, start:fmt(new Date()), checks:{}, status:"active", from:h.id});
    }
  }
  await saveHabits(); render(); drawHabits();
}

/* ----- ⭕ 오늘의 공부 링: 계획(완료한 비율) · 집중(목표시간) · 복기(완료한 것 중 메모 · 이해도 남긴 비율) ----- */

function ringSvg(v, color, emo){

/* ----- 할 일 탭 맨 위 '오늘' 카드: 공부 시간 · 세 링 · 목표 · 다음 할 일을 한곳에 ----- */
function ringsData(ts, actMin, goal){

/* ============================================================
 *  🏆 이번 주 공부 순위 (전체 회원) — 1~5등만 보이고, 나는 "총 N명 중 M등" 숫자만
 *  - 점수 = 앱이 직접 잰 시간만: ⏱ 타이머로 잰 시간 + 포커스 타이머 + 학습앱(천문장 · 영단어 · 그래머)이 기록한 시간
 *    (직접 적은 시간은 빼요 · 하루 최대 6시간) → 부풀리기 어렵게
 *  - 서로 할 수 있는 건 👍 응원 누르기뿐 (사람마다 한 번 · 글 · 쪽지 없음), 응원 수만 보여요
 *  - 보이는 것: 순위표 별명(실명 대신) · 캐릭터 · 시간 · 👍 수. 부모님 계정은 참여하지 않아요
 *  - ranks/{주 시작일}/entries/{uid} {nick, el, stage, min, likes, at} · …/likes/{누른 uid}
 * ============================================================ */
const RANK_DAY_CAP=360, RANK_TOP=5;
const rankWeek=()=>charWeekDays()[0];
const rankCol=(wk)=>db.collection("ranks").doc(wk||rankWeek()).collection("entries");
const rankOn=()=>!(state.settings.rank && state.settings.rank.off);

async function rankScore(uid){
  const days=charWeekDays();
  const s=await db.collection("planner").doc(uid).collection("tasks").where("date",">=",days[0]).where("date","<=",days[6]).get();
  const wk=s.docs.map(d=>d.data()).filter(t=>t.done && !t.appLinked);
  let X={}; try{ X=await fetchExtData(uid); }catch(_){}
  const focusFree=(X && X.focusFree)||{};
  return days.reduce((sum,ds)=>{
    const timer=wk.filter(t=>t.date===ds).reduce((a,t)=>a+timedMin(t),0);
    const focus=Math.round(Number(focusFree[ds])||0);
    const app=extCreditedOn(ds, X).total;
    return sum+Math.min(RANK_DAY_CAP, timer+focus+app);
  },0);
}

async function rankPublish(){
  if(!state.user || isParentUser() || state.viewingChild || state.ownerUid!==state.user.uid) return;
  const ref=rankCol().doc(state.user.uid);
  if(!rankOn()){ await ref.delete().catch(()=>{}); return; }
  const min=Math.max(0, Math.min(RANK_DAY_CAP*7, Math.round(await rankScore(state.user.uid))));
  if(!familyList) try{ familyList=await Family.listMine(db, state.user); }catch(_){}
  const ch=charOf(), body={nick:rankNick(), el:ch.el||"", stage:charNow().stage|0, min, fam:myParentUids().slice(0,4), at:Date.now()};
  const d=await ref.get().catch(()=>null);
  if(d && d.exists){ const o=d.data(); if(o.min===min && o.nick===body.nick && o.el===body.el && o.stage===body.stage && JSON.stringify(o.fam||[])===JSON.stringify(body.fam)) return; await ref.update(body); }
  else await ref.set({...body, likes:0});
}
async function rankCount(q){ if(typeof q.count==="function"){ try{ return (await q.count().get()).data().count; }catch(_){} } return (await q.get()).size; }
async function rankLike(uid){
  const me=state.user.uid; if(uid===me) return;
  const ref=rankCol().doc(uid), like=ref.collection("likes").doc(me);
  try{
    const b=db.batch();
    b.set(like,{at:Date.now()});
    b.update(ref,{likes:firebase.firestore.FieldValue.increment(1)});
    await b.commit();
    try{ window.SFX && SFX.play("ok"); }catch(_){}
    if(rankView!=="fam") drawRanks(true);
  }catch(e){ toast("이미 응원했어요","info"); }
}

 *  - hall/{uid_c캐릭터번호} {uid, nick, el, stage, rule, start, count, left, status:'active'|'done', doneAt, likes, at} · …/likes/{누른 uid}

const hallIdNow=()=>`${state.user.uid}_c${charOf().done.length}`;
function hallBody(){
  const ch=charOf(), c=charNow(), n=Math.min(HABIT_DAYS, c.pts);
  return {uid:state.user.uid, nick:rankNick(), el:ch.el, stage:c.stage|0, rule:pconf().rule, start:ch.start||fmt(new Date()),
    count:n, left:HABIT_DAYS-n, status:n>=HABIT_DAYS? "done" : "active", doneAt:n>=HABIT_DAYS? fmt(new Date()) : "", at:Date.now()};
}
// 지금 키우는 캐릭터를 명예의 장에 맞춰요
async function hallSync(){
  if(!state.user || isParentUser() || state.viewingChild || state.ownerUid!==state.user.uid || !charReady()) return;
  const ch=charOf(); if(!ch.el) return;
  const ref=db.collection("hall").doc(hallIdNow());
  try{
    if(!rankOn()){ await ref.delete().catch(()=>{}); return; }
    const body=hallBody(), d=await ref.get().catch(()=>null);
    if(d && d.exists){ const o=d.data(); if(o.status==="done") return; if(["nick","el","stage","rule","count"].every(k=>o[k]===body[k])) return; await ref.update(body); }
    else await ref.set({...body, likes:0});
  }catch(e){ console.warn("명예의 장", e); }
}

let keptKid="";
async function drawKeptRule(kid){
  const isP=isParentUser();

  if(!kids.length){ hubShell("🐣 지킨 날 인정 방법", `<div class="empty" style="padding:18px">먼저 <b>가족 연결</b>로 자녀와 연결해 주세요.</div>`); return; }
  keptKid= kid || (state.viewingChild? state.ownerUid : (kids.some(k=>k.uid===keptKid)? keptKid : kids[0].uid));
  hubShell("🐣 지킨 날 인정 방법", `<div class="empty">불러오는 중…</div>`);
  let c=pconfDefault(), tasks=[], X={};
  const days=Array.from({length:14},(_,i)=>fmt(addDays(new Date(),-i)));
  try{
    const d=await db.collection("parentConf").doc(keptKid).get(); if(d.exists) c={...c, ...d.data(), ok:d.data().ok||{}};
    const s=await db.collection("planner").doc(keptKid).collection("tasks").where("date",">=",days[13]).where("date","<=",days[0]).get();
    tasks=s.docs.map(x=>x.data());

  }catch(e){ hubShell("🐣 지킨 날 인정 방법", `<div class="share-note">불러오지 못했어요.<br>${esc(firestoreDiag(e))}</div>`); return; }
  const keptBy=(ds,info)=> !!c.ok[ds] || (c.rule==="trust"? info.done>0 : c.rule==="app"? info.vmin>=(Number(c.appMin)||20) : false);
  const W="일월화수목금토";
  const rows=days.map(ds=>{ const info=keptDayOf(tasks, ds, X), k=keptBy(ds,info), dd=parseD(ds), ok=!!c.ok[ds];

async function keptWrite(patch){
  const ref=db.collection("parentConf").doc(keptKid);
  const d=await ref.get().catch(()=>null), cur={...pconfDefault(), ...(d&&d.exists? d.data() : {})};
  const next={rule:cur.rule, appMin:cur.appMin, ok:cur.ok||{}, ...patch, updatedAt:Date.now(), by:state.user.uid};
  await ref.set(next);
  if(state.pconf && state.pconf.uid===keptKid){ Object.assign(state.pconf, next); keptChanged(); render(); }
}
async function keptSetRule(rule, appMin){
  try{ await keptWrite(appMin? {rule, appMin} : {rule}); toast("인정 방법을 바꿨어요","good"); drawKeptRule(keptKid); }
  catch(e){ toast("저장하지 못했어요: "+firestoreDiag(e),"info"); }
}
async function keptToggle(ds, on, quiet){
  try{
    const d=await db.collection("parentConf").doc(keptKid).get(); const ok={...((d.exists&&d.data().ok)||{})};
    if(on) ok[ds]=true; else delete ok[ds];
    await keptWrite({ok}); if(!quiet) drawKeptRule(keptKid);
  }catch(e){ toast("저장하지 못했어요: "+firestoreDiag(e),"info"); }
}

  if(rate===1) return {emo:"🎉", msg:"완벽해요! 오늘 계획을 모두 해냈어요.", tip};
  if(rate>=0.5) return {emo:"💪", msg:"잘하고 있어요! 조금만 더 하면 끝이에요.", tip};
  if(rate>0) return {emo:"🙂", msg:"좋은 출발이에요. 하나씩 해나가요.", tip};
  return {emo:"✨", msg:"첫 항목부터 시작해봐요! 시작이 반이에요.", tip};

// Firestore 접근 오류 진단
function firestoreDiag(e){
  const c=e&&e.code;
  if(c==="permission-denied") return "데이터베이스 접근이 거부되었습니다. Firestore '규칙(Rules)'을 설정 가이드의 내용으로 게시했는지 확인하세요.";
  if(c==="unavailable") return "데이터베이스에 연결할 수 없습니다. 네트워크, 또는 Firestore 데이터베이스가 생성되었는지 확인하세요.";
  if(c==="failed-precondition") return "오프라인 캐시(다중 탭) 관련 경고입니다. 다른 탭을 닫고 새로고침해 보세요.";
  if(c==="not-found") return "Firestore 데이터베이스가 아직 생성되지 않았습니다. 콘솔에서 데이터베이스를 만드세요.";
  return "데이터베이스 오류: "+((e&&e.message)||c||"unknown");
}

function socialProvider(kind){
  if(kind==="google"){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); return p; }
  const p=new firebase.auth.OAuthProvider("apple.com"); p.addScope("email"); p.addScope("name"); p.setCustomParameters({locale:"ko"}); return p;
}
const SOC_NAME={google:"Google", apple:"Apple", "google.com":"Google", "apple.com":"Apple", password:"이메일·비밀번호"};
async function socialLogin(kind){
  if(!CONFIGURED){ showAuthErr("먼저 Firebase 설정을 입력해 주세요."); return; }
  showAuthErr("");
  try{ await auth.signInWithPopup(socialProvider(kind)); }
  catch(e){ await socialError(e, kind); }
}
async function socialError(e, kind){
  console.warn("social login", e);
  const c=e&&e.code;
  if(c==="auth/popup-blocked" || c==="auth/operation-not-supported-in-this-environment"){ try{ await auth.signInWithRedirect(socialProvider(kind)); }catch(e2){ showAuthErr(authMessage(e2.code)); } return; }
  if(c==="auth/popup-closed-by-user" || c==="auth/cancelled-popup-request" || c==="auth/user-cancelled") return;
  if(c==="auth/account-exists-with-different-credential"){
    // 같은 이메일로 이미 이메일·비밀번호 가입 → 비밀번호로 한 번 로그인하면 이 로그인 방법을 그 계정에 연결해요
    const email=(e.customData&&e.customData.email)||e.email||"";
    pendingLink={cred:e.credential, kind};
    if(authMode!=="login") toggleAuthMode();
    if(email) document.getElementById("email").value=email;
    document.getElementById("pw").focus();
    showAuthErr(`${email||"이 이메일"}은(는) 이미 이메일·비밀번호로 가입된 계정이에요. 비밀번호를 입력해 로그인하면 ${SOC_NAME[kind]} 로그인이 이 계정에 연결돼서, 다음부터는 ${SOC_NAME[kind]}로 바로 들어올 수 있어요.`);
    return;
  }
  showAuthErr(authMessage(c));
}

/* ============================================================
 *  ② 주간 마감 리포트 — 이번 주 한 페이지 요약
 * ============================================================ */
function weeklySummary(tasks, days, cats, crit){
  const wk=tasks.filter(t=>days.includes(t.date));
  const done=wk.filter(t=>t.done);
  const r=computeAllowance(tasks, days, crit);
  const goalMin=days.reduce((a,ds)=>a+dayTypeGoal(ds),0);
  // 과목별 집계
  const bySub={};
  (cats.subjects||[]).forEach(s=>bySub[s.id]={s, min:0, planned:0, done:0, units:[]});
  wk.forEach(t=>{
    const b=bySub[t.subjectId]; if(!b) return;
    b.planned++;
    if(t.done){ b.done++; b.min+=creditedMin(t); const u=(t.unit||"").trim(); if(u&&!b.units.includes(u)) b.units.push(u); }
  });
  const subs=Object.values(bySub).filter(b=>b.planned>0||b.min>0).sort((a,b)=>b.min-a.min);
  // 부족한 과목: 계획했으나 이행률 70% 미만 또는 아예 학습 안 한 과목
  const weak=subs.filter(b=>b.planned>0 && (b.done/b.planned)<0.7);
  const untouched=(cats.subjects||[]).filter(s=>!bySub[s.id]||bySub[s.id].planned===0);
  // 요일별 학습시간
  const byDay=days.map(ds=>({ds, min:done.filter(t=>t.date===ds).reduce((a,t)=>a+creditedMin(t),0), type:effDayType(ds)}));
  return {r, goalMin, subs, weak, untouched, byDay, doneCount:done.length, planCount:wk.length};
}

/* ============================================================
 *  ③ 🚀 부스터 모드 — 학생이 직접 켜요 (시험 대비)
 *  - 켜면 그 기간 동안 하루 최대 인정 시간이 늘어나요 (부모가 ⚙️ 용돈 기준에서 정함, 기본 등교일 6시간 · 자율학습일 10시간)
 *  - 주간 시간 용돈 최대도 시험기간 금액(boostCap)으로 올라가요 · 1시간당 금액은 그대로
 *  - 한 번에 최대 14일 · 시험 날짜까지 · 끄면 어제까지만 부스터로 남아요 (지난 기록은 그대로)
 *  - settings.exams: [{name, date(시험 날짜), from(시작), end(끈 날), by}]
 * ============================================================ */
const BOOST_MAX_DAYS=14;
function examList(){ return (state.settings && state.settings.exams)||[]; }
function boostRange(e){
  if(!e||!e.date) return null;
  const from=e.from || fmt(addDays(parseD(e.date), -(Number(e.prepDays)||14)));
  const to=(e.end && e.end<e.date)? e.end : e.date;
  return from<=to? {from, to} : null;
}
// 그 날짜에 켜져 있는 부스터 (목록을 주면 그 목록 기준 — 용돈 계산은 자녀 설정으로)
function examFor(ds, list){
  for(const e of (list||examList())){ const g=boostRange(e); if(g && ds>=g.from && ds<=g.to) return e; }
  return null;
}
function examDday(e, from){
  return Math.round((parseD(e.date)-parseD(from||fmt(new Date())))/86400000);
}
function activeExam(){ return examFor(fmt(new Date())); }
async function boostOn(){
  if(state.profile.role==="parent" || state.viewingChild) return alert("부스터는 학생이 직접 켜요.");
  if(activeExam()) return alert("이미 부스터가 켜져 있어요.");
  const name=((document.getElementById("examName")||{}).value||"").trim()||"시험";
  const date=(document.getElementById("examDate")||{}).value;
  const today=fmt(new Date());
  if(!date || date<today) return alert("시험 날짜를 골라 주세요.");
  if(!(document.getElementById("sctAgree")||{}).checked) return alert("📵 스크린타임 제한 안내를 읽고 체크해 주세요.");
  const left=examDday({date}, today);
  const from= left>BOOST_MAX_DAYS-1? fmt(addDays(parseD(date), -(BOOST_MAX_DAYS-1))) : today;
  const E=[...examList(), {name, date, from, by:"child", at:Date.now(), screenTime:true}];
  await saveSettings({...state.settings, exams:E});
  drawBooster(); render();
  toast(from===today? `🚀 부스터 ON! 📵 스크린타임 제한을 걸고 시험 공부에 집중해요` : `🚀 ${name} 부스터 예약 · ${parseD(from).getMonth()+1}/${parseD(from).getDate()}부터 켜져요`,"cheer");
}
// 끄기: 오늘부터 꺼져요 (어제까지 부스터로 인정한 시간은 그대로) · 아직 시작 전이면 지워요
async function boostOff(i){
  const E=[...examList()], e=E[i]; if(!e) return;
  if(!confirm(`🚀 '${e.name||"시험"}' 부스터를 끌까요?\n오늘부터 하루 최대 인정 시간이 평소대로 돌아가요.`)) return;
  const g=boostRange(e), today=fmt(new Date());
  if(!g || g.from>=today) E.splice(i,1);
  else E[i]={...e, end:fmt(addDays(new Date(),-1)), endBy:state.profile.role};
  await saveSettings({...state.settings, exams:E});
  drawBooster(); render();
}
function examListHTML(){
  const E=examList(), today=fmt(new Date());
  const rows=E.map((e,i)=>({e,i,g:boostRange(e)})).filter(x=>x.g && x.g.to>=fmt(addDays(new Date(),-30)));
  if(!rows.length) return `<div style="font-size:12.5px;color:#94A3B8">아직 켠 부스터가 없어요.</div>`;
