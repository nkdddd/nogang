<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phonics Monster App</title>
    
    <!-- 🟢 구글 애드센스 기본 스크립트 (Head 영역) 🟢 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6453117184750039" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Nunito', 'Noto Sans KR', sans-serif;
            height: 100dvh;
            background-color: #000;
            touch-action: pan-y;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 16px), 8px); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-2deg); }
            40% { transform: translateX(10px) rotate(2deg); }
            60% { transform: translateX(-10px) rotate(-2deg); }
            80% { transform: translateX(10px) rotate(2deg); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes fly-to-blank {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            50% { transform: scale(1.5) translateY(-50px); opacity: 0.8; }
            100% { transform: scale(0.5) translate(0, -150px); opacity: 0; }
        }
        .animate-fly { animation: fly-to-blank 0.6s ease-in-out forwards; }
        @keyframes flash-red {
            0% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
            20% { box-shadow: inset 0 0 0 30px rgba(239, 68, 68, 0.6); }
            100% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .animate-flash { animation: flash-red 0.5s ease-out; }
        @keyframes pack-tremble {
            0%, 100% { transform: rotate(0deg) scale(1); filter: brightness(1); }
            25% { transform: rotate(-5deg) scale(1.05); filter: brightness(1.2); }
            50% { transform: rotate(5deg) scale(1.05); }
            75% { transform: rotate(-5deg) scale(1.05); }
        }
        .animate-pack-open { animation: pack-tremble 0.3s infinite ease-in-out; }

        details > summary { list-style: none; outline: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: pop 0.3s ease-in-out; }

        .grade-super { background: linear-gradient(135deg, #fffbeb, #fef3c7, #fde68a); border: 4px solid #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        .grade-rare { background: linear-gradient(135deg, #f8fafc, #f1f5f9, #e2e8f0); border: 4px solid #cbd5e1; box-shadow: 0 0 15px rgba(203, 213, 225, 0.5); }
        .grade-normal { background: #ffffff; border: 4px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="app" class="relative w-full max-w-md h-full bg-slate-50 flex flex-col shadow-2xl overflow-hidden">
        <div class="flex-1 flex flex-col items-center justify-center bg-blue-500 text-white font-black text-2xl h-full">
            <i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i>
            서버와 연결 중...
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC5ffBjfAuLmq_Dg-J9XFOp6y7lzdhHYI",
            authDomain: "phonicsmonster-2d495.firebaseapp.com",
            projectId: "phonicsmonster-2d495",
            storageBucket: "phonicsmonster-2d495.firebasestorage.app",
            messagingSenderId: "961679319312",
            appId: "1:961679319312:web:8eb58f35e963585bab8595",
            measurementId: "G-RFDMSR7G82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 앱 데이터베이스 ---
        const VOWEL_DB = {
            'a': { sound: '애', fam: [{n:'-at', w:['cat','hat','bat','mat']}, {n:'-an', w:['can','fan','man','pan']}, {n:'-ap', w:['cap','map','tap']}], magic: ['cake','game','name','lake'], var: [{rule:'ar (아)', w:['car','park','star']}] },
            'e': { sound: '에', fam: [{n:'-en', w:['pen','hen','ten']}, {n:'-et', w:['net','wet','pet']}, {n:'-ell', w:['bell','well','fell']}], magic: ['here'], var: [{rule:'단어 끝 e (이)', w:['he','me','we']}, {rule:'ee/ea (이~)', w:['see','sea','leaf']}] },
            'i': { sound: '이', fam: [{n:'-it', w:['sit','hit','bit']}, {n:'-in', w:['win','pin','bin']}, {n:'-ig', w:['pig','big','dig']}], magic: ['kite','bike','five','nine'], var: [{rule:'ir (어)', w:['bird','girl','shirt']}] },
            'o': { sound: '아', fam: [{n:'-ot', w:['hot','pot','dot']}, {n:'-op', w:['mop','top','hop']}, {n:'-og', w:['dog','log','fog']}], magic: ['hope','nose','rose','bone'], var: [{rule:'or (오)', w:['corn','horn','fork']}] },
            'u': { sound: '어', fam: [{n:'-ug', w:['bug','rug','mug']}, {n:'-ub', w:['tub','rub','cub']}, {n:'-ut', w:['nut','cut','hut']}], magic: ['cute','tube','cube','mule'], var: [{rule:'ur (어)', w:['nurse','purple','turtle']}] }
        };
        const CONSONANT_DB = {
            locations: [
                { id: 'lips', title: '💋 입술 소리', tags: '(p, b, m, w)', items: [{id: 'p', kr: '프', w: 'pig'}, {id: 'b', kr: '브', w: 'bear'}, {id: 'm', kr: '음', w: 'mouse'}, {id: 'w', kr: '우/워', w: 'water'}]},
                { id: 'teeth', title: '🦷 혀끝 소리', tags: '(t, d, n, l)', items: [{id: 't', kr: '트', w: 'tiger'}, {id: 'd', kr: '드', w: 'dog'}, {id: 'n', kr: '은', w: 'nest'}, {id: 'l', kr: '을', w: 'lion'}]},
                { id: 'throat', title: '🗣️ 목 안쪽 소리', tags: '(k, g, c, q)', items: [{id: 'k', kr: '크', w: 'kite'}, {id: 'g', kr: '그', w: 'grapes'}, {id: 'c', kr: '크', w: 'cat'}, {id: 'q', kr: '쿠', w: 'queen'}]},
                { id: 'wind', title: '🌬️ 이·바람 소리', tags: '(s, z, f, v)', items: [{id: 's', kr: '스', w: 'sun'}, {id: 'z', kr: '즈', w: 'zebra'}, {id: 'f', kr: '프', w: 'fish'}, {id: 'v', kr: '브', w: 'van'}]},
                { id: 'etc', title: '기타 소리', tags: '(h, j, r, y, x)', items: [{id: 'h', kr: '흐', w: 'house'}, {id: 'j', kr: '즈', w: 'juice'}, {id: 'r', kr: '르', w: 'rabbit'}, {id: 'y', kr: '여', w: 'yo-yo'}, {id: 'x', kr: '크스', w: 'xylophone'}]}
            ],
            vs: [
                { p1: {id: 'p', kr: '바람만(프)', sound: '프', w: 'pig'}, p2: {id: 'b', kr: '목 떨림!(브)', sound: '브', w: 'bear'} },
                { p1: {id: 't', kr: '바람만(트)', sound: '트', w: 'tiger'}, p2: {id: 'd', kr: '목 떨림!(드)', sound: '드', w: 'dog'} },
                { p1: {id: 'k', kr: '바람만(크)', sound: '크', w: 'kite'}, p2: {id: 'g', kr: '목 떨림!(그)', sound: '그', w: 'grapes'} },
                { p1: {id: 's', kr: '바람만(스)', sound: '스', w: 'sun'}, p2: {id: 'z', kr: '목 떨림!(즈)', sound: '즈', w: 'zebra'} },
                { p1: {id: 'f', kr: '바람만(프)', sound: '프', w: 'fish'}, p2: {id: 'v', kr: '목 떨림!(브)', sound: '브', w: 'van'} }
            ]
        };
        const RAW_WORDS = "cat:고양이:🐱:a,dog:개:🐶:o,pig:돼지:🐷:i,sun:태양:☀️:u,bed:침대:🛏️:e,bat:박쥐:🦇:a,hat:모자:🧢:a,map:지도:🗺️:a,cap:모자:🧢:a,fan:선풍기:🌬️:a,man:남자:👨:a,pan:팬:🍳:a,net:그물:🥅:e,red:빨강:🔴:e,leg:다리:🦵:e,pen:펜:🖊️:e,hen:암탉:🐔:e,sit:앉다:🪑:i,hit:치다:🏏:i,lip:입술:👄:i,six:육:6️⃣:i,box:상자:📦:o,fox:여우:🦊:o,top:팽이:🌀:o,hop:뛰다:🦘:o,mop:걸레:🧹:o,bug:벌레:🐛:u,rug:깔개:🔲:u,mug:머그컵:☕:u,nut:견과:🥜:u,cup:컵:🥤:u,bus:버스:🚌:u,tub:욕조:🛁:u,mud:진흙:🟤:u,web:거미줄:🕸️:e,wet:젖은:💧:e,vet:수의사:👩‍⚕️:e,zip:지퍼:🤐:i,win:이기다:🏆:i,fin:지느러미:🦈:i,bin:쓰레기통:🗑️:i,pin:핀:📍:i,mix:섞다:🥣:i,sad:슬픈:😢:a,mad:화난:😡:a,bad:나쁜:😈:a,bag:가방:👜:a,tag:태그:🏷️:a,wag:흔들다:🐕:a,jam:잼:🍓:a,ham:햄:🍖:a,ram:숫양:🐏:a,can:캔:🥫:a,van:승합차:🚐:a,run:달리다:🏃:u,fun:재미:🎉:u,gum:껌:🍬:u,hot:뜨거운:🔥:o,pot:냄비:🥘:o,dot:점:⏺️:o,log:통나무:🪵:o,jog:조깅:🏃‍♂️:o,cop:경찰:👮:o,pop:터지다:💥:o,sob:흐느끼다:😭:o,rob:도둑질:🦹:o,nod:끄덕이다:😌:o,rod:막대:🦯:o";
        const CONS_WORDS = "bear:곰:🐻:b,tiger:호랑이:🐯:t,lion:사자:🦁:l,zebra:얼룩말:🦓:z,fish:물고기:🐟:f,mouse:생쥐:🐭:m,nest:둥지:🪹:n,rabbit:토끼:🐰:r,house:집:🏠:h,juice:주스:🧃:j,kite:연:🪁:k,grapes:포도:🍇:g,queen:여왕:👑:q,water:물:💧:w";

        const WORDS_DB = [...RAW_WORDS.split(','), ...CONS_WORDS.split(',')].map(item => {
            const [w, kr, emoji, ans] = item.split(':');
            const opts = ['a','e','i','o','u'].includes(ans) ? ['a','e','i','o','u'] : [ans, 'p','b','t','d','k','g','s','m'].sort(() => 0.5 - Math.random()).slice(0,5);
            if(!opts.includes(ans)) opts[0] = ans;
            return { w, kr, emoji, ans, parts: w.split(''), opts: opts.sort(() => 0.5 - Math.random()) };
        });

        // --- 전역 상태 ---
        let currentUser = null;
        let isAuthReady = false; 
        let state = {
            tab: 'learning', subTab: 'vowel', coins: 200, inventory: [], farmPets: [], altarSelection: [],
            toastMsg: null, currentQuiz: null, isAnswering: false, packOpening: false, revealedCard: null, animatingCorrect: null
        };

        // --- Firebase 유저 상태 감지 ---
        onAuthStateChanged(auth, async (user) => {
            isAuthReady = true;
            if (user) {
                currentUser = user;
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.coins = data.coins !== undefined ? data.coins : 200;
                    state.inventory = data.inventory || [];
                    state.farmPets = data.farmPets || [];
                } else {
                    state.coins = 200;
                    state.inventory = [];
                    state.farmPets = [];
                    saveToDB();
                }
                changeTab('learning');
            } else {
                currentUser = null;
                render(); 
            }
        });

        async function saveToDB() {
            if (!currentUser) return false;
            try {
                await setDoc(doc(db, "users", currentUser.uid), {
                    coins: state.coins, inventory: state.inventory, farmPets: state.farmPets
                });
                return true;
            } catch (e) { 
                console.error("저장 에러:", e); 
                return false;
            }
        }

        // --- 서버 저장 테스트 함수 ---
        window.testFirebase = async function() {
            showToast("서버와 동기화 중...");
            const success = await saveToDB();
            if(success) {
                setTimeout(() => showToast("✅ 서버 저장 완벽 성공!"), 1000);
            } else {
                setTimeout(() => showToast("❌ 서버 저장 실패 (규칙 확인 필요)"), 1000);
            }
        };

        window.handleAuth = async function(isLogin) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('이메일과 비밀번호를 모두 입력해주세요.');
            if(password.length < 6) return alert('비밀번호는 6자리 이상이어야 합니다.');
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('회원가입이 완료되었습니다! 시작합니다.');
                }
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') alert('이미 가입된 이메일입니다. 로그인을 눌러주세요.');
                else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') alert('이메일이나 비밀번호가 틀렸습니다.');
                else alert('오류가 발생했습니다: ' + error.message);
            }
        };

        window.logout = async function() {
            if(confirm("로그아웃 하시겠습니까?")) await signOut(auth);
        };

        window.speak = function(text, lang = 'en-US') {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        window.showToast = function(msg) {
            state.toastMsg = msg; render();
            setTimeout(() => { state.toastMsg = null; render(); }, 2000);
        }

        window.changeTab = function(tab) {
            state.tab = tab;
            if(tab === 'training' && !state.currentQuiz) getNewQuiz();
            if(tab !== 'altar') state.altarSelection = [];
            render();
        }

        window.setSubTab = function(subTab) {
            state.subTab = subTab; render();
        }

        function getCardGradeStyle(grade) {
            if (grade === 'SUPER') return 'grade-super';
            if (grade === 'RARE') return 'grade-rare';
            return 'grade-normal';
        }
        
        function getCardGradeText(grade) {
            if (grade === 'SUPER') return '<span class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-3 py-1 rounded-full text-xs font-black shadow-sm">👑 SUPER (S급)</span>';
            if (grade === 'RARE') return '<span class="bg-gradient-to-r from-slate-300 to-slate-400 text-slate-700 px-3 py-1 rounded-full text-xs font-black shadow-sm">✨ RARE (A급)</span>';
            return '<span class="bg-gray-200 text-gray-500 px-3 py-1 rounded-full text-xs font-bold">NORMAL (일반)</span>';
        }

        window.render = function() {
            const app = document.getElementById('app');
            if (!isAuthReady) return;

            // --- 로그인 화면 ---
            if (!currentUser) {
                app.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-8 w-full bg-gradient-to-b from-blue-50 to-blue-100">
                        <div class="text-6xl mb-6 animate-bounce">👻</div>
                        <h1 class="text-4xl font-black text-blue-800 mb-2 tracking-tight">Phonics Monster</h1>
                        <p class="text-gray-500 font-bold mb-8 text-center">나만의 파닉스 몬스터를<br>수집하고 진화시키세요!</p>
                        <div class="w-full bg-white p-6 rounded-3xl shadow-xl flex flex-col gap-4">
                            <input type="email" id="email" placeholder="이메일 주소" class="w-full bg-gray-100 px-4 py-3 rounded-xl font-bold text-gray-800 outline-none focus:ring-2 focus:ring-blue-400">
                            <input type="password" id="password" placeholder="비밀번호 (6자리 이상)" class="w-full bg-gray-100 px-4 py-3 rounded-xl font-bold text-gray-800 outline-none focus:ring-2 focus:ring-blue-400 mb-2">
                            <button onclick="handleAuth(true)" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-[0_4px_0_#1d4ed8] active:translate-y-1 active:shadow-none transition-all">로그인</button>
                            <button onclick="handleAuth(false)" class="w-full bg-white text-blue-600 border-2 border-blue-200 font-black py-4 rounded-xl active:bg-blue-50 transition-all mt-2">10초만에 회원가입</button>
                        </div>
                    </div>
                `;
                return;
            }

            // --- 앱 메인 화면 ---
            const toastHtml = state.toastMsg ? `
                <div class="absolute top-20 left-1/2 -translate-x-1/2 z-[100] bg-gray-800 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl animate-pop whitespace-nowrap">
                    ${state.toastMsg}
                </div>
            ` : '';

            const packOverlayHtml = state.packOpening ? `
                <div class="absolute inset-0 z-[200] bg-black/90 flex flex-col items-center justify-center p-6 backdrop-blur-sm">
                    ${state.revealedCard ? `
                        <div class="${getCardGradeStyle(state.revealedCard.grade)} rounded-3xl p-8 w-full max-w-[280px] animate-pop flex flex-col items-center text-center relative overflow-hidden">
                            ${state.revealedCard.grade !== 'NORMAL' ? '<div class="absolute inset-0 bg-[url(\'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=\')] opacity-50 mix-blend-overlay"></div>' : ''}
                            <div class="relative z-10 w-full flex flex-col items-center">
                                <div class="mb-6">${getCardGradeText(state.revealedCard.grade)}</div>
                                <div class="text-8xl mb-4 drop-shadow-md">${state.revealedCard.emoji}</div>
                                <div class="text-gray-500 font-black mb-1 bg-white/50 px-3 py-1 rounded-full text-sm">${state.revealedCard.kr}</div>
                                <div class="text-4xl font-black mb-8 text-gray-800 tracking-wider">${state.revealedCard.w}</div>
                                <div class="w-full flex gap-2 flex-col">
                                    <button onclick="keepCard()" class="w-full py-3.5 bg-blue-500 text-white rounded-xl font-black text-lg shadow-[0_4px_0_#1d4ed8] active:translate-y-1 active:shadow-none transition-all">
                                        <i class="fa-solid fa-box-open mr-1"></i> 도감에 넣기
                                    </button>
                                    <button onclick="discardCard()" class="w-full py-3 bg-red-50 text-red-500 border border-red-200 rounded-xl font-bold text-sm active:bg-red-100 transition-colors">
                                        <i class="fa-solid fa-trash-can mr-1"></i> 버리기 (+10)
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="text-9xl animate-pack-open filter drop-shadow-2xl mb-8">📦</div>
                        <div class="text-white font-bold text-2xl animate-pulse">카드를 뽑는 중...</div>
                    `}
                </div>
            ` : '';

            let contentHtml = '';
            if(state.tab === 'learning') contentHtml = renderLearning();
            if(state.tab === 'training') contentHtml = renderTraining();

                    getNewQuiz();
                    render();

                state.coins = Math.max(0, state.coins - 10);
                saveToDB(); 
                let soundKr = selected;
                if (VOWEL_DB[selected]) soundKr = VOWEL_DB[selected].sound;
                else {
                    const allCons = [];
                    CONSONANT_DB.locations.forEach(loc => allCons.push(...loc.items));

                    ` : ''}
                    <div class="flex-1 bg-white rounded-t-3xl p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] border-t border-gray-100 overflow-y-auto">
                        <h3 class="font-bold text-gray-700 mb-3 text-sm">합성 가능한 일반 카드</h3>
                        <div class="grid grid-cols-4 gap-2">
                            ${normalCards.map(item => {
                                const isSel = state.altarSelection.includes(item.id);
                                return `
                                <button onclick="selectForAltar('${item.id}')" class="relative bg-slate-50 border-2 rounded-xl p-2 flex flex-col items-center transition-all ${isSel ? 'border-blue-500 bg-blue-50' : 'border-slate-200'}">
                                    <div class="text-2xl">${item.emoji}</div>
                                    <div class="text-[9px] font-black mt-1 truncate w-full text-center text-slate-700">${item.w}</div>
                                    ${isSel ? '<div class="absolute -top-2 -right-2 bg-blue-500 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center font-bold">✓</div>' : ''}
                                </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDex() {
            if(state.inventory.length === 0) {
                return `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 font-bold gap-4">
                        <i class="fa-solid fa-book-open text-5xl"></i>
                        <p>수집한 카드가 없어요.</p>
                    </div>
                `;
            }
            return `
                <div class="p-4">
                    <h2 class="text-xl font-black text-slate-800 mb-4 px-2">나의 도감 <span class="text-blue-500">${state.inventory.length}</span></h2>
                    <div class="grid grid-cols-3 gap-3">
                        ${state.inventory.slice().reverse().map(item => `
                            <div class="${getCardGradeStyle(item.grade)} rounded-2xl p-3 flex flex-col items-center relative overflow-hidden active:scale-95 transition-transform" onclick="speak('${item.w}')">
                                ${item.grade === 'SUPER' ? '<div class="absolute top-0 right-0 bg-yellow-400 text-white text-[8px] font-black px-2 py-0.5 rounded-bl-lg">S급</div>' : ''}
                                ${item.grade === 'RARE' ? '<div class="absolute top-0 right-0 bg-slate-400 text-white text-[8px] font-black px-2 py-0.5 rounded-bl-lg">A급</div>' : ''}
                                <div class="text-3xl mb-1 mt-2 z-10">${item.emoji}</div>
                                <div class="text-xs font-black text-slate-800 truncate w-full text-center z-10">${item.w}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderFarm() {
            if(state.farmPets.length === 0) {
                return `
                    <div class="flex flex-col items-center justify-center h-full text-green-700 font-bold gap-4 p-6 text-center bg-green-50/50">
                        <i class="fa-solid fa-seedling text-5xl text-green-400"></i>
                        <p>농장이 비어있어요!</p>
                    </div>
                `;
            }
            return `
                <div class="relative w-full h-full bg-gradient-to-b from-blue-200 via-green-200 to-green-300 overflow-hidden">
                    <div class="absolute top-4 left-4 text-white font-black drop-shadow-md z-10">
                        🌳 내 농장 (${state.farmPets.length}마리)
                    </div>
                    ${state.farmPets.map((pet, i) => `
                        <div class="absolute cursor-pointer hover:scale-110 transition-transform flex flex-col items-center drop-shadow-xl z-20"
                             style="left: ${pet.x}%; top: ${pet.y}%; animation: shake ${3 + (i%2)}s infinite alternate ease-in-out;"
                             onclick="speak('${pet.w}')">
                            <div class="text-4xl bg-white/80 rounded-full w-12 h-12 flex items-center justify-center shadow-inner border-2 border-white/50 backdrop-blur-sm relative">
                                ${pet.grade === 'SUPER' ? '<div class="absolute -top-2 text-xs">👑</div>' : ''}
                                ${pet.grade === 'RARE' ? '<div class="absolute -top-2 text-xs">✨</div>' : ''}
                                ${pet.emoji}
                            </div>
                            <div class="bg-black/50 text-white text-[10px] font-bold px-2 py-0.5 rounded-full mt-1 backdrop-blur-sm">
                                ${pet.w}
                            </div>
                        </div>
                    `).join('')}
                    <div class="absolute bottom-10 left-10 text-6xl opacity-50 z-0">🌲</div>
                    <div class="absolute bottom-20 right-10 text-5xl opacity-50 z-0">🌳</div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', render);
        if (document.readyState === 'complete' || document.readyState === 'interactive') render();
    </script>
</body>
</html>
