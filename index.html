  }
  state.children=rows;
}

/* ============================================================
 *  6) Firestore 구독 (실시간 동기화)
 * ============================================================ */
function plannerRef(){ return db.collection("planner").doc(state.ownerUid); }
function rangeFor(){
  let s,e;
  if(state.view==="month"){
    const first=new Date(state.cursor.getFullYear(),state.cursor.getMonth(),1);
    s=startOfWeek(first); e=addDays(s,41);
  }else if(state.view==="week"){
    s=startOfWeek(state.cursor); e=addDays(s,6);
  }else{ // 할 일 탭: 주간 날짜 줄 + 어제 비교까지 한 번에 받아 둠
    const ws=startOfWeek(state.cursor); s=addDays(ws,-1); e=addDays(ws,6);
  }
  return {start:fmt(s), end:fmt(e)};
}
function subscribeTasks(){
  if(state._taskUnsub) state._taskUnsub();
  const {start,end}=rangeFor();
  state._taskUnsub = plannerRef().collection("tasks")
    .where("date",">=",start).where("date","<=",end)
    .onSnapshot(snap=>{
      state.tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
      state.tasksMap={}; state.tasks.forEach(t=>state.tasksMap[t.id]=t);
      render();
    }, err=>console.error("tasks",err));
}
function subscribeCategories(){
  if(state._catUnsub) state._catUnsub();
  state._catUnsub = plannerRef().collection("meta").doc("categories")
    .onSnapshot(async doc=>{
      if(doc.exists){ state.categories=doc.data(); }
      else if(!state.viewingChild){ // 내 플래너면 시드 생성
        state.categories=seedCategories();
        await plannerRef().collection("meta").doc("categories").set(state.categories);
      }
      render();
    });
  // settings
  plannerRef().collection("meta").doc("settings").get().then(d=>{
    const base=defaultSettings();
    const loaded=d.exists? d.data():{};
    state.settings = Object.assign(base, loaded, { allowance: Object.assign(base.allowance, loaded.allowance||{}) });
    if(!d.exists && !state.viewingChild) plannerRef().collection("meta").doc("settings").set(state.settings);
    render();
  });
}
async function saveTask(t){
  try{ monGainCheck(state.tasksMap[t.id], t); }catch(_){}
  await plannerRef().collection("tasks").doc(t.id).set(t);
}
async function deleteTaskDoc(id){ await plannerRef().collection("tasks").doc(id).delete(); }
async function saveCategories(c){ state.categories=c; await plannerRef().collection("meta").doc("categories").set(c); }
async function saveSettings(s){ state.settings=s; await plannerRef().collection("meta").doc("settings").set(s); }
/* ----- 일일 목표시간 (날짜별 저장, 캐시는 state.dayGoals) ----- */
async function loadDayGoal(ds){
  if(state.dayGoals[ds]!==undefined) return state.dayGoals[ds];
  try{
    const d=await plannerRef().collection("daygoals").doc(ds).get();
    state.dayGoals[ds]= d.exists? Number(d.data().goalMin)||0 : null;
  }catch(_){ state.dayGoals[ds]=null; }
  return state.dayGoals[ds];
}
async function setDayGoal(ds,min){
  min=Math.max(0,Number(min)||0);
  state.dayGoals[ds]=min;
  try{ await plannerRef().collection("daygoals").doc(ds).set({goalMin:min}); }catch(e){ console.error(e); }
  render();
}
function promptDayGoal(ds){
  const v=prompt("오늘 목표 학습시간(분)을 입력하세요:", String(effDayGoal(ds)));
  if(v==null) return;
  setDayGoal(ds, v);
}
function effDayGoal(ds){
  const ov=state.dayGoals[ds];
  if(ov!=null && ov!==undefined) return ov;
  return dayTypeGoal(ds);
}

/* ----- 등교일 / 비등교일(주말·방학) 구분 ----- */
// 자동 판정: 월~금 = 등교, 토·일 = 비등교. 방학 기간이 설정돼 있으면 그 기간은 비등교.
function autoDayType(ds){
  const d=parseD(ds), dow=d.getDay();
  const V=state.settings.vacations||[];
  for(const v of V){ if(v && v.from && v.to && ds>=v.from && ds<=v.to) return "free"; }
  return (dow===0||dow===6)? "free" : "school";
}
function effDayType(ds){
  const ov=state.dayTypes[ds];
  return (ov==="school"||ov==="free")? ov : autoDayType(ds);
}
function dayTypeGoal(ds){
  const s=state.settings;
  const base = effDayType(ds)==="free"
    ? (s.dailyGoalFree!=null? s.dailyGoalFree : 240)
    : (s.dailyGoalSchool!=null? s.dailyGoalSchool : (s.dailyGoalMin||120));
  const e=examFor(ds);                       // 시험 대비 기간이면 목표 상향
  return base + (e? (Number(e.boost)||150) : 0);
}
async function loadDayTypes(days){
  const need=days.filter(ds=>state.dayTypes[ds]===undefined);
  if(!need.length) return;
  need.forEach(ds=>state.dayTypes[ds]=null); // 중복 조회 방지
  try{
    const snaps=await Promise.all(need.map(ds=>plannerRef().collection("daytypes").doc(ds).get()));
    snaps.forEach((doc,i)=>{ if(doc.exists) state.dayTypes[need[i]]=doc.data().type||null; });
  }catch(e){ console.error(e); }
}
async function setDayType(ds,type){
  state.dayTypes[ds]=type;               // "school" | "free" | null(자동)
  state.dayGoals[ds]=undefined;          // 유형이 바뀌면 목표도 유형 기본값으로
  try{
    const ref=plannerRef().collection("daytypes").doc(ds);
    if(type) await ref.set({type});
    else await ref.delete();
    await plannerRef().collection("daygoals").doc(ds).delete().catch(()=>{});
  }catch(e){ console.error(e); }
  delete state.dayGoals[ds];
  render();
}
function toggleDayType(ds){
  setDayType(ds, effDayType(ds)==="school"? "free" : "school");
}

function vacListHTML(){

async function addVacation(){
  const from=(document.getElementById("vacFrom")||{}).value;
  const to=(document.getElementById("vacTo")||{}).value;
  const name=((document.getElementById("vacName")||{}).value||"방학").trim();

async function removeVacation(i){
  const V=[...(state.settings.vacations||[])];
  if(!V[i]) return;
  if(!confirm(`'${V[i].name||"방학"}' 기간을 삭제할까요?`)) return;
  V.splice(i,1);
  await saveSettings({...state.settings, vacations:V});
  state.dayTypes={}; state.dayGoals={};
  drawSettings(); render();
}

function tbById(id){return (state.categories.textbooks||[]).find(t=>t.id===id);}

function tasksOn(dateStr){
  // 미완료를 위로(할 일 먼저), 그 다음 등록 순서
  return state.tasks.filter(t=>t.date===dateStr)
    .sort((a,b)=>((a.done?1:0)-(b.done?1:0)) || ((a.order||0)-(b.order||0)));

/* ============================================================
 *  하루틀 UI — 아래쪽 메뉴(할 일 · 일정 · 학습 · 기록) + ✨ 빠른 계획
 * ============================================================ */
const WD_FULL=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
function setTab(t, force){
  const prevView=state.view;
  if(t===state.tab && !force){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  state.tab=t;
  if(t==="timer"){ focusTasks=null; FocusSound.prepareAll(); }   // 오늘 과제 새로 읽기 · 소리 미리 만들기
  if(t==="todo") state.view="day";
  else if(t==="plan") state.view=state.planView||"week";
  if(state.view!==prevView || force) subscribeTasks(); else render();
  window.scrollTo(0,0);
}
// 새 학습을 넣을 기본 날짜: 할 일 탭에서는 고른 날, 그 외에는 오늘
function addDate(){ return state.tab==="todo"? fmt(state.cursor) : fmt(new Date()); }
function selectDay(ds){
  const same=fmt(startOfWeek(parseD(ds)))===fmt(startOfWeek(state.cursor));
  state.cursor=parseD(ds);
  if(same) render(); else subscribeTasks();
}
function render(){
  if(!state.profile) return;
  const main=document.getElementById("main"), head=document.getElementById("pageHead");
  document.querySelectorAll(".bnav-pill button").forEach(b=>b.classList.toggle("on", b.dataset.tab===state.tab));
  if(state.tab==="learn"){ head.innerHTML=pageHead("학습", state.viewingChild? `${esc(state.ownerName)} 님의 학습앱` : "천문장 · 영단어 · 문법"); main.innerHTML=renderLearn(); }
  else if(state.tab==="stats"){ head.innerHTML=pageHead("기록", "성장 · 보상 · 리포트"); main.innerHTML=renderRecord(); }
  else if(state.tab==="timer"){ head.innerHTML=pageHead("포커스", "집중 타이머"); main.innerHTML=renderFocus(); bindFocusDial(); }
  else if(state.tab==="plan"){ head.innerHTML=planHead(); main.innerHTML= state.view==="month"? renderMonth() : renderWeek(); }
  else { head.innerHTML=todoHead(); main.innerHTML=renderDay(); }
  updateMonHead();
  updateTopChips();
  updateWeekBanner();
}
function pageHead(title, sub){
  return `<div class="page-h"><div><div class="h-sub">${sub||""}</div><h2>${title}</h2></div></div>`;
}
function todoHead(){
  const d=state.cursor, ds=fmt(d), today=fmt(new Date());
  const ws=startOfWeek(d);
  let strip="";
  for(let i=0;i<7;i++){
    const x=addDays(ws,i), xs=fmt(x), ts=state.tasks.filter(t=>t.date===xs), done=ts.filter(t=>t.done).length;
    const cls=["wday", xs===ds?"on":"", xs===today?"today":"", x.getDay()===0?"sun":"", x.getDay()===6?"sat":"", ts.length&&done===ts.length?"full":""].join(" ");
    strip+=`<button class="${cls}" onclick="selectDay('${xs}')"><span class="w">${WD[i]}</span><span class="n">${x.getDate()}</span><span class="r">${ts.length? (done===ts.length?"✓ ":"")+`${done}/${ts.length}` : ""}</span></button>`;
  }
  const sub = ds===today? "오늘" : `${d.getMonth()+1}월 ${d.getDate()}일`;
  return `<div class="page-h">
      <div><div class="h-sub">${sub}</div><h2>${WD_FULL[d.getDay()]}</h2></div>
      <div class="h-nav">
        ${(ds!==today)?`<button class="today-chip" onclick="goToday()">오늘</button>`:""}
        <button onclick="nav(-1)" aria-label="지난주">‹</button>
        <span>${ws.getFullYear()}년 ${ws.getMonth()+1}월</span>
        <button onclick="nav(1)" aria-label="다음 주">›</button>
      </div>
    </div>
    <div class="wstrip">${strip}</div>`;
}
function planHead(){
  const isCur = state.view==="month"
    ? (state.cursor.getFullYear()===new Date().getFullYear() && state.cursor.getMonth()===new Date().getMonth())
    : fmt(startOfWeek(state.cursor))===fmt(startOfWeek(new Date()));
  return `<div class="page-h">
      <div><div class="h-sub">${state.view==="month"?"월간 계획":"주간 계획"}</div><h2>일정</h2></div>
      <div class="h-nav">
        ${isCur?"":`<button class="today-chip" onclick="goToday()">오늘</button>`}
        <button onclick="nav(-1)" aria-label="이전">‹</button>
        <span>${periodLabel()}</span>
        <button onclick="nav(1)" aria-label="다음">›</button>
      </div>
    </div>
    <div class="seg">
      <button class="${state.view==="week"?"on":""}" onclick="setView('week')">주간</button>
      <button class="${state.view==="month"?"on":""}" onclick="setView('month')">월간</button>

}
function updateTopChips(){
  const today=fmt(new Date());
  if(state.streakCache===null && !state._streakLoading){
    state._streakLoading=true;
    refreshStreakCache().then(()=>{ state._streakLoading=false; updateTopChips(); });
  }
  const s=state.streakCache;
  const st=document.getElementById("tbStreak"); if(st) st.textContent="🔥 "+(s? s.streak : 0);
  // 오늘이 조회 범위에 있을 때만 새로 셈 (아니면 마지막 값 유지)
  const {start,end}=rangeFor();
  if(today>=start && today<=end) state._todayDone=state.tasks.filter(t=>t.date===today && t.done).length;
  const dn=document.getElementById("tbDone"); if(dn) dn.textContent="✅ "+(state._todayDone||0);

function learnCard(k, x, min){
  const A=EXT_APPS[k], s=x&&x.sum;
  let sub, stats, prog;
  if(k==="sentence"){
    sub=s? `연속 ${s.streak}일 · 포인트 ${s.pts.toLocaleString()}` : "문장 성분 분석 · 5형식 · 문법 포인트";
    stats=s? [[`${s.today}/${s.goal}`,"오늘 문장"],[s.mastered,"마스터"],[s.weak,"취약 문장"]] : null;
    prog=s&&s.total? {pct:Math.round(s.mastered/s.total*100), l:`마스터 ${s.mastered} / ${s.total}문장`} : null;
  }else if(k==="vocab"){
    sub=s? `연속 ${s.streak}일 · 포인트 ${s.points.toLocaleString()}` : "하루 단어 · 어근 · 복습 카드";
    stats=s? [[s.todayNew,"오늘 신규"],[s.todayRev,"오늘 복습"],[s.mastered,"마스터"]] : null;
    prog=s&&s.intro? {pct:Math.round(s.mastered/Math.max(1,s.intro)*100), l:`학습한 ${s.intro}단어 중 ${s.mastered}개 마스터`} : null;
  }else{
    sub=s? `연속 ${s.streak}일 · ${s.pts.toLocaleString()} XP` : "레벨 1~3 유닛 · 개념 카드 · 퀴즈";
    stats=s? [[`${s.todayMin}분`,"오늘 집중"],[s.answered? Math.round(s.correct/s.answered*100)+"%" : "–","오늘 정답률"],[`${s.done}`,"완료 유닛"]] : null;
    prog=s&&s.total? {pct:Math.round(s.done/s.total*100), l:`유닛 ${s.done} / ${s.total} 완료`} : null;
  }
  const go = state.viewingChild
    ? ""
    : `<button class="lgo" onclick="openLearnApp('${k}')">${s?"이어서 학습하기":"시작하기"} ›</button>`;
  return `<div class="lcard">
    <div class="lcard-top">
      <span class="lcard-ic" style="background:${A.soft}">${A.emo}</span>
      <div style="min-width:0"><div class="lcard-name">${A.name}</div><div class="lcard-sub">${sub}</div></div>
      <span class="lcard-min ${min?"":"zero"}">오늘 +${min}분</span>
    </div>
    ${stats?`<div class="lstats">${stats.map(([v,l])=>`<div class="lstat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`:`<div style="font-size:12.5px;color:#8F8D9B;margin:12px 0 2px">${state.viewingChild?"아직 학습 기록이 없어요.":"아직 기록이 없어요. 첫 학습을 시작해 보세요!"}</div>`}
    ${prog?`<div class="lprog"><div style="width:${prog.pct}%;background:${A.color}"></div></div><div class="lprog-l"><span>${prog.l}</span><span>${prog.pct}%</span></div>`:""}
    ${go}
  </div>`;
}
// 학습앱을 전체 화면으로 열기 (같은 계정으로 자동 로그인)
function openLearnApp(k){
  const A=EXT_APPS[k]; if(!A) return;
  closeLearnApp(true);
  const w=document.createElement("div");
  w.className="lapp"; w.id="learnApp";
  w.innerHTML=`<div class="lapp-h">
      <button class="lapp-back" onclick="leaveLearnApp()">‹ 플래너</button>
      <span class="sp"></span><b>${A.emo} ${A.name}</b><span class="sp"></span>
      <span style="width:84px"></span>
    </div>
    <iframe src="${A.page}" title="${A.name}"></iframe>`;
  document.body.appendChild(w);
  document.body.classList.add("lapp-open");
  try{ history.pushState({lapp:k}, ""); }catch(_){}
}
function leaveLearnApp(){
  if(history.state && history.state.lapp) history.back(); else closeLearnApp();
}
function closeLearnApp(silent){
  const w=document.getElementById("learnApp"); if(!w) return;
  w.remove(); document.body.classList.remove("lapp-open");
  if(!silent){ state.extCache=null; render(); }   // 방금 공부한 기록 다시 읽기
}
Device.onChange(()=>{ if(state.profile) render(); });
window.addEventListener("popstate", ()=>{ if(document.getElementById("learnApp")) closeLearnApp(); });

/* ============================================================
 *  ⏱ 포커스 타이머 — 원을 돌려 시간을 맞추고, 필요하면 집중 사운드와 함께
 *  과제를 고르면 집중한 시간이 그 과제의 '타이머 실측 시간'(100% 인정)으로 기록됩니다.
 * ============================================================ */
const FOCUS_KEY="planner_focus_v1";
let F={setMin:25, mode:"idle", total:0, endAt:0, remaining:0, accSec:0, segAt:0, taskId:"", sound:"", vol:0.6, doneMin:0, doneTask:""};
let focusTick=null, focusTasks=null, focusToday=null, dialDrag=false;
function focusSave(){ try{ localStorage.setItem(FOCUS_KEY, JSON.stringify(F)); }catch(_){} }
function focusLoad(){
  try{ const o=JSON.parse(localStorage.getItem(FOCUS_KEY)||"null"); if(o) F=Object.assign(F,o); }catch(_){}
  FocusSound.setVolume(F.vol);
  // 새로고침 뒤에는 브라우저가 자동 재생을 막으므로, 처음 화면을 누를 때 사운드를 다시 켬
  if(F.mode==="run"||F.mode==="break") document.addEventListener("pointerdown", ()=>{ if(F.mode==="run"||F.mode==="break"){ focusAudioOn(); focusWake(); } }, {once:true});
  if(F.mode==="run" || F.mode==="break"){
    if(Date.now()>=F.endAt){ F.mode==="run"? focusFinish(true) : focusBreakEnd(true); }
    else focusStartTick();
  }
}
const mmss=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
function focusRemaining(){
  if(F.mode==="run"||F.mode==="break") return Math.max(0,F.endAt-Date.now());
  if(F.mode==="pause") return F.remaining;
  return F.setMin*60000;
}
function focusElapsedSec(){ return F.accSec + (F.mode==="run"? (Date.now()-F.segAt)/1000 : 0); }
function focusStartTick(){
  if(focusTick) clearInterval(focusTick);
  focusTick=setInterval(()=>{
    const rem=focusRemaining();
    if(rem<=0){ F.mode==="run"? focusFinish() : focusBreakEnd(); return; }
    const bt=document.getElementById("bigTime"); if(bt) bt.textContent=mmss(rem);
    const arc=document.getElementById("runArc");
    if(arc){ const C=2*Math.PI*100; arc.setAttribute("stroke-dasharray", `${C*(F.total? rem/F.total : 0)} ${C}`); }
    focusNavLabel();
  },1000);
  focusNavLabel();
}
function focusStopTick(){ if(focusTick){ clearInterval(focusTick); focusTick=null; } focusNavLabel(); }
function focusNavLabel(){
  const l=document.querySelector('.bnav-pill [data-tab="timer"] .lbl'); if(!l) return;
  l.textContent=(F.mode==="run"||F.mode==="break")? mmss(focusRemaining()) : (F.mode==="pause"? "일시정지" : "타이머");
}
// 오늘 내 학습 목록 (부모가 자녀를 보고 있어도 타이머는 내 플래너 기준)
async function loadFocusTasks(){
  const uid=state.user.uid, today=fmt(new Date());
  try{
    const [snap, log]=await Promise.all([
      db.collection("planner").doc(uid).collection("tasks").where("date","==",today).get(),
      db.collection("planner").doc(uid).collection("focus").doc(today).get(),
    ]);
    focusTasks=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>!t.done).sort((a,b)=>(a.order||0)-(b.order||0));
    focusToday=log.exists? log.data() : {min:0, sessions:0};
  }catch(e){ console.error("포커스 목록", e); focusTasks=[]; focusToday={min:0,sessions:0}; }
  if(state.tab==="timer") render();
}
function focusTaskLabel(t){
  const su=(state.viewingChild? null : subjById(t.subjectId));
  return `${su?su.name+" · ":""}${t.unit||t.method||"학습"} (${t.plannedMin||0}분)`;
}
function renderFocus(){
  if(focusTasks===null){ loadFocusTasks(); }
  const R=100, C=2*Math.PI*R, m=F.setMin;
  const task=(focusTasks||[]).find(t=>t.id===F.taskId);
  const running=F.mode==="run"||F.mode==="pause";
  const opts=`<option value="">과제 없이 집중하기</option>`+(focusTasks||[]).map(t=>`<option value="${t.id}" ${t.id===F.taskId?"selected":""}>${esc(focusTaskLabel(t))}</option>`).join("");
  let body="";
  if(F.mode==="done"){
    body=`<div class="fo-done">
      <div class="fo-big-emo">🎉</div>
      <div class="fo-done-t">${F.doneMin}분 집중 완료!</div>
      <div class="fo-done-s">${F.doneTask? `‘${esc(F.doneTask)}’에 ${F.doneMin}분이 실측 시간으로 기록됐어요` : "잠깐 쉬었다가 다음 집중을 시작해요"}</div>

    </div>`;
  }else if(F.mode==="break"){
    const rem=focusRemaining();
    body=`<svg class="fo-dial" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#DDF3E9" stroke-width="22"/>
        <circle id="runArc" cx="130" cy="130" r="${R}" fill="none" stroke="#0E9F6E" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*(F.total?rem/F.total:0)} ${C}" transform="rotate(-90 130 130)"/>
        <text x="130" y="148" text-anchor="middle" font-size="52">☕</text></svg>
      <div class="fo-time" id="bigTime">${mmss(rem)}</div>
      <div class="fo-sub">쉬는 시간 · 물 한 잔, 스트레칭</div>
      <div class="fo-ctrl"><button class="fo-btn ghost" onclick="focusBreakEnd()">휴식 끝내기</button></div>`;
  }else if(!running){
    let ticks="";
    for(let i=0;i<60;i++){ const t=i/60*2*Math.PI, r1=i%5?R-6:R-11;
      ticks+=`<line x1="${(130+(R-2)*Math.sin(t)).toFixed(1)}" y1="${(130-(R-2)*Math.cos(t)).toFixed(1)}" x2="${(130+r1*Math.sin(t)).toFixed(1)}" y2="${(130-r1*Math.cos(t)).toFixed(1)}" stroke="#1C1B24" stroke-width="${i%5?1:1.6}" opacity="${i<m?.85:.2}"/>`; }
    const a=m/60*2*Math.PI, kx=130+R*Math.sin(a), ky=130-R*Math.cos(a);
    body=`<svg class="fo-dial" id="foDial" viewBox="0 0 260 260" role="slider" aria-label="집중 시간(분)" aria-valuemin="1" aria-valuemax="60" aria-valuenow="${m}" tabindex="0">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#E6E1FB" stroke-width="26"/>
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#6A58E6" stroke-width="26" stroke-linecap="round" stroke-dasharray="${C*m/60} ${C}" transform="rotate(-90 130 130)"/>
        ${ticks}
        <text x="130" y="42" text-anchor="middle" font-size="12" fill="#8F8D9B">60</text><text x="222" y="134" text-anchor="middle" font-size="12" fill="#8F8D9B">15</text>
        <text x="130" y="226" text-anchor="middle" font-size="12" fill="#8F8D9B">30</text><text x="38" y="134" text-anchor="middle" font-size="12" fill="#8F8D9B">45</text>
        <text x="130" y="146" text-anchor="middle" font-size="54" font-weight="700" fill="#1C1B24">${m}</text>
        <text x="130" y="170" text-anchor="middle" font-size="13" fill="#8F8D9B">분</text>
        <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="15" fill="#fff" stroke="#6A58E6" stroke-width="3"/>
      </svg>
      <div class="fo-presets">${[15,25,50].map(x=>`<button class="${m===x?"on":""}" onclick="focusSetMin(${x})">${x}분</button>`).join("")}</div>
      <div class="fo-ctrl"><button class="fo-btn" onclick="focusStart()">시작하기 ▶</button></div>
      <div class="fo-sub">원을 돌리거나 빠른 시간을 눌러 맞추세요</div>`;
  }else{
    const rem=focusRemaining();
    body=`<svg class="fo-dial ${F.mode==="pause"?"paused":""}" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#E9E8F0" stroke-width="22"/>
        <circle id="runArc" cx="130" cy="130" r="${R}" fill="none" stroke="#6A58E6" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*(F.total?rem/F.total:0)} ${C}" transform="rotate(-90 130 130)"/>
        <circle cx="130" cy="130" r="70" fill="#F4F2FF"/>
        <text class="fo-glass" x="130" y="152" text-anchor="middle" font-size="58">⏳</text>
      </svg>
      <div class="fo-time" id="bigTime">${mmss(rem)}</div>
      <div class="fo-sub">${task? esc(focusTaskLabel(task)) : "과제 없이 집중 중"}</div>
      <div class="fo-ctrl">
        <button class="fo-btn ghost" onclick="focusPlus()">+5분</button>
        <button class="fo-btn" onclick="focusPause()">${F.mode==="run"?"❚❚ 일시 중지":"▶ 계속"}</button>
        <button class="fo-btn ghost" onclick="focusEnd()">⏹ 끝</button>
      </div>`;
  }
  const S=FocusSound.TRACKS;
  const sound=`<div class="fo-card">
      <div class="fo-card-h">🎧 집중 사운드 <span>${F.sound? esc(S[F.sound].desc) : "필요할 때만 골라 켜세요"}</span></div>
      <div class="fo-sounds">
        <button class="${!F.sound?"on":""}" onclick="focusSound('')">🔇 끄기</button>
        ${Object.entries(S).map(([k,t])=>`<button class="${F.sound===k?"on":""}" onclick="focusSound('${k}')">${t.emo} ${t.name}</button>`).join("")}
      </div>
      <div class="fo-vol"><span>🔈</span><input type="range" min="0" max="100" value="${Math.round(F.vol*100)}" oninput="focusVol(this.value)" aria-label="사운드 크기"><span>🔊</span></div>
      <label class="fo-awake"><input type="checkbox" ${F.keepAwake?"checked":""} onchange="focusKeepAwake(this.checked)"> 📱 타이머가 도는 동안 화면 켜 두기</label>
      <div class="fo-hint">타이머가 도는 동안 재생되고, <b>휴대폰 화면이 꺼져도 소리와 끝 알림이 이어져요</b>(잠금 화면에 재생 컨트롤이 보여요). 브라우저를 닫거나 앱을 완전히 끄면 멈춰요. 멈춰 있을 때 고르면 6초 미리 들려 드려요. iPhone은 음량 버튼으로 크기를 조절하세요.</div>

      <div class="r-stat"><div class="e">🍅</div><b>${td.sessions||0}</b><span>완료한 집중</span></div>

function bindFocusDial(){
  const dial=document.getElementById("foDial"); if(!dial) return;
  const set=e=>{
    const r=dial.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
    let a=Math.atan2(x,-y); if(a<0) a+=2*Math.PI;
    let v=Math.round(a/(2*Math.PI)*60); if(v===0) v=F.setMin>30?60:1;
    if(v!==F.setMin){ F.setMin=v; render(); if(navigator.vibrate) try{navigator.vibrate(4);}catch(_){} }
  };
  dial.addEventListener("pointerdown",e=>{ dialDrag=true; set(e); });
  window.onpointermove=e=>{ if(dialDrag) set(e); };
  window.onpointerup=()=>{ if(dialDrag){ dialDrag=false; focusSave(); } };
  dial.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowRight"){ focusSetMin(Math.min(60,F.setMin+1)); }
    if(e.key==="ArrowDown"||e.key==="ArrowLeft"){ focusSetMin(Math.max(1,F.setMin-1)); }
    setTimeout(()=>{ const d=document.getElementById("foDial"); if(d) d.focus(); },0);
  });
}
function focusSetMin(m){ F.setMin=m; focusSave(); render(); }
function focusStart(){
  FocusSound.unlock();
  // 같은 과제의 기존 타이머가 돌고 있으면 먼저 저장
  if(state.timer && F.taskId && state.timer.taskId===F.taskId) stopTimer(true);
  F.total=F.setMin*60000; F.endAt=Date.now()+F.total; F.accSec=0; F.segAt=Date.now(); F.mode="run";
  focusSave(); focusStartTick();
  focusAudioOn(); focusWake();
  toast("⏱ 집중 시작! 끝나면 알려 드릴게요","good");
  render();
}
function focusPause(){
  if(F.mode==="run"){
    F.accSec+=(Date.now()-F.segAt)/1000; F.remaining=Math.max(0,F.endAt-Date.now()); F.mode="pause";
    focusStopTick(); FocusSound.stop(); focusWake();
  }else if(F.mode==="pause"){
    F.endAt=Date.now()+F.remaining; F.segAt=Date.now(); F.mode="run";
    focusStartTick(); focusAudioOn(); focusWake();
  }
  focusSave(); render();
}
function focusPlus(){
  if(F.mode==="run") F.endAt+=5*60000; else if(F.mode==="pause") F.remaining+=5*60000;
  F.total+=5*60000; focusSave(); render();
}
async function focusRecord(sec, natural){
  const min=Math.round(sec/60);
  const uid=state.user.uid, today=fmt(new Date());
  const task=(focusTasks||[]).find(t=>t.id===F.taskId);
  F.doneMin=min; F.doneTask=task? focusTaskLabel(task) : "";
  if(min<1) return;
  try{
    const ref=db.collection("planner").doc(uid).collection("focus").doc(today);
    const d=await ref.get(), cur=d.exists? d.data() : {min:0,sessions:0};
    focusToday={min:(Number(cur.min)||0)+min, sessions:(Number(cur.sessions)||0)+(natural?1:0)};
    await ref.set(focusToday);
  }catch(e){ console.error("포커스 기록", e); }
  if(task){
    try{
      const tref=db.collection("planner").doc(uid).collection("tasks").doc(task.id);
      const td=await tref.get(); if(!td.exists) return;
      const t=td.data(), timerMin=(Number(t.timerMin)||0)+min, actualMin=Math.max(Number(t.actualMin)||0, timerMin);
      if(state.ownerUid===uid && state.tasksMap[task.id]) await saveTask({...state.tasksMap[task.id], timerMin, actualMin});
      else await tref.update({timerMin, actualMin});
      task.timerMin=timerMin; task.actualMin=actualMin;
    }catch(e){ console.error("과제 시간 기록", e); }
  }
}
async function focusFinish(silent){
  // 끝까지 집중한 시간 (새로고침 뒤 늦게 확인해도 종료 시각까지만 계산)
  const used=F.mode==="run"? F.accSec+(Math.min(Date.now(),F.endAt)-F.segAt)/1000 : F.accSec;
  focusStopTick();
  if(!silent) FocusSound.chime(); else FocusSound.stop();
  F.mode="done"; focusSave(); focusNavLabel(); focusWake();
  FocusSound.setMeta({title:"🎉 집중 완료!"});
  await focusRecord(Math.min(used, F.total/1000), true);
  focusSave();
  if(!silent){ toast(`🎉 ${F.doneMin}분 집중 완료!`,"cheer"); if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(_){} }
  if(state.tab==="timer") render();
}
async function focusEnd(){
  const used=focusElapsedSec();
  if(!confirm(`지금까지 ${Math.round(used/60)}분 집중했어요. 여기서 끝낼까요?`)) return;
  focusStopTick(); FocusSound.stop();
  F.mode="done"; focusSave(); focusNavLabel(); focusWake();
  await focusRecord(used, false);
  focusSave(); render();
}
function focusBreak(min){
  F.total=min*60000; F.endAt=Date.now()+F.total; F.mode="break";
  focusSave(); focusStartTick(); focusAudioOn(); focusWake(); render();
}
function focusBreakEnd(silent){
  focusStopTick(); F.mode="idle"; focusSave(); focusNavLabel(); focusWake();
  if(!silent){ FocusSound.chime(); toast("☕ 휴식 끝! 다시 집중해 볼까요?","info"); } else FocusSound.stop();
  if(state.tab==="timer") render();
}
function focusReset(){ F.mode="idle"; F.accSec=0; focusSave(); render(); }
function focusSound(k){
  F.sound=k; focusSave();
  if(F.mode==="run"||F.mode==="break") focusAudioOn();
  else if(!k) FocusSound.stop();
  else FocusSound.preview(k, 6);
  render();
}
// 타이머가 도는 동안: 고른 배경음, 없으면 거의 들리지 않는 소리로 재생을 유지(끝 알림용)
function focusAudioOn(){
  const id=(F.mode==="run" && F.sound)? F.sound : "silent";
  FocusSound.setMeta({title: F.mode==="break"? "☕ 쉬는 시간" : `⏱ 포커스 ${Math.round(F.total/60000)}분`});
  FocusSound.play(id);
}
FocusSound.setActions({
  play:()=>{ if(F.mode==="pause") focusPause(); },
  pause:()=>{ if(F.mode==="run") focusPause(); },
  stop:()=>{ if(F.mode==="run") focusPause(); },
});
// 화면이 꺼져 있어도 <audio> 재생 신호로 끝났는지 확인
let focusEnding=false;
FocusSound.onTick(()=>{
  if(focusEnding || !(F.mode==="run"||F.mode==="break") || focusRemaining()>0) return;
  focusEnding=true;
  Promise.resolve(F.mode==="run"? focusFinish() : focusBreakEnd()).finally(()=>{ focusEnding=false; });
});
// 📱 화면 켜 두기 (Screen Wake Lock)
let wakeLock=null;
async function focusWake(){
  const want=F.keepAwake && (F.mode==="run"||F.mode==="break") && document.visibilityState==="visible";
  try{
    if(want && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{ wakeLock=null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ console.warn("화면 켜 두기", e); }
}
document.addEventListener("visibilitychange", ()=>{ focusWake(); if(document.visibilityState==="visible" && (F.mode==="run"||F.mode==="break") && focusRemaining()<=0) (F.mode==="run"? focusFinish() : focusBreakEnd()); });
function focusKeepAwake(on){ F.keepAwake=!!on; focusSave(); focusWake(); render(); }
function focusVol(v){ F.vol=Number(v)/100; FocusSound.setVolume(F.vol); focusSave(); }

let quickItems=[];
function openQuick(){

  const ex=(state.categories.textbooks||[])[0];
  hubShell("✨ 빠른 계획", `

      <span style="margin-left:auto">과목·교재·학습방법·시간(분/시간)을 알아서 찾아요</span>
    </div>
    <div id="qList"></div>
  `);
  setTimeout(()=>{ const t=document.getElementById("qText"); if(t) t.focus(); }, 50);
}
function parseQuick(text){
  const subs=state.categories.subjects||[], tbs=state.categories.textbooks||[], ms=state.categories.methods||[];
  const ALIAS=[["단어","영어"],["영단어","영어"],["문법","영어"],["독해","영어"],["문장","영어"],["연산","수학"],["한국사","한국사"],["역사","한국사"]];
  return String(text||"").split(/\n|,|;|·|\s그리고\s/).map(x=>x.trim()).filter(Boolean).map(chunk=>{
    let min=30, rest=chunk;
    const h=chunk.match(/(\d+(?:\.\d+)?)\s*시간(?:\s*(\d+)\s*분)?/), m=chunk.match(/(\d+)\s*분/);
    if(h){ min=Math.round(parseFloat(h[1])*60+(h[2]?Number(h[2]):0)); rest=rest.replace(h[0]," "); }
    else if(m){ min=Number(m[1]); rest=rest.replace(m[0]," "); }
    const tb=[...tbs].sort((a,b)=>b.name.length-a.name.length).find(t=>t.name && chunk.includes(t.name));
    if(tb) rest=rest.replace(tb.name," ");
    let su=tb? subs.find(x=>x.id===tb.subjectId) : null;
    if(!su){ su=[...subs].sort((a,b)=>b.name.length-a.name.length).find(x=>chunk.includes(x.name)) || null; }
    if(su) rest=rest.replace(su.name," ");
    if(!su){ const al=ALIAS.find(([w])=>chunk.includes(w)); if(al) su=subs.find(x=>x.name===al[1])||null; }
    const me=ms.find(x=>chunk.includes(x.name));
    if(me) rest=rest.replace(me.name," ");
    const unit=rest.replace(/\s+/g," ").replace(/^[\s,.·-]+|[\s,.·-]+$/g,"").trim();
    return {subjectId:su?su.id:"", textbookId:tb?tb.id:"", method:me?me.name:"", plannedMin:Math.max(5,min||30), unit, src:chunk};
  });
}
function quickParse(){
  const t=document.getElementById("qText");
  quickItems=parseQuick(t?t.value:"");
  drawQuickList();
}
function drawQuickList(){
  const box=document.getElementById("qList"); if(!box) return;
  if(!quickItems.length){ box.innerHTML=`<div style="text-align:center;color:#8F8D9B;font-size:13px;margin-top:14px">정리할 내용을 먼저 적어 주세요.</div>`; return; }
  const subs=state.categories.subjects||[];
  const rows=quickItems.map((q,i)=>{
    const opts=`<option value="">과목 선택</option>`+subs.map(s=>`<option value="${s.id}" ${s.id===q.subjectId?"selected":""}>${esc(s.name)}</option>`).join("");
    const tb=tbById(q.textbookId), su=subjById(q.subjectId);
    const label=[tb?tb.name:"", q.unit, q.method].filter(Boolean).join(" · ") || q.src;
    return `<div class="q-row" style="${su?`border-left:4px solid ${su.color}`:"border-left:4px solid #E5484D"}">
      <select onchange="quickItems[${i}].subjectId=this.value;quickItems[${i}].textbookId='';drawQuickList()">${opts}</select>
      <span class="q-t" title="${esc(q.src)}">${esc(label)}</span>
      <input type="number" value="${q.plannedMin}" min="5" step="5" onchange="quickItems[${i}].plannedMin=Number(this.value)||30"><span class="q-m">분</span>
      <button class="icon-btn sm" onclick="quickItems.splice(${i},1);drawQuickList()" title="빼기">✕</button>
    </div>`;
  }).join("");

async function quickSave(){

  let n=0;

function weekActualMin(){

    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v/100)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#1E2A4A">${v}%</text>

function stampHTML(t){
  const pp=planPoints(t), rp=reviewPoints(t);
  const cr=(t.creditRate!=null)?Number(t.creditRate):1;
  const act=Number(t.actualMin)||0, plan=Number(t.plannedMin)||0;
  const full = pp>=PLAN_PTS.full && rp>=REVIEW_PTS.full && cr>=1;   // 계획·복기·당일체크 모두 만점
  let cls="", top="참잘했어요", sub="VERY GOOD";
  if(full && plan>0 && act>=plan*1.5){ cls="gold"; top="최고예요"; sub="EXCELLENT"; }
  else if(full){ cls=""; top="참잘했어요"; sub="VERY GOOD"; }
  else { cls="blue"; top="잘했어요"; sub="GOOD"; }
  return `<div class="stamp ${cls}"><b>${top}</b><i>${sub}</i></div>`;
}
/* ----- 어제의 나 vs 오늘의 나 ----- */
function vsYesterdayHTML(ds){
  const yst=fmt(addDays(parseD(ds),-1));
  const sum=(d)=>{
    const ts=state.tasks.filter(t=>t.date===d);
    const done=ts.filter(t=>t.done);
    return { min:done.reduce((a,t)=>a+creditedMin(t),0), done:done.length, planned:ts.length };
  };
  const y=sum(yst), o=sum(ds);
  if(y.planned===0 && o.planned===0) return "";      // 비교할 게 없으면 숨김
  const max=Math.max(y.min,o.min,30);
  const bar=(v,color)=>`<div class="vs-bar"><div style="width:${Math.max(8,Math.round(v/max*100))}%;background:${color}"><span>${v}분</span></div></div>`;
  const diff=o.min-y.min;
  let verdict;
  if(o.min===0 && y.min>0){
    verdict=`<div class="vs-verdict" style="background:#F1F4F8;color:#64748B">어제는 ${y.min}분 했어요. 오늘도 시작해 볼까요?</div>`;
  }else if(diff>0){
    verdict=`<div class="vs-verdict" style="background:#EAF7F1;color:#0E7A55">🔥 어제보다 <b>${diff}분 더</b> 했어요! 오늘의 내가 이겼습니다</div>`;
  }else if(diff===0 && o.min>0){
    verdict=`<div class="vs-verdict" style="background:#EFECFD;color:#4B3FA6">🤝 어제와 똑같이 <b>${o.min}분</b> — 꾸준함이 최고예요</div>`;
  }else{
    verdict=`<div class="vs-verdict" style="background:#FFF7E8;color:#8A6516">어제보다 <b>${-diff}분</b> 적어요. ${-diff}분만 더 하면 어제의 나를 넘어요!</div>`;
  }
  return `<div class="vs-card">
    <div class="vs-head">⚔️ 어제의 나 vs 오늘의 나</div>
    <div class="vs-row"><span class="vs-lbl">어제</span>${bar(y.min,"#94A3B8")}<span style="font-size:11px;color:#94A3B8;width:44px;text-align:right">${y.done}/${y.planned}</span></div>
    <div class="vs-row"><span class="vs-lbl">오늘</span>${bar(o.min,o.min>=y.min?"#0E9F6E":"#F5A524")}<span style="font-size:11px;color:#94A3B8;width:44px;text-align:right">${o.done}/${o.planned}</span></div>
    ${verdict}
  </div>`;
}

async function rolloverIncomplete(){
  const ds=fmt(state.cursor);
  const undone=tasksOn(ds).filter(t=>!t.done);
  if(!undone.length){ toast("이월할 미완료 계획이 없어요","info"); return; }
  if(!confirm(`오늘 완료하지 못한 ${undone.length}건을 다음 날로 옮길까요?`)) return;
  const next=fmt(addDays(state.cursor,1));
  for(const t of undone){ await saveTask({...t, date:next}); }
  toast(`${undone.length}건을 내일로 옮겼어요 ↪`,"good");

/* ----- 인라인 저장 ----- */
/* ----- 계획·복기 충실도 점수 (10점 만점) -----
   계획: 학습할 범위를 적었으면 10/10, 안 적으면 2/10
   복기: 배운 내용을 적었으면 10/10, 체크만 하면 3/10          */
const PLAN_PTS={full:10, bare:2};
const REVIEW_PTS={full:10, bare:3};
function hasText(v,min){ return !!(v && String(v).trim().length>=(min||2)); }
function planPoints(t){ return (hasText(t.unit)||hasText(t.plannedNote,4))? PLAN_PTS.full : PLAN_PTS.bare; }
function reviewPoints(t){ return hasText(t.understood,5)? REVIEW_PTS.full : REVIEW_PTS.bare; }
// 두 점수의 평균이 학습 인정 배율(0.25 ~ 1.0)
function qualityRate(t){
  if(!t.done) return planPoints(t)/10;
  return (planPoints(t)+reviewPoints(t))/20;
}
/* ----- 체크 시점별 학습 인정률: 당일 100% · 다음날 50% · 이틀 후 불가 ----- */
function daysLate(dateStr, now){
  now=now||new Date();
  const today=parseD(fmt(now)), target=parseD(dateStr);
  return Math.round((today-target)/86400000); // 0=당일, 1=다음날, 2+=지연
}
function creditFor(dateStr, now){
  const d=daysLate(dateStr, now);
  if(d<0) return {rate:1, label:"예정일 이전", ok:true};      // 미래 날짜(미리 체크)는 100%
  if(d===0) return {rate:1, label:"당일 체크 · 100% 인정", ok:true};
  if(d===1) return {rate:0.5, label:"다음날 체크 · 50% 인정", ok:true};
  return {rate:0, label:`${d}일 지나 체크 불가`, ok:false};
}
/* ----- 학습시간 검증: 타이머 실측 100% · 수기 입력 85% · 이상치 차단 ----- */
function allowCrit(){ return (state.settings&&state.settings.allowance)||defaultSettings().allowance; }
function verifiedMin(t){
  const A=allowCrit();
  let actual=Number(t.actualMin)||0;
  // 이상치 차단: 계획시간의 N배, 1건당 상한
  const planCap=(Number(t.plannedMin)||0)*(Number(A.planMulti)||3);
  const hardCap=Number(A.taskCapMin)||480;
  const limit=Math.max(30, Math.min(hardCap, planCap>0?planCap:hardCap));
  actual=Math.min(actual, limit);
  const timed=Math.min(Number(t.timerMin)||0, actual);   // 타이머로 실측된 부분
  const manual=Math.max(0, actual-timed);                // 손으로 적은 부분
  const mRate=(A.manualRate!=null)? Number(A.manualRate) : 0.85;
  return Math.round(timed + manual*mRate);
}
// 인정 시간 = 검증시간 × 체크시점 배율 × 충실도 배율
function creditedMin(t){
  const r=(t.creditRate!=null)? Number(t.creditRate) : 1;
  return Math.round(verifiedMin(t) * r * qualityRate(t));
}
async function toggleDone(id){
  const t=state.tasksMap[id]; if(!t)return;
  if(!t.done){
    const cr=creditFor(t.date);
    if(!cr.ok){ alert(`이 학습은 ${t.date} 계획이라 ${cr.label}입니다.\n\n당일 체크 = 100% 인정, 다음날 체크 = 50% 인정,\n이틀이 지나면 체크할 수 없어요.`); return; }
    openCompleteModal(id); return;   // 완료는 항상 점검창에서(복기 입력 시 점수 상승)
  }else{
    await saveTask({...t,done:false,creditRate:null});
  }
}

      </div>

  cmPts();
  setTimeout(()=>{const el=document.getElementById("cm-understood");if(el)el.focus();},50);

function cmPts(){
  const el=document.getElementById("cm-pts");
  const v=(document.getElementById("cm-understood")||{}).value||"";
  const full=hasText(v,5);
  if(el){
    el.textContent=`(${full?REVIEW_PTS.full:REVIEW_PTS.bare}/10점)`;
    el.style.color= full? "#0E9F6E" : "#F5A524";
  }
  const hint=document.getElementById("cmHint"); if(!hint) return;
  const t=state.tasksMap[completeTarget]; if(!t) return;
  const minEl=document.getElementById("cm-min");
  const actual=Number(minEl&&minEl.value)||t.plannedMin||0;
  const cr=creditFor(t.date);
  const mk=(rp)=>Math.round(actual*cr.rate*((planPoints(t)+rp)/20));
  const nowMin=mk(full?REVIEW_PTS.full:REVIEW_PTS.bare), bestMin=mk(REVIEW_PTS.full);
  if(full){
    hint.className="pts-hint good";
    hint.innerHTML=`<span>✅</span><div>복기 <b>${REVIEW_PTS.full}/10점</b> · 계획 <b>${planPoints(t)}/10점</b> → 이번 학습 <b>${nowMin}분</b> 인정돼요!</div>`;
  }else{
    hint.className="pts-hint warn";
    hint.innerHTML=`<span>💡</span><div><b>오늘 배운 내용을 적으면 포인트가 크게 올라가요!</b><br>
      지금 완료 시 복기 <b>${REVIEW_PTS.bare}/10점</b> → <b>${nowMin}분</b> 인정.
      내용을 적으면 <b>${REVIEW_PTS.full}/10점</b>이 되어 <b>${bestMin}분</b> 인정돼요.</div>`;
  }
}
function cmTime(v){
  const inp=document.getElementById("cm-min"); if(!inp)return;
  if(v<0) inp.value=(Number(inp.value)||0)+(-v); else inp.value=v;
  cmPts();
}
async function submitComplete(){
  const t=state.tasksMap[completeTarget]; if(!t){closeModal();return;}
  const cr=creditFor(t.date);
  if(!cr.ok){ alert(cr.label+" — 체크할 수 없어요."); closeModal(); return; }
  const understood=(document.getElementById("cm-understood").value||"").trim();
  if(!hasText(understood,5)){
    if(!confirm(`복기 내용이 비어 있어요.\n\n지금 완료하면 복기 점수 ${REVIEW_PTS.bare}/10점으로 인정됩니다.\n(배운 내용을 정리하면 ${REVIEW_PTS.full}/10점)\n\n이대로 완료할까요?`)) return;
  }
  const actualMin=Number(document.getElementById("cm-min").value)||t.plannedMin||0;
  const dayTs=state.tasks.filter(x=>x.date===t.date);
  const doneCount=dayTs.filter(x=>x.done).length+1;
  const saved={...t,done:true,understood,actualMin,creditRate:cr.rate,checkedAt:Date.now()};
  state.justDone=t.id;                       // 완료 애니메이션 표시용
  setTimeout(()=>{ state.justDone=null; },900);
  await saveTask(saved);
  closeModal(); completeTarget=null;
  const cm=creditedMin(saved), pp=planPoints(saved), rp=reviewPoints(saved);
  if(pp<PLAN_PTS.full || rp<REVIEW_PTS.full || cr.rate<1){
    toast(`계획 ${pp}/10 · 복기 ${rp}/10 → ${cm}분 인정`,"info");
  }else if(dayTs.length>0 && doneCount>=dayTs.length){
    toast("오늘 계획을 모두 완료했어요! 🎉","cheer");

    toast(PRAISES[Math.floor(Math.random()*PRAISES.length)],"good");
  }
  // 복습 제안: 복기를 충실히 한 새 학습에 대해서만(복습 항목 자체는 제외)

function mtoggleDay(dow){
  const arr=modalTask.repeatDays||[];
  modalTask.repeatDays = arr.includes(dow)? arr.filter(x=>x!==dow) : [...arr,dow].sort();
  drawModal();
}
function repeatDates(startStr, endStr, mode, weekdays){
  const out=[]; let d=parseD(startStr); const end=parseD(endStr);
  if(end<d) return [startStr];
  let guard=0;
  while(d<=end && guard<400){
    const dow=d.getDay(); // 0=일 … 6=토
    let ok=false;
    if(mode==="daily") ok=true;
    else if(mode==="weekday") ok=(dow>=1&&dow<=5);
    else if(mode==="weekend") ok=(dow===0||dow===6);
    else if(mode==="custom") ok=(weekdays||[]).includes(dow);
    if(ok) out.push(fmt(d));
    d=addDays(d,1); guard++;
  }
  return out.length?out:[startStr];
}

function planPtsHint(){
  const el=document.getElementById("planHint"); if(!el||!modalTask) return;
  const pts=planPoints(modalTask), min=Number(modalTask.plannedMin)||0;
  if(pts>=PLAN_PTS.full){
    el.className="pts-hint good";
    el.innerHTML=`<span>✅</span><div>계획 점수 <b>${PLAN_PTS.full}/10점</b>으로 저장돼요. 이대로 학습하고 복기까지 하면 <b>${min}분 전부</b> 인정받아요!</div>`;
  }else{
    const now=Math.round(min*(PLAN_PTS.bare/10 + REVIEW_PTS.full/10)/2);
    const full=Math.round(min*1);
    el.className="pts-hint warn";
    el.innerHTML=`<span>💡</span><div><b>학습할 단원·범위를 적으면 포인트가 올라가요!</b><br>
      지금 저장하면 계획 <b>${PLAN_PTS.bare}/10점</b> → 나중에 복기까지 해도 ${min}분 중 <b>${now}분</b>만 인정.
      범위를 적으면 <b>${PLAN_PTS.full}/10점</b>이 되어 <b>${full}분</b>까지 인정돼요.</div>`;
  }
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; modalTask=null; }
async function saveFromModal(){
  if(!modalTask.subjectId){ alert("과목을 선택해 주세요."); return; }
  if(planPoints(modalTask)<PLAN_PTS.full){
    if(!confirm(`학습할 단원·범위가 비어 있어요.\n\n지금 저장하면 계획 점수 ${PLAN_PTS.bare}/10점으로 인정됩니다.\n(구체적으로 적으면 ${PLAN_PTS.full}/10점)\n\n이대로 저장할까요?`)) return;
  }
  const {repeat,repeatEnd,repeatDays,...base}=modalTask;
  if(repeat && repeat!=="none"){
    if(!repeatEnd){ alert("반복 종료일(기한)을 선택해 주세요."); return; }
    if(repeat==="custom" && (!repeatDays||!repeatDays.length)){ alert("반복할 요일을 선택해 주세요."); return; }
    const dates=repeatDates(base.date, repeatEnd, repeat, repeatDays);
    if(state.tasksMap[base.id]){ try{ await deleteTaskDoc(base.id); }catch(_){} } // 기존 단일 제거 후 시리즈 생성
    let n=0;
    for(const dt of dates){
      await saveTask({...base, id:uid(), date:dt, done:false, actualMin:0, understood:"", rating:0, parentComment:"", score:"", scoreTotal:"", order:Date.now()+n});
      n++;
    }
    closeModal();
    toast(`${dates.length}일에 계획을 만들었어요 🔁`,"good");
    return;
  }
  await saveTask(base);
  closeModal();
}

function renderCatPanel(){
  const c=state.categories;
  let body="";
  if(catTab==="subjects"){
    body=(c.subjects||[]).map(s=>`<div class="list-item"><span class="dot" style="background:${s.color};width:12px;height:12px"></span><span style="flex:1">${esc(s.name)}</span><button class="icon-btn sm" onclick="delCat('subjects','${s.id}')">🗑️</button></div>`).join("")
      +`<button class="add-line" onclick="addSubject()">+ 과목 추가</button>`;
  }else if(catTab==="textbooks"){
    body=(c.textbooks||[]).map(tb=>{const s=subjById(tb.subjectId);
      return `<div class="list-item"><span class="subj-tag" style="background:${s?s.color:"#94A3B8"};font-size:11px">${esc(s?s.name:"")}</span><span style="flex:1">${esc(tb.name)}</span><button class="icon-btn sm" onclick="delCat('textbooks','${tb.id}')">🗑️</button></div>`;}).join("")
      +`<button class="add-line" onclick="addTextbook()">+ 교재 추가</button>`;
  }else{
    body=(c.methods||[]).map(m=>`<div class="list-item"><span>${m.icon}</span><span style="flex:1">${esc(m.name)}${m.track?" · 진도추적":""}</span><button class="icon-btn sm" onclick="delCat('methods','${m.id}')">🗑️</button></div>`).join("")
      +`<button class="add-line" onclick="addMethod()">+ 방법 추가</button>`;
  }
  return `<div class="tab-row" style="padding:0 0 12px">
      <button class="tab ${catTab==='subjects'?'on':''}" onclick="catTab='subjects';drawSettings()">과목</button>
      <button class="tab ${catTab==='textbooks'?'on':''}" onclick="catTab='textbooks';drawSettings()">교재</button>
      <button class="tab ${catTab==='methods'?'on':''}" onclick="catTab='methods';drawSettings()">학습방법</button>
    </div>${body}`;
}
async function addSubject(){
  const name=prompt("과목 이름"); if(!name)return;
  const color=SUBJECT_PALETTE[(state.categories.subjects||[]).length%SUBJECT_PALETTE.length];
  await saveCategories({...state.categories,subjects:[...(state.categories.subjects||[]),{id:uid(),name,color}]}); drawSettings();
}
async function addTextbook(){
  const subs=state.categories.subjects||[]; if(!subs.length)return alert("먼저 과목을 추가하세요.");
  const name=prompt("교재 이름"); if(!name)return;
  const sName=prompt("어느 과목? ("+subs.map(s=>s.name).join(", ")+")");
  const subj=subs.find(s=>s.name===sName)||subs[0];
  await saveCategories({...state.categories,textbooks:[...(state.categories.textbooks||[]),{id:uid(),subjectId:subj.id,name}]}); drawSettings();
}
async function addMethod(){
  const name=prompt("학습 방법 이름"); if(!name)return;
  const icon=prompt("이모지 아이콘 (선택)")||"•";
  const track=confirm("회차(진도) 추적이 필요한가요? (예: 인강)");
  const scored=confirm("점수(맞은/만점) 기록이 필요한가요? (예: 문제풀이)");
  await saveCategories({...state.categories,methods:[...(state.categories.methods||[]),{id:uid(),name,icon,track,scored}]}); drawSettings();
}
async function saveCrit(field,val){
  const a=Object.assign(defaultSettings().allowance, state.settings.allowance||{}, {[field]:Number(val)});
  await saveSettings({...state.settings, allowance:a});
  drawSettings();
}
async function delCat(kind,id){
  await saveCategories({...state.categories,[kind]:(state.categories[kind]||[]).filter(x=>x.id!==id)}); drawSettings();
}

async function unlinkChild(childUid){
  if(!confirm("이 자녀 등록을 해제할까요?\n(자녀 계정·데이터는 삭제되지 않고, 내 목록에서만 제거됩니다)")) return;
  try{
    await Family.unlink(db, state.user, childUid);
  }catch(e){ console.error("unlinkChild", e); alert("삭제에 실패했어요: "+firestoreDiag(e)); return; }
  state.children = state.children.filter(c=>c.uid!==childUid); // 화면 즉시 반영
  drawSettings();
  toast("자녀 등록을 해제했어요","info");
  try{ await loadChildren(); drawSettings(); }catch(_){}
}

/* ----- 대시보드 (현재 보는 플래너 기준) ----- */
async function drawDashboard(){
  // 넓은 범위 로드
  const all=await plannerRef().collection("tasks").get();
  const my=all.docs.map(d=>d.data());
  const done=my.filter(t=>t.done);
  const rate=my.length?Math.round(done.length/my.length*100):0;
  const totalMin=done.reduce((a,t)=>a+creditedMin(t),0);
  // 스트릭
  const dset=new Set(done.map(t=>t.date));
  let streak=0,d=new Date(); if(!dset.has(fmt(d)))d=addDays(d,-1);
  while(dset.has(fmt(d))){streak++;d=addDays(d,-1);}
  // 과목별
  const bySub={}; done.forEach(t=>bySub[t.subjectId]=(bySub[t.subjectId]||0)+creditedMin(t));
  const rows=Object.entries(bySub).map(([id,min])=>({s:subjById(id),min})).filter(r=>r.s).sort((a,b)=>b.min-a.min);
  const maxMin=Math.max(1,...rows.map(r=>r.min));
  // 최근 7일
  const last7=Array.from({length:7},(_,i)=>{const dd=fmt(addDays(new Date(),-6+i));
    const dt=my.filter(t=>t.date===dd),dn=dt.filter(t=>t.done).length;
    return {date:dd,rate:dt.length?Math.round(dn/dt.length*100):0,has:dt.length>0};});

  const spark=last7.map(x=>{const col=x.rate===100?"#0E9F6E":x.rate>=50?"#F5A524":"#CBD5E1";
    return `<div class="spark-col"><div class="spark-wrap"><div class="spark-bar" style="height:${x.has?Math.max(6,x.rate):2}%;background:${col}"></div></div><div class="spark-lbl">${parseD(x.date).getDate()}</div></div>`;}).join("");
  const subjRows=rows.length? rows.map(r=>`<div class="subj-bar-row"><span class="subj-tag" style="background:${r.s.color};min-width:52px;text-align:center">${esc(r.s.name)}</span><div class="subj-bar-track"><div class="subj-bar-fill" style="width:${r.min/maxMin*100}%;background:${r.s.color}"></div></div><span class="subj-bar-num">${r.min}분</span></div>`).join("")
    : `<div class="empty">아직 완료된 학습이 없어요.</div>`;

  // 성취 뱃지
  const byDate={}; my.forEach(t=>{(byDate[t.date]=byDate[t.date]||[]).push(t);});
  const perfectDays=Object.values(byDate).filter(arr=>arr.length>0 && arr.every(t=>t.done)).length;
  const highScores=done.filter(t=>Number(t.scoreTotal)>0 && (Number(t.score)/Number(t.scoreTotal))>=0.9).length;
  const totalActualH=totalMin/60;
  const BADGES=[
    {emo:"🔥",name:"3일 연속",ok:streak>=3},
    {emo:"🔥",name:"7일 연속",ok:streak>=7},
    {emo:"🏆",name:"14일 연속",ok:streak>=14},
    {emo:"🌟",name:"완벽한 하루 5일",ok:perfectDays>=5},
    {emo:"📚",name:"10개 완료",ok:done.length>=10},
    {emo:"📖",name:"50개 완료",ok:done.length>=50},
    {emo:"💯",name:"고득점 5회",ok:highScores>=5},
    {emo:"⏱",name:"누적 10시간",ok:totalActualH>=10},
  ];
  const earned=BADGES.filter(b=>b.ok).length;
  const badgesHTML=BADGES.map(b=>`<div class="badge ${b.ok?"":"locked"}"><div class="b-emo">${b.ok?b.emo:"🔒"}</div><div class="b-name">${b.name}</div></div>`).join("");

  // 챔피언 인증카드
  let certHTML="";
  try{
    const cs=await plannerRef().collection("certs").get();
    const certs=cs.docs.map(d=>d.data()).filter(c=>c.champion).sort((a,b)=>(b.issuedAt||0)-(a.issuedAt||0));
    if(certs.length){
      certHTML=`<div class="dash-section">🏆 챔피언 인증카드 <span style="color:#94A3B8;font-weight:600">${certs.length}회</span></div>`
        + certs.slice(0,6).map(c=>certCardHTML(state.ownerName, c.species||monSpecies(), c.weekLabel||"", c.points||0, true)).join("");
    }
  }catch(_){}

  document.getElementById("drawerRoot").innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer wide">
      <div class="drawer-head"><h3>학습 대시보드${state.viewingChild?` · ${esc(state.ownerName)}`:""}</h3><button class="icon-btn sm" onclick="closeDrawer()">✕</button></div>
      <div class="drawer-body">
        <div class="dash-cards">
          <div class="dash-stat"><div class="ic">✅</div><div class="big">${rate}%</div><div class="l">누적 이행률</div></div>
          <div class="dash-stat"><div class="ic">🔥</div><div class="big">${streak}일</div><div class="l">연속 학습</div></div>
          <div class="dash-stat"><div class="ic">⏱</div><div class="big">${Math.round(totalMin/60*10)/10}h</div><div class="l">총 학습시간</div></div>
          <div class="dash-stat"><div class="ic">📚</div><div class="big">${done.length}</div><div class="l">완료 학습 수</div></div>
        </div>
        ${certHTML}
        <div class="dash-section">성취 뱃지 <span style="color:#94A3B8;font-weight:600">${earned}/${BADGES.length}</span></div>
        <div class="badges">${badgesHTML}</div>
        <div class="dash-section">바로가기</div>
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <button class="ghost-btn" style="flex:1" onclick="drawCoupons()">🎟️ 보상 쿠폰</button>
          <button class="ghost-btn" style="flex:1" onclick="drawArchive()">📚 학습 다이어리</button>
        </div>
        <div class="dash-section">최근 7일 이행률</div>
        <div class="spark">${spark}</div>
        <div class="dash-section">과목별 학습시간</div>
        ${subjRows}
      </div>
    </div></div>`;
}

/* ============================================================
 *  10-b) 용돈 정산 (주 상한 + 이행률·문제점수·복습 종합)
 * ============================================================ */
// 정산·대결 주간도 캐릭터/계획과 동일하게 월요일 시작(월~일)
function allowanceWeekDays(d){ const s=startOfWeek(d||new Date()); return Array.from({length:7},(_,i)=>fmt(addDays(s,i))); }
function weekLabelOf(days){ const s=parseD(days[0]),e=parseD(days[6]); return `${s.getMonth()+1}.${s.getDate()}~${e.getMonth()+1}.${e.getDate()}`; }

function computeAllowance(tasks, days, crit, extData){
  const wk=tasks.filter(t=>days.includes(t.date));
  const planned=wk.length, done=wk.filter(t=>t.done).length;
  // 이행률: 계획 '시간' 가중 — 10시간짜리를 해낸 것과 10분짜리를 해낸 것을 구분
  const planMinAll=wk.reduce((a,t)=>a+(Number(t.plannedMin)||0),0);
  const planMinDone=wk.filter(t=>t.done).reduce((a,t)=>a+(Number(t.plannedMin)||0),0);
  const completion = planMinAll>0? planMinDone/planMinAll : (planned? done/planned : 0);
  const scored=wk.filter(t=>t.done && Number(t.scoreTotal)>0 && t.score!=="" && t.score!=null);
  const scoreRate = scored.length? scored.reduce((a,t)=>a+Number(t.score)/Number(t.scoreTotal),0)/scored.length : null;
  const reviews=wk.filter(t=>t.done && t.method==="복습").length;
  const reviewRate = crit.reviewTarget? Math.min(1,reviews/crit.reviewTarget) : 0;
  // 학습시간: 목표까지는 비례, 목표를 넘기면 체감 보너스(최대 1.25) — 더 오래 하면 더 인정
  let weekMin=wk.filter(t=>t.done).reduce((a,t)=>a+creditedMin(t),0);
  // 학습앱(천문장·MD영단어·그래머 인사이드) 인정 시간 — 학습시간 지표에만 가산
  const extMin=(typeof extWeekMin==="function")? extWeekMin(days, extData) : 0;
  weekMin+=extMin;
  // 주간 목표시간: 그 주의 등교일/자율학습일 구성에 맞춰 자동 산출(설정에서 고정도 가능)
  const timeTarget=(crit.autoTimeTarget===false)
    ? (Number(crit.timeTargetMin)||900)
    : days.reduce((a,ds)=>a+dayTypeGoal(ds),0) || (Number(crit.timeTargetMin)||900);
  const ratio=timeTarget>0? weekMin/timeTarget : 0;
  const timeRate = ratio<=1? ratio : Math.min(1.25, 1+Math.log2(ratio)*0.25);
  // 학습일수(꾸준함): 하루 몰아치기 방지
  const studyDays=new Set(wk.filter(t=>t.done).map(t=>t.date)).size;
  const daysTarget=Number(crit.daysTarget)||6;
  const dayRate=Math.min(1, studyDays/daysTarget);
  // 가중치 정규화 (문제풀이 기록이 없으면 해당 가중치 제외 후 재분배)
  const parts=[
    {k:"completion",w:crit.wCompletion,v:completion},
    {k:"review",w:crit.wReview,v:reviewRate},
    {k:"time",w:(crit.wTime!=null?crit.wTime:30),v:timeRate},
    {k:"days",w:(crit.wDays!=null?crit.wDays:15),v:dayRate},
  ];
  if(scoreRate!==null) parts.push({k:"score",w:crit.wScore,v:scoreRate});
  const totW=parts.reduce((a,p)=>a+p.w,0)||1;
  let achievement=Math.min(1, parts.reduce((a,p)=>a+p.w*p.v,0)/totW);
  // 난이도 커브: 상위 구간일수록 만점에 가까워지기 어렵게
  const curve=Number(crit.curve)||1;
  if(curve>1) achievement=Math.pow(achievement, curve);
  // 최소 요건: 미달 시 '비례 감액'(적게 할수록 크게 깎임)
  const caps=[];
  const minMin=Number(crit.minMin)||0, minDays=Number(crit.minDays)||0;
  if(minMin>0 && weekMin<minMin){
    achievement=Math.min(achievement, 0.5*(weekMin/minMin));
    caps.push(`학습시간 ${minMin}분 미만 → 비례 감액`);
  }
  if(minDays>0 && studyDays<minDays){
    achievement=Math.min(achievement, 0.7*(studyDays/minDays));
    caps.push(`학습일 ${minDays}일 미만 → 비례 감액`);
  }
  // 부스터(시험 대비) 기간이면 상한·지급액을 배율만큼 상향
  const boostRate=(typeof examBoostRateFor==="function")? examBoostRateFor(days) : 1;
  const effCap=Math.round(crit.cap*boostRate/100)*100;
  let amount=Math.round(effCap*achievement/100)*100;   // 100원 단위
  amount=Math.min(effCap, Math.max(0, amount));
  // 목표 초과 학습 보너스 (상한과 별도로 지급) — 더 오래 공부할수록 계속 보상
  const overMin=Math.max(0, weekMin-timeTarget);
  const perHour=Number(crit.bonusPerHour)||0, bMax=Number(crit.bonusMax)||0;
  const bonus=Math.min(bMax, Math.floor(overMin/60)*perHour);
  return {planned,done,completion,scoreRate,reviews,reviewRate,weekMin,timeTarget,timeRate,
    studyDays,daysTarget,dayRate,caps,achievement,amount,bonus,overMin,total:amount+bonus,extMin,
    boostRate,effCap,scoredCount:scored.length};
}
async function fetchWeekTasks(uid,days){
  const snap=await db.collection("planner").doc(uid).collection("tasks")
    .where("date",">=",days[0]).where("date","<=",days[6]).get();
  return snap.docs.map(d=>d.data());
}
async function fetchAllowanceCrit(uid){
  const d=await db.collection("planner").doc(uid).collection("meta").doc("settings").get();
  const base=defaultSettings().allowance;
  return Object.assign(base, (d.exists&&d.data().allowance)||{});
}
async function fetchPayout(uid,weekId){
  const d=await db.collection("planner").doc(uid).collection("payouts").doc(weekId).get();
  return d.exists? d.data() : null;
}
async function fetchWeekCap(uid,weekId){
  const d=await db.collection("planner").doc(uid).collection("weekcaps").doc(weekId).get();

}
async function saveWeekCap(uid,weekId,cap){
  await db.collection("planner").doc(uid).collection("weekcaps").doc(weekId).set({cap:Number(cap)||0});
}
function computePayAmount(cap,pct){
  const amt=Math.round((Number(cap)||0)*(Number(pct)||0)/100/100)*100; // 100원 단위
  return Math.min(Number(cap)||0, Math.max(0, amt));
}

  const raw = (typeof pct==="string"&&pct.includes("%"))? parseInt(pct) : 0;

  const over = raw>100;
  return `<div class="metric">
    <div class="metric-top"><span class="lbl">${label} <span style="color:#94A3B8;font-weight:600">· ${weight}%</span></span><span class="val"${over?' style="color:#0E9F6E"':''}>${pct}${over?" 🔥":""}</span></div>
    <div class="metric-track"><div class="metric-fill" style="width:${w}%;background:${color}"></div></div>
  </div>`;
}

    ${metricBar(`복습 이행 (${r.reviews}/${crit.reviewTarget}회)`, revPct, "#0E9F6E", crit.wReview)}`;

/* ============================================================
 *  10-c) 부모용 자녀 리포트 (평균 학습시간 + 과목·목차)
 * ============================================================ */
function calcStudyStats(tasks){
  const done=tasks.filter(t=>t.done);
  const m=t=>creditedMin(t);
  const today=new Date(), tds=fmt(today);
  const inLast=(n)=>{const set=new Set(Array.from({length:n},(_,i)=>fmt(addDays(today,-i))));return done.filter(t=>set.has(t.date));};
  const todayMin=done.filter(t=>t.date===tds).reduce((a,t)=>a+m(t),0);
  const d7=inLast(7), d30=inLast(30);
  const sum7=d7.reduce((a,t)=>a+m(t),0), sum30=d30.reduce((a,t)=>a+m(t),0);
  const wkDays=allowanceWeekDays(today);
  const weekMin=done.filter(t=>wkDays.includes(t.date)).reduce((a,t)=>a+m(t),0);
  const monthPrefix=tds.slice(0,7);
  const monthDone=done.filter(t=>t.date.startsWith(monthPrefix));
  const monthMin=monthDone.reduce((a,t)=>a+m(t),0);
  const monthStudyDays=new Set(monthDone.map(t=>t.date)).size;
  // 과목별 시간 + 학습한 단원 목차 (최근 완료순)
  const bySub={};
  done.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(t=>{
    const b=(bySub[t.subjectId]=bySub[t.subjectId]||{min:0,units:[]});
    b.min+=m(t);
    const u=(t.unit||"").trim();
    if(u && !b.units.includes(u)) b.units.push(u);
  });
  return { todayMin, avg7:Math.round(sum7/7), avg30:Math.round(sum30/30),
    weekMin, monthMin, monthAvg: monthStudyDays? Math.round(monthMin/monthStudyDays):0,
    monthStudyDays, doneCount:done.length, bySub };
}
function hmFmt(min){ min=Number(min)||0; const h=Math.floor(min/60),m2=min%60; return h? `${h}시간 ${m2?m2+"분":""}`.trim() : `${m2}분`; }

/* ============================================================
 *  10-d) 주간 포인트 대결 + 챔피언 인증카드
 * ============================================================ */
function computeWeekPoints(tasks, days){
  return tasks.filter(t=>t.done && days.includes(t.date))
    .reduce((a,t)=>a + Math.round(20*((t.creditRate!=null)?Number(t.creditRate):1)*qualityRate(t)) + creditedMin(t), 0);
}
async function fetchChildSpeciesLevel(uid){
  let species="water", stage=0;
  const days=charWeekDays();
  try{
    const [sd,ts]=await Promise.all([
      db.collection("planner").doc(uid).collection("meta").doc("settings").get(),
      db.collection("planner").doc(uid).collection("tasks").where("done","==",true).get()
    ]);
    if(sd.exists && sd.data().monster) species=sd.data().monster.species||"water";
    const all=ts.docs.map(d=>d.data());
    // 캐릭터 단계는 이번 주(월~일) 성취분 기준
    let count=0,min=0;
    all.forEach(t=>{ if(days.includes(t.date)){count++;min+=creditedMin(t);} });
    stage=monsterCalc(count,min).stage;
    return {species,stage,weekTasks:all};
  }catch(e){ console.error(e); return {species,stage,weekTasks:[]}; }
}
let battleCache=null;
function certCardHTML(name, species, weekLabel, points, issued){
  return `<div class="cert">

    <div style="display:flex;justify-content:center;margin:6px 0">${monArt(species,MON_MAX_STAGE,60)}</div>
    <div class="who">${esc(name)}</div>
    <div class="meta">${esc(weekLabel)} · ${points.toLocaleString()} P</div>
    <div class="seal">${issued?"인증 완료":"CHAMPION"}</div>
  </div>`;
}

/* ============================================================
 *  학습 타이머 — 실제 공부한 시간을 앱에서 측정
 * ============================================================ */
state.timer=null;      // {taskId, startAt}
let timerTick=null;
function timerElapsedMin(){ return state.timer? (Date.now()-state.timer.startAt)/60000 : 0; }
function fmtClock(min){
  const s=Math.max(0,Math.floor(min*60));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return (h?`${h}:`:"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0");
}
function startTimer(id){
  const t=state.tasksMap[id]; if(!t) return;
  if(typeof F!=="undefined" && (F.mode==="run"||F.mode==="pause") && F.taskId===id){ toast("⏱ 포커스 타이머가 이 과제를 재고 있어요","info"); setTab("timer"); return; }
  if(state.timer && state.timer.taskId!==id){
    if(!confirm("다른 학습의 타이머가 켜져 있어요.\n그 시간을 저장하고 새로 시작할까요?")) return;
    stopTimer(true);
  }
  state.timer={taskId:id, startAt:Date.now()};
  if(timerTick) clearInterval(timerTick);
  timerTick=setInterval(updateTimerUI,1000);
  render();
  toast("⏱ 타이머 시작! 집중해 볼까요","good");
}
async function stopTimer(silent){
  if(!state.timer) return;
  const taskId=state.timer.taskId;
  const add=Math.round(timerElapsedMin());
  state.timer=null;
  if(timerTick){ clearInterval(timerTick); timerTick=null; }
  const t=state.tasksMap[taskId];
  if(t){
    const timerMin=(Number(t.timerMin)||0)+add;
    const actualMin=Math.max(Number(t.actualMin)||0, timerMin);
    await saveTask({...t, timerMin, actualMin});
    if(!silent) toast(`⏹ ${add}분 기록! 총 ${timerMin}분 실측`,"cheer");
  }
  render();
}
function updateTimerUI(){
  const el=document.getElementById("timerClock");
  if(el) el.textContent=fmtClock(timerElapsedMin());
}
function timerBtnHTML(t){
  if(t.done) return "";
  const on=state.timer && state.timer.taskId===t.id;
  const acc=Number(t.timerMin)||0;
  return on
    ? `<button class="timer-btn on" onclick="stopTimer()">⏹ <span id="timerClock">0:00</span> 정지</button>`
    : `<button class="timer-btn" onclick="startTimer('${t.id}')">▶ 타이머${acc?` · ${acc}분 실측`:""}</button>`;
}

 *  10-e) 보상 쿠폰 (1시간 놀기 · 1만원 게임방 충전권)

/* 쿠폰: 2~8시간 이용권(캐릭터 단계 연동) + 1만원 게임방 충전권(챔피언 전용)
   - 이번 주 캐릭터 단계에 따라 받을 수 있는 이용권 등급이 올라감
   - 매주 이용권은 '도달한 최고 등급 1장'만 발급 (누적 발급 방지) */
const HOUR_COUPONS=[
  {h:2, stage:3, emo:"🎫", cls:"h2"}, //  4단계
  {h:3, stage:4, emo:"🎫", cls:"h3"}, //  5단계
  {h:4, stage:5, emo:"🎟️", cls:"h4"}, //  6단계
  {h:5, stage:6, emo:"🎟️", cls:"h5"}, //  7단계
  {h:6, stage:7, emo:"🏅", cls:"h6"}, //  8단계
  {h:7, stage:8, emo:"🏅", cls:"h7"}, //  9단계
  {h:8, stage:9, emo:"👑", cls:"h8"}, // 10단계
];
const COUPONS={};
HOUR_COUPONS.forEach(c=>{
  COUPONS["h"+c.h]={ id:"h"+c.h, name:`${c.h}시간 이용권`, emo:c.emo, cls:"hour",
    img:`cupon0${c.h}.png`, kind:"hour", hours:c.h, target:c.stage,
    desc:`이번 주 캐릭터 ${c.stage+1}단계 달성` };
});
COUPONS.pc10k={ id:"pc10k", name:"1만원 게임방 충전권", emo:"🕹️", cls:"pc", img:"cupon_pc.png",
  kind:"special", desc:"이번 주 캐릭터 10단계(최종) 달성 + 주간 챔피언", target:MON_MAX_STAGE };
// 이번 주 도달 가능한 최고 등급 이용권 (없으면 null)
function bestHourCoupon(stage){
  let best=null;
  HOUR_COUPONS.forEach(c=>{ if(stage>=c.stage) best=c; });
  return best? COUPONS["h"+best.h] : null;
}
function couponEligibility(stage, isChampion){
  const e={};
  HOUR_COUPONS.forEach(c=>{ e["h"+c.h]= stage>=c.stage; });
  e.pc10k=(stage>=COUPONS.pc10k.target) && !!isChampion;
  return e;
}
// 쿠폰 이미지 경로 (인덱스 페이지와 같은 폴더). 없으면 이모지로 자동 대체
const COUPON_IMG_BASE="";
function couponArt(type, size, emoFallback){
  const cp=COUPONS[type];
  const emo=emoFallback||(cp?cp.emo:"🎟️");
  const src=cp&&cp.img? COUPON_IMG_BASE+cp.img : "";
  if(!src) return `<span class="cp-emo">${emo}</span>`;
  return `<img src="${src}" width="${size}" height="${size}" alt="${cp.name}"
    style="object-fit:contain;border-radius:8px;display:inline-block;vertical-align:middle"
    onerror="this.onerror=null;this.outerHTML='<span class=&quot;cp-emo&quot;>${emo}</span>'">`;
}
async function fetchCoupons(uid){
  try{
    const s=await db.collection("planner").doc(uid).collection("coupons").get();

      </div>`).join("")
    : `<div style="font-size:13px;color:#94A3B8">아직 받은 쿠폰이 없어요.</div>`;

  const body=`
    <div style="font-size:12.5px;color:#64748B;margin-bottom:12px">${label} · ${esc(state.ownerName)} · 이번 주 <b>${c.stage+1}단계</b></div>
    ${hourBlock}
    <div style="display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 8px;margin-bottom:12px;overflow-x:auto">${ladder}</div>
    ${pcBlock}
    ${!canGrant?`<div style="font-size:11.5px;color:#94A3B8;margin:-2px 0 14px">조건을 채우면 부모님이 쿠폰을 발급해 주세요.</div>`:""}
    <div class="dash-section">내 쿠폰함</div>
    ${wallet}`;
  const root=document.querySelector("#drawerRoot .drawer-body");
  if(root) root.innerHTML=body;
}
async function grantCouponUI(type,weekId,label){
  const cp=COUPONS[type];
  if(!confirm(`${state.ownerName} 님에게 '${cp.name}'을 발급할까요?`)) return;
  try{
    await grantCoupon(state.ownerUid, type, weekId, label);
    toast(`${cp.emo} ${cp.name} 발급 완료!`,"cheer");
    drawCoupons();
  }catch(e){ console.error(e); alert("발급 실패: "+firestoreDiag(e)); }
}

/* ============================================================
 *  11) 시작
 * ============================================================ */
boot();
</script>
