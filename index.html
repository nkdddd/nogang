<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>우리집 학습플래너</title>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="학습플래너">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F2F7">
<meta name="color-scheme" content="light">
<script src="assets/device.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --ink:#1E2A4A; --bg:#F5F6F8; --surface:#fff; --line:#E8EBF0; --line2:#EDF0F5;
    --blue:#6A58E6; --green:#0E9F6E; --amber:#F5A524; --red:#E5484D; --purple:#8E4EC6;
    --muted:#94A3B8; --muted2:#64748B; --slate:#475569;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
    padding-bottom:env(safe-area-inset-bottom);}
  input,textarea,button,select{font-family:inherit;font-size:16px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;}
  .hidden{display:none!important;}
  button{cursor:pointer;}

  /* ===== AUTH ===== */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:390px;box-shadow:0 10px 40px rgba(30,42,74,.08);}
  .auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6A58E6,#8E4EC6);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}
  .auth-title{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.02em;}
  .auth-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:22px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:6px;}
  .inp{width:100%;padding:11px 13px;border:1px solid #E2E8F0;border-radius:10px;font-size:15px;outline:none;background:#fff;}
  .inp:focus{border-color:var(--blue);}
  .role-pick{display:flex;gap:8px;}
  .role-pick button{flex:1;padding:11px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;font-weight:700;font-size:14px;color:var(--slate);}
  .role-pick button.on{border-color:var(--blue);background:#EFECFD;color:var(--blue);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;margin-top:6px;}
  .btn-primary:disabled{opacity:.5;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted2);}
  .auth-switch a{color:var(--blue);font-weight:700;text-decoration:none;}
  .auth-err{background:#FFF5F6;color:var(--red);border:1px solid #FADADD;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
  .cfg-warn{background:#FFF8EC;color:#92610A;border:1px solid #F5D999;border-radius:9px;padding:11px 13px;font-size:12px;margin-bottom:14px;line-height:1.5;}

  /* ===== HEADER ===== */
  header{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;position:relative;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6A58E6,#8E4EC6);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .brand p{font-size:11px;color:var(--muted);}
  .who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .who-chip{display:flex;align-items:center;gap:7px;background:#F1F4F8;border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:700;color:var(--slate);}
  .who-chip .av{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid #E5E9F0;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:17px;}
  .icon-btn.sm{width:30px;height:30px;font-size:14px;}

  /* viewing-child banner */
  .child-banner{display:flex;align-items:center;gap:10px;background:#FBF7FF;border-bottom:1px solid #EFE3FB;padding:8px 16px;font-size:13px;color:#6D28A8;font-weight:600;}
  .child-banner button{margin-left:auto;border:1px solid #E4CDF7;background:#fff;color:#8E4EC6;border-radius:8px;padding:5px 11px;font-weight:700;font-size:12.5px;}

  /* ===== TOOLBAR ===== */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;flex-wrap:wrap;}
  .navg{display:flex;align-items:center;gap:7px;}
  .today-btn{padding:7px 13px;border:1px solid #D9DEE7;border-radius:9px;background:#fff;font-weight:700;font-size:13px;color:var(--slate);}
  .period{font-weight:800;font-size:16px;margin-left:6px;letter-spacing:-.02em;}
  .vtoggle{display:flex;background:#EBEEF3;border-radius:10px;padding:3px;}
  .vtoggle button{padding:6px 15px;border:none;background:transparent;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted2);}
  .vtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  main{padding:2px 16px 48px;}

  /* ===== MONTH ===== */
  .month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .wd-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2);}
  .wd-head div{padding:9px 0;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted2);}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,auto);}
  .mcell{border-right:1px solid #F1F4F8;border-bottom:1px solid #F1F4F8;padding:6px;position:relative;min-height:92px;overflow:hidden;}
  .mcell.out{background:#FAFBFC;opacity:.5;}
  .mcell-top{display:flex;align-items:center;gap:4px;min-width:0;padding-right:22px;}
  .daynum{font-size:13px;font-weight:700;width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#334155;}
  .daynum.today{background:var(--blue);color:#fff;border-radius:50%;}
  .rate-badge{font-size:10px;font-weight:700;color:#fff;padding:1px 6px;border-radius:999px;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;}
  .cell-add{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:6px;border:none;background:#F1F4F8;color:var(--muted2);font-size:12px;opacity:.7;}
  .dotrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

  /* ===== WEEK ===== */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .wcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px;display:flex;flex-direction:column;}
  .wcol.today{background:#F0F5FF;}
  .wcol-head{text-align:center;padding:9px 6px 7px;border-bottom:1px solid #F1F4F8;}
  .wcol-head .wd{font-size:12px;font-weight:700;color:var(--muted2);}
  .wcol-head .num{font-size:17px;font-weight:800;width:28px;height:28px;margin:2px auto 0;display:flex;align-items:center;justify-content:center;}
  .wcol-head .num.today{background:var(--blue);color:#fff;border-radius:50%;}
  .wcol-head .mini{font-size:11px;color:var(--green);font-weight:700;margin-top:2px;}
  .wcol-body{padding:6px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .wcard{display:flex;gap:6px;align-items:flex-start;background:#F8FAFC;border-radius:9px;padding:6px 7px;}
  .wcard .chk{border:none;background:transparent;padding:0;font-size:15px;line-height:1;margin-top:1px;}
  .wcard .tt{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wcard .ss{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wadd{border:1px dashed #D1D9E4;background:transparent;border-radius:8px;padding:6px;font-size:12px;color:var(--muted);margin-top:auto;}

  /* ===== DAY ===== */
  .day{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start;}
  .day-side{display:flex;flex-direction:column;gap:11px;position:sticky;top:72px;}
  .sum-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .sum-title{font-size:13px;font-weight:700;color:var(--muted2);margin-bottom:8px;}
  .sum-stat{margin-top:6px;font-size:14px;color:var(--slate);}
  .mini-row{display:flex;gap:9px;}
  .mini-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;}
  .mini-stat .v{font-size:15px;font-weight:800;}
  .mini-stat .l{font-size:11px;color:var(--muted);}
  .goal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;}
  .goal-top{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:8px;}
  .bar-track{height:9px;background:#EDF0F5;border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#6A58E6,#0E9F6E);border-radius:999px;transition:width .4s;}
  .goal-num{font-size:12px;color:var(--muted2);margin-top:6px;text-align:right;}

  .day-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .dl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px;}
  .dl-head h2{font-size:16px;font-weight:800;}
  .dl-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .add-btn{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:800;font-size:13.5px;}
  .empty{text-align:center;color:var(--muted);padding:38px 0;font-size:14px;}

  .task{border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;overflow:hidden;position:relative;transition:.25s;}
  /* 완료 상태: 확실히 구분되는 시각 보상 */
  .task.done{border:1.5px solid #7BD3A8;background:linear-gradient(135deg,#F3FBF7 0%,#EAF7F1 100%);
    box-shadow:0 2px 10px rgba(14,159,110,.10);}
  .task.done::after{content:"";position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 44px 44px 0;border-color:transparent #0E9F6E transparent transparent;}
  .task.done .done-mark{position:absolute;top:5px;right:6px;color:#fff;font-size:14px;font-weight:900;z-index:1;}
  .task.done .task-title{color:#0E7A55;}
  .done-stamp{display:inline-flex;align-items:center;gap:5px;background:#0E9F6E;color:#fff;
    font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;margin-top:7px;
    box-shadow:0 2px 6px rgba(14,159,110,.28);}
  @keyframes taskPop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
  .task.just-done{animation:taskPop .45s ease;}

  /* 참잘했어요 도장 */
  .stamp{position:absolute;right:12px;bottom:12px;width:74px;height:74px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:3px double #E5484D;color:#E5484D;background:rgba(255,255,255,.55);
    transform:rotate(-14deg);pointer-events:none;opacity:.92;z-index:2;
    box-shadow:inset 0 0 0 1px rgba(229,72,77,.25);}
  .stamp b{font-size:14px;font-weight:900;letter-spacing:-.5px;line-height:1.1;}
  .stamp i{font-size:8.5px;font-style:normal;font-weight:800;letter-spacing:.5px;opacity:.85;}
  .stamp.blue{border-color:#6A58E6;color:#6A58E6;box-shadow:inset 0 0 0 1px rgba(62,99,221,.25);}
  .stamp.gold{border-color:#B8891F;color:#B8891F;box-shadow:inset 0 0 0 1px rgba(184,137,31,.25);}
  @keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}
    60%{transform:rotate(-14deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.92}}
  .task.just-done .stamp{animation:stampIn .5s cubic-bezier(.3,1.4,.5,1);}
  @media(max-width:720px){ .stamp{width:62px;height:62px;right:8px;bottom:8px;} .stamp b{font-size:12px;} .stamp i{font-size:7.5px;} }

  /* 어제의 나 vs 오늘의 나 */
  .vs-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;}
  .vs-head{font-size:12.5px;font-weight:800;color:#1E2A4A;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .vs-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .vs-lbl{font-size:11.5px;color:#94A3B8;width:52px;flex-shrink:0;font-weight:700;}
  .vs-bar{flex:1;height:22px;background:#F1F4F8;border-radius:7px;overflow:hidden;position:relative;}
  .vs-bar>div{height:100%;border-radius:7px;transition:width .5s;display:flex;align-items:center;padding-left:8px;}
  .vs-bar span{font-size:11px;font-weight:800;color:#fff;white-space:nowrap;}
  .vs-verdict{font-size:12.5px;font-weight:800;padding:9px 12px;border-radius:9px;line-height:1.5;}
  .task-main{display:flex;gap:11px;padding:13px;}
  .task.done .task-main{padding-right:94px;}
  @media(max-width:720px){ .task.done .task-main{padding-right:74px;} }
  .big-chk{border:none;background:transparent;padding:0;font-size:21px;line-height:1;margin-top:1px;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .subj-tag{color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;}
  .tb-tag{font-size:11.5px;color:var(--slate);background:#F1F4F8;padding:3px 8px;border-radius:7px;font-weight:600;}
  .unit-tag{font-size:11.5px;color:var(--purple);background:#F5EEFC;padding:3px 8px;border-radius:7px;font-weight:600;}
  .method-tag{font-size:11.5px;color:#334155;background:#EFECFD;padding:3px 8px;border-radius:7px;font-weight:600;}
  .time-tag{font-size:11.5px;color:var(--muted2);background:#F8FAFC;padding:3px 8px;border-radius:7px;}
  .planned-note{font-size:13px;color:var(--slate);margin-top:8px;}
  .exec-row{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap;}
  .exec-fld{display:flex;flex-direction:column;gap:4px;}
  .exec-fld.grow{flex:1;min-width:150px;}
  .exec-lbl{font-size:11px;color:var(--muted);font-weight:700;}
  .exec-min{width:82px;padding:7px 9px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;}
  .exec-note{width:100%;padding:7px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;}
  .stars{display:flex;align-items:center;gap:3px;margin-top:9px;}
  .star{border:none;background:transparent;padding:2px;font-size:17px;line-height:1;}
  .comment-box{display:flex;align-items:center;gap:7px;margin-top:9px;background:#FBF7FF;border-radius:9px;padding:8px 11px;}
  .comment-box input{flex:1;border:none;background:transparent;font-size:13px;color:#6D28A8;outline:none;}
  .comment-box .txt{font-size:13px;color:#6D28A8;font-weight:500;}
  .task-actions{display:flex;flex-direction:column;gap:4px;}

  /* ===== MODAL / DRAWER ===== */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:470px;max-height:90vh;margin:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line2);}
  .modal-head h3{font-size:16px;font-weight:800;}
  .modal-body{padding:17px;overflow-y:auto;}
  .modal-foot{display:flex;align-items:center;gap:8px;padding:13px;border-top:1px solid var(--line2);}
  .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .pick{padding:7px 12px;border-radius:9px;border:1px solid #E2E8F0;background:#fff;font-size:13px;font-weight:700;color:var(--slate);}
  .pick.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .textarea{width:100%;padding:9px 11px;border:1px solid #E2E8F0;border-radius:9px;font-size:14px;resize:vertical;outline:none;}
  .next-btn{padding:9px 12px;border-radius:9px;border:1px solid var(--blue);background:#EFECFD;color:var(--blue);font-size:12.5px;font-weight:700;white-space:nowrap;}
  .ghost-btn{padding:9px 16px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:var(--slate);font-weight:700;font-size:13.5px;}
  .danger-btn{display:flex;align-items:center;gap:5px;padding:9px 14px;border-radius:10px;border:1px solid #FADADD;background:#FFF5F6;color:var(--red);font-weight:700;font-size:13px;}

  .drawer{background:#F7F8FB;height:100%;width:100%;max-width:420px;margin-left:auto;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);}
  .drawer.wide{max-width:540px;}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;background:#fff;border-bottom:1px solid var(--line2);}
  .drawer-head h3{font-size:16px;font-weight:800;}
  .drawer-body{padding:17px;overflow-y:auto;flex:1;}
  .tab-row{display:flex;gap:6px;padding:11px 17px 0;background:#fff;}
  .tab{padding:8px 14px;border:none;background:transparent;border-bottom:2px solid transparent;font-weight:700;font-size:13.5px;color:var(--muted);}
  .tab.on{color:var(--ink);border-bottom-color:var(--blue);}
  .list-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:14px;font-weight:600;}
  .add-line{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border:1px dashed #CBD5E1;border-radius:10px;background:#fff;color:var(--blue);font-weight:700;font-size:13.5px;margin-top:4px;}
  .section-lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
  .code-box{background:linear-gradient(135deg,#6A58E6,#8E4EC6);border-radius:14px;padding:18px;color:#fff;text-align:center;margin-bottom:18px;}
  .code-box .lbl{font-size:12px;opacity:.85;}
  .code-box .code{font-size:32px;font-weight:800;letter-spacing:.15em;margin:6px 0;font-variant-numeric:tabular-nums;}
  .code-box button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12.5px;}
  .share-note{display:flex;gap:8px;align-items:flex-start;background:#EFECFD;border-radius:10px;padding:12px;font-size:12.5px;color:var(--slate);margin-top:18px;line-height:1.5;}
  .child-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:11px;padding:12px 13px;margin-bottom:9px;}
  .child-item .av{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .child-item .open{margin-left:auto;border:1px solid var(--blue);background:#EFECFD;color:var(--blue);border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;}

  /* dashboard */
  .dash-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .dash-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .dash-stat .ic{font-size:18px;}
  .dash-stat .big{font-size:22px;font-weight:800;margin-top:6px;}
  .dash-stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .dash-section{font-size:13px;font-weight:800;margin:20px 0 12px;}
  .spark{display:flex;gap:8px;align-items:flex-end;height:110px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .spark-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
  .spark-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .spark-bar{width:20px;border-radius:6px;transition:height .4s;}
  .spark-lbl{font-size:11px;color:var(--muted);margin-top:6px;}
  .subj-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .subj-bar-track{flex:1;height:12px;background:#EDF0F5;border-radius:999px;overflow:hidden;}
  .subj-bar-fill{height:100%;border-radius:999px;transition:width .4s;}
  .subj-bar-num{font-size:12px;color:var(--muted2);font-weight:700;min-width:44px;text-align:right;}

  /* 용돈 */
  .allow-hero{background:linear-gradient(135deg,#0E9F6E,#6A58E6);border-radius:16px;padding:20px;color:#fff;text-align:center;margin-bottom:14px;}
  .allow-hero .wk{font-size:12px;opacity:.9;}
  .allow-hero .amt{font-size:38px;font-weight:800;margin:4px 0;letter-spacing:-.02em;}
  .allow-hero .cap{font-size:12px;opacity:.85;}
  .allow-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;}
  .allow-card .name{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;margin-bottom:12px;}
  .allow-card .name .av{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .metric{margin-bottom:9px;}
  .metric-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .metric-top .lbl{color:var(--slate);font-weight:600;}
  .metric-top .val{color:var(--muted2);font-weight:700;}
  .metric-track{height:8px;background:#EDF0F5;border-radius:999px;overflow:hidden;}
  .metric-fill{height:100%;border-radius:999px;}
  .allow-total{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed #E2E8F0;margin-top:12px;padding-top:12px;}
  .allow-total .a{font-size:22px;font-weight:800;color:#0E9F6E;}
  .pay-btn{border:none;background:#0E9F6E;color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;}
  .paid-badge{background:#EAF7F1;color:#0E9F6E;border:1px solid #BFE8D6;border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px;}
  .pay-hist{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:7px;font-size:13px;}
  .crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .crit-grid .fld-lbl{font-size:11.5px;}
  .pay-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px;background:#F8FAFC;border-radius:10px;padding:11px;}
  .pay-ctrl .fld-lbl{font-size:11.5px;}
  .pay-ctrl .inp{padding:9px 10px;}

  .fld-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:6px;}

  /* 학습 카드 제목·기록 버튼 */
  .task-title{font-size:15px;font-weight:800;color:#1E2A4A;margin:6px 0 2px;cursor:pointer;line-height:1.35;}
  .task-title:hover{color:#6A58E6;}
  .rec-btn{width:100%;margin:8px 0 2px;border:1.5px solid #DCD6F7;background:#F7F6FE;color:#6A58E6;
    border-radius:10px;padding:9px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
  .rec-btn:hover{background:#EFECFD;}

  /* 오늘 할 일 추가 버튼 */
  .add-task-btn{width:100%;border:2px dashed #D2CAF8;background:#FAF9FF;color:#6A58E6;border-radius:14px;
    padding:16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;transition:.15s;}
  .add-task-btn:hover{background:#EFECFD;border-color:#A89BF3;}

  /* 메뉴 허브 */
  .hub-item{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s;}
  .hub-item:hover{border-color:#D2CAF8;background:#FAF9FF;}
  .hub-emo{font-size:22px;width:26px;text-align:center;flex-shrink:0;}
  .hub-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .hub-txt b{font-size:14px;font-weight:800;color:#1E2A4A;}
  .hub-txt span{font-size:11.5px;color:#94A3B8;line-height:1.4;}
  .hub-arr{color:#CBD5E1;font-size:20px;flex-shrink:0;}

  /* 학습 타이머 */
  .timer-btn{border:1.5px solid #DCD6F7;background:#F7F6FE;color:#6A58E6;border-radius:9px;padding:6px 11px;font-weight:800;font-size:12px;cursor:pointer;}
  .timer-btn.on{border-color:#E5484D;background:#FFF5F6;color:#E5484D;animation:tmrPulse 1.6s ease-in-out infinite;}
  @keyframes tmrPulse{0%,100%{opacity:1}50%{opacity:.6}}
  .verify-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;}

  /* 포인트 안내 배너 */
  .pts-hint{padding:10px 16px;font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;}
  .pts-hint.good{background:#F3FBF7;color:#0E7A55;}
  .pts-hint.warn{background:#FFF7E8;color:#8A6516;}
  .pts-hint b{font-weight:800;}

  /* 쿠폰 */
  .coupon{position:relative;border-radius:14px;padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;
    border:2px dashed #CBD5E1;background:#fff;}
  .coupon.play{border-color:#7BC96F;background:linear-gradient(135deg,#F2FCF3,#E7F8EA);}
  .coupon.hour{border-color:#F5A524;background:linear-gradient(135deg,#FFFBEF,#FFF4DA);}
  .coupon.pc{border-color:#8E4EC6;background:linear-gradient(135deg,#FAF5FF,#F3E8FF);}
  .coupon.used{opacity:.5;filter:grayscale(.6);}
  .coupon .cp-emo{font-size:28px;}
  .coupon .cp-name{font-weight:800;font-size:14.5px;}
  .coupon .cp-cond{font-size:11.5px;color:#64748B;margin-top:2px;line-height:1.4;}
  .coupon .cp-act{margin-left:auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
  .cp-btn{border:none;border-radius:9px;padding:7px 12px;font-weight:800;font-size:12.5px;color:#fff;background:#0E9F6E;}
  .cp-btn.gray{background:#94A3B8;}
  .cp-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#EAF7F1;color:#0E9F6E;border:1px solid #BFE8D6;}
  .cp-badge.lock{background:#F1F4F8;color:#94A3B8;border-color:#E2E8F0;}
  .cp-prog{height:6px;background:#EDF0F5;border-radius:999px;overflow:hidden;margin-top:6px;width:120px;}
  .cp-prog>div{height:100%;background:#0E9F6E;border-radius:999px;}
  .cp-wallet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-size:13px;}
  .cp-wallet .w-emo{font-size:20px;}
  .cp-wallet .w-when{margin-left:auto;font-size:11.5px;color:#94A3B8;}

  /* 주간 마감/계획 배너 */
  .week-banner{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:600;line-height:1.4;flex-wrap:wrap;}
  .week-banner.plan{background:#EFECFD;border-bottom:1px solid #DED8FB;color:#35296E;}
  .week-banner.soon{background:#FFF7E8;border-bottom:1px solid #F5DFA6;color:#8A6516;}
  .week-banner button{margin-left:auto;border:none;border-radius:9px;padding:7px 13px;font-weight:800;font-size:12.5px;color:#fff;background:#6A58E6;}

  /* 주간 대결 · 챔피언 인증카드 */
  .rank-row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;}
  .rank-row .medal{font-size:20px;width:26px;text-align:center;}
  .rank-row .pts{margin-left:auto;font-weight:800;color:#8E4EC6;font-size:14px;}
  .cert{border-radius:16px;padding:18px;text-align:center;color:#3a2f00;margin-bottom:14px;
    background:linear-gradient(135deg,#FFF7DA,#FDEBC0);border:2px solid #E8C879;box-shadow:0 8px 24px rgba(184,137,31,.18);position:relative;overflow:hidden;}
  .cert::before{content:"";position:absolute;inset:6px;border:1.5px dashed #D8B45B;border-radius:12px;pointer-events:none;}
  .cert .crown{font-size:30px;}
  .cert .ttl{font-weight:800;font-size:16px;letter-spacing:.02em;margin-top:2px;}
  .cert .who{font-weight:800;font-size:20px;margin:4px 0;}
  .cert .meta{font-size:12.5px;color:#7a6a30;}
  .cert .seal{position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:800;color:#B8891F;border:2px solid #B8891F;border-radius:999px;padding:4px 9px;transform:rotate(-8deg);opacity:.85;}

  /* 파트너 몬스터 */
  .mon-card{background:linear-gradient(160deg,#FFFDF5,#F3F7FF);border:1.5px solid #EDE4C8;border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden;}
  .mon-card .mon-name{font-weight:800;font-size:14px;margin-top:4px;}
  .mon-card .mon-lv{font-size:11.5px;color:#94A3B8;font-weight:700;}
  .mon-card .mon-msg{font-size:11.5px;color:#8A6D1F;background:#FFF6DC;border-radius:8px;padding:6px 9px;margin-top:8px;line-height:1.4;}
  .mon-xp{height:8px;background:#EDF0F5;border-radius:999px;overflow:hidden;margin-top:8px;}
  .mon-xp>div{height:100%;background:linear-gradient(90deg,#F5A524,#E5484D);border-radius:999px;transition:width .4s;}
  .mon-pick{display:flex;gap:10px;justify-content:center;}
  .mon-pick button{background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:10px;cursor:pointer;}
  .mon-pick button.on{border-color:#F5A524;background:#FFFBEF;}
  .mon-pick .pk-name{font-size:11.5px;font-weight:700;color:#475569;margin-top:4px;}
  @keyframes monBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .mon-card svg{animation:monBob 2.4s ease-in-out infinite;}

  /* 동기부여 */
  .cheer{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(135deg,#EFECFD,#F3EEFF);border:1px solid #E6E1FB;border-radius:13px;padding:13px 15px;margin-bottom:13px;}
  .cheer .emo{font-size:26px;line-height:1;}
  .cheer .msg{font-weight:800;font-size:14.5px;color:#35296E;}
  .cheer .tip{font-size:12px;color:#6B7280;margin-top:3px;line-height:1.5;}
  .rollover-btn{border:1px solid #E2E8F0;background:#fff;color:#64748B;border-radius:9px;padding:8px 12px;font-weight:700;font-size:12.5px;}
  .quick-praise{border:1px solid #E4CDF7;background:#FBF7FF;color:#8E4EC6;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;}
  .badges{display:flex;flex-wrap:wrap;gap:9px;}
  .badge{display:flex;flex-direction:column;align-items:center;gap:3px;width:74px;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:center;}
  .badge.locked{opacity:.38;filter:grayscale(1);}
  .badge .b-emo{font-size:24px;line-height:1;}
  .badge .b-name{font-size:10.5px;font-weight:700;color:var(--slate);line-height:1.25;}
  .toast-wrap{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;}
  .toast{background:#1E2A4A;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:90%;animation:toastIn .22s ease;}
  .toast.good{background:#0E9F6E;} .toast.info{background:#6A58E6;} .toast.cheer{background:linear-gradient(135deg,#8E4EC6,#6A58E6);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  @media(max-width:720px){
    .day{grid-template-columns:1fr;}
    .day-side{position:static;flex-direction:column;}
    .week{grid-template-columns:1fr;}
    .wcol{min-height:auto;}
    .mgrid{grid-auto-rows:minmax(64px,auto);}
    .mcell{min-height:64px;padding:4px;}
    .mcell-top{padding-right:2px;gap:2px;}
    .cell-add{display:none;}
    .daynum{width:20px;height:20px;font-size:12px;}
    .rate-badge{font-size:9px;padding:1px 4px;}
    .dot{width:6px;height:6px;}
    .period{font-size:15px;}
    /* 헤더 축약 */
    header{padding:9px 11px;gap:8px;}
    header h1{font-size:15px;}
    #brandSub{display:none;}
    .logo{width:32px;height:32px;font-size:17px;}
    .who{gap:5px;}
    .who-chip{padding:4px 9px 4px 6px;font-size:12px;max-width:104px;overflow:hidden;white-space:nowrap;}
    .who-chip span:last-child{overflow:hidden;text-overflow:ellipsis;}
    .icon-btn{width:33px;height:33px;font-size:16px;}
    .more-menu{right:8px;top:52px;min-width:180px;}
    /* 툴바 줄바꿈 허용 */
    .toolbar{flex-wrap:wrap;gap:7px;}
    /* 드로어 내부 그리드: 인라인 4열·3열 지정도 2열로 강제 */
    .drawer-body .dash-cards{grid-template-columns:1fr 1fr !important;}
    .drawer-body .crit-grid{grid-template-columns:1fr !important;}
    .dash-stat .big{font-size:15px !important;}
    .drawer-body .coupon{flex-wrap:wrap;}
    .drawer-body .coupon .cp-act{margin-left:0;width:100%;align-items:stretch;}
    .drawer-body .cp-act .cp-btn{width:100%;}
    .allow-card .name{flex-wrap:wrap;}
  }
  @media(max-width:400px){
    header h1{font-size:14px;}
    .who-chip{max-width:78px;}
    #monHead{display:none !important;}
  }

  /* =====================================================================
   *  하루틀 UI 셸 — 아래쪽 메뉴(할 일 · 일정 · 학습 · 기록) + ✨ 빠른 계획
   *  (위의 기존 스타일을 덮어씁니다)
   * ===================================================================== */
  :root{
    --bg:#F3F2F7; --surface:#fff; --surface2:#E9E8F0; --line:#E4E2EC; --line2:#EDEBF3;
    --ink:#1C1B24; --muted:#8F8D9B; --muted2:#6D6B7A; --slate:#4A4858;
    --blue:#6A58E6; --accent:#6A58E6; --accent-2:#8F80FF; --accent-soft:#EFECFD;
    --shadow:0 10px 30px rgba(20,16,50,.10);
    --r:18px;
  }
  html{color-scheme:light;}
  body{background:var(--bg);color:var(--ink);padding-bottom:0;}
  #app{max-width:760px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom));}
  body.lapp-open{overflow:hidden;}

  /* ----- 로그인 ----- */
  #auth{background:var(--bg);}
  .auth-card{border-radius:24px;border:none;box-shadow:var(--shadow);}
  .auth-logo,.code-box{background:linear-gradient(135deg,#8F80FF,#6A58E6 55%,#5646D0);}
  .inp,.textarea{border-color:var(--line);border-radius:12px;}
  .btn-primary{border-radius:14px;background:var(--ink);}

  /* ----- 상단 바 ----- */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(243,242,247,.9);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .tb-chips{display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;}
  .tb-chips span{display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .tb-mon{display:flex;align-items:center;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
  .tb-who{display:flex;align-items:center;gap:6px;border:none;background:var(--surface);border-radius:999px;
    padding:4px 12px 4px 4px;font-weight:800;font-size:13px;color:var(--slate);max-width:150px;min-width:0;
    box-shadow:0 1px 2px rgba(20,16,50,.06);}
  .tb-who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;}
  .tb-who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-pill{display:flex;align-items:center;background:var(--surface2);border-radius:999px;padding:3px;}
  .tb-pill button{width:42px;height:36px;border:none;background:transparent;border-radius:999px;font-size:19px;
    color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;}
  .tb-pill button:active{background:var(--surface);}
  .tb-pill svg{width:20px;height:20px;}
  #menuBtn{position:relative;}
  #menuBtn.has-dot::after{content:"";position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 2px var(--surface2);}
  .badge-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;vertical-align:1px;margin-left:4px;}
  .fam-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .fam-card .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;}
  .fam-card .tx{flex:1;min-width:0;}
  .fam-card .tx b{display:block;font-size:14px;}
  .fam-card .tx span{display:block;font-size:12px;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fam-btn{border:none;border-radius:999px;padding:8px 13px;font-weight:800;font-size:12.5px;background:var(--ink);color:#fff;white-space:nowrap;}
  .fam-btn.ghost{background:var(--surface2);color:var(--ink);}
  .fam-send{display:flex;gap:8px;}
  .fam-send .inp{flex:1;min-width:0;}

  .child-banner{background:var(--accent-soft);border:none;border-radius:14px;margin:0 16px 8px;color:#4B3FA6;}
  .child-banner button{border-color:#DCD6F7;color:var(--accent);border-radius:999px;}
  .week-banner{border-radius:14px;margin:0 16px 8px;border:none!important;}
  .share-note{display:block;}
  .week-banner button{border-radius:999px;}
  #examBanner>div{margin-left:16px!important;margin-right:16px!important;border-radius:14px!important;}

  /* ----- 페이지 머리 ----- */
  .page-h{display:flex;align-items:flex-end;gap:10px;padding:6px 16px 10px;flex-wrap:wrap;}
  .page-h h2{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.15;}
  .page-h .h-sub{font-size:13px;color:var(--muted2);font-weight:600;margin-bottom:5px;}
  .h-nav{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--muted2);font-size:14px;font-weight:600;margin-bottom:4px;}
  .h-nav button{border:none;background:transparent;width:32px;height:32px;border-radius:50%;font-size:19px;color:var(--muted2);}
  .h-nav button:active{background:var(--surface2);}
  .h-nav .today-chip{width:auto;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:800;color:var(--accent);margin-right:4px;}
  .seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin:0 16px 12px;}
  .seg button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 0;font-weight:800;font-size:13px;color:var(--muted2);}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,16,50,.08);}

  /* 주간 날짜 줄 */
  .wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px 12px;}
  .wday{border:none;background:transparent;border-radius:16px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted2);}
  .wday .w{font-size:11.5px;font-weight:600;}
  .wday .n{font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25;}
  .wday .r{font-size:10px;font-weight:800;color:var(--muted);min-height:14px;}
  .wday.sun .w{color:#E5484D;} .wday.sat .w{color:var(--accent);}
  .wday.today .n{color:var(--accent);font-weight:800;}
  .wday.on{background:var(--surface2);}
  .wday.on .n{font-weight:800;}
  .wday.full .r{color:var(--green);}

  main{padding:0 16px 24px;}

  /* ----- 할 일(일간) — 한 줄 레이아웃 ----- */
  .day{display:flex;flex-direction:column;gap:12px;}
  .day-side{position:static;order:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .day-side>*{min-width:0;}
  .day-side .mon-card,.day-side .goal-card:first-of-type{grid-column:1/-1;}
  .day-side .mini-row{grid-column:1/-1;}
  .day-list{background:transparent;border:none;padding:0;}
  /* 하루틀처럼 할 일 목록을 맨 위로, 응원·다이어리 같은 안내 카드는 그 아래로 */
  .day-list{display:flex;flex-direction:column;}
  .day>*,.day-list>*{min-width:0;max-width:100%;}
  .day-list>.dl-head{order:-3;}
  .day-list>.task,.day-list>.empty{order:-2;}
  .day-list>.add-task-btn{order:-1;margin:0 0 16px;}
  .dl-head h2{font-size:18px;}
  .sum-card,.goal-card,.mini-stat,.mon-card,.vs-card,.cheer,.day-list .task{border-radius:var(--r);}
  .sum-card,.goal-card,.mini-stat,.vs-card{border:1px solid var(--line);}
  .task{background:var(--surface);border:1px solid var(--line);}
  .cheer{background:var(--surface);border:1px solid var(--line);}
  .add-task-btn{border-radius:var(--r);border:1.5px dashed #CFCDD9;background:transparent;color:var(--muted2);}
  .add-task-btn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .bar-fill{background:linear-gradient(90deg,#8F80FF,#6A58E6);}
  .add-btn{border-radius:12px;}
  .rollover-btn,.ghost-btn,.pick,.icon-btn{border-color:var(--line);}
  .pick.on{background:var(--ink);border-color:var(--ink);}
  @media(max-width:520px){ .day-side{grid-template-columns:1fr;} }

  /* ----- 일정(주간·월간) ----- */
  .week{grid-template-columns:1fr;gap:10px;}
  .wcol{min-height:auto;border-radius:var(--r);flex-direction:row;}
  .wcol.today{background:#F7F6FE;border-color:#DCD6F7;}
  .wcol-head{width:64px;flex:0 0 64px;border-bottom:none;border-right:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .wcol-body{padding:8px;}
  .wcard{border-radius:12px;background:var(--bg);}
  .wadd{border-radius:12px;margin-top:2px;}
  .month{border-radius:var(--r);}
  .mcell{min-height:74px;}
  .mgrid{grid-auto-rows:minmax(74px,auto);}
  .daynum.today{background:var(--accent);}

  /* ----- 학습 탭 ----- */
  .l-hero{background:linear-gradient(135deg,#8F80FF,#6A58E6 60%,#5646D0);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 26px rgba(106,88,230,.28);}
  .l-hero .t{font-size:13px;opacity:.9;font-weight:700;}
  .l-hero .v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px;}
  .l-hero .v small{font-size:15px;opacity:.85;font-weight:700;}
  .l-hero .bar{height:8px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;}
  .l-hero .bar>div{height:100%;background:#fff;border-radius:999px;}
  .l-hero .per{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:700;opacity:.92;}
  .lcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;}
  .lcard-top{display:flex;align-items:center;gap:12px;}
  .lcard-ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
  .lcard-name{font-size:16.5px;font-weight:800;letter-spacing:-.01em;}
  .lcard-sub{font-size:12.5px;color:var(--muted2);margin-top:1px;}
  .lcard-min{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EAF7F1;color:#0E7A55;white-space:nowrap;}
  .lcard-min.zero{background:var(--bg);color:var(--muted);}
  .lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px;}
  .lstat{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center;}
  .lstat b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .lstat span{font-size:11px;color:var(--muted2);font-weight:600;}
  .lprog{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;}
  .lprog>div{height:100%;border-radius:999px;}
  .lprog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);margin-top:6px;font-weight:600;}
  .lgo{width:100%;margin-top:12px;border:none;border-radius:14px;padding:13px;font-weight:800;font-size:14.5px;background:var(--ink);color:#fff;}
  .lgo:active{transform:scale(.99);}
  .lnote{font-size:12px;color:var(--muted2);line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:4px;}

  /* 학습앱 전체 화면 */
  .lapp{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;}
  .lapp-h{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--surface);border-bottom:1px solid var(--line);}
  .lapp-h b{font-size:15px;font-weight:800;}
  .lapp-back{border:none;background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13.5px;color:var(--ink);}
  .lapp-h .sp{flex:1;}
  .lapp iframe{flex:1;width:100%;border:0;background:#fff;}

  /* ----- 기록 탭 ----- */
  .r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .r-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center;}
  .r-stat .e{font-size:22px;}
  .r-stat b{display:block;font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;}
  .r-stat span{font-size:11.5px;color:var(--muted2);font-weight:600;}
  .r-sec{font-size:13px;font-weight:800;color:var(--muted2);margin:18px 2px 10px;}
  .hub-item{border-radius:var(--r);border-color:var(--line);padding:15px;}
  .hub-item:hover{border-color:#D2CAF8;background:var(--surface);}
  .mon-card{border-color:var(--line);background:linear-gradient(160deg,#FFFDF7,#F4F2FF);}


  /* ----- 포커스 타이머 ----- */
  .fo-wrap{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#EFECFD,rgba(239,236,253,0) 70%);border-radius:24px;padding:14px 12px 18px;margin-bottom:12px;}
  .fo-dial{width:min(76vw,280px);aspect-ratio:1;touch-action:none;user-select:none;cursor:pointer;outline:none;}
  .fo-dial.paused .fo-glass{animation-play-state:paused;}
  .fo-glass{transform-box:fill-box;transform-origin:50% 50%;animation:foFlip 6s ease-in-out infinite;}
  @keyframes foFlip{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
  .fo-time{font-size:52px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:8px 0 2px;}
  .fo-sub{font-size:13px;color:var(--muted2);margin:6px 0 2px;text-align:center;}
  .fo-ctrl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
  .fo-btn{border:none;border-radius:999px;padding:12px 22px;font-weight:800;font-size:14.5px;background:var(--ink);color:#fff;}
  .fo-btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .fo-presets{display:flex;gap:8px;margin-top:6px;}
  .fo-presets button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--muted2);}
  .fo-presets button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .fo-done{text-align:center;padding:26px 6px 8px;}
  .fo-big-emo{font-size:56px;}
  .fo-done-t{font-size:24px;font-weight:800;margin-top:6px;}
  .fo-done-s{font-size:13px;color:var(--muted2);margin-top:4px;line-height:1.5;}
  .fo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;}
  .fo-card-h{font-weight:800;font-size:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
  .fo-card-h span{font-weight:600;font-size:12px;color:var(--muted2);}
  .fo-sounds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .fo-sounds button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 8px;font-weight:800;font-size:13.5px;color:var(--ink);}
  .fo-sounds button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .fo-vol{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .fo-vol input{flex:1;accent-color:var(--accent);}
  .fo-hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .fo-awake{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:700;color:var(--slate);}
  .fo-awake input{width:18px;height:18px;accent-color:var(--accent);}
  .bnav-pill button .lbl{font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* ----- 아래쪽 메뉴 ----- */
  .bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;
    display:flex;align-items:center;gap:10px;width:min(560px,calc(100% - 24px));}
  .bnav-pill{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);}
  .bnav-pill button{flex:1;height:50px;border:none;background:transparent;border-radius:999px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;color:var(--muted2);font-size:10.5px;font-weight:700;}
  .bnav-pill button svg{width:22px;height:22px;}
  .bnav-pill button.on{background:var(--surface2);color:var(--ink);}
  .fab{width:62px;height:62px;border-radius:50%;border:none;flex:0 0 auto;color:#fff;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%,#A597FF,#6A58E6 60%,#5646D0);box-shadow:0 8px 22px rgba(106,88,230,.45);}
  .fab svg{width:26px;height:26px;}
  .fab:active{transform:scale(.96);}
  .toast-wrap{bottom:calc(92px + env(safe-area-inset-bottom));}
  .toast{border-radius:999px;background:var(--ink);}
  .toast.good{background:#0E9F6E;} .toast.info{background:var(--accent);}

  /* ----- 시트(드로어·모달) ----- */
  .overlay{background:rgba(20,16,40,.38);z-index:60;}
  .drawer,.drawer.wide{max-width:600px;height:auto;max-height:92vh;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--bg);box-shadow:0 -10px 40px rgba(20,16,50,.18);animation:sheetUp .22s ease;}
  .drawer-head{background:transparent;border-bottom:none;padding:16px 18px 6px;}
  .drawer-head h3{font-size:19px;}
  .drawer-body{padding:10px 16px calc(22px + env(safe-area-inset-bottom));}
  .tab-row{background:transparent;}
  .list-item,.child-item{border-radius:14px;}
  .modal{border-radius:24px;}
  @media(max-width:600px){
    .overlay{align-items:flex-end;}
    .modal{margin:auto 0 0;max-width:none;border-radius:24px 24px 0 0;max-height:94vh;animation:sheetUp .22s ease;}
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

  /* 빠른 계획(✨) */
  .q-orb{width:84px;height:84px;border-radius:50%;margin:6px auto 12px;background:radial-gradient(circle at 32% 28%,#fff 0 6%,#A597FF 22%,#6A58E6 60%,#4B3CC4);
    box-shadow:0 12px 30px rgba(106,88,230,.35);display:flex;align-items:center;justify-content:center;color:#fff;}
  .q-orb svg{width:34px;height:34px;}
  .q-lead{text-align:center;font-size:15.5px;font-weight:700;line-height:1.55;}
  .q-ex{text-align:center;font-size:12.5px;color:var(--muted2);margin:6px 0 14px;line-height:1.5;}
  .q-box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:20px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);}
  .q-box textarea{flex:1;border:none;outline:none;resize:none;font-size:15px;min-height:46px;max-height:160px;padding:6px 0;background:transparent;}
  .q-box button{border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;padding:12px 16px;font-size:14px;white-space:nowrap;}
  .q-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;}
  .q-row select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13.5px;background:#fff;max-width:112px;}
  .q-row .q-t{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-row .q-m{font-size:12px;color:var(--muted2);white-space:nowrap;}
  .q-row input[type=number]{width:62px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:13.5px;}

  /* =====================================================================
   *  PC 레이아웃 (html[data-device="pc"]) — assets/device.js 가 판별
   *  왼쪽 사이드바 메뉴 + 넓은 여러 칸 화면. 모바일은 위의 기본 레이아웃 그대로.
   * ===================================================================== */
  .side-brand,.fab-t{display:none;}
  html[data-device="pc"] body{--side:248px;}
  html[data-device="pc"] #app{max-width:none;margin:0 0 0 var(--side);padding:0 32px 48px;}
  html[data-device="pc"] #app>*:not(.bnav){max-width:1200px;margin-left:auto;margin-right:auto;}
  html[data-device="pc"] .topbar{padding:18px 0 12px;background:rgba(243,242,247,.92);}
  html[data-device="pc"] .child-banner,html[data-device="pc"] .week-banner{margin:0 auto 10px;}
  html[data-device="pc"] #examBanner>div{margin-left:0!important;margin-right:0!important;}
  html[data-device="pc"] .page-h{padding:6px 0 14px;}
  html[data-device="pc"] .page-h h2{font-size:36px;}
  html[data-device="pc"] main{padding:0 0 24px;}
  html[data-device="pc"] .seg{margin:0 0 16px;max-width:360px;}
  html[data-device="pc"] .wstrip{padding:0 0 16px;gap:8px;}
  html[data-device="pc"] .wday{padding:10px 0 8px;}

  /* 사이드바 메뉴 */
  html[data-device="pc"] .bnav{left:0;top:0;bottom:0;transform:none;width:var(--side);max-width:none;height:100vh;
    flex-direction:column;align-items:stretch;gap:14px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);}
  html[data-device="pc"] .side-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid var(--line2);}
  html[data-device="pc"] .side-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8F80FF,#6A58E6 55%,#5646D0);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;}
  html[data-device="pc"] .side-brand b{display:block;font-size:15px;letter-spacing:-.02em;}
  html[data-device="pc"] .side-brand span{display:block;font-size:11.5px;color:var(--muted);}
  html[data-device="pc"] .bnav-pill{flex:0 0 auto;flex-direction:column;gap:4px;padding:0;background:transparent;border:none;box-shadow:none;border-radius:0;}
  html[data-device="pc"] .bnav-pill button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:14px;font-size:14.5px;font-weight:700;}
  html[data-device="pc"] .bnav-pill button:hover{background:var(--bg);color:var(--ink);}
  html[data-device="pc"] .bnav-pill button.on{background:var(--accent-soft);color:var(--accent);}
  html[data-device="pc"] .fab{width:100%;height:48px;border-radius:14px;gap:8px;font-weight:800;font-size:14.5px;box-shadow:0 6px 16px rgba(106,88,230,.3);}
  html[data-device="pc"] .fab svg{width:20px;height:20px;}
  html[data-device="pc"] .fab-t{display:inline;}
  html[data-device="pc"] .toast-wrap{left:var(--side);bottom:28px;}

  /* 할 일: 목록(왼쪽) + 요약 카드(오른쪽 고정) */
  html[data-device="pc"] .day{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;}
  html[data-device="pc"] .day-list{grid-column:1;grid-row:1;}
  html[data-device="pc"] .day-side{grid-column:2;grid-row:1;order:0;position:sticky;top:84px;grid-template-columns:1fr;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:4px;}

  /* 일정: 주간 7칸 */
  html[data-device="pc"] .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
  html[data-device="pc"] .wcol{flex-direction:column;min-height:420px;}
  html[data-device="pc"] .wcol-head{width:auto;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line2);padding:10px 4px 8px;}
  html[data-device="pc"] .wcol-body{padding:8px;}
  html[data-device="pc"] .wcard .tt{white-space:normal;}
  html[data-device="pc"] .mgrid{grid-auto-rows:minmax(112px,auto);}
  html[data-device="pc"] .mcell{min-height:112px;padding:8px;}
  html[data-device="pc"] .cell-add{display:block;}

  /* 학습: 앱 카드 3칸 */
  html[data-device="pc"] .l-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;}
  html[data-device="pc"] .l-grid .lcard{margin-bottom:0;}
  html[data-device="pc"] .l-hero{margin-bottom:18px;}
  html[data-device="pc"] .lnote{margin-top:16px;}

  /* 타이머: 다이얼(왼쪽) + 과제·사운드(오른쪽) */
  html[data-device="pc"] .fo-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start;}
  html[data-device="pc"] .fo-grid .fo-wrap{margin-bottom:0;padding:28px 16px 32px;}
  html[data-device="pc"] .fo-dial{width:320px;}

  /* 기록: 요약·파트너(왼쪽) + 메뉴(오른쪽) */
  html[data-device="pc"] .rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;}
  html[data-device="pc"] .rec-grid .r-sec:first-child{margin-top:0;}

  /* 시트 → 오른쪽 패널 / 가운데 창 */
  html[data-device="pc"] .overlay{align-items:stretch;}
  html[data-device="pc"] .drawer,html[data-device="pc"] .drawer.wide{margin:0 0 0 auto;width:520px;max-width:92vw;height:100vh;max-height:none;border-radius:24px 0 0 24px;animation:panelIn .2s ease;}
  html[data-device="pc"] .modal{margin:auto;max-width:560px;border-radius:24px;animation:none;}
  @keyframes panelIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

  /* 작은 PC(노트북) 화면: 사이드바·요약 칸을 좁게 */
  @media (max-width:1200px){
    html[data-device="pc"] body{--side:216px;}
    html[data-device="pc"] #app{padding:0 22px 40px;}
    html[data-device="pc"] .day{grid-template-columns:minmax(0,1fr) 290px;gap:16px;}
    html[data-device="pc"] .l-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  /* 학습앱 전체 화면: 사이드바는 그대로 두고 오른쪽에 */
  html[data-device="pc"] .lapp{left:var(--side);border-left:1px solid var(--line);}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">

const MONSTERS={

function monsterSVG(species,stage,size){
  const M=MONSTERS[species]||MONSTERS.water; size=size||84;
  const S=`<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">`, E=`</svg>`;
  const eye=(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${(r*1.15).toFixed(1)}" fill="#12233F"/><circle cx="${(x+r*0.4).toFixed(1)}" cy="${(y-r*0.45).toFixed(1)}" r="${(r*0.34).toFixed(1)}" fill="#fff"/>`;
  const cheeks=(y)=>`<ellipse cx="34" cy="${y}" rx="4" ry="2.6" fill="${M.cheek}" opacity=".8"/><ellipse cx="66" cy="${y}" rx="4" ry="2.6" fill="${M.cheek}" opacity=".8"/>`;
  const mirror=(inner)=>inner+`<g transform="translate(100,0) scale(-1,1)">${inner}</g>`;
  // 속성별 날개(오른쪽 기준, 좌우 미러)
  const wing=(y0)=>{
    if(species==="air") return `<path d="M60 ${y0} Q84 ${y0-16} 93 ${y0-6} Q83 ${y0-2} 90 ${y0+4} Q78 ${y0+2} 85 ${y0+9} Q73 ${y0+6} 79 ${y0+13} Q66 ${y0+9} 60 ${y0+4} Z" fill="${M.c1}" stroke="${M.c2}" stroke-width="2"/>`;
    if(species==="water") return `<path d="M60 ${y0} Q83 ${y0-10} 91 ${y0} Q84 ${y0+2} 88 ${y0+8} Q78 ${y0+4} 80 ${y0+11} Q70 ${y0+6} 60 ${y0+5} Z" fill="${M.accent}" stroke="${M.c2}" stroke-width="2"/>`;
    return `<path d="M60 ${y0} Q82 ${y0-12} 91 ${y0-2} L86 ${y0+2} L91 ${y0+7} L84 ${y0+7} L87 ${y0+13} L77 ${y0+9} Q66 ${y0+7} 60 ${y0+4} Z" fill="${M.c1}" stroke="${M.c2}" stroke-width="2"/>`;
  };
  // 속성별 머리 장식(정수리)
  const crest=(topY)=>{
    if(species==="water") return `<path d="M50 ${topY} Q44 ${topY-12} 40 ${topY-4} Q46 ${topY-4} 47 ${topY+3}Z" fill="${M.accent}" stroke="${M.c2}" stroke-width="1.5"/><path d="M50 ${topY} Q56 ${topY-12} 60 ${topY-4} Q54 ${topY-4} 53 ${topY+3}Z" fill="${M.accent}" stroke="${M.c2}" stroke-width="1.5"/>`;
    if(species==="earth") return `<path d="M42 ${topY+2} L38 ${topY-11} L46 ${topY-1} Z" fill="${M.belly}" stroke="${M.c2}" stroke-width="1.6"/><path d="M58 ${topY+2} L62 ${topY-11} L54 ${topY-1} Z" fill="${M.belly}" stroke="${M.c2}" stroke-width="1.6"/>`;
    return `<path d="M50 ${topY-1} Q45 ${topY-13} 41 ${topY-6} Q47 ${topY-6} 48 ${topY+2}Z" fill="${M.c2}"/><path d="M50 ${topY-1} Q52 ${topY-15} 56 ${topY-9} Q52 ${topY-6} 53 ${topY+2}Z" fill="${M.accent}"/>`;
  };
  // 입/부리
  const face=(y)=> species==="air"
    ? `<path d="M46 ${y+2} L54 ${y+2} L50 ${y+7} Z" fill="${M.c2}"/>`
    : `<path d="M44 ${y} Q50 ${y+6} 56 ${y}" stroke="#12233F" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;

  if(stage===0){ // 아기 (큰 머리, 작은 몸)
    return S+
      mirror(wing(60))+
      crest(30)+
      `<ellipse cx="50" cy="74" rx="15" ry="12" fill="${M.c1}" stroke="${M.c2}" stroke-width="2"/>
       <circle cx="50" cy="48" r="24" fill="${M.c1}" stroke="${M.c2}" stroke-width="2.5"/>
       <ellipse cx="50" cy="53" rx="13" ry="10" fill="${M.belly}"/>
       ${eye(41,46,4.6)}${eye(59,46,4.6)}${cheeks(53)}${face(52)}`+E;
  }
  if(stage===1){ // 성장기 (몸+작은 날개+뿔)
    return S+
      mirror(wing(52))+
      `<path d="M50 84 Q40 82 44 74 Q50 78 50 84Z" fill="${M.c2}"/>`+
      crest(30)+
      `<ellipse cx="50" cy="62" rx="22" ry="23" fill="${M.c1}" stroke="${M.c2}" stroke-width="2.5"/>
       <ellipse cx="50" cy="66" rx="12" ry="14" fill="${M.belly}"/>
       <ellipse cx="50" cy="42" rx="18" ry="16" fill="${M.c1}" stroke="${M.c2}" stroke-width="2.5"/>
       ${eye(43,41,4.4)}${eye(57,41,4.4)}${cheeks(47)}${face(46)}`+E;
  }
  // 완전체 (큰 날개 펼침, 위엄) — 정면 마스코트
  return S+
    mirror(wing(46))+
    `<path d="M50 90 Q36 86 42 74 Q50 80 50 90Z" fill="${M.c2}"/>
     <ellipse cx="38" cy="90" rx="8" ry="4.5" fill="${M.c2}"/><ellipse cx="62" cy="90" rx="8" ry="4.5" fill="${M.c2}"/>
     <ellipse cx="50" cy="64" rx="26" ry="26" fill="${M.c1}" stroke="${M.c2}" stroke-width="3"/>
     <ellipse cx="50" cy="68" rx="15" ry="17" fill="${M.belly}"/>
     <path d="M40 58 L44 64 M50 58 L50 66 M60 58 L56 64" stroke="${M.accent}" stroke-width="1.6" fill="none" opacity=".7"/>`+

// 10단계 진화 — 주간 XP 기준 (완료 1개=20XP, 공부 1분=1XP)
const MON_STAGE_XP=[0,80,180,320,500,720,980,1280,1620,2000];
const MON_LV_XP=120;
const STAGE_LABEL=["1단계","2단계","3단계","4단계","5단계","6단계","7단계","8단계","9단계","10단계"];
const MON_MAX_STAGE=MON_STAGE_XP.length-1;
function stageOfXP(xp){
  let s=0;
  for(let i=0;i<MON_STAGE_XP.length;i++){ if(xp>=MON_STAGE_XP[i]) s=i; }
  return s;
}
function monsterCalc(count,min){
  const xp=(Number(count)||0)*20+(Number(min)||0);
  const stage=stageOfXP(xp);
  const level=Math.floor(xp/MON_LV_XP)+1;
  const nextLv=level*MON_LV_XP, prevLv=(level-1)*MON_LV_XP;
  const pct=Math.min(100,Math.round((xp-prevLv)/(nextLv-prevLv)*100));
  const toStage = stage<MON_MAX_STAGE? MON_STAGE_XP[stage+1]-xp : 0;
  // 단계 진행률(다음 단계까지)
  const sPrev=MON_STAGE_XP[stage], sNext=stage<MON_MAX_STAGE?MON_STAGE_XP[stage+1]:sPrev;
  const stagePct = stage<MON_MAX_STAGE? Math.min(100,Math.round((xp-sPrev)/(sNext-sPrev)*100)) : 100;
  return {xp,stage,level,pct,toNext:nextLv-xp,toStage,stagePct};
}

const MON_ROW={water:"a",earth:"b",air:"c"};

const MON_IMG_BASE="";

// 이미지가 있으면 <img>, 로드 실패 시 자동으로 오리지널 SVG로 대체
// (기본 SVG는 3형태이므로 10단계를 3구간으로 매핑해 폴백)
function svgStageOf(stage){ return stage<=2?0 : stage<=6?1 : 2; }
function monArt(species,stage,size){
  // 인라인 onerror 안에 들어가므로 줄바꿈·따옴표를 정리 (줄바꿈이 있으면 스크립트 오류로 이미지가 깨짐)

function monMessage(stage,toStage){
  if(stage>=MON_MAX_STAGE) return `최종 ${MON_MAX_STAGE+1}단계 달성! 이번 주 최고예요 🏆`;
  return `이번 주 ${stage+1}단계 · ${toStage}XP 더 모으면 ${stage+2}단계 (완료 1개=20XP, 공부 1분=1XP)`;

function monGainCheck(prev, next){
  if(!(next.done && !(prev&&prev.done))) return;
  const days=charWeekDays();
  if(!days.includes(next.date)) return; // 이번 주(월~일) 학습만 성장에 반영
  const uid=state.ownerUid;
  const tot=state.monTotals[uid]; if(!tot || tot.week!==days[0]) return;

  tot.count+=1; tot.min+=creditedMin(next);

  if(after.stage>before.stage) setTimeout(()=>toast(`✨ ${M.name} ${after.stage+1}단계로 진화!`,"cheer"),700);

}

/* ============================================================
 *  ② 주간 마감 리포트 — 이번 주 한 페이지 요약
 * ============================================================ */
function weeklySummary(tasks, days, cats, crit){
  const wk=tasks.filter(t=>days.includes(t.date));
  const done=wk.filter(t=>t.done);
  const r=computeAllowance(tasks, days, crit);
  const goalMin=days.reduce((a,ds)=>a+dayTypeGoal(ds),0);
  // 과목별 집계
  const bySub={};
  (cats.subjects||[]).forEach(s=>bySub[s.id]={s, min:0, planned:0, done:0, units:[]});
  wk.forEach(t=>{
    const b=bySub[t.subjectId]; if(!b) return;
    b.planned++;
    if(t.done){ b.done++; b.min+=creditedMin(t); const u=(t.unit||"").trim(); if(u&&!b.units.includes(u)) b.units.push(u); }
  });
  const subs=Object.values(bySub).filter(b=>b.planned>0||b.min>0).sort((a,b)=>b.min-a.min);
  // 부족한 과목: 계획했으나 이행률 70% 미만 또는 아예 학습 안 한 과목
  const weak=subs.filter(b=>b.planned>0 && (b.done/b.planned)<0.7);
  const untouched=(cats.subjects||[]).filter(s=>!bySub[s.id]||bySub[s.id].planned===0);
  // 요일별 학습시간
  const byDay=days.map(ds=>({ds, min:done.filter(t=>t.date===ds).reduce((a,t)=>a+creditedMin(t),0), type:effDayType(ds)}));
  return {r, goalMin, subs, weak, untouched, byDay, doneCount:done.length, planCount:wk.length};
}

function examList(){ return state.settings.exams||[]; }
// 해당 날짜가 시험 대비 기간에 속하면 그 시험 정보 반환
function examFor(ds){
  for(const e of examList()){
    if(!e||!e.date) continue;
    const start=fmt(addDays(parseD(e.date), -(Number(e.prepDays)||14)));
    if(ds>=start && ds<=e.date) return e;
  }
  return null;
}
function examDday(e, from){
  return Math.round((parseD(e.date)-parseD(from||fmt(new Date())))/86400000);
}

/* ============================================================
 *  ⑤ 약한 과목 자동 감지 (최근 4주 추세)
 * ============================================================ */
function weakSubjects(tasks, cats, weeks){
  const n=weeks||4;
  const today=new Date();
  const from=fmt(addDays(startOfWeek(today), -7*(n-1)));
  const recent=tasks.filter(t=>t.date>=from && t.date<=fmt(addDays(today,0)));
  const map={};
  (cats.subjects||[]).forEach(s=>map[s.id]={s, planned:0, done:0, min:0});
  recent.forEach(t=>{
    const b=map[t.subjectId]; if(!b) return;
    b.planned++; if(t.done){ b.done++; b.min+=creditedMin(t); }
  });
  const rows=Object.values(map);
  const active=rows.filter(b=>b.planned>0);
  const avgMin=active.length? active.reduce((a,b)=>a+b.min,0)/active.length : 0;
  const weak=active.filter(b=>{
    const ip=b.done/b.planned;
    return ip<0.7 || (avgMin>0 && b.min < avgMin*0.5);
  }).sort((a,b)=>a.min-b.min);
  const never=rows.filter(b=>b.planned===0);
  return {weak, never, avgMin, weeks:n};
}

  if(!names.length) return "";

/* ============================================================
 *  ⑥ 스트릭 보호 / 회복 미션
 * ============================================================ */
function streakInfo(tasks){
  const doneDays=new Set(tasks.filter(t=>t.done).map(t=>t.date));
  const today=new Date();
  let streak=0;
  for(let i=0;i<400;i++){
    const ds=fmt(addDays(today,-i));
    if(doneDays.has(ds)) streak++;
    else if(i===0) continue;           // 오늘은 아직 안 했을 수 있음
    else break;
  }
  // 어제 학습을 놓쳤는지(회복 미션 대상)
  const yst=fmt(addDays(today,-1));
  const missedYesterday=!doneDays.has(yst);
  // 어제를 제외하고 그 이전 연속 기록
  let prev=0;
  for(let i=2;i<400;i++){
    const ds=fmt(addDays(today,-i));
    if(doneDays.has(ds)) prev++; else break;
  }
  return {streak, missedYesterday, prevStreak:prev, doneToday:doneDays.has(fmt(today))};
}

  const s=state.streakCache;
  if(!s) return "";
  if(s.missedYesterday && s.prevStreak>=2 && !s.doneToday){

}

/* ============================================================
 *  ⑦ 주차별 학습 이력 (아카이브)
 * ============================================================ */
function weekIdOf(ds){ return fmt(startOfWeek(parseD(ds))); }   // 그 주 월요일
function weekRangeLabel(monday){
  const s=parseD(monday), e=addDays(s,6);
  return `${s.getMonth()+1}.${s.getDate()}~${e.getMonth()+1}.${e.getDate()}`;
}
// 전체 학습을 주차별로 묶어 요약
function groupByWeek(tasks, cats){
  const subMap={}; (cats.subjects||[]).forEach(s=>subMap[s.id]=s);
  const weeks={};
  tasks.forEach(t=>{
    if(!t.date) return;
    const wid=weekIdOf(t.date);
    const w=(weeks[wid]=weeks[wid]||{wid, planned:0, done:0, min:0, days:new Set(), subs:{}, units:[]});
    w.planned++;
    if(t.done){
      w.done++; w.min+=creditedMin(t); w.days.add(t.date);
      const s=subMap[t.subjectId];
      if(s){
        const b=(w.subs[t.subjectId]=w.subs[t.subjectId]||{s, min:0, count:0, units:[]});
        b.min+=creditedMin(t); b.count++;
        const u=(t.unit||"").trim();
        if(u && !b.units.includes(u)) b.units.push(u);
        if(u && !w.units.includes(u)) w.units.push(u);
      }
    }
  });
  return Object.values(weeks).map(w=>({
    ...w, dayCount:w.days.size, label:weekRangeLabel(w.wid),
    subList:Object.values(w.subs).sort((a,b)=>b.min-a.min),
  })).sort((a,b)=>a.wid<b.wid?1:-1);   // 최신 주차부터
}
// 월 단위로 묶기
function groupByMonth(tasks, cats){
  const subMap={}; (cats.subjects||[]).forEach(s=>subMap[s.id]=s);
  const months={};
  tasks.forEach(t=>{
    if(!t.date) return;
    const mid=t.date.slice(0,7);
    const m=(months[mid]=months[mid]||{mid, planned:0, done:0, min:0, days:new Set(), subs:{}, weeks:new Set()});
    m.planned++;
    if(t.done){
      m.done++; m.min+=creditedMin(t); m.days.add(t.date); m.weeks.add(weekIdOf(t.date));
      const s=subMap[t.subjectId];
      if(s){
        const b=(m.subs[t.subjectId]=m.subs[t.subjectId]||{s, min:0, count:0, units:[]});
        b.min+=creditedMin(t); b.count++;
        const u=(t.unit||"").trim();
        if(u && !b.units.includes(u)) b.units.push(u);
      }
    }
  });
  return Object.values(months).map(m=>({
    ...m, dayCount:m.days.size, weekCount:m.weeks.size,
    label:`${Number(m.mid.slice(0,4))}년 ${Number(m.mid.slice(5,7))}월`,
    subList:Object.values(m.subs).sort((a,b)=>b.min-a.min),
  })).sort((a,b)=>a.mid<b.mid?1:-1);
}

/* ============================================================
 *  ⑧ 외부 학습앱 연동 (천문장 트레이너 · MD 중학영단어)
 *  - 같은 Firebase 프로젝트의 shares/{코드}, links/{코드} 를 읽어옴
 *  - 학습량을 분(分)으로 환산해 플래너 학습시간·용돈에 반영
 *  - 편법 방지: 앱별/전체 일일 인정 상한, 학습일수·복기 점수에는 미반영
 * ============================================================ */
/* ------------------------------------------------------------
 *  학습앱 통합 (천문장 · MD영단어 · 그래머 인사이드)
 *  통합 DB: 세 앱 모두 플래너와 같은 계정으로 planner/{uid}/apps/{doc}에 기록을 저장합니다.
 *  플래너는 연결 코드 없이 그 문서를 바로 읽어 날짜별 학습시간으로 인정합니다.
 * ------------------------------------------------------------ */
const EXT_APPS={
  sentence:{ id:"sentence", doc:"sentence", name:"천문장 트레이너", short:"천문장", emo:"📘", page:"apps/sentence.html",
    color:"#3E6FE0", soft:"#EAF0FF", desc:"문장 학습 1개 = 1.5분" },
  vocab:{ id:"vocab", doc:"words", name:"MD 중학영단어", short:"영단어", emo:"🔤", page:"apps/words.html",
    color:"#0E9F6E", soft:"#E4F5EC", desc:"신규 단어 1개 = 1분, 복습 1개 = 0.5분" },
  grammar:{ id:"grammar", doc:"grammar", name:"그래머 인사이드", short:"문법", emo:"📗", page:"apps/grammar.html",
    color:"#E0A100", soft:"#FFF6C4", desc:"앱이 잰 집중 학습 1분 = 1분" },
};
function extConf(){
  const d={ enabled:true, minPerSentence:1.5, minPerNewWord:1, minPerRevWord:0.5, grammarRate:1,
            dailyCapPerApp:30, dailyCapTotal:60, countInAllowance:true };
  return {...d, ...(state.settings.extApps||{})};
}
const num=v=>Number(v)||0;
// 앱 문서 → {sum:화면 요약, days:{'YYYY-MM-DD':{…}}}
function extNormalize(kind, d){
  if(!d) return null;
  const today=fmt(new Date()), days={};
  if(kind==="sentence"){
    Object.entries(d.dayLog||{}).forEach(([ds,n])=>{ days[ds]={n:num(n)}; });
    if(d.todayDate && num(d.todayCount)) days[d.todayDate]={n:Math.max(num(d.todayCount),(days[d.todayDate]||{}).n||0)};
    const s=d.summary||{};
    return {days, sum:{today:(days[today]||{}).n||0, goal:num(d.goal||s.goal)||8, streak:num(d.streak),
      mastered:num(s.mastered), total:num(s.total), pct:num(s.pct), weak:num(s.weakCount), pts:num(d.pts), updated:num(d.updated)}};
  }
  if(kind==="vocab"){
    const st=d.state||{}, s=d.summary||{};
    Object.entries(st.log||{}).forEach(([ds,l])=>{ days[ds]={new:num(l&&l.new), rev:num(l&&l.rev), correct:num(l&&l.correct), total:num(l&&l.total)}; });
    const t=days[today]||{};
    return {days, sum:{todayNew:t.new||0, todayRev:t.rev||0, streak:num(st.streak||s.streak), mastered:num(s.mastered), intro:num(s.intro),
      points:num(st.points||s.points), newPerDay:num(st.settings&&st.settings.newPerDay)||20, total:1800, updated:num(d.updated)}};
  }
  // grammar
  Object.entries(d.dayLog||{}).forEach(([ds,l])=>{ days[ds]={sec:num(l&&l.sec), answered:num(l&&l.answered), correct:num(l&&l.correct), cards:num(l&&l.cards)}; });
  const x=d.daily;
  if(x && x.date) days[x.date]={sec:num(x.activeSec), answered:num(x.answered), correct:num(x.correct), cards:num(x.cards)};
  const s=d.summary||{}, t=days[today]||{};
  return {days, sum:{todayMin:Math.round((t.sec||0)/60), answered:t.answered||0, correct:t.correct||0, cards:t.cards||0,
    done:num(s.done), total:num(s.total), pts:num(d.pts), streak:num(d.streak), updated:num(d.updatedAt)}};
}
// 한 앱의 하루 인정 시간(분) — 앱별 일일 상한 적용
function extDayMin(kind, day){
  if(!day) return 0;
  const c=extConf(); let m=0;
  if(kind==="sentence") m=num(day.n)*c.minPerSentence;
  else if(kind==="vocab") m=num(day.new)*c.minPerNewWord + num(day.rev)*c.minPerRevWord;
  else m=num(day.sec)/60*c.grammarRate;
  return Math.min(Math.round(m), c.dailyCapPerApp);
}
// uid 학생의 세 앱 기록을 읽어 정리 (캐시 없이)
async function fetchExtData(uid){
  const out={};
  await Promise.all(Object.keys(EXT_APPS).map(async k=>{
    try{
      const doc=await db.collection("planner").doc(uid).collection("apps").doc(EXT_APPS[k].doc).get();
      out[k]=doc.exists? extNormalize(k, doc.data()) : null;
    }catch(e){ console.error("학습앱 기록", k, e); out[k]=null; }
  }));
  return out;
}
// 지금 보고 있는 플래너 주인의 기록 (state.extCache)
async function loadExtAll(){
  const uid=state.ownerUid;
  const data=await fetchExtData(uid);
  if(uid===state.ownerUid) state.extCache={uid, at:Date.now(), data};
  return data;
}
async function ensureExt(){
  if(state.extCache && state.extCache.uid===state.ownerUid) return state.extCache.data;
  return loadExtAll();
}
function extData(){ return (state.extCache && state.extCache.uid===state.ownerUid)? state.extCache.data : {}; }
// 하루 인정 시간: 앱별 상한 → 전체 상한
function extCreditedOn(ds, data){
  const c=extConf(), d=data||extData(), per={};
  if(!c.enabled) return {total:0, per, raw:0};
  let sum=0;
  Object.keys(EXT_APPS).forEach(k=>{ const m=extDayMin(k, d[k]&&d[k].days[ds]); per[k]=m; sum+=m; });
  return {total:Math.min(sum, c.dailyCapTotal), per, raw:sum};
}
function extCreditedToday(){ return extCreditedOn(fmt(new Date())); }
// 주간 인정 시간(용돈 학습시간 지표에 가산)
function extWeekMin(days, data){
  const c=extConf();
  if(!c.enabled || !c.countInAllowance) return 0;
  return (days||[]).reduce((a,ds)=>a+extCreditedOn(ds, data).total, 0);
}
async function saveExtConf(key, val){

/* ----- 비밀번호 변경 (로그인 상태) ----- */
async function changePassword(){
  const curPw=prompt("현재 비밀번호를 입력하세요:");
  if(!curPw) return;
  try{
    const cred=firebase.auth.EmailAuthProvider.credential(state.user.email, curPw);
    await state.user.reauthenticateWithCredential(cred);
  }catch(e){ console.error(e); alert("현재 비밀번호 확인 실패: "+authMessage(e.code)); return; }
  const np=(prompt("새 비밀번호를 입력하세요 (6자 이상):")||"");
  if(!np) return;
  if(np.length<6){ alert("비밀번호는 6자 이상이어야 합니다."); return; }
  const np2=prompt("새 비밀번호를 한 번 더 입력하세요:");
  if(np!==np2){ alert("새 비밀번호가 일치하지 않습니다."); return; }
  try{
    await state.user.updatePassword(np);
    alert("비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용하세요.");
  }catch(e){ console.error(e); alert("비밀번호 변경 실패: "+authMessage(e.code)); }
}

/* ----- 회원 탈퇴 (계정 + 데이터 영구 삭제) ----- */
async function deleteAllDocs(collRef){
  const snap=await collRef.get();
  const docs=snap.docs;
  for(let i=0;i<docs.length;i+=400){
    const batch=db.batch();
    docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
}
async function purgeUserData(uid, linkCode, isParent){
  for(const s of ["tasks","payouts","weekcaps","meta","apps","diary","daygoals","daytypes","certs","coupons"]){
    try{ await deleteAllDocs(db.collection("planner").doc(uid).collection(s)); }catch(e){ console.error("purge",s,e); }
  }
  if(isParent){ try{ await deleteAllDocs(db.collection("links").doc(uid).collection("children")); }catch(e){ console.error(e); } }
  if(linkCode){ try{ await db.collection("codes").doc(linkCode).delete(); }catch(_){} }
  try{ await deleteAllDocs(db.collection("familyRequests").where("fromUid","==",uid)); }catch(e){ console.error("purge familyRequests", e); }
  try{ await db.collection("planner").doc(uid).delete(); }catch(_){}
  try{ await db.collection("users").doc(uid).delete(); }catch(e){ console.error(e); }
}
async function deleteAccount(){
  if(state.viewingChild){ alert("자녀 플래너 열람 중에는 탈퇴할 수 없습니다. 상단 '내 플래너로'로 돌아간 뒤 다시 시도하세요."); return; }
  if(!confirm("정말 탈퇴하시겠어요?\n\n모든 학습 계획·이행 기록·용돈 내역이 영구 삭제되며 되돌릴 수 없습니다.")) return;
  const pw=prompt("보안을 위해 비밀번호를 다시 입력하세요:");
  if(!pw) return;
  try{
    const cred=firebase.auth.EmailAuthProvider.credential(state.user.email, pw);
    await state.user.reauthenticateWithCredential(cred);
  }catch(e){ console.error(e); alert("비밀번호 확인 실패: "+authMessage(e.code)); return; }
  if(!confirm("최종 확인 — 계정과 모든 데이터를 삭제합니다. 진행할까요?")) return;
  try{
    if(state._taskUnsub) state._taskUnsub();
    if(state._catUnsub) state._catUnsub();
    await purgeUserData(state.user.uid, state.profile.linkCode, state.profile.role==="parent");
    await state.user.delete(); // onAuthStateChanged(null) → 로그인 화면 전환
    alert("탈퇴가 완료되었습니다.");
  }catch(e){ console.error(e); alert("탈퇴 처리 중 오류가 발생했습니다: "+((e&&e.message)||e)); }
}

function boot(){
  // file:// 로 직접 열면 브라우저 저장소/네트워크 제약으로 로그인이 실패할 수 있음
  if(location.protocol==="file:"){
    const w=document.getElementById("cfgWarn");
    w.classList.remove("hidden");
    w.innerHTML="⚠️ 파일을 <b>file://</b> 로 직접 열면 로그인이 되지 않을 수 있습니다. 로컬 서버(예: 터미널에서 <code>python -m http.server</code> 후 <code>http://localhost:8000</code>)나 Firebase Hosting 주소(https)로 여세요.";
  }
  if(!CONFIGURED){
    const w=document.getElementById("cfgWarn");
    w.classList.remove("hidden");
    if(location.protocol!=="file:") w.innerHTML="⚙️ Firebase 설정이 아직 입력되지 않았습니다. 설정 가이드를 보고 이 파일 상단의 <code>firebaseConfig</code>를 채운 뒤 다시 여세요.";
    return;
  }
  auth.onAuthStateChanged(async (user)=>{
    const btn=document.getElementById("authBtn"); if(btn) btn.disabled=false;
    if(!user){ showApp(false); return; }
    state.user=user;
    try{
      // 프로필 로드 (없으면 생성: 회원가입 정보 우선)
      let pdoc=await db.collection("users").doc(user.uid).get();
      if(!pdoc.exists){
        const info = pendingSignup || {name:(user.email||"사용자").split("@")[0], role:"child"};
        pendingSignup=null;
        await db.collection("users").doc(user.uid).set({name:info.name, role:info.role, email:(user.email||"").toLowerCase(), createdAt:Date.now()});
        pdoc=await db.collection("users").doc(user.uid).get();
      }
      state.profile=pdoc.data();
      if(user.email && state.profile.email!==user.email.toLowerCase()){
        db.collection("users").doc(user.uid).set({email:user.email.toLowerCase()},{merge:true}).catch(()=>{});
      }
    }catch(e){
      console.error("프로필 로드/생성 실패", e);
      // 로그인은 되었으나 DB 접근 실패 → 폴백 프로필로 화면은 띄우되 원인을 안내
      state.profile = state.profile || {name:(user.email||"사용자").split("@")[0], role:(pendingSignup&&pendingSignup.role)||"child"};
      alert("로그인은 되었지만 데이터 연결에 실패했습니다.\n\n"+firestoreDiag(e)+"\n\n원인을 해결한 뒤 새로고침하세요.");
    }
    state.ownerUid=user.uid; state.ownerName=state.profile.name; state.ownerRole=state.profile.role;
    state.viewingChild=false;
    // 일요일 18시 마감 이후면 다음 주 계획 모드로 시작
    if(weekPhase().phase==="planning"){ state.cursor=activeWeekStart(new Date()); state.tab="plan"; state.view="week"; }
    try{ await loadChildren(); }catch(e){ console.error("자녀 로드 실패", e); }
    showApp(true);
    checkFamilyRequests();
    focusLoad();
    if(location.hash==="#family"){ history.replaceState(null,"",location.pathname); setTimeout(drawFamily,300); }
    renderHeader();
    subscribeCategories();
    subscribeTasks();
  });
}
function showApp(on){
  document.getElementById("auth").classList.toggle("hidden", on);
  document.getElementById("app").classList.toggle("hidden", !on);
}
async function loadChildren(){
  state.children=[];
  if(state.profile.role!=="parent") return;
  await Family.syncLinks(db, state.user, state.profile);   // 자녀가 승인한 신청 → 연결
  const snap=await db.collection("links").doc(state.user.uid).collection("children").get();
  const rows=[];
  for(let i=0;i<snap.docs.length;i++){
    const d=snap.docs[i], data=d.data();
