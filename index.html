    return ["BEGIN:VEVENT",`UID:${t.id}@nogang`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${icsDT(t.date)}`,`DTEND;VALUE=DATE:${icsDT(fmt(addDays(parseD(t.date),1)))}`,
      `SUMMARY:${icsEsc(`${su?su.name+" · ":""}${t.unit||""}`)}`,`DESCRIPTION:${icsEsc(`${p.name} · ${t.plannedMin||30}분`)}`,"END:VEVENT"].join("\r\n"); });
  if(p.kind==="exam") ev.push(["BEGIN:VEVENT",`UID:exam-${p.id}@nogang`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${icsDT(p.end)}`,`DTEND;VALUE=DATE:${icsDT(fmt(addDays(parseD(p.end),1)))}`,`SUMMARY:${icsEsc("📝 "+p.name)}`,"END:VEVENT"].join("\r\n"));

async function asRule(t){

function parseDateK(s){
  s=String(s||"").trim(); const now=new Date(); let y, m, d;
  let x=s.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/); if(x){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=s.match(/(\d{1,2})\s*(?:월|\/|\.|-)\s*(\d{1,2})/))){ m=+x[1]; d=+x[2]; y=now.getFullYear(); if(fmt(new Date(y,m-1,d))<fmt(now)) y++; }
  else if((x=s.match(/(\d+)\s*(일|주)\s*(뒤|후)/))){ return fmt(addDays(now, +x[1]*(x[2]==="주"?7:1))); }
  else return null;
  const dt=new Date(y,m-1,d); return isNaN(dt)? null : fmt(dt);
}

/* ⚖️ 하루 분량 맞추기 (계획표 할 일만 옮겨요) */
async function asBalance(){
  const days=Array.from({length:14},(_,i)=>fmt(addDays(new Date(),i)));
  const T=(await asTasksRange(days[0], days[13])).filter(t=>!t.done);
  const load={}; days.forEach(d=>load[d]=0); T.forEach(t=>load[t.date]=(load[t.date]||0)+(Number(t.plannedMin)||0));
  const goal={}; days.forEach(d=>goal[d]=dayTypeGoal(d)||120);
  const rowOf={}; (state.plans||[]).forEach(p=>(p.rows||[]).forEach(r=>rowOf[p.id+"/"+r.id]=r));
  const moves=[];
  days.forEach((d,i)=>{
    let over=load[d]-goal[d]; if(over<=30) return;
    const mv=T.filter(t=>t.date===d && t.planId).sort((a,b)=>(b.plannedMin||0)-(a.plannedMin||0));
    for(const t of mv){ if(over<=30) break;
      const r=rowOf[t.planId+"/"+t.planRow], m=Number(t.plannedMin)||30;
      const to=days.slice(i+1).find(x=>load[x]+m<=goal[x] && (!r || (r.days||[]).includes(parseD(x).getDay())));
      if(!to) continue; moves.push({t, to}); load[d]-=m; load[to]+=m; over-=m; t.date=to; }
  });
  const heavy=days.filter(d=>load[d]-goal[d]>30), light=days.filter(d=>load[d]>0 && goal[d]-load[d]>60);
  if(!moves.length) return asBot(`⚖️ 2주 동안 옮길 만한 계획이 없어요.${heavy.length? `<br>여전히 많은 날: ${heavy.map(d=>`${d.slice(5).replace("-","/")}(${load[d]}분/${goal[d]}분)`).join(", ")} — 목표 시간을 늘리거나 계획을 줄여 보세요.` : " 하루 분량이 고르게 잘 맞아요 👍"}`, AS_HELP);
  AS.pend={kind:"balance", moves};
  asBot(`⚖️ 목표 시간보다 많은 날의 계획표 할 일 <b>${moves.length}개</b>를 여유 있는 날로 옮길게요.<br>${moves.slice(0,12).map(x=>{ const s=subjById(x.t.subjectId); return `· ${esc(s?s.name:"")} ${esc(x.t.unit||"")} → <b>${x.to.slice(5).replace("-","/")}</b>`; }).join("<br>")}${moves.length>12? `<br>… 외 ${moves.length-12}개` : ""}`,
    [["✅ 적용","적용"],["취소","취소"]]);
}

async function aiUndo(id){

const AI_SCHEMA={type:"object", additionalProperties:false, required:["reply","add","update","remove"], properties:{
  reply:{type:"string"},
  add:{type:"array", items:{type:"object", additionalProperties:false, required:["date","subject","unit","minutes"], properties:{date:{type:"string"}, subject:{type:"string"}, unit:{type:"string"}, minutes:{type:"integer"}}}},
  update:{type:"array", items:{type:"object", additionalProperties:false, required:["id","date","unit","minutes"], properties:{id:{type:"string"}, date:{type:"string"}, unit:{type:"string"}, minutes:{type:"integer"}}}},
  remove:{type:"array", items:{type:"string"}}}};
async function aiContext(){
  const today=new Date(), from=fmt(addDays(today,-7)), to=fmt(addDays(today,42));
  const T=(await asTasksRange(from, to)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.order||0)-(b.order||0));
  const sn=id=>{ const s=subjById(id); return s? s.name : ""; };
  const days=Array.from({length:14},(_,i)=>fmt(addDays(today,i)));
  return {
    today:fmt(today), weekday:WD_FULL[today.getDay()], student:state.ownerName||"",
    subjects:(state.categories.subjects||[]).map(s=>s.name),
    textbooks:(state.categories.textbooks||[]).map(t=>`${sn(t.subjectId)}: ${t.name}`),
    dailyGoalMin:days.map(d=>`${d} ${WD[parseD(d).getDay()]} ${dayTypeGoal(d)}분`),
    timetable:ttList().map(b=>`${(b.days||[]).map(d=>WD[d]).join("")} ${b.s}-${b.e} ${b.title}`),
    exams:[...(state.plans||[]).filter(p=>p.kind==="exam").map(p=>`${p.name} ${p.end}`), ...examList().map(e=>`${e.name} ${e.date}`)],
    tasks:T.map(t=>`${t.id} | ${t.date} | ${sn(t.subjectId)} | ${t.unit||""} | ${t.plannedMin||0}분 | ${t.done?"완료":"예정"}${t.underStars!=null?` | 이해도 ${gradeTxt(t.underStars)}`:""}${t.help&&!t.helpOk?` | 질문: ${t.help}`:""}`)};
}
const AI_SYS=`너는 한국 중고등학생의 학습 매니저야. 부모님이나 학생과 대화하며 학생 플래너의 할 일을 짜고 정리해.
규칙:
- 계획에는 항상 구체적인 범위를 적어 (쪽수 p.10~15 · 단원 · 강 번호 · DAY 번호 · 문제 번호). "저번에 배운 단원 복습"처럼 막연하게 쓰지 마.
- 하루 분량은 dailyGoalMin 목표 시간에 맞춰 (±30분). 시간표(timetable)의 학원 · 과외 시간과 겹쳐 무리하지 않게.
- 완료된 할 일은 절대 수정 · 삭제하지 마. 수정 · 삭제는 context.tasks 에 있는 id만 써.
- subject 는 반드시 context.subjects 중 하나. date 는 YYYY-MM-DD, 오늘부터 60일 안. minutes 는 10~240.
- 바꿀 것이 없거나 질문만 받은 경우 add · update · remove 는 빈 배열.
- reply 는 한국어로 짧게: 무엇을 바꾸는지 요약 (몇 개 추가 · 수정 · 삭제, 하루 분량).
- 반드시 JSON 하나만 출력: {"reply": "...", "add": [{"date","subject","unit","minutes"}], "update": [{"id","date","unit","minutes"}], "remove": ["id"]}`;
const AI_SYS_KID=`
지금 대화 상대는 학생 본인이야 (부모님이 허용한 자녀 계정).
- 학습 계획 · 공부 방법 · 시간 관리 이야기만 해. 다른 주제(게임 · 연애 · 외모 · 위험한 행동 · 개인정보 등)는 짧고 친절하게 거절하고 공부 계획으로 돌아와.
- 숙제나 시험 답을 대신 써 주지 말고, 계획과 공부 순서만 도와줘.
- 이름 · 학교 · 주소 · 연락처 같은 개인정보를 묻거나 적지 마.
- 학생이 힘들다고 하면 분량을 줄이는 쪽을 먼저 제안하고, 걱정되는 내용이면 부모님이나 선생님께 이야기하라고 권해.
- 말투는 친근한 존댓말로.`;
async function aiCall(ctx, text){
  const SYS=AI_SYS+(AS.kid? AI_SYS_KID : "");
  const a=AS.ai, msgs=[...AS.hist.slice(-8), {role:"user", text:`[플래너 정보]\n${JSON.stringify(ctx)}\n\n[요청]\n${text}`}];
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST", headers:{"content-type":"application/json","x-api-key":a.key,"anthropic-version":"2026-10-21",
        "anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:a.model||AI_DEF.claude, max_tokens:16000, system:SYS, fallbacks:"default",
        output_config:{effort:"medium", format:{type:"json_schema", schema:AI_SCHEMA}},
        messages:msgs.map(m=>({role:m.role, content:m.text}))})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
    if(j.stop_reason==="refusal") throw new Error("AI가 이 요청을 처리하지 않았어요.");
    if(j.stop_reason==="max_tokens") throw new Error("답이 너무 길어 잘렸어요. 기간을 나눠서 요청해 주세요.");
    const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    return JSON.parse(txt);
  }
  const model=a.model||AI_DEF.gemini;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(a.key)}`,{method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]}, contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user", parts:[{text:m.text}]})),
      generationConfig:{responseMimeType:"application/json"}})});
  const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  const txt=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("");
  if(!txt) throw new Error("AI가 답을 주지 않았어요.");
  return JSON.parse(txt.replace(/^```(?:json)?\s*|\s*```$/g,""));
}
async function aiAsk(text){
  if(AS.kid){ const day=fmt(new Date()); let u={day, n:0}; try{ const d=await aiUseRef(state.user.uid).get(); if(d.exists && d.data().day===day) u=d.data(); }catch(_){}
    if(u.n>=AS.kid.daily) return asBot(`🤖 오늘은 AI를 ${AS.kid.daily}번 다 썼어요. 내일 다시 쓸 수 있어요.<br>그동안은 아래 기능을 써 보세요.`, AS_HELP);
    try{ await aiUseRef(state.user.uid).set({day, n:u.n+1, at:Date.now()}); }catch(_){} }
  AS.busy=true; asDraw();
  let out; const ctx=await aiContext();
  try{ out=await aiCall(ctx, text); }
  catch(e){ AS.busy=false; console.warn("AI", e); return asBot(`🤖 AI 연결 오류: ${esc(e.message||e)}<br>키 · 모델 이름을 확인해 주세요.`, [["⚙️ AI 설정","AI 설정"],["처음으로","도움"]]); }
  AS.busy=false;
  AS.hist.push({role:"user", text}, {role:"assistant", text:JSON.stringify({reply:out.reply})});
  // 검사
  const subs=state.categories.subjects||[], known=new Set(ctx.tasks.map(l=>l.split(" | ")[0]));
  const doneIds=new Set(ctx.tasks.filter(l=>l.includes("| 완료")).map(l=>l.split(" | ")[0]));
  const today=fmt(new Date()), last=fmt(addDays(new Date(),60)), okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d) && d>=today && d<=last;
  const add=(out.add||[]).filter(x=>okDate(x.date) && subs.some(s=>s.name===x.subject) && String(x.unit||"").trim()).map(x=>({...x, minutes:Math.max(10,Math.min(240,Number(x.minutes)||30))}));
  const update=(out.update||[]).filter(x=>known.has(x.id) && !doneIds.has(x.id) && okDate(x.date));
  const remove=(out.remove||[]).filter(id=>known.has(id) && !doneIds.has(id));
  const dropped=(out.add||[]).length-add.length+(out.update||[]).length-update.length+(out.remove||[]).length-remove.length;
  if(!add.length && !update.length && !remove.length) return asBot(`🤖 ${asEsc(out.reply||"")}${dropped? `<br><small>(규칙에 맞지 않는 제안 ${dropped}개는 뺐어요)</small>` : ""}`);
  AS.pend={kind:"ai", add, update, remove};
  const line=(d,s,u,m)=>`${d.slice(5).replace("-","/")} <b>${esc(s)}</b> ${esc(u)} · ${m}분`;
  asBot(`🤖 ${asEsc(out.reply||"")}<div class="as-prev">
      ${add.length? `<div class="ap-h">➕ 추가 ${add.length}개</div>${add.slice(0,15).map(x=>`<div>${line(x.date,x.subject,x.unit,x.minutes)}</div>`).join("")}${add.length>15?`<div>… 외 ${add.length-15}개</div>`:""}` : ""}
      ${update.length? `<div class="ap-h">✏️ 수정 ${update.length}개</div>${update.slice(0,10).map(x=>`<div>${line(x.date,"",x.unit,x.minutes)}</div>`).join("")}` : ""}
      ${remove.length? `<div class="ap-h">🗑 삭제 ${remove.length}개</div>` : ""}
      ${dropped? `<div><small>규칙에 맞지 않는 제안 ${dropped}개는 뺐어요 (완료한 것 · 날짜 · 과목 오류)</small></div>` : ""}</div>`,
    [["✅ 적용","적용"],["취소","취소"]]);
}
async function aiApply(){
  const P=AS.pend; AS.pend=null;
  if(P.remove.length>=20 && !confirm(`할 일 ${P.remove.length}개를 지워요. 적용할까요?`)) return asBot("적용하지 않았어요.");
  const col=plannerRef().collection("tasks"), subs=state.categories.subjects||[], logId=Date.now().toString(36)+"a";
  const by=(state.viewingChild && state.profile.role==="parent")? {uid:state.user.uid, name:state.profile.name||"부모님"} : null;
  const added=[], removed=[], updated=[]; let ops=[];
  P.add.forEach((x,i)=>{ const id=`ai-${logId}-${i}`, s=subs.find(z=>z.name===x.subject); added.push(id);
    ops.push(b=>b.set(col.doc(id), {id, date:x.date, subjectId:s?s.id:"", unit:x.unit, plannedMin:x.minutes, done:false, order:Date.now()+i, byAI:logId, ...(by?{byParent:by}:{})})); });
  for(const x of P.update){ const d=await col.doc(x.id).get(); if(!d.exists) continue; const o=d.data(); updated.push({id:x.id, before:{date:o.date, unit:o.unit||"", plannedMin:o.plannedMin||0}});
    ops.push(b=>b.update(col.doc(x.id), {date:x.date, unit:x.unit, plannedMin:Math.max(10,Math.min(240,Number(x.minutes)||o.plannedMin||30)), byAI:logId})); }
  for(const id of P.remove){ const d=await col.doc(id).get(); if(!d.exists || d.data().done) continue; removed.push(d.data()); ops.push(b=>b.delete(col.doc(id))); }
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
  try{ await plannerRef().collection("aiLog").doc(logId).set(JSON.parse(JSON.stringify({src:AS.ai.provider, summary:`AI: 추가 ${added.length} · 수정 ${updated.length} · 삭제 ${removed.length}`, added, removed, updated, at:Date.now(), by:state.user.uid, byName:state.profile.name||""}))); }catch(e){ console.warn(e); }
  subscribeTasks();
  asBot(`✅ 적용했어요: 추가 ${added.length} · 수정 ${updated.length} · 삭제 ${removed.length}`, [["↩ 되돌리기",`되돌리기 ${logId}`],["📋 이번 주 점검","이번 주 점검"]]);
}

/* ============================================================
 *  🔎 학습 점검 — "정말 알았나?" 확인하기
 *  ① 스스로 점검: 완료 창에서 공부 방법에 맞는 점검 (단어 · 문제 → 맞은 수, 인강 · 개념 → 한 줄 요약)
 *      정답률로 이해도(S~F)를 자동으로 매기고, C · F면 복습 자동
 *  ② AI 점검 (🧭 도우미 · AI 연결 시): 🧑‍🏫 설명해 보기(빠진 부분 · 꼬리 질문) · 📝 미니 퀴즈 3문제 → 채점
 *  ③ 부모 점검 (매니저 확인): 그날 완료한 학습을 모아 ✓ 잘했어 · △ 다시 보기 · ✗ 다시 하기 + 한마디
 *  task.check = {type, correct, total, wrong, summary, ai:{mode, score, max, weak, at}} · task.mgr = {mark, note, by, at}
 * ============================================================ */
function checkType(t){
  const m=t.method||"", txt=`${t.unit||""} ${(tbById(t.textbookId)||{}).name||""}`;
  if(/암기/.test(m) || /단어|voca|DAY\s*\d|어휘/i.test(txt)) return "word";
  if(/문제|오답/.test(m) || /문제|기출|모의고사|오답/.test(txt)) return "problem";
  if(/인강/.test(m) || /\d+\s*강|인강|강의/.test(txt)) return "lecture";
  return "concept";
}
const CHECK_Q={word:"📝 단어 테스트 — 몇 개 중 몇 개 맞았어요?", problem:"✍️ 문제 — 몇 문제 중 몇 개 맞았어요? (틀린 번호도)", lecture:"📺 오늘 강의를 한 줄로 요약하면?", concept:"🧠 핵심 개념을 짧게 적어 보세요 (2~3개)"};
const pctGrade=p=>p>=1? 5 : p>=0.85? 4 : p>=0.7? 3 : p>=0.5? 2 : 1;
function checkHTML(d, t){

      : `<div class="tm-area mic-wrap"><input class="inp" id="ckSum" maxlength="120" value="${esc(c.summary||"")}" placeholder="${ty==="lecture"?"예: 이차방정식 근의 공식 유도와 판별식":"예: 관계대명사 who/which · 계속적 용법"}" oninput="doneDraft.check={...(doneDraft.check||{}),summary:this.value}">${micBtn("ckSum")}</div>`}

// 완료 저장 때 점검 결과 반영
function checkApply(d, t, extra){
  const c=d.check; if(!c) return;
  const ty=checkType(t), out={type:ty, at:Date.now()};
  if(ty==="word"||ty==="problem"){ const a=Number(c.correct), b=Number(c.total);
    if(b>0 && a>=0 && a<=b){ out.correct=a; out.total=b; if(c.wrong) out.wrong=String(c.wrong).slice(0,60);
      const g=pctGrade(a/b); if(extra.underStars==null || g<extra.underStars) extra.underStars=g; } else return; }
  else { const s=String(c.summary||"").trim(); if(!s) return; out.summary=s.slice(0,120); if(!String(t.understood||"").trim()) extra.understood=out.summary; }
  extra.check=out;
}

async function aiJSON(sys, text, schema){
  const a=AS.ai, SYS=sys+(AS.kid? AI_SYS_KID : "");
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST", headers:{"content-type":"application/json","x-api-key":a.key,"anthropic-version":"2026-10-21",
        "anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:a.model||AI_DEF.claude, max_tokens:8000, system:SYS, fallbacks:"default",
        output_config:{effort:"low", format:{type:"json_schema", schema}}, messages:[{role:"user", content:text}]})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
    if(j.stop_reason==="refusal") throw new Error("AI가 이 요청을 처리하지 않았어요.");
    return JSON.parse((j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join(""));
  }
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model||AI_DEF.gemini)}:generateContent?key=${encodeURIComponent(a.key)}`,{method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYS+"\n반드시 JSON 하나만 출력해."}]}, contents:[{role:"user", parts:[{text}]}], generationConfig:{responseMimeType:"application/json"}})});
  const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  const txt=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("");
  if(!txt) throw new Error("AI가 답을 주지 않았어요.");
  return JSON.parse(txt.replace(/^```(?:json)?\s*|\s*```$/g,""));
}
const OBJ=(props,req)=>({type:"object", additionalProperties:false, required:req||Object.keys(props), properties:props});
const SCH_EXPLAIN=OBJ({score:{type:"integer"}, feedback:{type:"string"}, missing:{type:"array", items:{type:"string"}}, followup:{type:"string"}});

const CK_SYS=`너는 한국 중고등학생의 학습 점검 선생님이야. 학생이 방금 공부한 범위를 바탕으로 정말 이해했는지 확인해.

- 답이나 풀이를 길게 늘어놓지 말고, 짧고 친절하게. 틀린 부분은 무엇이 틀렸는지 한 문장으로.

async function checkSaveAI(taskId, ai){
  const ref=plannerRef().collection("tasks").doc(taskId), d=await ref.get(); if(!d.exists) return;
  const t=d.data(), g=pctGrade(ai.max? ai.score/ai.max : 0), upd={check:{...(t.check||{}), ai:{...ai, at:Date.now()}}};
  if(t.underStars==null || g<Number(t.underStars)) upd.underStars=g;
  await ref.update(upd);
  const nt={...t, ...upd}; state.tasksMap[taskId]=nt;
  if(upd.underStars!=null && upd.underStars<=2) autoReviewAfter(nt).catch(()=>{});
}

    const nid=`mg-${id}-${mark}`, tm=fmt(addDays(new Date(),1));
    await plannerRef().collection("tasks").doc(nid).set({id:nid, date:tm, subjectId:t.subjectId, textbookId:t.textbookId||"", unit:t.unit||"", method:mark==="re"?"복습":(t.method||""),
      plannedMin:mark==="re"? Math.max(10,Math.round((Number(t.plannedMin)||30)*0.5)) : (Number(t.plannedMin)||30), plannedNote:mark==="re"? "△ 부모님: 다시 보기" : "✗ 부모님: 다시 하기",
      done:false, order:Date.now(), reviewOf:id, byParent:{uid:state.user.uid, name:state.profile.name||"부모님"}});
    toast(mark==="re"? "△ 내일 '다시 보기'를 넣었어요" : "✗ 내일 '다시 하기'를 넣었어요","info");
  }
  drawMgrCheck();
}
async function mgrNote(id, note){
  const ref=plannerRef().collection("tasks").doc(id), d=await ref.get(); if(!d.exists) return;
  await ref.update({mgr:{...(d.data().mgr||{}), note:String(note||"").slice(0,80), by:state.profile.name||"부모님", at:Date.now()}});
  toast("💬 한마디를 남겼어요","good");
}

</script>
