/* ============================================================
 *  ⑤ 약한 과목 자동 감지 (최근 4주 추세)
 * ============================================================ */
function weakSubjects(tasks, cats, weeks){
  const n=weeks||4;
  const today=new Date();
  const from=fmt(addDays(startOfWeek(today), -7*(n-1)));
  const recent=tasks.filter(t=>t.date>=from && t.date<=fmt(addDays(today,0)));
  const map={};
  (cats.subjects||[]).forEach(s=>map[s.id]={s, planned:0, done:0, min:0});
  recent.forEach(t=>{
    const b=map[t.subjectId]; if(!b) return;
    b.planned++; if(t.done){ b.done++; b.min+=creditedMin(t); }
  });
  const rows=Object.values(map);
  const active=rows.filter(b=>b.planned>0);
  const avgMin=active.length? active.reduce((a,b)=>a+b.min,0)/active.length : 0;
  const weak=active.filter(b=>{
    const ip=b.done/b.planned;
    return ip<0.7 || (avgMin>0 && b.min < avgMin*0.5);
  }).sort((a,b)=>a.min-b.min);
  const never=rows.filter(b=>b.planned===0);
  return {weak, never, avgMin, weeks:n};
}

  if(!names.length) return "";

/* ============================================================
 *  ⑦ 주차별 학습 이력 (아카이브)
 * ============================================================ */
function weekIdOf(ds){ return fmt(startOfWeek(parseD(ds))); }   // 그 주 일요일
function weekRangeLabel(monday){
  const s=parseD(monday), e=addDays(s,6);
  return `${s.getMonth()+1}.${s.getDate()}~${e.getMonth()+1}.${e.getDate()}`;
}
// 전체 학습을 주차별로 묶어 요약
function groupByWeek(tasks, cats){
  const subMap={}; (cats.subjects||[]).forEach(s=>subMap[s.id]=s);
  const weeks={};
  tasks.forEach(t=>{
    if(!t.date) return;
    const wid=weekIdOf(t.date);
    const w=(weeks[wid]=weeks[wid]||{wid, planned:0, done:0, min:0, days:new Set(), subs:{}, units:[]});
    w.planned++;
    if(t.done){
      w.done++; w.min+=creditedMin(t); w.days.add(t.date);
      const s=subMap[t.subjectId];
      if(s){
        const b=(w.subs[t.subjectId]=w.subs[t.subjectId]||{s, min:0, count:0, units:[]});
        b.min+=creditedMin(t); b.count++;
        const u=(t.unit||"").trim();
        if(u && !b.units.includes(u)) b.units.push(u);
        if(u && !w.units.includes(u)) w.units.push(u);
      }
    }
  });
  return Object.values(weeks).map(w=>({
    ...w, dayCount:w.days.size, label:weekRangeLabel(w.wid),
    subList:Object.values(w.subs).sort((a,b)=>b.min-a.min),
  })).sort((a,b)=>a.wid<b.wid?1:-1);   // 최신 주차부터
}
// 월 단위로 묶기
function groupByMonth(tasks, cats){
  const subMap={}; (cats.subjects||[]).forEach(s=>subMap[s.id]=s);
  const months={};
  tasks.forEach(t=>{
    if(!t.date) return;
    const mid=t.date.slice(0,7);
    const m=(months[mid]=months[mid]||{mid, planned:0, done:0, min:0, days:new Set(), subs:{}, weeks:new Set()});
    m.planned++;
    if(t.done){
      m.done++; m.min+=creditedMin(t); m.days.add(t.date); m.weeks.add(weekIdOf(t.date));
      const s=subMap[t.subjectId];
      if(s){
        const b=(m.subs[t.subjectId]=m.subs[t.subjectId]||{s, min:0, count:0, units:[]});
        b.min+=creditedMin(t); b.count++;
        const u=(t.unit||"").trim();
        if(u && !b.units.includes(u)) b.units.push(u);
      }
    }
  });
  return Object.values(months).map(m=>({
    ...m, dayCount:m.days.size, weekCount:m.weeks.size,
    label:`${Number(m.mid.slice(0,4))}년 ${Number(m.mid.slice(5,7))}월`,
    subList:Object.values(m.subs).sort((a,b)=>b.min-a.min),
  })).sort((a,b)=>a.mid<b.mid?1:-1);
}

/* ============================================================
 *  ⑧ 외부 학습앱 연동 (천문장 트레이너 · MD 중학영단어)
 *  - 같은 Firebase 프로젝트의 shares/{코드}, links/{코드} 를 읽어옴
 *  - 학습량을 분(分)으로 환산해 플래너 학습시간·용돈에 반영
 *  - 편법 방지: 앱별/전체 일일 인정 상한, 학습일수·복기 점수에는 미반영
 * ============================================================ */
/* ------------------------------------------------------------
 *  학습앱 통합 (천문장 · MD영단어 · 그래머 인사이드)
 *  통합 DB: 세 앱 모두 플래너와 같은 계정으로 planner/{uid}/apps/{doc}에 기록을 저장합니다.
 *  플래너는 연결 코드 없이 그 문서를 바로 읽어 날짜별 학습시간으로 인정합니다.
 * ------------------------------------------------------------ */
const EXT_APPS={
  sentence:{ id:"sentence", doc:"sentence", name:"천문장 트레이너", short:"천문장", emo:"📘", page:"apps/sentence.html",
    color:"#3E6FE0", soft:"#EAF0FF", desc:"문장 학습 1개 = 1.5분" },
  vocab:{ id:"vocab", doc:"words", name:"MD 중학영단어", short:"영단어", emo:"🔤", page:"apps/words.html",
    color:"#0E9F6E", soft:"#E4F5EC", desc:"신규 단어 1개 = 1분, 복습 1개 = 0.5분" },
  grammar:{ id:"grammar", doc:"grammar", name:"그래머 인사이드", short:"문법", emo:"📗", page:"apps/grammar.html",
    color:"#E0A100", soft:"#FFF6C4", desc:"앱이 잰 집중 학습 1분 = 1분" },
};
function extConf(){
  const d={ enabled:true, minPerSentence:1.5, minPerNewWord:1, minPerRevWord:0.5, grammarRate:1,
            dailyCapPerApp:30, dailyCapTotal:60, countInAllowance:true };
  return {...d, ...(state.settings.extApps||{})};
}
const num=v=>Number(v)||0;
// 앱 문서 → {sum:화면 요약, days:{'YYYY-MM-DD':{…}}}
function extNormalize(kind, d){
  if(!d) return null;
  const today=fmt(new Date()), days={};
  if(kind==="sentence"){
    Object.entries(d.dayLog||{}).forEach(([ds,n])=>{ days[ds]={n:num(n)}; });
    Object.entries(d.dayStat||{}).forEach(([ds,x])=>{ days[ds]={...(days[ds]||{n:0}), ok:num(x&&x.ok), no:num(x&&x.no)}; });
    if(d.todayDate && num(d.todayCount)) days[d.todayDate]={n:Math.max(num(d.todayCount),(days[d.todayDate]||{}).n||0)};
    const s=d.summary||{};
    return {days, sum:{today:(days[today]||{}).n||0, goal:num(d.goal||s.goal)||8, streak:num(d.streak),
      mastered:num(s.mastered), total:num(s.total), pct:num(s.pct), weak:num(s.weakCount), pts:num(d.pts), updated:num(d.updated)}};
  }
  if(kind==="vocab"){
    const st=d.state||{}, s=d.summary||{};
    Object.entries(st.log||{}).forEach(([ds,l])=>{ days[ds]={new:num(l&&l.new), rev:num(l&&l.rev), correct:num(l&&l.correct), total:num(l&&l.total)}; });
    const t=days[today]||{};
    return {days, sum:{todayNew:t.new||0, todayRev:t.rev||0, streak:num(st.streak||s.streak), mastered:num(s.mastered), intro:num(s.intro),
      points:num(st.points||s.points), newPerDay:num(st.settings&&st.settings.newPerDay)||20, total:1800, updated:num(d.updated)}};
  }
  // grammar
  Object.entries(d.dayLog||{}).forEach(([ds,l])=>{ days[ds]={sec:num(l&&l.sec), answered:num(l&&l.answered), correct:num(l&&l.correct), cards:num(l&&l.cards)}; });
  const x=d.daily;
  if(x && x.date) days[x.date]={sec:num(x.activeSec), answered:num(x.answered), correct:num(x.correct), cards:num(x.cards)};
  const s=d.summary||{}, t=days[today]||{};
  return {days, sum:{todayMin:Math.round((t.sec||0)/60), answered:t.answered||0, correct:t.correct||0, cards:t.cards||0,
    done:num(s.done), total:num(s.total), pts:num(d.pts), streak:num(d.streak), updated:num(d.updatedAt)}};
}
// 한 앱의 하루 인정 시간(분) — 앱별 일일 상한 적용
function extDayMin(kind, day){
  if(!day) return 0;
  const c=extConf(); let m=0;
  if(kind==="sentence") m=num(day.n)*c.minPerSentence;
  else if(kind==="vocab") m=num(day.new)*c.minPerNewWord + num(day.rev)*c.minPerRevWord;
  else m=num(day.sec)/60*c.grammarRate;
  return Math.min(Math.round(m), c.dailyCapPerApp);
}
// uid 학생의 세 앱 기록을 읽어 정리 (캐시 없이)
async function fetchExtData(uid){
  const out={};
  // 과제 없이 쓴 포커스 타이머 시간 (날짜별)
  try{ const fs=await db.collection("planner").doc(uid).collection("focus").get();
    out.focusFree={}; fs.docs.forEach(d=>{ const v=Number((d.data()||{}).freeMin)||0; if(v) out.focusFree[d.id]=v; }); }catch(_){ out.focusFree={}; }
  await Promise.all(Object.keys(EXT_APPS).map(async k=>{
    try{
      const doc=await db.collection("planner").doc(uid).collection("apps").doc(EXT_APPS[k].doc).get();
      out[k]=doc.exists? extNormalize(k, doc.data()) : null;
    }catch(e){ console.error("학습앱 기록", k, e); out[k]=null; }
  }));
  return out;
}
// 지금 보고 있는 플래너 주인의 기록 (state.extCache)

  const uid=state.ownerUid;
  const data=await fetchExtData(uid);
  if(uid===state.ownerUid) state.extCache={uid, at:Date.now(), data};
  return data;
}
async function ensureExt(){
  if(state.extCache && state.extCache.uid===state.ownerUid) return state.extCache.data;
  return loadExtAll();
}
function extData(){ return (state.extCache && state.extCache.uid===state.ownerUid)? state.extCache.data : {}; }
// 하루 인정 시간: 앱별 상한 → 전체 상한
function extCreditedOn(ds, data){
  const c=extConf(), d=data||extData(), per={};
  if(!c.enabled) return {total:0, per, raw:0};
  let sum=0;
  Object.keys(EXT_APPS).forEach(k=>{ const m=extDayMin(k, d[k]&&d[k].days[ds]); per[k]=m; sum+=m; });
  return {total:Math.min(sum, c.dailyCapTotal), per, raw:sum};
}
function extCreditedToday(){ return extCreditedOn(fmt(new Date())); }
// 주간 인정 시간(용돈 학습시간 지표에 가산)
function extWeekMin(days, data){
  const c=extConf();
  if(!c.enabled || !c.countInAllowance) return 0;
  return (days||[]).reduce((a,ds)=>a+extCreditedOn(ds, data).total, 0);
}

async function changePassword(){

  try{
    const cred=firebase.auth.EmailAuthProvider.credential(state.user.email, curPw);

/* ----- 회원 탈퇴 (계정 + 데이터 영구 삭제) ----- */
async function deleteAllDocs(collRef){
  const snap=await collRef.get();
  const docs=snap.docs;
  for(let i=0;i<docs.length;i+=400){
    const batch=db.batch();
    docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
}
async function purgeUserData(uid, linkCode, isParent){
  for(const s of ["tasks","payouts","weekcaps","meta","apps","diary","daygoals","daytypes","certs","coupons"]){
    try{ await deleteAllDocs(db.collection("planner").doc(uid).collection(s)); }catch(e){ console.error("purge",s,e); }
  }
  if(isParent){ try{ await deleteAllDocs(db.collection("links").doc(uid).collection("children")); }catch(e){ console.error(e); } }
  if(linkCode){ try{ await db.collection("codes").doc(linkCode).delete(); }catch(_){} }
  try{ await deleteAllDocs(db.collection("familyRequests").where("fromUid","==",uid)); }catch(e){ console.error("purge familyRequests", e); }
  try{ await db.collection("planner").doc(uid).delete(); }catch(_){}
  try{ await db.collection("users").doc(uid).delete(); }catch(e){ console.error(e); }
}

/* ============================================================
 *  5) 로그인 상태 감지 → 프로필 로드
 * ============================================================ */
function boot(){
  // file:// 로 직접 열면 브라우저 저장소/네트워크 제약으로 로그인이 실패할 수 있음
  if(location.protocol==="file:"){
    const w=document.getElementById("cfgWarn");
    w.classList.remove("hidden");
    w.innerHTML="⚠️ 파일을 <b>file://</b> 로 직접 열면 로그인이 되지 않을 수 있습니다. 로컬 서버(예: 터미널에서 <code>python -m http.server</code> 후 <code>http://localhost:8000</code>)나 Firebase Hosting 주소(https)로 여세요.";
  }
  if(!CONFIGURED){
    const w=document.getElementById("cfgWarn");
    w.classList.remove("hidden");
    if(location.protocol!=="file:") w.innerHTML="⚙️ Firebase 설정이 아직 입력되지 않았습니다. 설정 가이드를 보고 이 파일 상단의 <code>firebaseConfig</code>를 채운 뒤 다시 여세요.";
    return;
  }
  auth.getRedirectResult && auth.getRedirectResult().catch(e=>socialError(e, (e&&e.credential&&e.credential.providerId==="apple.com")?"apple":"google"));
  auth.onAuthStateChanged(async (user)=>{
    const btn=document.getElementById("authBtn"); if(btn) btn.disabled=false;
    if(!user){ showApp(false); return; }
    state.user=user;
    try{
      // 프로필 로드 (없으면 생성: 회원가입 정보 우선)
      let pdoc=await db.collection("users").doc(user.uid).get();
      if(!pdoc.exists && !pendingSignup && (user.providerData||[]).some(p=>p.providerId!=="password")){
        const np=await askNewProfile(user);
        if(!np){ try{ await user.delete(); }catch(_){ await auth.signOut(); } showAuthErr("기존 계정의 이메일과 비밀번호로 로그인해 주세요."); return; }
        pendingSignup=np;
      }
      if(!pdoc.exists){
        const info = pendingSignup || {name:(user.email||"사용자").split("@")[0], role:"child"};
        pendingSignup=null;
        await db.collection("users").doc(user.uid).set({name:info.name, role:info.role, email:(user.email||"").toLowerCase(), createdAt:Date.now()});
        pdoc=await db.collection("users").doc(user.uid).get();
      }
      state.profile=pdoc.data();
      if(user.email && state.profile.email!==user.email.toLowerCase()){
        db.collection("users").doc(user.uid).set({email:user.email.toLowerCase()},{merge:true}).catch(()=>{});
      }
    }catch(e){
      console.error("프로필 로드/생성 실패", e);
      // 로그인은 되었으나 DB 접근 실패 → 폴백 프로필로 화면은 띄우되 원인을 안내
      state.profile = state.profile || {name:(user.email||"사용자").split("@")[0], role:(pendingSignup&&pendingSignup.role)||"child"};
      alert("로그인은 되었지만 데이터 연결에 실패했습니다.\n\n"+firestoreDiag(e)+"\n\n원인을 해결한 뒤 새로고침하세요.");
    }
    state.ownerUid=user.uid; state.ownerName=state.profile.name; state.ownerRole=state.profile.role;
    state.viewingChild=false;
    try{ await loadChildren(); }catch(e){ console.error("자녀 로드 실패", e); }
    showApp(true);
    checkFamilyRequests().then(async()=>{ await refreshCommBadge(); await checkNewCheers(); await hallCheckLikes(); newsAnnounce(); });
    setTimeout(rankPublishSoon, 3000);
    setTimeout(()=>{ loadCharTotals().then(()=>{ hallSync(); }); }, 3500);
    focusLoad();
    checkAllowanceNotices();
    scheduleSnap();
    if(location.hash==="#family"){ history.replaceState(null,"",location.pathname); setTimeout(drawFamily,300); }
    renderHeader();
    subscribeCategories();
    subscribeTasks();
  });
}
function showApp(on){
  document.getElementById("auth").classList.toggle("hidden", on);
  document.getElementById("app").classList.toggle("hidden", !on);
}
async function loadChildren(){
  state.children=[];
  if(state.profile.role!=="parent") return;
  await Family.syncLinks(db, state.user, state.profile);   // 자녀가 승인한 신청 → 연결
  const snap=await db.collection("links").doc(state.user.uid).collection("children").get();
  const rows=[];
  for(let i=0;i<snap.docs.length;i++){
    const d=snap.docs[i], data=d.data();
    let name=data.name, exists=true;
    try{ const u=await db.collection("users").doc(d.id).get(); if(u.exists) name=u.data().name||name; else exists=false; }catch(_){}
    rows.push({uid:d.id, ...data, name, exists, color:SUBJECT_PALETTE[(i+1)%SUBJECT_PALETTE.length]});
  }
  state.children=rows;
}

/* ============================================================
 *  6) Firestore 구독 (실시간 동기화)
 * ============================================================ */
function plannerRef(){ return db.collection("planner").doc(state.ownerUid); }
function rangeFor(){
  let s,e;
  if(state.view==="month"){
    const first=new Date(state.cursor.getFullYear(),state.cursor.getMonth(),1);
    s=startOfWeek(first); e=addDays(s,41);
  }else if(state.view==="week"||state.view==="tt"||state.view==="plans"){
    s=startOfWeek(state.cursor); e=addDays(s,6);
  }else{ // 할 일 탭: 주간 날짜 줄 + 어제 비교까지 한 번에 받아 둠
    const ws=startOfWeek(state.cursor); s=addDays(ws,-1); e=addDays(ws,6);
  }
  return {start:fmt(s), end:fmt(e)};
}
function subscribeTasks(){
  if(state._taskUnsub) state._taskUnsub();
  const {start,end}=rangeFor();
  state._taskUnsub = plannerRef().collection("tasks")
    .where("date",">=",start).where("date","<=",end)
    .onSnapshot(snap=>{
      state.tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
      scheduleSnap();
      state.tasksMap={}; state.tasks.forEach(t=>state.tasksMap[t.id]=t);
      if(window.GCal) GCal.onTasks(state.ownerUid, state.tasks, start, end);
      render();
      weeklyCarry();
    }, err=>console.error("tasks",err));
}
/* ↪ 주간 이월: 한 주가 끝나면(🏁 종료했거나 일요일이 되면), 월~토에 못 한 계획을 "골라 담기"로 보여 줘요
 *  - 자동으로 옮기지 않아요: 아이가 이번 주에 가져갈 것만 골라요 (안 골라도 괜찮아요)
 *  - 고른 것만 일요일(일요일이 지났으면 오늘)로 복사 · 지난주 계획엔 '↪ 넘김' 표시
 *  - 주마다 한 번만 (meta/carry.last) · 복사본 id가 정해져 있어 기기 여러 대여도 안 겹쳐요 */
const carryRun={};
async function weeklyCarry(){
  const uid=state.ownerUid; if(!uid) return;
  const sat=lastClosedSaturday(new Date()), key=uid+":"+sat;
  if(carryRun[key]) return; carryRun[key]=1;
  try{
    const ref=plannerRef().collection("meta").doc("carry"), m=await ref.get();
    if(m.exists && m.data().last>=sat) return;
    const satD=parseD(sat), mon=fmt(addDays(satD,-5)), sun=fmt(addDays(satD,1)), today=fmt(new Date());
    const target= today>sun? today : sun;
    const snap=await plannerRef().collection("tasks").where("date",">=",mon).where("date","<=",sat).get();
    const undone=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>!t.done && !t.carriedTo).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
    if(!undone.length){ await ref.set({last:sat, at:Date.now(), count:0, target},{merge:true}); return; }
    if(uid!==state.ownerUid) return;
    state.carryOffer={uid, sat, target, sun, list:undone};
    carryOfferShow();
  }catch(e){ console.warn("주간 이월", e); delete carryRun[key]; }
}

          이번 주에 <b>하고 싶은 것만</b> 골라서 ${o.target===o.sun?"일요일":"오늘"}로 가져와요. 다 안 가져와도 괜찮아요 🙂</div>

async function carryApply(take){
  const o=state.carryOffer; if(!o) return;
  const picked= take? [...document.querySelectorAll('.carry-list input:checked')].map(x=>o.list[+x.dataset.i]) : [];
  if(take && !picked.length){ toast("가져올 계획을 골라 주세요 (안 가져가려면 아래 버튼)","info"); return; }
  closeDrawer(); state.carryOffer=null;
  try{
    for(const t of picked){
      const {id, done, doneAt, actualMin, timerMin, focusMin, score, rating, understood, parentComment, creditRate, ...rest}=t;
      const copy={...rest, id:"cr_"+id, date:o.target, done:false, actualMin:"", timerMin:0, score:"", carriedFrom:{id, date:t.date}, order:(Number(t.order)||Date.now())};
      await plannerRef().collection("tasks").doc(copy.id).set(copy);
      await plannerRef().collection("tasks").doc(id).set({carriedTo:o.target},{merge:true});
      if(window.GCal) try{ GCal.onSave(o.uid, copy); }catch(_){}
    }
    await plannerRef().collection("meta").doc("carry").set({last:o.sat, at:Date.now(), count:picked.length, offered:o.list.length, target:o.target},{merge:true});
    toast(picked.length? `↪ ${picked.length}개를 ${o.target===o.sun?"일요일":"오늘"}로 가져왔어요` : "좋아요, 이번 주는 새로 시작해요","good");
  }catch(e){ console.warn("주간 이월", e); toast("저장하지 못했어요. 다시 해 주세요","info"); }
}
function subscribeCategories(){
  if(state._catUnsub) state._catUnsub();
  state._catUnsub = plannerRef().collection("meta").doc("categories")
    .onSnapshot(async doc=>{
      if(doc.exists){ state.categories=doc.data(); }
      else if(!state.viewingChild){ // 내 플래너면 시드 생성
        state.categories=seedCategories();
        await plannerRef().collection("meta").doc("categories").set(state.categories);
      }
      render();
    });
  // settings
  plannerRef().collection("meta").doc("settings").get().then(d=>{
    const base=defaultSettings();
    const loaded=d.exists? d.data():{};
    const mig=migrateAllowance(Object.assign({}, loaded.allowance||{}));
    state.settings = Object.assign(base, loaded, { allowance: Object.assign(base.allowance, mig.a) });
    if(!d.exists && !state.viewingChild) plannerRef().collection("meta").doc("settings").set(state.settings);
    else if(d.exists && mig.changed) plannerRef().collection("meta").doc("settings").set({allowance:state.settings.allowance},{merge:true}).catch(()=>{});
    fetchPayTerms(state.ownerUid).then(pt=>{ state.payTermsRaw=pt; render(); });
    loadWeekClose(state.ownerUid);
    setTimeout(()=>planReflow().catch(e=>console.warn("재배치", e)), 2500);
    if(!AS.aiLoaded) setTimeout(()=>aiLoad().then(()=>{ if(AS.ai) render(); }).catch(()=>{}), 3000);
    render();
  });
}

/* ----- 일일 목표시간 (날짜별 저장, 캐시는 state.dayGoals) ----- */
async function loadDayGoal(ds){
  if(state.dayGoals[ds]!==undefined) return state.dayGoals[ds];
  try{
    const d=await plannerRef().collection("daygoals").doc(ds).get();
    state.dayGoals[ds]= d.exists? Number(d.data().goalMin)||0 : null;
  }catch(_){ state.dayGoals[ds]=null; }
  return state.dayGoals[ds];
}
async function setDayGoal(ds,min){
  min=Math.max(0,Number(min)||0);
  state.dayGoals[ds]=min;
  try{ await plannerRef().collection("daygoals").doc(ds).set({goalMin:min}); }catch(e){ console.error(e); }
  render();
}
function promptDayGoal(ds){
  const v=prompt("오늘 목표 학습시간(분)을 입력하세요:", String(effDayGoal(ds)));
  if(v==null) return;
  setDayGoal(ds, v);
}
function effDayGoal(ds){
  const ov=state.dayGoals[ds];
  if(ov!=null && ov!==undefined) return ov;
  return dayTypeGoal(ds);
}

/* ----- 등교일 / 비등교일(주말·방학) 구분 ----- */
// 자동 판정: 월~금 = 등교, 토·일 = 비등교. 방학 기간이 설정돼 있으면 그 기간은 비등교.
function autoDayType(ds){
  const d=parseD(ds), dow=d.getDay();
  const V=state.settings.vacations||[];
  for(const v of V){ if(v && v.from && v.to && ds>=v.from && ds<=v.to) return "free"; }
  return (dow===0||dow===6)? "free" : "school";
}
function effDayType(ds){
  const ov=state.dayTypes[ds];
  return (ov==="school"||ov==="free")? ov : autoDayType(ds);
}
function dayTypeGoal(ds){
  const s=state.settings;
  const base = effDayType(ds)==="free"
    ? (s.dailyGoalFree!=null? s.dailyGoalFree : 240)
    : (s.dailyGoalSchool!=null? s.dailyGoalSchool : (s.dailyGoalMin||120));
  return base;                               // 🚀 부스터는 목표가 아니라 '하루 최대 인정 시간'을 늘려요
}
async function loadDayTypes(days){
  const need=days.filter(ds=>state.dayTypes[ds]===undefined);
  if(!need.length) return;
  need.forEach(ds=>state.dayTypes[ds]=null); // 중복 조회 방지
  try{
    const snaps=await Promise.all(need.map(ds=>plannerRef().collection("daytypes").doc(ds).get()));
    snaps.forEach((doc,i)=>{ if(doc.exists) state.dayTypes[need[i]]=doc.data().type||null; });
  }catch(e){ console.error(e); }
}
async function setDayType(ds,type){
  state.dayTypes[ds]=type;               // "school" | "free" | null(자동)
  state.dayGoals[ds]=undefined;          // 유형이 바뀌면 목표도 유형 기본값으로
  try{
    const ref=plannerRef().collection("daytypes").doc(ds);
    if(type) await ref.set({type});
    else await ref.delete();
    await plannerRef().collection("daygoals").doc(ds).delete().catch(()=>{});
  }catch(e){ console.error(e); }
  delete state.dayGoals[ds];
  render();
}
function toggleDayType(ds){
  setDayType(ds, effDayType(ds)==="school"? "free" : "school");
}

async function removeVacation(i){

const WD_FULL=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
function setTab(t, force){
  const prevView=state.view;
  if(t===state.tab && !force){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  state.tab=t;
  if(t==="timer"){ focusTasks=null; FocusSound.prepareAll(); }   // 오늘 과제 새로 읽기 · 소리 미리 만들기
  if(t==="todo") state.view="day";
  else if(t==="plan") state.view=state.planView||"week";

  if(!state.profile) return;

function todoHead(){
  const d=state.cursor, ds=fmt(d), today=fmt(new Date());

  for(let i=0;i<7;i++){
    const x=addDays(ws,i), xs=fmt(x), ts=state.tasks.filter(t=>t.date===xs), done=ts.filter(t=>t.done).length;
    const cls=["wday", xs===ds?"on":"", xs===today?"today":"", x.getDay()===0?"sun":"", x.getDay()===6?"sat":"", ts.length&&done===ts.length?"full":""].join(" ");
    strip+=`<button class="${cls}" onclick="selectDay('${xs}')"><span class="w">${WD[i]}</span><span class="n">${x.getDate()}</span><span class="r">${ts.length? (done===ts.length?"✓ ":"")+`${done}/${ts.length}` : ""}</span></button>`;
  }
  const sub = ds===today? "오늘" : `${d.getMonth()+1}월 ${d.getDate()}일`;

      <div><div class="h-sub">${sub}</div><h2>${WD_FULL[d.getDay()]}</h2></div>

let payBarTimer=null, payBarSeq=0;

function stripDay(X, ds){
  const o={...X, focusFree:{...((X&&X.focusFree)||{})}}; delete o.focusFree[ds];
  ["sentence","vocab","grammar"].forEach(k=>{ if(X&&X[k]){ const d={...X[k].days}; delete d[ds]; o[k]={...X[k], days:d}; } });
  return o;
}
// 이번 주 용돈 + 오늘 번 금액 (오늘 기록을 뺀 주와 비교)
async function computeWeekPay(uid){
  const days=snapWeekDays(), weekId=days[6], ds=fmt(new Date());
  const [tasks, crit, capOv, payout, exd]=await Promise.all([
    fetchWeekTasks(uid,days), fetchAllowanceCrit(uid), fetchWeekCap(uid,weekId), fetchPayout(uid,weekId), fetchExtData(uid)]);
  const cap=capOv!=null? capOv : null;
  const r=computeAllowance(tasks,days,crit,exd), now=payAmount(r,cap);
  let today=0;
  if(days.includes(ds)){
    const r0=computeAllowance(tasks.filter(t=>t.date!==ds), days, crit, stripDay(exd, ds));
    today=now-payAmount(r0,cap);
  }
  return {r, amount:payout? Number(payout.amount)||0 : now, timePay:now-r.appBonus-r.mockBonus, today, days, paid:!!payout};
}
// 자동 마감은 없어요 — 학생이 🏁 종료하면 정산 (그 전엔 토요일까지 남은 날)
function payDeadline(days, uid){
  if(uid && weekClosed(uid, days[6])) return "🏁 종료";
  const d=Math.round((parseD(days[6])-parseD(fmt(new Date())))/86400000);
  return d>0? `종료까지 D-${d}` : d===0? "오늘 종료하기" : "종료 전";
}
function payBarHTML(P){

  const tMax=r.timeCap+Math.round(r.timeCap*r.timerBonusRate), max=Math.max(1, tMax+r.appBonusMax+r.mockBonusMax);
  const w=n=>Math.max(0,Math.min(100, n/max*100)).toFixed(1)+"%";
  const td=Math.round(P.today), tdTxt=td===0? "오늘 ₩0" : `오늘 ${td>0?"+":"−"}₩${Math.abs(td).toLocaleString()}`;
  return `<div class="pb-top"><b class="pb-amt">${won(P.amount)}</b><span class="pb-today ${td>0?"up":td<0?"down":""}">${tdTxt}</span>
      <span class="pb-dl">${P.paid?"지급완료":payDeadline(P.days, state.ownerUid)}</span></div>
    <div class="pb-track" aria-hidden="true"><i style="width:${w(P.timePay)};background:#6A58E6"></i><i style="width:${w(r.appBonus)};background:#0E9F6E"></i><i style="width:${w(r.mockBonus)};background:#E0A100"></i></div>
    <div class="pb-lbl"><span>⏱ ${won(P.timePay)}</span><span>📚 ${won(r.appBonus)}</span><span>📝 ${r.mock? won(r.mockBonus) : "–"}</span></div>`;

async function refreshPayBar(){
  const el=document.getElementById("payBar"); if(!el || !state.user || !state.profile) return;
  const seq=++payBarSeq;
  try{
    if(state.profile.role==="parent" && !state.viewingChild){
      const days=snapWeekDays(), weekId=days[6];
      const rows=await Promise.all((state.children||[]).map(async ch=>{
        try{ const d=await db.collection("planner").doc(ch.uid).collection("allowanceSnap").doc(weekId).get();
          return {name:ch.name, amt:d.exists? Number(d.data().amount)||0 : 0}; }catch(_){ return {name:ch.name, amt:0}; } }));
      if(seq!==payBarSeq) return;
      const sum=rows.reduce((a,x)=>a+x.amt,0);
      el.innerHTML=`<div class="pb-top"><b class="pb-amt">₩${sum.toLocaleString()}</b><span class="pb-today">자녀 이번 주</span><span class="pb-dl">${payDeadline(days)}</span></div>

async function startLivePay(k, taskId){
  LP={k, base:null, c:0, t:0, P:null, taskId, before:null};

function liveBonus(c,t){

function drawLivePay(flash){

  const amount=P.paid? P.amount : P.amount-r.appBonus+b, today=P.today-r.appBonus+b;
  let hint;
  if(t<r.appMinAnswers) hint=`보너스까지 ${r.appMinAnswers-t}문제`;
  else if(b>=r.appBonusMax) hint="최대 보너스";
  else { let n=1; while(n<300 && liveBonus(c+n,t+n)<=b) n++; hint=n<300? `연속 ${n}문제 정답이면 보너스 ↑` : ""; }
  el.innerHTML=`<div class="lp-top"><b>₩${Math.round(amount).toLocaleString()}</b><span class="${today>0?"up":""}">오늘 ${today>=0?"+":"−"}₩${Math.abs(Math.round(today)).toLocaleString()}</span></div>
    <div class="lp-sub">📚 이번 주 정답률 ${t? Math.round(c/t*100)+"%" : "–"} (${c}/${t}) → ₩${b.toLocaleString()}${hint?` · ${hint}`:""}</div>

}

/* ============================================================
 *  ⏱ 포커스 타이머 — 원을 돌려 시간을 맞추고, 필요하면 집중 사운드와 함께
 *  과제를 고르면 집중한 시간이 그 과제의 '타이머 실측 시간'(100% 인정)으로 기록됩니다.
 * ============================================================ */
const FOCUS_KEY="planner_focus_v1";
let F={setMin:25, mode:"idle", total:0, endAt:0, remaining:0, accSec:0, segAt:0, taskId:"", sound:"", vol:0.6, doneMin:0, doneTask:""};
let focusTick=null, focusTasks=null, focusToday=null, dialDrag=false;
function focusSave(){ try{ localStorage.setItem(FOCUS_KEY, JSON.stringify(F)); }catch(_){} }
function focusLoad(){
  try{ const o=JSON.parse(localStorage.getItem(FOCUS_KEY)||"null"); if(o) F=Object.assign(F,o); }catch(_){}
  FocusSound.setVolume(F.vol);
  // 새로고침 뒤에는 브라우저가 자동 재생을 막으므로, 처음 화면을 누를 때 사운드를 다시 켬
  if(F.mode==="run"||F.mode==="break") document.addEventListener("pointerdown", ()=>{ if(F.mode==="run"||F.mode==="break"){ focusAudioOn(); focusWake(); } }, {once:true});
  if(F.mode==="run" || F.mode==="break"){
    if(Date.now()>=F.endAt){ F.mode==="run"? focusFinish(true) : focusBreakEnd(true); }
    else focusStartTick();
  }
}
const mmss=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
function focusRemaining(){
  if(F.mode==="run"||F.mode==="break") return Math.max(0,F.endAt-Date.now());
  if(F.mode==="pause") return F.remaining;
  return F.setMin*60000;
}
function focusElapsedSec(){ return F.accSec + (F.mode==="run"? (Date.now()-F.segAt)/1000 : 0); }
function focusStartTick(){
  if(focusTick) clearInterval(focusTick);
  focusTick=setInterval(()=>{
    const rem=focusRemaining();
    if(rem<=0){ F.mode==="run"? focusFinish() : focusBreakEnd(); return; }
    const bt=document.getElementById("bigTime"); if(bt) bt.textContent=mmss(rem);
    const arc=document.getElementById("runArc");
    if(arc){ const C=2*Math.PI*100; arc.setAttribute("stroke-dasharray", `${C*(F.total? rem/F.total : 0)} ${C}`); }
    focusNavLabel();
  },1000);
  focusNavLabel();
}
function focusStopTick(){ if(focusTick){ clearInterval(focusTick); focusTick=null; } focusNavLabel(); }
function focusNavLabel(){
  const l=document.querySelector('.bnav-pill [data-tab="timer"] .lbl'); if(!l) return;
  l.textContent=(F.mode==="run"||F.mode==="break")? mmss(focusRemaining()) : (F.mode==="pause"? "일시정지" : "타이머");
}
// 오늘 내 학습 목록 (부모가 자녀를 보고 있어도 타이머는 내 플래너 기준)
async function loadFocusTasks(){
  const uid=state.user.uid, today=fmt(new Date());
  try{
    const [snap, log]=await Promise.all([
      db.collection("planner").doc(uid).collection("tasks").where("date","==",today).get(),
      db.collection("planner").doc(uid).collection("focus").doc(today).get(),
    ]);
    focusTasks=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>!t.done).sort((a,b)=>(a.order||0)-(b.order||0));
    focusToday=log.exists? log.data() : {min:0, sessions:0};
  }catch(e){ console.error("포커스 목록", e); focusTasks=[]; focusToday={min:0,sessions:0}; }
  if(state.tab==="timer") render();
}
function focusTaskLabel(t){
  const su=(state.viewingChild? null : subjById(t.subjectId));
  return `${su?su.name+" · ":""}${t.unit||t.method||"학습"} (${t.plannedMin||0}분)`;
}
function renderFocus(){
  if(focusTasks===null){ loadFocusTasks(); }
  const R=100, C=2*Math.PI*R, m=F.setMin;
  const task=(focusTasks||[]).find(t=>t.id===F.taskId);
  const running=F.mode==="run"||F.mode==="pause";
  const opts=`<option value="">과제 없이 집중하기</option>`+(focusTasks||[]).map(t=>`<option value="${t.id}" ${t.id===F.taskId?"selected":""}>${esc(focusTaskLabel(t))}</option>`).join("");
  let body="";
  if(F.mode==="done"){
    body=`<div class="fo-done">
      <div class="fo-big-emo">🎉</div>

    </div>`;
  }else if(F.mode==="break"){
    const rem=focusRemaining();
    body=`<svg class="fo-dial" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#DDF3E9" stroke-width="22"/>
        <circle id="runArc" cx="130" cy="130" r="${R}" fill="none" stroke="#0E9F6E" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*(F.total?rem/F.total:0)} ${C}" transform="rotate(-90 130 130)"/>
        <text x="130" y="148" text-anchor="middle" font-size="52">☕</text></svg>
      <div class="fo-time" id="bigTime">${mmss(rem)}</div>
      <div class="fo-sub">쉬는 시간 · 물 한 잔, 스트레칭</div>
      <div class="fo-ctrl"><button class="fo-btn ghost" onclick="focusBreakEnd()">휴식 끝내기</button></div>`;
  }else if(!running){
    let ticks="";
    for(let i=0;i<60;i++){ const t=i/60*2*Math.PI, r1=i%5?R-6:R-11;
      ticks+=`<line x1="${(130+(R-2)*Math.sin(t)).toFixed(1)}" y1="${(130-(R-2)*Math.cos(t)).toFixed(1)}" x2="${(130+r1*Math.sin(t)).toFixed(1)}" y2="${(130-r1*Math.cos(t)).toFixed(1)}" stroke="#1C1B24" stroke-width="${i%5?1:1.6}" opacity="${i<m?.85:.2}"/>`; }
    const a=m/60*2*Math.PI, kx=130+R*Math.sin(a), ky=130-R*Math.cos(a);
    body=`<svg class="fo-dial" id="foDial" viewBox="0 0 260 260" role="slider" aria-label="집중 시간(분)" aria-valuemin="1" aria-valuemax="60" aria-valuenow="${m}" tabindex="0">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#E6E1FB" stroke-width="26"/>
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#6A58E6" stroke-width="26" stroke-linecap="round" stroke-dasharray="${C*m/60} ${C}" transform="rotate(-90 130 130)"/>
        ${ticks}
        <text x="130" y="42" text-anchor="middle" font-size="12" fill="#8F8D9B">60</text><text x="222" y="134" text-anchor="middle" font-size="12" fill="#8F8D9B">15</text>
        <text x="130" y="226" text-anchor="middle" font-size="12" fill="#8F8D9B">30</text><text x="38" y="134" text-anchor="middle" font-size="12" fill="#8F8D9B">45</text>
        <text x="130" y="146" text-anchor="middle" font-size="54" font-weight="700" fill="#1C1B24">${m}</text>
        <text x="130" y="170" text-anchor="middle" font-size="13" fill="#8F8D9B">분</text>
        <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="15" fill="#fff" stroke="#6A58E6" stroke-width="3"/>
      </svg>
      <div class="fo-presets">${[15,25,50].map(x=>`<button class="${m===x?"on":""}" onclick="focusSetMin(${x})">${x}분</button>`).join("")}</div>
      <div class="fo-ctrl"><button class="fo-btn" onclick="focusStart()">시작하기 ▶</button></div>
      <div class="fo-sub">원을 돌리거나 빠른 시간을 눌러 맞추세요</div>`;
  }else{
    const rem=focusRemaining();
    body=`<svg class="fo-dial ${F.mode==="pause"?"paused":""}" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="#E9E8F0" stroke-width="22"/>
        <circle id="runArc" cx="130" cy="130" r="${R}" fill="none" stroke="#6A58E6" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*(F.total?rem/F.total:0)} ${C}" transform="rotate(-90 130 130)"/>
        <circle cx="130" cy="130" r="70" fill="#F4F2FF"/>
        <text class="fo-glass" x="130" y="152" text-anchor="middle" font-size="58">⏳</text>
      </svg>
      <div class="fo-time" id="bigTime">${mmss(rem)}</div>
      <div class="fo-sub">${task? esc(focusTaskLabel(task)) : "과제 없이 집중 중"}</div>
      <div class="fo-ctrl">
        <button class="fo-btn ghost" onclick="focusPlus()">+5분</button>
        <button class="fo-btn" onclick="focusPause()">${F.mode==="run"?"❚❚ 일시 중지":"▶ 계속"}</button>
        <button class="fo-btn ghost" onclick="focusEnd()">⏹ 끝</button>
      </div>`;
  }
  const S=FocusSound.TRACKS;
  const sound=`<div class="fo-card">
      <div class="fo-card-h">🎧 집중 사운드 <span>${F.sound? esc(S[F.sound].desc) : "필요할 때만 골라 켜세요"}</span></div>
      <div class="fo-sounds">
        <button class="${!F.sound?"on":""}" onclick="focusSound('')">🔇 끄기</button>
        ${Object.entries(S).map(([k,t])=>`<button class="${F.sound===k?"on":""}" onclick="focusSound('${k}')">${t.emo} ${t.name}</button>`).join("")}
      </div>
      <div class="fo-vol"><span>🔈</span><input type="range" min="0" max="100" value="${Math.round(F.vol*100)}" oninput="focusVol(this.value)" aria-label="사운드 크기"><span>🔊</span></div>
      <label class="fo-awake"><input type="checkbox" ${F.keepAwake?"checked":""} onchange="focusKeepAwake(this.checked)"> 📱 타이머가 도는 동안 화면 켜 두기</label>
      <div class="fo-hint">타이머가 도는 동안 재생되고, <b>휴대폰 화면이 꺼져도 소리와 끝 알림이 이어져요</b>(잠금 화면에 재생 컨트롤이 보여요). 브라우저를 닫거나 앱을 완전히 끄면 멈춰요. 멈춰 있을 때 고르면 6초 미리 들려 드려요. iPhone은 음량 버튼으로 크기를 조절하세요.</div>
    </div>`;
  const tsel=(F.mode==="idle")? `<div class="fo-card">
      <div class="fo-card-h">📌 무엇을 공부하나요? <span>고르면 집중한 시간이 그 과제에 기록돼요</span></div>
      <select class="inp" onchange="F.taskId=this.value;focusSave()">${opts}</select>
      ${focusTasks&&!focusTasks.length?`<div class="fo-hint">오늘 남은 과제가 없어요. <a href="#" onclick="setTab('todo');return false">할 일</a>에서 먼저 추가할 수 있어요.</div>`:""}
    </div>` : "";

  return `<div class="fo-grid">
    <div class="fo-wrap">
      ${body}
    </div>
    <div>
    ${tsel}
    ${sound}

      <div class="r-stat"><div class="e">⏱</div><b>${td.min||0}</b><span>오늘 집중(분)</span></div>
      <div class="r-stat"><div class="e">🍅</div><b>${td.sessions||0}</b><span>완료한 집중</span></div>
    </div>
    </div></div>`;
}
function bindFocusDial(){
  const dial=document.getElementById("foDial"); if(!dial) return;
  const set=e=>{
    const r=dial.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
    let a=Math.atan2(x,-y); if(a<0) a+=2*Math.PI;
    let v=Math.round(a/(2*Math.PI)*60); if(v===0) v=F.setMin>30?60:1;
    if(v!==F.setMin){ F.setMin=v; render(); if(navigator.vibrate) try{navigator.vibrate(4);}catch(_){} }
  };
  dial.addEventListener("pointerdown",e=>{ dialDrag=true; set(e); });
  window.onpointermove=e=>{ if(dialDrag) set(e); };
  window.onpointerup=()=>{ if(dialDrag){ dialDrag=false; focusSave(); } };
  dial.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowRight"){ focusSetMin(Math.min(60,F.setMin+1)); }
    if(e.key==="ArrowDown"||e.key==="ArrowLeft"){ focusSetMin(Math.max(1,F.setMin-1)); }
    setTimeout(()=>{ const d=document.getElementById("foDial"); if(d) d.focus(); },0);
  });
}
function focusSetMin(m){ F.setMin=m; focusSave(); render(); }
function focusStart(){
  FocusSound.unlock();
  // 같은 과제의 기존 타이머가 돌고 있으면 먼저 저장
  if(state.timer && F.taskId && state.timer.taskId===F.taskId) stopTimer(true);
  F.total=F.setMin*60000; F.endAt=Date.now()+F.total; F.accSec=0; F.segAt=Date.now(); F.mode="run";
  focusSave(); focusStartTick();
  focusAudioOn(); focusWake();
  toast("⏱ 집중 시작! 끝나면 알려 드릴게요","good");
  render();
}
function focusPause(){
  if(F.mode==="run"){
    F.accSec+=(Date.now()-F.segAt)/1000; F.remaining=Math.max(0,F.endAt-Date.now()); F.mode="pause";
    focusStopTick(); FocusSound.stop(); focusWake();
  }else if(F.mode==="pause"){
    F.endAt=Date.now()+F.remaining; F.segAt=Date.now(); F.mode="run";
    focusStartTick(); focusAudioOn(); focusWake();
  }
  focusSave(); render();
}
function focusPlus(){
  if(F.mode==="run") F.endAt+=5*60000; else if(F.mode==="pause") F.remaining+=5*60000;
  F.total+=5*60000; focusSave(); render();
}
async function focusRecord(sec, natural){
  const min=Math.round(sec/60);
  const uid=state.user.uid, today=fmt(new Date());
  const task=(focusTasks||[]).find(t=>t.id===F.taskId);
  F.doneMin=min; F.doneTask=task? focusTaskLabel(task) : "";
  if(min<1) return;
  try{
    const ref=db.collection("planner").doc(uid).collection("focus").doc(today);
    const d=await ref.get(), cur=d.exists? d.data() : {min:0,sessions:0};
    focusToday={min:(Number(cur.min)||0)+min, sessions:(Number(cur.sessions)||0)+(natural?1:0), freeMin:(Number(cur.freeMin)||0)+(task?0:min)};
    await ref.set(focusToday);
  }catch(e){ console.error("포커스 기록", e); }
  if(task){
    try{
      const tref=db.collection("planner").doc(uid).collection("tasks").doc(task.id);
      const td=await tref.get(); if(!td.exists) return;
      const t=td.data(), timerMin=(Number(t.timerMin)||0)+min, actualMin=Math.max(Number(t.actualMin)||0, timerMin);
      if(state.ownerUid===uid && state.tasksMap[task.id]) await saveTask({...state.tasksMap[task.id], timerMin, actualMin});
      else await tref.update({timerMin, actualMin});
      task.timerMin=timerMin; task.actualMin=actualMin;
    }catch(e){ console.error("과제 시간 기록", e); }
  }
}
async function focusFinish(silent){
  // 끝까지 집중한 시간 (새로고침 뒤 늦게 확인해도 종료 시각까지만 계산)
  const used=F.mode==="run"? F.accSec+(Math.min(Date.now(),F.endAt)-F.segAt)/1000 : F.accSec;
  focusStopTick();
  if(!silent) FocusSound.chime(); else FocusSound.stop();
  F.mode="done"; focusSave(); focusNavLabel(); focusWake();
  FocusSound.setMeta({title:"🎉 집중 완료!"});
  await focusRecord(Math.min(used, F.total/1000), true);
  focusSave();
  if(!silent){ toast(`🎉 ${F.doneMin}분 집중 완료!`,"cheer"); if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(_){} }
  if(state.tab==="timer") render();
}
async function focusEnd(){
  const used=focusElapsedSec();
  if(!confirm(`지금까지 ${Math.round(used/60)}분 집중했어요. 여기서 끝낼까요?`)) return;
  focusStopTick(); FocusSound.stop();
  F.mode="done"; focusSave(); focusNavLabel(); focusWake();
  await focusRecord(used, false);
  focusSave(); render();
}
function focusBreak(min){
  F.total=min*60000; F.endAt=Date.now()+F.total; F.mode="break";
  focusSave(); focusStartTick(); focusAudioOn(); focusWake(); render();
}
function focusBreakEnd(silent){
  focusStopTick(); F.mode="idle"; focusSave(); focusNavLabel(); focusWake();
  if(!silent){ FocusSound.chime(); toast("☕ 휴식 끝! 다시 집중해 볼까요?","info"); } else FocusSound.stop();
  if(state.tab==="timer") render();
}
function focusReset(){ F.mode="idle"; F.accSec=0; focusSave(); render(); }
function focusSound(k){
  F.sound=k; focusSave();
  if(F.mode==="run"||F.mode==="break") focusAudioOn();
  else if(!k) FocusSound.stop();
  else FocusSound.preview(k, 6);
  render();
}
// 타이머가 도는 동안: 고른 배경음, 없으면 거의 들리지 않는 소리로 재생을 유지(끝 알림용)
function focusAudioOn(){
  const id=(F.mode==="run" && F.sound)? F.sound : "silent";
  FocusSound.setMeta({title: F.mode==="break"? "☕ 쉬는 시간" : `⏱ 포커스 ${Math.round(F.total/60000)}분`});
  FocusSound.play(id);
}
FocusSound.setActions({
  play:()=>{ if(F.mode==="pause") focusPause(); },
  pause:()=>{ if(F.mode==="run") focusPause(); },
  stop:()=>{ if(F.mode==="run") focusPause(); },
});
// 화면이 꺼져 있어도 <audio> 재생 신호로 끝났는지 확인
let focusEnding=false;
FocusSound.onTick(()=>{
  if(focusEnding || !(F.mode==="run"||F.mode==="break") || focusRemaining()>0) return;
  focusEnding=true;
  Promise.resolve(F.mode==="run"? focusFinish() : focusBreakEnd()).finally(()=>{ focusEnding=false; });
});
// 📱 화면 켜 두기 (Screen Wake Lock)
let wakeLock=null;
async function focusWake(){
  const want=F.keepAwake && (F.mode==="run"||F.mode==="break") && document.visibilityState==="visible";
  try{
    if(want && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{ wakeLock=null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ console.warn("화면 켜 두기", e); }
}
document.addEventListener("visibilitychange", ()=>{ focusWake(); if(document.visibilityState==="visible" && (F.mode==="run"||F.mode==="break") && focusRemaining()<=0) (F.mode==="run"? focusFinish() : focusBreakEnd()); });
function focusKeepAwake(on){ F.keepAwake=!!on; focusSave(); focusWake(); render(); }
function focusVol(v){ F.vol=Number(v)/100; FocusSound.setVolume(F.vol); focusSave(); }

/* ============================================================
 *  💰 용돈 정산 알림 — 학생이 🏁 이번 주 종료를 누르면
 *  - 스냅샷: 학생 플래너가 열려 있을 때(또는 부모가 볼 때) 이번 주 정산 결과를
 *    planner/{자녀uid}/allowanceSnap/{토요일 날짜} 에 저장합니다. (종료하면 closed:true 로 고정)
 *  - 종료: planner/{자녀uid}/payRequests/{토요일} (용돈 요청) — 부모 앱을 열면 바로 보여요
 *  - 발송: GitHub Actions(tools/weekly-allowance.mjs)가 매시간 새로 종료된 주를 찾아
 *    부모에게 휴대폰 푸시 · 이메일을 보내고 planner/{부모uid}/notices/{토요일} 에 남깁니다.
 *  - 앱 안: 부모가 앱을 열면 읽지 않은 정산서를 알려 줍니다. (예약 발송이 설정되지 않았어도 앱이 직접 만듦)
 * ============================================================ */
const NOTIFY_DEFAULT={push:true, email:true, emailTo:""};

  if(!state.user || !state.profile) return;
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{
    // 학생 본인 플래너에서만 자동 갱신 (부모 기기는 스냅샷이 없을 때만 채움 → checkAllowanceNotices)
    if(state.profile.role!=="parent") saveAllowanceSnap(state.user.uid, state.profile.name).catch(e=>console.warn("용돈 스냅샷",e));

async function saveAllowanceSnap(uid, name, weekDays, closing){
  const days=weekDays||snapWeekDays(), weekId=days[6];
  const sref=db.collection("planner").doc(uid).collection("allowanceSnap").doc(weekId);
  if(!closing){ try{ const o=await sref.get(); if(o.exists && o.data().closed) return o.data(); }catch(_){} }   // 🏁 종료한 주는 그대로
  const [tasks, crit, capOv, payout, exd]=await Promise.all([
    fetchWeekTasks(uid,days), fetchAllowanceCrit(uid), fetchWeekCap(uid,weekId), fetchPayout(uid,weekId), fetchExtData(uid)
  ]);
  const cap=capOv!=null? capOv : null;
  const r=computeAllowance(tasks, days, crit, exd);
  const pct=Math.round(r.achievement*100), bonus=0;
  const amount=payout? Number(payout.amount)||0 : payAmount(r, cap);
  const snap={weekId, label:weekLabelOf(days), name:name||"", amount, cap, pct, bonus,
    weekMin:Math.round(r.weekMin||0), extMin:Math.round(r.extMin||0), timeTarget:Math.round(r.timeTarget||0),
    done:r.done||0, planned:r.planned||0, studyDays:r.studyDays||0, caps:r.caps||[], paid:!!payout, updatedAt:Date.now(),
    payMin:r.payMin||0, rate:r.rate||0, earned:r.earned||0, timerMin:r.timerMin||0, focusMin:r.focusMin||0,
    timePay:payAmount(r,cap)-r.appBonus-r.mockBonus, timerBonus:r.timerBonus, appBonus:r.appBonus, mockBonus:r.mockBonus,
    appAcc:r.appAcc.acc, appAnswered:r.appAcc.total, mockAcc:r.mockAcc, boost:r.boost};
  if(closing){ snap.closed=true; snap.closedAt=Date.now(); }
  await sref.set(snap);
  return snap;
}

state.notices=[];
async function checkAllowanceNotices(){
  if(!state.profile || state.profile.role!=="parent") return;
  const ref=db.collection("planner").doc(state.user.uid).collection("notices");
  try{
    // 정산서는 자녀가 🏁 이번 주 종료(= 💌 용돈 요청)를 누르면 만들어져요 (예약 알림이 휴대폰 푸시 · 이메일도 보내요)
    // 이번 주 스냅샷이 아직 없는 자녀는 부모 기기에서 채워 둠 (자녀 기기에서 계산한 값이 있으면 그대로)
    const cw=snapWeekDays()[6];
    for(const ch of state.children){
      db.collection("planner").doc(ch.uid).collection("allowanceSnap").doc(cw).get()
        .then(d=>{ if(!d.exists) return saveAllowanceSnap(ch.uid, ch.name); }).catch(()=>{});
    }
    const snap=await ref.where("read","==",false).get();
    state.notices=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.weekId<a.weekId?-1:1);
  }catch(e){ console.warn("정산 알림 확인", e); }
  // 💌 자녀의 용돈 요청
  try{
    const reqs=[];
    for(const ch of state.children){
      const q=await db.collection("planner").doc(ch.uid).collection("payRequests").where("status","==","pending").get();
      q.docs.forEach(d=>reqs.push({...d.data(), uid:ch.uid, name:ch.name, weekId:d.id}));
    }
    state.payReqs=reqs.sort((a,b)=>b.at-a.at);
    if(reqs.length) toast(`🏁 ${reqs[0].name}이(가) 이번 주를 종료하고 용돈을 요청했어요${reqs.length>1?` 외 ${reqs.length-1}건`:""}`,"info");
  }catch(e){ console.warn("용돈 요청 확인", e); }
  const n=state.notices.length;
  const b=document.getElementById("menuBtn"); if(b && n) b.classList.add("has-dot");
  if(n) toast(`💰 ${state.notices[0].label} 용돈 정산서가 도착했어요`,"info");
  if(state.tab==="stats") render();
}

async function enablePush(){
  try{
    if(!pushSupported()) return alert("이 브라우저는 푸시 알림을 지원하지 않아요.");
    const perm=await Notification.requestPermission();
    if(perm!=="granted") return alert("알림 권한을 허용해야 푸시를 받을 수 있어요.");
    const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");

function parseQuick(text){
  const subs=state.categories.subjects||[], tbs=state.categories.textbooks||[], ms=state.categories.methods||[];
  const ALIAS=[["단어","영어"],["영단어","영어"],["문법","영어"],["독해","영어"],["문장","영어"],["연산","수학"],["한국사","한국사"],["역사","한국사"]];
  return String(text||"").split(/\n|,|;|·|\s그리고\s/).map(x=>x.trim()).filter(Boolean).map(chunk=>{
    let min=30, rest=chunk;
    const h=chunk.match(/(\d+(?:\.\d+)?)\s*시간(?:\s*(\d+)\s*분)?/), m=chunk.match(/(\d+)\s*분/);
    if(h){ min=Math.round(parseFloat(h[1])*60+(h[2]?Number(h[2]):0)); rest=rest.replace(h[0]," "); }
    else if(m){ min=Number(m[1]); rest=rest.replace(m[0]," "); }
    const tb=[...tbs].sort((a,b)=>b.name.length-a.name.length).find(t=>t.name && chunk.includes(t.name));
    if(tb) rest=rest.replace(tb.name," ");
    let su=tb? subs.find(x=>x.id===tb.subjectId) : null;
    if(!su){ su=[...subs].sort((a,b)=>b.name.length-a.name.length).find(x=>chunk.includes(x.name)) || null; }
    if(su) rest=rest.replace(su.name," ");
    if(!su){ const al=ALIAS.find(([w])=>chunk.includes(w)); if(al) su=subs.find(x=>x.name===al[1])||null; }
    const me=ms.find(x=>chunk.includes(x.name));
    if(me) rest=rest.replace(me.name," ");
    const unit=rest.replace(/\s+/g," ").replace(/^[\s,.·-]+|[\s,.·-]+$/g,"").trim();
    return {subjectId:su?su.id:"", textbookId:tb?tb.id:"", method:me?me.name:"", plannedMin:Math.max(5,min||30), unit, src:chunk};
  });
}

function renderMonth(){
  const first=new Date(state.cursor.getFullYear(),state.cursor.getMonth(),1);
  const gridStart=startOfWeek(first);
  const today=new Date();
  const allDays=Array.from({length:42},(_,i)=>fmt(addDays(gridStart,i)));
  if(allDays.some(d=>state.dayTypes[d]===undefined)){ loadDayTypes(allDays).then(()=>{ if(state.view==="month") render(); }); }
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), ds=fmt(d);
    const inMonth=d.getMonth()===state.cursor.getMonth();
    const ts=tasksOn(ds), done=ts.filter(t=>t.done).length;
    const rate=ts.length?Math.round(done/ts.length*100):0;
    const rc=rate===100?"#0E9F6E":rate>=50?"#F5A524":"#94A3B8";
    const dowColor=d.getDay()===0?"#E5484D":d.getDay()===6?"#6A58E6":"#334155";
    let dots="";
    ts.slice(0,8).forEach(t=>{const s=subjById(t.subjectId);dots+=`<span class="dot" style="background:${s?s.color:"#CBD5E1"};opacity:${t.done?1:.35}"></span>`;});
    cells+=`<div class="mcell ${inMonth?"":"out"}" onclick="openDaySheet('${ds}')">
      <div class="mcell-top">
        <span class="daynum ${isSameDay(d,today)?"today":""}" style="color:${isSameDay(d,today)?"#fff":dowColor}">${d.getDate()}</span>
        ${ts.length?`<span class="rate-badge" style="background:${rc}">${done}/${ts.length}</span>`:""}
        <button class="cell-add" onclick="event.stopPropagation();openTask(null,'${ds}')">+</button>
      </div>
      ${inMonth?`<div style="margin:1px 0 2px" onclick="event.stopPropagation();toggleDayType('${ds}')" title="클릭하면 등교/자율 전환">${dayTypeBadge(ds,true)}</div>`:""}
      <div class="dotrow">${dots}</div>
    </div>`;
  }
  return `<div class="month">
    <div class="wd-head">${WD.map((w,i)=>`<div style="color:${i===6?"#6A58E6":i===0?"#E5484D":"#64748B"}">${w}</div>`).join("")}</div>

  </div>`;
}

function weekActualMin(){
  const s=startOfWeek(state.cursor);
  const days=Array.from({length:7},(_,i)=>fmt(addDays(s,i)));
  return state.tasks.filter(t=>days.includes(t.date)&&t.done).reduce((a,t)=>a+creditedMin(t),0);
}

async function rolloverIncomplete(){
  const ds=fmt(state.cursor);
  const undone=tasksOn(ds).filter(t=>!t.done);
  if(!undone.length){ toast("이월할 미완료 계획이 없어요","info"); return; }
  if(!confirm(`오늘 완료하지 못한 ${undone.length}건을 다음 날로 옮길까요?`)) return;
  const next=fmt(addDays(state.cursor,1));
  for(const t of undone){ await saveTask({...t, date:next}); }
  toast(`${undone.length}건을 내일로 옮겼어요 ↪`,"good");
}

function taskApp(t){
  const tb=tbById(t.textbookId), txt=((tb?tb.name:"")+" "+(t.unit||"")+" "+(t.episode||"")).toLowerCase();
  if(/천문장/.test(txt)) return "sentence";
  if(/그래머|grammar|문법/.test(txt)) return "grammar";
  if(/영단어|md\s*중학|voca/.test(txt)) return "vocab";
  return null;
}
function taskGo(t,k){
  const tb=tbById(t.textbookId), txt=[t.episode,t.unit].join(" "), go={task:t.id};
  if(k==="vocab"){
    const m=txt.match(/day\s*(\d+)/i); if(m) go.day=Number(m[1]);
    if(tb && /1800|중학/.test(tb.name)) go.book="mid"; else if(tb && /기본|800/.test(tb.name)) go.book="start";
  }
  if(k==="grammar") go.unit=t.unit||t.episode||"";
  return go;
}

  const k=taskApp(t); if(!k || t.done || state.viewingChild) return "";

/* ----- 계획·복기 충실도 점수 (10점 만점) -----
   계획: 학습할 범위를 적었으면 10/10, 안 적으면 2/10
   복기: 배운 내용을 적었으면 10/10, 체크만 하면 3/10          */
const PLAN_PTS={full:10, bare:2};
const REVIEW_PTS={full:10, bare:3};
function hasText(v,min){ return !!(v && String(v).trim().length>=(min||2)); }
function planPoints(t){ return (hasText(t.unit)||hasText(t.plannedNote,4))? PLAN_PTS.full : PLAN_PTS.bare; }
function reviewPoints(t){ return hasText(t.understood,5)? REVIEW_PTS.full : REVIEW_PTS.bare; }
// 두 점수의 평균이 학습 인정 배율(0.25 ~ 1.0)
// 계획·복기 점수로 시간을 깎지 않음 (습관 들이기가 우선) — 메모는 선택
function qualityRate(t){ return 1; }
/* ----- 체크 시점별 학습 인정률: 당일 100% · 다음날 50% · 이틀 후 불가 ----- */
function daysLate(dateStr, now){
  now=now||new Date();
  const today=parseD(fmt(now)), target=parseD(dateStr);
  return Math.round((today-target)/86400000); // 0=당일, 1=다음날, 2+=지연
}
function creditFor(dateStr, now){
  const d=daysLate(dateStr, now);
  // 늦게 체크해도 깎지 않음 · 일주일 안에만 체크 가능
  if(d<=7) return {rate:1, label:"인정", ok:true};
  return {rate:0, label:`${d}일 지나 체크 불가`, ok:false};
}
/* ----- 학습시간 검증: 기록한 시간 인정 (타이머로 잰 시간은 용돈 +10%) · 이상치 차단 ----- */
function allowCrit(){ const a=(state.settings&&state.settings.allowance)||defaultSettings().allowance; return {...a, exams:examList(), vacations:(state.settings&&state.settings.vacations)||[], dayTypes:state.dayTypes||{}, ...payTermsOf(a, state.payTermsRaw)}; }
function verifiedMin(t){
  const A=allowCrit();
  let actual=Number(t.actualMin)||0;
  // 이상치 차단: 계획시간의 N배, 1건당 상한
  const planCap=(Number(t.plannedMin)||0)*(Number(A.planMulti)||3);
  const hardCap=Number(A.taskCapMin)||480;
  const limit=Math.max(30, Math.min(hardCap, planCap>0?planCap:hardCap));
  actual=Math.min(actual, limit);
  // 손으로 적은 시간도 인정 (타이머로 잰 부분은 용돈에서 +10% 보너스)
  return Math.round(actual);
}
// 그중 타이머(학습 카드 ▶ 타이머 · 포커스 타이머)로 잰 시간
function timedMin(t){ return Math.round(Math.min(Number(t.timerMin)||0, verifiedMin(t))); }
// 인정 시간 = 검증시간 × 체크시점 배율 × 충실도 배율
function creditedMin(t){
  const r=(t.creditRate!=null)? Number(t.creditRate) : 1;
  return Math.round(verifiedMin(t) * r * qualityRate(t));
}

function repeatDates(startStr, endStr, mode, weekdays){
  const out=[]; let d=parseD(startStr); const end=parseD(endStr);
  if(end<d) return [startStr];
  let guard=0;
  while(d<=end && guard<400){
    const dow=d.getDay(); // 0=일 … 6=토
    let ok=false;
    if(mode==="daily") ok=true;
    else if(mode==="weekday") ok=(dow>=1&&dow<=5);
    else if(mode==="weekend") ok=(dow===0||dow===6);
    else if(mode==="custom") ok=(weekdays||[]).includes(dow);
    if(ok) out.push(fmt(d));
    d=addDays(d,1); guard++;
  }
  return out.length?out:[startStr];
}

async function saveFromModal(){

/* ----- 일정 삭제 (구글 캘린더처럼 '이 일정만' / '이 일정 및 이후 일정') ----- */
// 같은 반복 묶음(series) — 예전 항목은 과목 · 교재 · 내용 · 방법 · 시간이 같은 이후 일정으로 판단. 완료한 기록은 남김
async function followingTasks(t){
  let later=[];
  try{ later=(await plannerRef().collection("tasks").where("date",">",t.date).get()).docs.map(d=>({...d.data(), id:d.id})); }
  catch(e){ later=state.tasks.filter(x=>x.date>t.date); }
  const same=x=> t.series? x.series===t.series
    : (x.subjectId===t.subjectId && (x.textbookId||"")===(t.textbookId||"") && (x.unit||"")===(t.unit||"")
       && (x.method||"")===(t.method||"") && Number(x.plannedMin)===Number(t.plannedMin));
  return later.filter(x=>x.id!==t.id && !x.done && same(x)).sort((a,b)=>a.date<b.date?-1:1);
}
function dlgClose(){ const d=document.getElementById("dlgRoot"); if(d) d.remove(); }
async function askDelete(id){
  const t=state.tasksMap[id]; if(!t) return;
  const fol=await followingTasks(t);
  const su=subjById(t.subjectId), d=parseD(t.date);
  const when=`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  dlgClose();
  const w=document.createElement("div"); w.id="dlgRoot";
  w.innerHTML=`<div class="dlg-ov" onclick="if(event.target===this)dlgClose()"><div class="dlg">
    <h3>일정 삭제</h3>
    <div class="dlg-ev"><span class="dlg-bar" style="background:${su?su.color:"#94A3B8"}"></span>
      <div><b>${esc(t.unit||(su?su.name:"학습"))}</b><small>${esc(su?su.name:"")} · ${when}${t.done?" · 완료한 기록":""}</small></div></div>
    ${fol.length? `

      : `<p class="dlg-msg">이 일정을 삭제할까요?${t.done?"<br><small>완료한 기록도 함께 지워지고 이번 주 용돈 계산에서 빠져요.</small>":""}</p>`}
    <div class="dlg-btns"><button class="tm-btn" onclick="dlgClose()">취소</button>
      <button class="tm-btn del" onclick="doDelete('${id}')">삭제</button></div>
  </div></div>`;
  document.body.appendChild(w);
  w._fol=fol;
}
async function doDelete(id){
  const w=document.getElementById("dlgRoot"); if(!w) return;
  const scope=(w.querySelector('input[name="dlgScope"]:checked')||{}).value||"one";
  const ids=[id, ...(scope==="after"? (w._fol||[]).map(x=>x.id) : [])];
  dlgClose(); closeModal();
  for(const x of ids){ try{ await deleteTaskDoc(x); }catch(e){ console.error("삭제", e); } }
  toast(ids.length>1? `일정 ${ids.length}개를 삭제했어요` : "일정을 삭제했어요","info");
}

async function drawDashboard(){
  // 넓은 범위 로드
  const all=await plannerRef().collection("tasks").get();
  const my=all.docs.map(d=>d.data());
  const done=my.filter(t=>t.done);
  const rate=my.length?Math.round(done.length/my.length*100):0;
  const totalMin=done.reduce((a,t)=>a+creditedMin(t),0);
  // 스트릭
  const dset=new Set(done.map(t=>t.date));
  let streak=0,d=new Date(); if(!dset.has(fmt(d)))d=addDays(d,-1);
  while(dset.has(fmt(d))){streak++;d=addDays(d,-1);}

/* ============================================================
 *  10-b) 용돈 정산 (주 상한 + 이행률·문제점수·복습 종합)
 * ============================================================ */
// 정산 주간도 캐릭터/계획과 동일하게 일요일 시작(일~토) · 🏁 학생이 종료하면 정산
function allowanceWeekDays(d){ const s=startOfWeek(d||new Date()); return Array.from({length:7},(_,i)=>fmt(addDays(s,i))); }
function weekLabelOf(days){ const s=parseD(days[0]),e=parseD(days[6]); return `${s.getMonth()+1}.${s.getDate()}~${e.getMonth()+1}.${e.getDate()}`; }

/* ============================================================
 *  💰 주간 용돈 = ⏱ 시간 용돈 + 📚 학습앱 정답률 보너스 + 📝 모의고사 정답률 보너스
 *  - 시간 용돈: 공부한 시간 × 1시간당 금액 (평소 · 시험기간(부스터) 최대 — 부모가 자녀별로 정해요, 기본 1만 원 · 2만 원)
 *    🚀 부스터(학생이 켬) 날은 하루 최대 인정 시간이 늘어나요 (기본 등교일 4→6시간 · 자율학습일 8→10시간)
 *       대신 시험 대비 공부만 인정 — 그날 학습앱 시간과 학습앱 정답률 보너스는 빼요
 *    + 타이머 보너스: 그중 타이머로 잰 부분의 10% (상한과 별도)
 *    → 1시간당 금액은 그대로라 시험기간 상한을 채우려면 공부 시간이 두 배 필요
 *  - 학습앱 보너스: 영단어 · 그래머 인사이드 · 천문장이 직접 채점한 그 주 정답률 (최대 5천 원)
 *  - 모의고사 보너스: 그 주 공부한 일반과목 범위로 본 모의고사 점수를 부모가 입력 (최대 5천 원)
 *  - 정답률 → 보너스: 60% 이하 0원, 95% 이상 최대, 그 사이 비례 (100원 단위)
 *  - 기준은 payTerms/{자녀uid} 에 저장 → 보안 규칙상 연결된 부모만 바꿀 수 있음
 * ============================================================ */
const PAY_DEFAULT={hourlyRate:1000, timerBonusRate:0.1, cap:10000, boostCap:20000, dailyMaxMin:240, dailyMaxFreeMin:480, boostDayMaxMin:360, boostDayMaxFreeMin:600, includeApps:true,
  appBonusMax:5000, mockBonusMax:5000, accFloor:0.6, accFull:0.95, appMinAnswers:30, mocks:{}};
function payTermsOf(allowance, pt){ return {...PAY_DEFAULT, ...(pt||{})}; }
async function fetchPayTerms(uid){

  catch(e){ console.warn("용돈 기준 읽기", e); return null; }
}
async function savePayTerms(uid, patch){
  try{
    const cur=(await fetchPayTerms(uid))||{};
    await db.collection("payTerms").doc(uid).set({...cur, ...patch, updatedAt:Date.now(), updatedBy:state.user.uid});

    return true;
  }catch(e){
    console.error("용돈 기준 저장", e);
    alert("용돈 기준을 저장하지 못했어요.\n\nFirebase에 게시된 보안 규칙에 용돈 기준(payTerms) 규칙이 아직 없어요.\n· GitHub 저장소 → Actions → '보안 규칙 게시' → Run workflow, 또는\n· Firebase 콘솔 → Firestore → 규칙에 저장소의 firestore.rules 를 붙여넣고 '게시'\n\n"+firestoreDiag(e));
    return false;
  }
}
// 정답률 → 보너스 (floor 이하 0, full 이상 최대, 사이는 비례)
function accBonus(acc, max, floor, full){
  if(acc==null || !(max>0)) return 0;
  const k=Math.max(0, Math.min(1, (acc-floor)/Math.max(0.01, full-floor)));
  return Math.round(max*k/100)*100;
}
// 세 학습앱이 채점한 그 주 정답 수
function appAccuracy(days, X){
  const per={sentence:{c:0,t:0}, vocab:{c:0,t:0}, grammar:{c:0,t:0}};
  days.forEach(ds=>{
    const s=X.sentence&&X.sentence.days[ds]; if(s){ per.sentence.c+=num(s.ok); per.sentence.t+=num(s.ok)+num(s.no); }
    const v=X.vocab&&X.vocab.days[ds];       if(v){ per.vocab.c+=num(v.correct); per.vocab.t+=num(v.total); }
    const g=X.grammar&&X.grammar.days[ds];   if(g){ per.grammar.c+=num(g.correct); per.grammar.t+=num(g.answered); }
  });
  const c=per.sentence.c+per.vocab.c+per.grammar.c, t=per.sentence.t+per.vocab.t+per.grammar.t;
  return {correct:c, total:t, acc:t? c/t : null, per};
}
// 시험기간(부스터) 주인가 — 계산 대상 자녀의 부스터 목록 기준
function isBoostWeek(days, exams){
  const list=Array.isArray(exams)? exams : examList();
  return (days||[]).some(ds=>!!examFor(ds, list));
}
// 용돈 계산용 등교일/자율학습일 판정 — 계산 대상 자녀의 설정(방학 · 날짜별 지정) 기준
function payDayType(ds, T){
  const ov=T.dayTypes && T.dayTypes[ds];
  if(ov==="school"||ov==="free") return ov;
  for(const v of (T.vacations||[])){ if(v && v.from && v.to && ds>=v.from && ds<=v.to) return "free"; }
  const dow=parseD(ds).getDay();
  return (dow===0||dow===6)? "free" : "school";
}
function computeAllowance(tasks, days, crit, exd){
  const wk=tasks.filter(t=>days.includes(t.date));
  const planned=wk.length, done=wk.filter(t=>t.done).length;
  const planMinAll=wk.reduce((a,t)=>a+(Number(t.plannedMin)||0),0);
  const planMinDone=wk.filter(t=>t.done).reduce((a,t)=>a+(Number(t.plannedMin)||0),0);
  const completion = planMinAll>0? planMinDone/planMinAll : (planned? done/planned : 0);
  const scored=wk.filter(t=>t.done && Number(t.scoreTotal)>0 && t.score!=="" && t.score!=null);
  const scoreRate = scored.length? scored.reduce((a,t)=>a+Number(t.score)/Number(t.scoreTotal),0)/scored.length : null;
  const reviews=wk.filter(t=>t.done && t.method==="복습").length;
  const studyDays=new Set(wk.filter(t=>t.done).map(t=>t.date)).size;
  const T={...PAY_DEFAULT, ...crit};
  const X=exd || extData();
  // ⏱ 시간 용돈
  const focusFree=(X && X.focusFree) || {};
  const rate=Math.max(0, Number(T.hourlyRate)||0);
  const dayMaxSchool=Math.max(0, Number(T.dailyMaxMin)||0), dayMaxFree=Math.max(0, Number(T.dailyMaxFreeMin)||0);
  const dayMax=dayMaxSchool;
  const exams=Array.isArray(T.exams)? T.exams : examList();
  const byDay=days.map(ds=>{
    const type=payDayType(ds, T), boosted=!!examFor(ds, exams);
    // 등교일 / 자율학습일(주말·방학) 하루 최대 — 🚀 부스터 날은 늘어난 최대
    const cap=boosted? Math.max(0, Number(type==="free"? T.boostDayMaxFreeMin : T.boostDayMaxMin)||0) : (type==="free"? dayMaxFree : dayMaxSchool);
    const dt=wk.filter(t=>t.date===ds && !t.appLinked);   // 학습앱 할 일은 앱이 잰 시간으로 인정
    const task=dt.reduce((a,t)=>a+verifiedMin(t),0);                            // 과제에 기록한 시간 (직접 적은 시간 포함)
    const taskTimed=dt.reduce((a,t)=>a+timedMin(t),0);                         // 그중 타이머로 잰 시간
    const focus=Math.round(Number(focusFree[ds])||0);                          // 과제 없이 쓴 포커스 타이머
    const appAll=(T.includeApps!==false)? extCreditedOn(ds, X).total : 0;       // 학습앱이 잰 시간
    const app=boosted? 0 : appAll;                                              // 🚀 부스터 날은 시험 대비 공부만 — 학습앱 시간 제외
    const raw=task+focus+app, paid=cap>0? Math.min(raw, cap) : raw;
    const timedPaid=Math.min(taskTimed+focus, paid);                           // 인정 시간 중 타이머 몫
    return {ds, type, boosted, cap, appSkipped:appAll-app, task, timer:taskTimed, focus, app, raw, paid, timedPaid};
  });
  const sum=k=>byDay.reduce((a,d)=>a+d[k],0);
  const taskMin=sum("task"), timerMin=sum("timer"), focusMin=sum("focus"), appMin=sum("app"), rawMin=sum("raw"), payMin=sum("paid"), timedPaidMin=sum("timedPaid");
  const timerBonusRate=Math.max(0, Number(T.timerBonusRate)||0), timedShare=payMin>0? timedPaidMin/payMin : 0;
  const boost=isBoostWeek(days, T.exams);
  const timeCap=Math.max(0, Number(boost? T.boostCap : T.cap)||0);
  const earned=Math.round(payMin/60*rate/10)*10;                                 // 10원 단위
  const basePay=timeCap>0? Math.min(timeCap, earned) : earned;
  const timerBonus=Math.round(basePay*timedShare*timerBonusRate/10)*10;         // ⏱ 타이머 보너스 (상한과 별도)
  const timePay=basePay+timerBonus;
  // 📚 학습앱 정답률 보너스
  const accDays=byDay.filter(d=>!d.boosted).map(d=>d.ds);                       // 🚀 부스터 날 푼 학습앱 문제는 보너스에서도 제외
  const acc=appAccuracy(accDays, X);
  const appSkipMin=sum("appSkipped"), boostDays=byDay.filter(d=>d.boosted).length;
  const appOk=acc.total>=(Number(T.appMinAnswers)||0);
  const appBonus=appOk? accBonus(acc.acc, Number(T.appBonusMax)||0, Number(T.accFloor), Number(T.accFull)) : 0;
  // 📝 모의고사 정답률 보너스 (부모가 입력)
  const mock=(T.mocks||{})[days[6]]||null;
  const mockAcc=mock && Number(mock.total)>0? Math.min(1, Number(mock.correct)/Number(mock.total)) : null;
  const mockBonus=accBonus(mockAcc, Number(T.mockBonusMax)||0, Number(T.accFloor), Number(T.accFull));
  const amount=timePay+appBonus+mockBonus;
  return {planned, done, completion, scoreRate, scoredCount:scored.length, reviews, studyDays, daysTarget:Number(crit.daysTarget)||5,
    weekMin:rawMin, taskMin, timerMin, focusMin, appMin, timedPaidMin, timedShare, timerBonusRate, basePay, timerBonus, extMin:appMin, payMin, overDayMin:rawMin-payMin, byDay,
    rate, dayMax, dayMaxSchool, dayMaxFree, includeApps:T.includeApps!==false, boost, boostDays, appSkipMin, timeCap, earned, timePay,
    appAcc:acc, appOk, appMinAnswers:Number(T.appMinAnswers)||0, appBonus, appBonusMax:Number(T.appBonusMax)||0,
    mock, mockAcc, mockBonus, mockBonusMax:Number(T.mockBonusMax)||0, accFloor:Number(T.accFloor), accFull:Number(T.accFull),
    amount, total:amount, bonus:appBonus+mockBonus, overMin:0, timeTarget:0, boostRate:1, effCap:timeCap,
    achievement: (timeCap+ (Number(T.appBonusMax)||0) + (Number(T.mockBonusMax)||0))>0? amount/(timeCap+(Number(T.appBonusMax)||0)+(Number(T.mockBonusMax)||0)) : 0, caps:[]};
}
// 이번 주 시간 상한만 따로 바꾼 경우 (cap이 없으면 평소/시험기간 기본 상한)
function payAmount(r, cap){
  const c=(cap!=null && cap!=="")? Math.max(0, Number(cap)||0) : r.timeCap;
  const base=c>0? Math.min(c, r.earned) : r.earned;
  const tb=Math.round(base*(r.timedShare||0)*(r.timerBonusRate||0)/10)*10;
  return base+tb+r.appBonus+r.mockBonus;
}

 *  10-c) 부모용 자녀 리포트 (평균 학습시간 + 과목·목차)
 * ============================================================ */
function calcStudyStats(tasks){
  const done=tasks.filter(t=>t.done);
  const m=t=>creditedMin(t);
  const today=new Date(), tds=fmt(today);
  const inLast=(n)=>{const set=new Set(Array.from({length:n},(_,i)=>fmt(addDays(today,-i))));return done.filter(t=>set.has(t.date));};
  const todayMin=done.filter(t=>t.date===tds).reduce((a,t)=>a+m(t),0);
  const d7=inLast(7), d30=inLast(30);
  const sum7=d7.reduce((a,t)=>a+m(t),0), sum30=d30.reduce((a,t)=>a+m(t),0);
  const wkDays=allowanceWeekDays(today);
  const weekMin=done.filter(t=>wkDays.includes(t.date)).reduce((a,t)=>a+m(t),0);
  const monthPrefix=tds.slice(0,7);
  const monthDone=done.filter(t=>t.date.startsWith(monthPrefix));
  const monthMin=monthDone.reduce((a,t)=>a+m(t),0);
  const monthStudyDays=new Set(monthDone.map(t=>t.date)).size;
  // 과목별 시간 + 학습한 단원 목차 (최근 완료순)
  const bySub={};
  done.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(t=>{
    const b=(bySub[t.subjectId]=bySub[t.subjectId]||{min:0,units:[]});
    b.min+=m(t);
    const u=(t.unit||"").trim();
    if(u && !b.units.includes(u)) b.units.push(u);
  });
  return { todayMin, avg7:Math.round(sum7/7), avg30:Math.round(sum30/30),
    weekMin, monthMin, monthAvg: monthStudyDays? Math.round(monthMin/monthStudyDays):0,
    monthStudyDays, doneCount:done.length, bySub };
}
function hmFmt(min){ min=Number(min)||0; const h=Math.floor(min/60),m2=min%60; return h? `${h}시간 ${m2?m2+"분":""}`.trim() : `${m2}분`; }

state.timer=null;      // {taskId, startAt}
let timerTick=null;
function timerElapsedMin(){ return state.timer? (Date.now()-state.timer.startAt)/60000 : 0; }
function fmtClock(min){
  const s=Math.max(0,Math.floor(min*60));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return (h?`${h}:`:"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0");
}
function startTimer(id){
  const t=state.tasksMap[id]; if(!t) return;
  if(typeof F!=="undefined" && (F.mode==="run"||F.mode==="pause") && F.taskId===id){ toast("⏱ 포커스 타이머가 이 과제를 재고 있어요","info"); setTab("timer"); return; }

    stopTimer(true);
  }
  state.timer={taskId:id, startAt:Date.now()};
  if(timerTick) clearInterval(timerTick);
  timerTick=setInterval(updateTimerUI,1000);
  render();
  toast("⏱ 타이머 시작! 집중해 볼까요","good");
}
async function stopTimer(silent){
  if(!state.timer) return;
  const taskId=state.timer.taskId;
  const add=Math.round(timerElapsedMin());
  state.timer=null;
  if(timerTick){ clearInterval(timerTick); timerTick=null; }
  const t=state.tasksMap[taskId];
  if(t){
    const timerMin=(Number(t.timerMin)||0)+add;
    const actualMin=Math.max(Number(t.actualMin)||0, timerMin);
    await saveTask({...t, timerMin, actualMin});
    if(!silent) toast(`⏹ ${add}분 기록! 총 ${timerMin}분 실측`,"cheer");
  }
  render();
}

state.plans=null;
async function loadPlans(){
  try{ const s=await planCol().get(); state.plans=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.end||"")<(b.end||"")?-1:1); }
  catch(e){ console.warn("계획표", e); state.plans=[]; }
  return state.plans;

// 가장 가까운 시험 D-day (계획표의 시험 · 🚀 부스터 시험)
function nextExam(ds){
  ds=ds||fmt(new Date());
  const L=[...(state.plans||[]).filter(p=>p.kind==="exam" && p.end>=ds).map(p=>({name:p.name, date:p.end})),
    ...examList().filter(e=>e.date>=ds).map(e=>({name:e.name, date:e.date}))].sort((a,b)=>a.date<b.date?-1:1);
  return L[0]? {...L[0], dd:Math.round((parseD(L[0].date)-parseD(ds))/86400000)} : null;
}
function planDates(from, to){ const out=[]; if(!from||!to) return out; for(let d=parseD(from); fmt(d)<=to; d=addDays(d,1)) out.push(fmt(d)); return out; }
// 한 줄의 배치: 고른 요일에 하루 n개씩 순서대로, 남는 날은 버퍼
function planLayout(row){
  const dates=planDates(row.from, row.to).filter(ds=>(row.days||[]).includes(parseD(ds).getDay()));
  const chunks=(row.chunks||[]).filter(x=>String(x).trim());
  let per=Math.max(1, Number(row.perDay)||1), short=false;
  if(dates.length && chunks.length>dates.length*per){ per=Math.ceil(chunks.length/dates.length); short=true; }
  const map={}; let i=0;
  dates.forEach(ds=>{ if(i<chunks.length){ map[ds]=chunks.slice(i, i+per); i+=per; } else map[ds]=null; });
  return {dates, map, per, short, chunks};
}
function planTasks(p){
  const out=[];
  (p.rows||[]).forEach((row,ri)=>{
    const L=planLayout(row);
    L.dates.forEach((ds,k)=>{ const c=L.map[ds]; if(!c) return;
      out.push({id:`pl-${p.id}-${row.id}-${k}`, date:ds, subjectId:row.subjectId||"", textbookId:row.textbookId||"",
        unit:[row.textbookId? "" : (row.book||""), c.join(", ")].filter(Boolean).join(" · "),
        plannedMin:Number(row.min)||30, done:false, order:Date.now()+ri*100+k, planId:p.id, planRow:row.id, planName:p.name}); });
  });
  return out;
}
// 저장 + 할 일 만들기 (끝낸 할 일은 그대로, 안 한 옛 할 일은 지우고 새로)
async function planApply(p){
  const want=planTasks(p), ids=new Set(want.map(t=>t.id));
  const cur=await plannerRef().collection("tasks").where("planId","==",p.id).get();
  const have={}; cur.docs.forEach(d=>have[d.id]=d.data());
  const by=(state.viewingChild && state.profile.role==="parent")? {uid:state.user.uid, name:state.profile.name||"부모님"} : null;
  let ops=[];
  for(const d of cur.docs){ if(!ids.has(d.id) && !d.data().done) ops.push(b=>b.delete(d.ref)); }
  for(const t of want){ const h=have[t.id]; if(h && h.done) continue;
    const ref=plannerRef().collection("tasks").doc(t.id);
    ops.push(b=>b.set(ref, {...(h||{}), ...t, ...(h && h.moved? {date:h.date} : {}), ...(by && !h? {byParent:by} : {})})); }
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
  return want.length;
}
async function planDelete(id){
  if(!confirm("이 계획표를 지울까요?\n아직 안 한 할 일도 함께 지워요 (끝낸 기록은 남아요).")) return;
  const cur=await plannerRef().collection("tasks").where("planId","==",id).get();
  const b=db.batch(); cur.docs.forEach(d=>{ if(!d.data().done) b.delete(d.ref); }); await b.commit();
  await planCol().doc(id).delete();
  await loadPlans(); closeDrawer(); render();
}

    const rows=p.rows.map(r=>{ const L=planLayout(r), su=subjById(r.subjectId); let idx=0; const pos={}; L.dates.forEach((ds,k)=>pos[ds]=k);

const autoOn=k=>{ const a=(state.settings && state.settings.auto)||{}; return a[k]!==false; };

/* ① 밀린 계획 재배치 */
const reflowRan={};
async function planReflow(manual){
  const owner=state.ownerUid; if(!owner || (!manual && !autoOn("reflow"))) return 0;
  const today=fmt(new Date()), key=owner+":"+today;
  if(!manual && reflowRan[key]) return 0; reflowRan[key]=1;
  if(state.plans===null) await loadPlans();
  let moved=0;
  for(const p of (state.plans||[])){
    if(p.end<today) continue;
    let T=[]; try{ T=(await plannerRef().collection("tasks").where("planId","==",p.id).get()).docs.map(d=>d.data()); }catch(_){ continue; }
    const late=T.filter(t=>!t.done && t.date<today).sort((a,b)=>a.date<b.date?-1:1); if(!late.length) continue;
    const batch=db.batch(); let n=0;
    for(const row of (p.rows||[])){
      const L=planLayout(row), mine=late.filter(t=>t.planRow===row.id); if(!mine.length) continue;
      const load={}; T.filter(t=>t.planRow===row.id && !t.done && t.date>=today).forEach(t=>load[t.date]=(load[t.date]||0)+1);
      const future=L.dates.filter(ds=>ds>=today);
      for(const t of mine){
        if(!future.length) break;
        // 버퍼 날(배정 없음)부터, 없으면 할 일이 가장 적은 공부 날
        const buf=future.find(ds=>!L.map[ds] && !load[ds]);
        const ds=buf || future.slice().sort((a,b)=>(load[a]||0)-(load[b]||0) || (a<b?-1:1))[0];
        load[ds]=(load[ds]||0)+1;
        batch.update(plannerRef().collection("tasks").doc(t.id), {date:ds, moved:true, movedFrom:t.movedFrom||t.date, movedAt:Date.now()});
        n++;
      }
    }
    if(n){ await batch.commit(); moved+=n; delete state.planTasks[p.id]; }
  }
  if(moved){ toast(`↪ 밀린 계획 ${moved}개를 버퍼 날로 옮겼어요`,"info"); subscribeTasks(); }
  else if(manual) toast("밀린 계획이 없어요 👍","good");
  return moved;
}

/* ----- ⚡ 한 줄로 계획 넣기 (규칙으로 해석) -----
 *  예) 수학 올림포스 p.10-60 5쪽씩 월~금 40분
 *      영어 강성태 영단어 DAY 1-58 월수금 하루 2개
 *      국어 문학 작품 19개 매일                                      */
const DAYMAP={"일":0,"월":1,"화":2,"수":3,"목":4,"금":5,"토":6};
function parseDays(s){
  if(/매일/.test(s)) return [0,1,2,3,4,5,6];
  if(/평일/.test(s)) return [1,2,3,4,5];
  if(/주말/.test(s)) return [0,6];
  const rg=s.match(/([일월화수목금토])\s*[~\-]\s*([일월화수목금토])/);
  if(rg){ const a=DAYMAP[rg[1]], b=DAYMAP[rg[2]], out=[]; for(let i=0;i<7;i++){ const d=(a+i)%7; out.push(d); if(d===b) break; } return out; }
  const one=s.match(/(?:^|\s)([일월화수목금토]{2,7})(?:요일)?(?=\s|$)/);
  if(one) return [...new Set(one[1].split("").map(c=>DAYMAP[c]))];
  return null;
}
function parsePlanLine(line){
  let s=" "+String(line||"").trim()+" "; if(!s.trim()) return null;
  const subs=state.categories.subjects||[], tbs=state.categories.textbooks||[];
  const su=subs.slice().sort((a,b)=>b.name.length-a.name.length).find(x=>s.includes(x.name));
  if(su) s=s.replace(su.name," ");
  const tb=tbs.filter(t=>!su || t.subjectId===su.id).sort((a,b)=>b.name.length-a.name.length).find(t=>s.includes(t.name));
  if(tb) s=s.replace(tb.name," ");
  let min=30; s=s.replace(/(\d+)\s*분/,(m,a)=>{ min=Number(a); return " "; });
  let per=1; s=s.replace(/하루\s*(\d+)\s*개?/,(m,a)=>{ per=Number(a); return " "; });
  const days=parseDays(s)||[1,2,3,4,5];
  s=s.replace(/매일|평일|주말/g," ").replace(/[일월화수목금토]\s*[~\-]\s*[일월화수목금토]/g," ").replace(/(^|\s)[일월화수목금토]{2,7}(요일)?(?=\s|$)/g," ");
  let step=1; s=s.replace(/(\d+)\s*(쪽|개|강|회|단원|일차)?\s*씩/,(m,a)=>{ step=Number(a); return " "; });
  let chunks=[];
  const rg=s.match(/([A-Za-z가-힣.]*)\s*\.?\s*(\d+)\s*[~\-]\s*(\d+)\s*(강|쪽|단원|회|일차)?/);
  if(rg){ const pre=rg[1]||"", a=Number(rg[2]), b=Number(rg[3]), suf=rg[4]||"";
    for(let x=a;x<=b;x+=step){ const y=Math.min(b,x+step-1); chunks.push(`${pre}${pre&&!/[.\s]$/.test(pre)?" ":""}${x===y?x:`${x}-${y}`}${suf}`.trim()); }
    s=s.replace(rg[0]," "); }
  else { const cnt=s.match(/(\d+)\s*개/); if(cnt){ const n=Number(cnt[1]); s=s.replace(cnt[0]," "); const name=s.replace(/\s+/g," ").trim()||"범위"; chunks=Array.from({length:n},(_,i)=>`${name} ${i+1}`); s=""; } }
  const book=s.replace(/\s+/g," ").trim();
  return {subjectId:su?su.id:"", textbookId:tb?tb.id:"", book:tb? "" : book, chunks, days, perDay:Math.max(1,per), min, _subj:su?su.name:"", _tb:tb?tb.name:""};
}

    const cells=[]; let k0=-1, n=0; days.forEach(ds=>{ const k=phaseOf(ds); if(k!==k0){ if(n) cells.push([k0,n]); k0=k; n=0; } n++; }); if(n) cells.push([k0,n]);

      <tr><th colspan="2"></th>${cells.map(([k,c])=>`<th colspan="${c}" style="background:${PHASE_C[k%PHASE_C.length]}">${esc((p.phases[k]||{}).name||"")}</th>`).join("")}</tr>
      <tr><th>과목</th><th>목표</th>${days.map(ds=>{ const d=parseD(ds), w=d.getDay(); return `<th class="${w===0?"sun":w===6?"sat":""}">${d.getDate()}<br>${WD[w]}</th>`; }).join("")}</tr>`;
    p.rows.forEach(r=>{ const L=planLayout(r), pos={}; L.dates.forEach((ds,k)=>pos[ds]=k);

    return head+h+`</table>`;
  }
  const weeks=[]; for(let s=startOfWeek(parseD(p.start)); fmt(s)<=p.end; s=addDays(s,7)) weeks.push(s);
  const mh=[]; weeks.forEach(w=>{ const m=w.getMonth()+1; if(mh.length && mh[mh.length-1][0]===m) mh[mh.length-1][1]++; else mh.push([m,1]); });
  const wn={};

    <tr>${weeks.map(w=>{ const m=w.getMonth(); wn[m]=(wn[m]||0)+1; return `<th>${wn[m]}주</th>`; }).join("")}</tr>`;

      return `<td class="c" style="background:${su?su.color:"#999"}22">${esc(all.length>1? `${all[0]} ~ ${all[all.length-1]}` : all[0])}</td>`; }).join("")}</tr>`; });

function ttPrint(){
  const L=ttList(); if(!L.length) return alert("시간표가 비어 있어요.");
  const lo=Math.min(...L.map(b=>hm2m(b.s))), hi=Math.max(...L.map(b=>hm2m(b.e)));
  const h0=Math.floor(Math.min(lo,9*60)/60)*60, h1=Math.ceil(Math.max(hi,18*60)/60)*60, step=30, rows=[];
  for(let m=h0;m<h1;m+=step) rows.push(m);
  const used={};   // 이미 그린 칸 (rowspan)
  let h=`<h1>🗓 ${esc(state.ownerName||"")}의 주간 시간표</h1><div class="sub">요일마다 고정된 학원 · 과외 · 자습 시간</div>
    <table class="tt"><colgroup><col style="width:80px">${TT_DAYS.map(()=>`<col>`).join("")}</colgroup>
    <tr><th></th>${TT_DAYS.map(d=>`<th class="${d===0?"sun":d===6?"sat":""}">${WD[d]}</th>`).join("")}</tr>`;
  rows.forEach(m=>{
    h+=`<tr><th>${m2hm(m)}~${m2hm(m+step)}</th>`;
    TT_DAYS.forEach(d=>{ if(used[d+":"+m]) return;
      const b=L.find(x=>(x.days||[]).includes(d) && hm2m(x.s)<=m && hm2m(x.e)>m);
      if(!b){ h+=`<td></td>`; return; }
      const end=Math.min(h1, hm2m(b.e)), span=Math.max(1, Math.ceil((end-m)/step));
      for(let k=1;k<span;k++) used[d+":"+(m+k*step)]=1;
      h+=`<td class="b" rowspan="${span}" style="background:${b.color||"#6A58E6"}26;border-left:3px solid ${b.color||"#6A58E6"}">${esc(b.title)}<br><small>${b.s}~${b.e}</small></td>`; });
    h+=`</tr>`; });
  printDoc("주간 시간표", h+`</table>`, true);
}

function downloadFile(name, text, type){
  const blob=new Blob([text], {type}), a=document.createElement("a");

  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
const icsDT=(ds,hm)=>ds.replace(/-/g,"")+(hm? "T"+hm.replace(":","")+"00" : "");
function icsWrap(name, ev){
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//nogang//planner//KO","CALSCALE:GREGORIAN",`X-WR-CALNAME:${icsEsc(name)}`,"X-WR-TIMEZONE:Asia/Seoul",
    "BEGIN:VTIMEZONE","TZID:Asia/Seoul","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0900","TZOFFSETTO:+0900","TZNAME:KST","END:STANDARD","END:VTIMEZONE",
    ...ev,"END:VCALENDAR"].join("\r\n");
}
const ICS_DAY=["SU","MO","TU","WE","TH","FR","SA"];
function ttICS(){
  const L=ttList(); if(!L.length) return alert("시간표가 비어 있어요.");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z", today=new Date();
  const ev=L.map(b=>{ let d=new Date(today); for(let i=0;i<7 && !(b.days||[]).includes(d.getDay());i++) d=addDays(d,1); const ds=fmt(d);
    return ["BEGIN:VEVENT",`UID:tt-${b.id}@nogang`,`DTSTAMP:${stamp}`,`DTSTART;TZID=Asia/Seoul:${icsDT(ds,b.s)}`,`DTEND;TZID=Asia/Seoul:${icsDT(ds,b.e)}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${(b.days||[]).map(x=>ICS_DAY[x]).join(",")}`,`SUMMARY:${icsEsc(b.title)}`,"END:VEVENT"].join("\r\n"); });
  downloadFile("주간시간표.ics", icsWrap(`${state.ownerName||""} 시간표`, ev), "text/calendar;charset=utf-8");
