    <input type="file" id="file" accept="application/json" class="hidden">
  </div>`);
  v.querySelector('#goal').onclick=e=>{const g=e.target.dataset.g;if(g){S.goal=+g;save();go('settings');}};
  v.querySelector('#adv').onclick=()=>{S.adv=!S.adv;save();go('settings');toast(S.adv?'심화 모드 켜짐':'심화 모드 꺼짐');};
  const lo=v.querySelector('#logout'); if(lo)lo.onclick=()=>{ try{ if(_cloudT){clearTimeout(_cloudT);} if(CLOUD&&UID&&fbDB){cloudPush();} }catch(e){} fbAuth.signOut(); };
  const fo=v.querySelector('#famopen'); if(fo) fo.onclick=openFamilyInPlanner;
  v.querySelector('#test-spk').onclick=()=>{speak('A strange thing happened to me.');toast('소리가 안 나면 기기 음량/무음 모드를 확인하세요');};
  v.querySelector('#bk').onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='천문장_진행_'+todayStr()+'.json';a.click();toast('백업 파일을 저장했어요');
  };
  v.querySelector('#rs').onclick=()=>v.querySelector('#file').click();
  v.querySelector('#file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d.cards){
      // 새 문장이 추가됐을 수 있으니 병합
      SENTENCES.forEach(s=>{if(!d.cards[s.n])d.cards[s.n]={box:0,due:0,seen:0,ok:0,no:0,star:false};});
      S=d;save();go('home');toast('복원했어요');}else toast('형식이 올바르지 않아요');
    }catch(err){toast('파일을 읽을 수 없어요');}};r.readAsText(f);
  };
  v.querySelector('#reset').onclick=()=>{if(confirm('정말 모든 진행을 초기화할까요?')){S=fresh();save();go('home');toast('초기화했어요');}};
  return v;
}

/* ============================ 하단 네비 ============================ */
function drawNav(){
  let nav=$('.nav');if(nav)nav.remove();
  if(SESSION){return;}
  const tabs=[['home','🏠','홈'],['book','📑','문장방'],['grammar','📘','문법방'],['stats','📊','통계'],['settings','⚙️','설정']];
  nav=el(`<div class="nav">${tabs.map(([k,ic,l])=>`<button class="${TAB===k?'on':''}" data-k="${k}"><span class="ic">${ic}</span><span>${l}</span></button>`).join('')}</div>`);
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='grammar'){grammarUnit=null;grammarPoint=null;}
    if(k==='book'){bookCat=null;}
    go(k);
  });
  document.body.appendChild(nav);
}

/* 음성 목록 로드 */
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
function showBootError(msg){
  try{var a=document.getElementById('app')||document.body;
    a.innerHTML='<div style="padding:24px;font-family:sans-serif;color:#1C1B24;line-height:1.7">'
      +'<h3 style="color:#DC2626">앱을 여는 중 문제가 발생했어요</h3>'
      +'<p style="font-size:13px;color:#5E6485">아래 메시지를 캡처해 보내주시면 정확히 고치겠습니다.</p>'
      +'<pre style="white-space:pre-wrap;font-size:12px;background:#F3F4F6;padding:12px;border-radius:8px">'+String(msg)+'</pre></div>';
  }catch(e){}
}
window.onerror=function(m,src,ln,col,err){showBootError((err&&err.stack)?err.stack:(m+' @'+ln+':'+col));return false;};

/* ---------- 로그인 화면 ---------- */
let authMode='login';
// 가족 연결은 플래너에서 (상대 이메일로 신청 → 상대가 승인)
function openFamilyInPlanner(){
  try{ if(window.parent!==window && typeof parent.drawFamily==="function"){ parent.closeLearnApp(); parent.drawFamily(); return; } }catch(e){}
  location.href="../index.html#family";
}
function renderAuth(){
  const app=$('#app'); const nv=document.querySelector('.nav'); if(nv)nv.remove();
  const isSignup=authMode==='signup';
  app.innerHTML='';
  const v=el(`<div class="view auth-wrap">
    <div class="auth-logo"><div class="em">📘</div><h1>천문장 <span>단문장 트레이너</span></h1>
      <p class="auth-sub">${isSignup?'새 계정 만들기':'로그인하면 어느 기기에서나 이어서 학습해요'}</p></div>
    <div class="auth-card">
      ${isSignup?`<input class="auth-in" id="a-name" placeholder="이름(별명)">`:''}
      <input class="auth-in" id="a-email" type="email" placeholder="이메일" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input class="auth-in" id="a-pw" type="password" placeholder="비밀번호 (6자 이상)">
      <button class="btn" id="a-go">${isSignup?'가입하기':'로그인'}</button>
      <div class="auth-msg" id="a-msg"></div>
      <button class="auth-switch" id="a-switch">${isSignup?'이미 계정이 있어요 · 로그인':'계정이 없어요 · 회원가입'}</button>
    </div></div>`);
  app.appendChild(v);
  v.querySelector('#a-switch').onclick=()=>{authMode=isSignup?'login':'signup';renderAuth();};
  v.querySelector('#a-go').onclick=()=>{
    const email=(v.querySelector('#a-email').value||'').trim();
    const pw=v.querySelector('#a-pw').value||'';
    const msg=v.querySelector('#a-msg');
    if(!email||pw.length<6){msg.textContent='이메일과 6자 이상 비밀번호를 입력하세요.';return;}
    msg.textContent='처리 중…';
    const go2=isSignup
      ? fbAuth.createUserWithEmailAndPassword(email,pw).then(cred=>{
          const nm=(v.querySelector('#a-name').value||'').trim();
          if(nm&&cred.user)return cred.user.updateProfile({displayName:nm});
        })
      : fbAuth.signInWithEmailAndPassword(email,pw);
    go2.catch(err=>{ msg.textContent=authErr(err); });
  };
  return v;
}
function authErr(err){
  const c=(err&&err.code)||'';
  if(c.indexOf('email-already')>=0)return '이미 가입된 이메일이에요. 로그인하세요.';
  if(c.indexOf('invalid-email')>=0)return '이메일 형식이 올바르지 않아요.';
  if(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0)return '비밀번호가 틀렸어요.';
  if(c.indexOf('user-not-found')>=0)return '가입되지 않은 이메일이에요.';
  if(c.indexOf('weak-password')>=0)return '비밀번호는 6자 이상이어야 해요.';
  if(c.indexOf('unauthorized-domain')>=0)return '이 주소가 Firebase 승인 도메인에 없어요(콘솔에서 추가).';
  return '오류: '+((err&&err.message)||c);
}

/* ---------- 부팅 (클라우드/로컬 분기) ---------- */
function renderApp(){ try{ render(); }catch(err){ showBootError((err&&err.stack)?err.stack:err); } }
function boot(){
  if(cloudEnabled()){
    try{
      firebase.initializeApp(firebaseConfig);
      fbAuth=firebase.auth(); fbDB=firebase.firestore(); CLOUD=true;
      fbAuth.onAuthStateChanged(function(user){
        if(user){ UID=user.uid; USER_EMAIL=user.email||''; cloudLoad(user).then(function(){ TAB='home'; renderApp(); }); }
        else { UID=null; renderAuth(); }
      });
    }catch(e){ CLOUD=false; S=load(); renderApp(); }
  } else { S=load(); renderApp(); }
}
boot();

</script>
