<!DOCTYPE html>
<html lang="ko" data-app="sentence">
<head>
<script src="../assets/device.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6453117184750039"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F3F2F7">
<title>천문장 단문장 트레이너</title>
<!-- Firebase (compat) — 설정값을 넣으면 클라우드 저장, 안 넣으면 자동 로컬 모드 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>/* 통합 플래너 안(iframe)에서 열렸는지 표시 */if(window.self!==window.top)document.documentElement.classList.add('in-planner');</script>
<style>
:root{
  --bg:#F3F2F7; --paper:#FFFFFF; --ink:#1C1B24; --ink-soft:#5E6485; --ink-faint:#9AA0BC;
  --line:#E3E6F0; --brand:#6A58E6; --brand-deep:#5646D0; --brand-soft:#EFECFD;
  --flame:#F59E0B; --flame-soft:#FEF3DD; --good:#0FA678; --good-soft:#E3F6EF;
  --bad:#E5484D; --bad-soft:#FCEBEC; --gold:#D9A406;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(27,33,64,.05),0 8px 24px rgba(27,33,64,.07);
  --shadow-lg:0 12px 40px rgba(27,33,64,.16);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  /* 문장 성분 색 */
  --rS:#3D5AFE; --rS-bg:#E8ECFF;
  --rV:#E5484D; --rV-bg:#FCEBEC;
  --rO:#0FA678; --rO-bg:#E3F6EF;
  --rIO:#0EA5E9; --rIO-bg:#E3F4FC;
  --rDO:#15803D; --rDO-bg:#E4F2E8;
  --rSC:#E08600; --rSC-bg:#FEF1DC;
  --rOC:#8B5CF6; --rOC-bg:#F1ECFD;
  --rM:#7A8194; --rM-bg:#EEF0F4;
  --rCONJ:#475569; --rCONJ-bg:#E9EDF2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  line-height:1.5;max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

/* appbar */
.appbar{padding:16px 18px 4px;display:flex;align-items:center;justify-content:space-between}
.appbar h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.01em}
.appbar h1 span{color:var(--brand)}
.chips{display:flex;gap:7px}
.chip{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-weight:800;font-size:12.5px;box-shadow:var(--shadow)}
.chip.flame b{color:var(--flame)} .chip.pts b{color:var(--gold)}

.view{padding:8px 16px 20px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* home */
.hero{padding:20px;margin-top:6px}
.hero .lead{font-size:13px;color:var(--ink-soft);font-weight:600}
.ring-wrap{display:flex;align-items:center;gap:18px;margin:14px 0 4px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:24px;font-weight:800;line-height:1}
.ring .num small{font-size:11px;color:var(--ink-faint);font-weight:700}
.todo-info{flex:1}
.todo-info .big{font-size:17px;font-weight:800;margin-bottom:2px}
.todo-info .sub{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.btn{display:block;width:100%;background:var(--brand);color:#fff;font-weight:800;font-size:15px;
  padding:15px;border-radius:14px;box-shadow:0 6px 18px rgba(79,70,229,.32);margin-top:16px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--paper);color:var(--brand);border:1.5px solid var(--brand-soft);box-shadow:var(--shadow)}
.auth-wrap{min-height:84vh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-logo .em{font-size:44px;line-height:1}
.auth-logo h1{font-size:20px;font-weight:800;margin:10px 0 4px}
.auth-logo h1 span{color:var(--brand)}
.auth-sub{font-size:13px;color:var(--ink-soft);margin:0}
.auth-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.auth-in{display:block;width:100%;padding:14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;background:var(--bg);color:var(--ink)}
.auth-in:focus{outline:none;border-color:var(--brand);background:var(--paper)}
.auth-msg{min-height:18px;font-size:13px;color:var(--bad);text-align:center;margin-top:10px}
.auth-switch{display:block;width:100%;text-align:center;margin-top:8px;color:var(--brand);font-weight:700;font-size:13px;padding:8px}
.focus-card{display:flex;align-items:center;gap:12px;border-left:4px solid var(--flame)}
.focus-card .fc-txt{flex:1}
.focus-card .t{font-weight:800;font-size:14px;color:var(--ink)}
.focus-card .t b{color:var(--flame)}
.focus-card .s{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.focus-card .tog{white-space:nowrap}
.weak-item{cursor:pointer;border-left:4px solid var(--flame-soft)}
.weak-item:active{background:var(--flame-soft)}
.weak-item .wi-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.weak-item .wi-pt{flex:1;font-size:11px;font-weight:700;color:var(--flame)}
.weak-item .wi-kr{font-size:13px;color:var(--ink-soft);margin-top:4px}
.wi-more{text-align:center;font-size:12px;color:var(--ink-faint);padding:6px 0 2px}
.sharecode-card .t{font-weight:800;font-size:14px}
.sharecode-card .s{font-size:12px;color:var(--ink-soft);margin:4px 0 12px;line-height:1.5}
.sharecode{font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--brand);
  background:var(--brand-soft);border-radius:12px;padding:14px;margin-bottom:10px;user-select:all}
.btn.gray{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.sm{padding:11px;font-size:13.5px;margin-top:10px}

.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.statgrid .card{padding:13px;text-align:center}
.statgrid b{font-size:19px;font-weight:800;display:block}
.statgrid small{font-size:11px;color:var(--ink-faint);font-weight:700}

.sect-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 9px}
.sect-h h2{font-size:14px;font-weight:800;margin:0}
.sect-h a{font-size:12px;color:var(--brand);font-weight:700}

/* calendar */
.cal{padding:14px}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal .wk span{text-align:center;font-size:10px;font-weight:800;color:var(--ink-faint)}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .day{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-faint);background:var(--bg)}
.cal .day.done{background:var(--brand);color:#fff}
.cal .day.today{outline:2px solid var(--brand);outline-offset:-2px;color:var(--brand)}
.cal .day.done.today{color:#fff}
.cal .day.blank{background:transparent}

/* session */
.session-top{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.session-top .x{font-size:20px;color:var(--ink-faint);width:28px}
.prog{flex:1;height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.phase-tag{font-size:11.5px;font-weight:800;color:var(--ink-soft);min-width:54px;text-align:right}

.stage{padding:6px 16px}
.flash{min-height:300px;display:flex;flex-direction:column}
.fc-meta{display:flex;align-items:center;gap:8px;margin:8px 2px 0}
.badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep)}
.badge.pat{background:var(--good-soft);color:var(--good)}
.badge.gray{background:var(--bg);color:var(--ink-faint)}
.sound{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:17px;display:flex;align-items:center;justify-content:center}

.sent-card{margin-top:12px;padding:22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.sent-en{font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.01em;word-break:keep-all}
.tap-hint{text-align:center;color:var(--ink-faint);font-size:12px;font-weight:700;margin-top:14px}

/* chunk analysis (revealed) */
.analysis{margin-top:4px}
.an-line{font-size:19px;line-height:2.4;word-break:keep-all}
.chunk{position:relative;display:inline-block;padding:1px 2px;border-radius:6px;margin:0 1px}
.chunk .lab{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;
  white-space:nowrap;padding:0 3px;border-radius:4px}
.kr-box{margin-top:18px;padding:13px 15px;background:var(--brand-soft);border-radius:12px;
  font-size:15px;font-weight:600;color:var(--brand-deep)}
.note-box{margin-top:10px;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.words-box{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.wtag{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:600;cursor:pointer}
.wtag:active{background:var(--brand-soft);border-color:var(--brand)}
.wtag b{color:var(--ink);font-weight:800}.wtag span{color:var(--ink-soft)}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.lg{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px}

.know-row{display:flex;gap:10px;margin-top:16px;padding:0 16px}
.know-row button{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.know-no{background:var(--bad-soft);color:var(--bad)}
.know-yes{background:var(--good-soft);color:var(--good)}

/* quiz */
.q-instr{font-size:13px;font-weight:700;color:var(--ink-soft);margin:6px 2px 2px}
.q-en{font-size:18px;font-weight:700;line-height:1.5;margin:8px 0 6px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:13px;padding:14px 15px;margin-top:9px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);transition:.15s}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:800}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.5}

/* tagging quiz */
.tag-sent{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;line-height:2}
.tag-chunk{padding:9px 12px;border-radius:11px;background:var(--paper);border:2px solid var(--line);
  font-size:16px;font-weight:700;box-shadow:var(--shadow);position:relative;word-break:keep-all}
.tag-chunk.sel{outline:3px solid var(--brand);outline-offset:1px}
.tag-chunk .as{position:absolute;top:-11px;right:-6px;font-size:10px;font-weight:800;color:#fff;
  padding:1px 6px;border-radius:999px}
.tag-chunk.ok{border-color:var(--good)} .tag-chunk.no{border-color:var(--bad)}
.role-pal{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.role-btn{padding:9px 13px;border-radius:11px;font-weight:800;font-size:13px;border:2px solid transparent;box-shadow:var(--shadow)}
.role-btn.active{outline:3px solid var(--ink);outline-offset:1px}

/* word-order quiz */
.wo-target{min-height:62px;margin-top:10px;padding:11px;border:2px dashed var(--line);border-radius:13px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:var(--paper)}
.wo-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wo-tok{padding:9px 13px;border-radius:11px;background:var(--paper);border:1.5px solid var(--line);
  font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.wo-tok.used{opacity:.32;pointer-events:none}
.wo-target .wo-tok{border-color:var(--brand-soft);background:var(--brand-soft)}

.feedback{margin-top:14px;padding:13px 15px;border-radius:13px;font-weight:700;font-size:13.5px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback .kr{display:block;margin-top:6px;color:var(--ink-soft);font-weight:600}
.q-next{margin-top:14px}

/* result */
.result{text-align:center;padding:30px 16px}
.result .em{font-size:54px}
.result h2{font-size:21px;margin:10px 0 4px}
.result p{color:var(--ink-soft);font-weight:600;margin:0}
.res-stat{display:flex;justify-content:center;gap:26px;margin:22px 0}
.res-stat b{font-size:24px;display:block}
.res-stat small{font-size:11px;color:var(--ink-faint);font-weight:700}

/* sentencebook */
.toolbar{display:flex;gap:8px;margin:6px 0 12px}
.search{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.tog{padding:11px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow)}
.tog.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pt-group{margin-bottom:16px}
.pt-head{font-size:12px;font-weight:800;color:var(--brand-deep);margin:0 2px 8px;display:flex;gap:6px;align-items:center}
.pt-head .u{font-size:10px;color:var(--ink-faint)}
.sb-item{padding:13px 15px;margin-bottom:8px}
.sb-top{display:flex;align-items:flex-start;gap:8px}
.sb-en{font-size:15px;font-weight:700;flex:1;line-height:1.45;word-break:keep-all}
.star{font-size:17px;color:var(--ink-faint);width:24px;flex:none}.star.on{color:var(--flame)}
.sb-kr{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:5px}
.sb-an{margin-top:7px}
.boxbadge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--ink-faint);border-radius:999px;padding:1px 7px;margin-top:6px}

/* grammar room */
.gr-card{padding:16px;margin-bottom:11px}
.gr-card h3{margin:0 0 3px;font-size:15px;font-weight:800}
.gr-card .u{font-size:11px;color:var(--ink-faint);font-weight:700}
.gr-card .d{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.65}
.gr-ex{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.gr-ex .ex-en{font-size:13.5px;font-weight:700;margin-bottom:2px}
.gr-ex .ex-kr{font-size:12px;color:var(--ink-soft)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border:none}
.set-row .t{font-weight:700;font-size:14px}.set-row .s{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{padding:7px 11px;border-radius:8px;font-weight:800;font-size:13px;color:var(--ink-soft)}
.seg button.on{background:var(--paper);color:var(--brand);box-shadow:var(--shadow)}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:50}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;color:var(--ink-faint);font-weight:700}
.nav button .ic{font-size:19px;line-height:1}
.nav button span{font-size:10px}
.nav button.on{color:var(--brand)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:99;box-shadow:var(--shadow-lg);
  opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink-faint);padding:40px 20px;font-weight:600;font-size:13.5px}

@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cat-card{cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:13px}
.cat-card:active{transform:scale(.98)}
.cat-name{font-weight:800;color:var(--brand-deep);font-size:14px}
.cat-blurb{font-size:11px;color:var(--ink-faint);line-height:1.45;flex:1}
.cat-detail-head{margin:2px 2px 10px}
.cat-detail-head h3{margin:6px 0 3px;color:var(--brand-deep)}
.cat-detail-head .d{font-size:12px;color:var(--ink-faint);margin-bottom:9px}
.backbtn{background:none;border:none;color:var(--brand);font-weight:700;font-size:13px;padding:2px 0;cursor:pointer}
.btn-primary.sm{font-size:13px;padding:9px 14px}
.lvl-badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff}
.lvl-badge.lv1{background:#0FA678}.lvl-badge.lv2{background:#E08600}.lvl-badge.lv3{background:#8B5CF6}
.sb-note{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin-top:5px;padding-left:8px;border-left:2px solid var(--line)}
.add-chip{display:inline-block;font-size:11px;font-weight:700;color:var(--brand-deep);background:var(--brand-soft,#EEF1FF);border:1px solid var(--line);padding:2px 8px;border-radius:999px;margin:2px 0 4px}
/* ===================== 반응형 ===================== */
/* 태블릿 / 가로 넓은 화면: 본문을 넓게, 그리드 다열, 하단 네비 유지 */
@media (min-width:701px){
  body{max-width:780px;padding-bottom:96px}
  .view{padding:12px 24px 28px}
  .appbar{padding:20px 24px 6px}
  .hero{padding:26px}
  .nav{max-width:560px;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(27,33,64,.10)}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .statgrid{grid-template-columns:repeat(3,1fr)}
  .ring-wrap{gap:22px}
}
/* 데스크톱: 좌측 세로 사이드바 + 가운데 정렬 본문 */
@media (min-width:1120px){
  body{max-width:1120px;padding-bottom:24px;padding-left:220px}
  body.insession{padding-left:0}
  .appbar{max-width:760px;margin:0 auto;padding-top:26px}
  .view{max-width:760px;margin:0 auto;padding:18px 24px 48px}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .statgrid{grid-template-columns:repeat(3,1fr)}
  /* 하단 네비 → 좌측 사이드바 */
  .nav{position:fixed;top:0;bottom:auto;height:100vh;
    left:calc(50% - 560px);transform:none;width:210px;max-width:none;
    flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;
    padding:26px 14px;border-top:none;border-right:1px solid var(--line);
    border-radius:0;box-shadow:none;background:var(--paper)}
  body.insession .nav{display:none}

{n:318,cat:"elem",lvl:2,pt:"완성-09",add:"동명사구 목적어",en:"He enjoys helping people in need.",pattern:"3",chunks:[["He","S"],["enjoys","V"],["helping people in need.","O"]],kr:"그는 어려움에 처한 사람들을 돕는 것을 즐긴다.",note:"enjoy의 목적어는 동명사구. in need가 people을 수식.",words:[["in need","어려움에 처한"]]},

{n:354,cat:"modal",lvl:3,pt:"완성-21",add:"can't have p.p. (~했을 리 없다)",en:"She can't have said such a thing.",pattern:"3",chunks:[["She","S"],["can't have said","V"],["such a thing.","O"]],kr:"그녀가 그런 말을 했을 리가 없다.",note:"can't have p.p. — 과거 일에 대한 강한 부정적 추측.",words:[["such","그런"]]},

{n:355,cat:"modal",lvl:3,pt:"완성-22",add:"이성적 판단 형용사 + should",en:"It is natural that he should feel angry.",pattern:"2",chunks:[["It","S"],["is","V"],["natural","SC"],["that he should feel angry.","M"]],kr:"그가 화를 내는 것은 당연하다.",note:"natural·strange 등 판단 형용사 뒤 that절에 should(~하다니/~하는 것)를 쓴다.",words:[["natural","당연한"]]},
{n:356,cat:"modal",lvl:3,pt:"완성-22",add:"주장·요구 동사 + (should)+동사원형",en:"They insisted that the rule should be changed.",pattern:"3",chunks:[["They","S"],["insisted","V"],["that the rule should be changed.","O"]],kr:"그들은 그 규칙이 바뀌어야 한다고 주장했다.",note:"insist·demand 등 뒤 that절은 (should) + 동사원형.",words:[["insist","주장하다"]]},
{n:357,cat:"modal",lvl:3,pt:"완성-22",add:"감정 + should (~하다니)",en:"I was surprised that she should say so.",pattern:"2",chunks:[["I","S"],["was","V"],["surprised","SC"],["that she should say so.","M"]],kr:"그녀가 그렇게 말하다니 나는 놀랐다.",note:"감정 형용사 뒤 that절의 should는 '~하다니'의 뜻을 더한다.",words:[["surprised","놀란"]]},
// 완성-23 여러 가지 조동사 표현
{n:358,cat:"modal",lvl:2,pt:"완성-23",add:"had better (~하는 게 좋다)",en:"You had better see a doctor soon.",pattern:"3",chunks:[["You","S"],["had better see","V"],["a doctor","O"],["soon.","M"]],kr:"너는 곧 의사에게 가 보는 게 좋겠다.",note:"had better + 동사원형 — (강한 충고) ~하는 편이 낫다.",words:[["had better","~하는 게 낫다"]]},
{n:359,cat:"modal",lvl:2,pt:"완성-23",add:"would rather (차라리 ~하겠다)",en:"I would rather stay home tonight.",pattern:"1",chunks:[["I","S"],["would rather stay","V"],["home","M"],["tonight.","M"]],kr:"나는 오늘 밤엔 차라리 집에 있겠다.",note:"would rather + 동사원형 — 차라리 ~하겠다.",words:[["would rather","차라리 ~하겠다"]]},
{n:360,cat:"modal",lvl:3,pt:"완성-23",add:"may well (~하는 것도 당연하다)",en:"We may well be proud of our team.",pattern:"2",chunks:[["We","S"],["may well be","V"],["proud","SC"],["of our team.","M"]],kr:"우리가 우리 팀을 자랑스러워하는 것도 당연하다.",note:"may well + 동사원형 — ~하는 것도 당연하다.",words:[["proud","자랑스러운"]]},
// 완성-24 be p.p.+O / +to·for / +C
{n:361,cat:"passive",lvl:3,pt:"완성-24",add:"4형식 수동(IO 주어) + 직접목적어 유지",en:"The students were given a second chance.",pattern:"3",chunks:[["The students","S"],["were given","V"],["a second chance.","O"]],kr:"학생들은 두 번째 기회를 받았다.",note:"4형식의 간접목적어를 주어로 한 수동태 — 직접목적어(a second chance)가 남는다.",words:[["chance","기회"]]},
{n:362,cat:"passive",lvl:3,pt:"완성-24",add:"5형식 수동 + 명사 보어",en:"He was elected president of the club.",pattern:"2",chunks:[["He","S"],["was elected","V"],["president of the club.","SC"]],kr:"그는 동아리 회장으로 선출되었다.",note:"5형식의 수동태 — 능동의 목적격보어(president)가 보어로 남는다.",words:[["elect","선출하다"]]},
{n:363,cat:"passive",lvl:3,pt:"완성-24",add:"지각동사 수동 + to-v 보어",en:"She was seen to enter the building.",pattern:"2",chunks:[["She","S"],["was seen","V"],["to enter the building.","SC"]],kr:"그녀가 건물에 들어가는 것이 목격되었다.",note:"지각동사의 수동태에서는 원형부정사가 to부정사로 바뀐다.",words:[["enter","들어가다"]]},
// 완성-25 동사구 수동태 / that절 목적어 수동
{n:364,cat:"passive",lvl:3,pt:"완성-25",add:"동사구의 수동태 (take care of)",en:"The baby was taken care of by the nurse.",pattern:"1",chunks:[["The baby","S"],["was taken care of","V"],["by the nurse.","M"]],kr:"그 아기는 간호사에게 돌봄을 받았다.",note:"take care of 같은 동사구는 하나의 동사로 묶어 수동태로 만든다.",words:[["take care of","~를 돌보다"]]},
{n:365,cat:"passive",lvl:3,pt:"완성-25",add:"that절 목적어 수동 (주어로 끌어올림)",en:"He is said to be a genius.",pattern:"2",chunks:[["He","S"],["is said","V"],["to be a genius.","SC"]],kr:"그는 천재라고들 한다.",note:"It is said that he is ~ = He is said to be ~ — that절 주어를 문장 주어로 올린 수동태.",words:[["genius","천재"]]},
{n:366,cat:"passive",lvl:3,pt:"완성-25",add:"동사구 수동태 (put off)",en:"The meeting was put off until next week.",pattern:"1",chunks:[["The meeting","S"],["was put off","V"],["until next week.","M"]],kr:"회의는 다음 주로 연기되었다.",note:"put off(연기하다) → be put off. 동사구 전체가 수동태가 된다.",words:[["put off","연기하다"]]},
// 완성-26 여러 가지 수동태 표현
{n:367,cat:"passive",lvl:2,pt:"완성-26",add:"be covered with",en:"The mountain was covered with deep snow.",pattern:"1",chunks:[["The mountain","S"],["was covered","V"],["with deep snow.","M"]],kr:"그 산은 깊은 눈으로 덮여 있었다.",note:"by 대신 with를 쓰는 수동태 관용표현(be covered with).",words:[["cover","덮다"]]},
{n:368,cat:"passive",lvl:2,pt:"완성-26",add:"be interested in",en:"I am interested in learning new languages.",pattern:"1",chunks:[["I","S"],["am interested","V"],["in learning new languages.","M"]],kr:"나는 새로운 언어를 배우는 데 관심이 있다.",note:"by 대신 in을 쓰는 감정의 수동태(be interested in).",words:[["be interested in","~에 관심이 있다"]]},
{n:369,cat:"passive",lvl:3,pt:"완성-26",add:"be known to",en:"She was known to everyone in the village.",pattern:"1",chunks:[["She","S"],["was known","V"],["to everyone in the village.","M"]],kr:"그녀는 마을 사람 모두에게 알려져 있었다.",note:"be known to (~에게 알려지다). known to/for/as/by 구분에 주의.",words:[["village","마을"]]},

// ========================= 완성편 27~31 (가정법) =========================
// 완성-27 가정법 과거 (현재 사실의 반대)
{n:370,cat:"subj",lvl:3,pt:"완성-27",add:"가정법 과거 (if+과거, would+동사원형)",en:"If I were rich, I would travel around the world.",pattern:"1",chunks:[["If I were rich,","M"],["I","S"],["would travel","V"],["around the world.","M"]],kr:"내가 부자라면 세계를 여행할 텐데.",note:"가정법 과거: 현재 사실의 반대. if + 과거(were), 주절 would + 동사원형.",words:[["rich","부유한"]]},
{n:371,cat:"subj",lvl:3,pt:"완성-27",add:"가정법 과거 (현재 반대)",en:"If she knew the answer, she would tell us.",pattern:"3",chunks:[["If she knew the answer,","M"],["she","S"],["would tell","V"],["us.","O"]],kr:"그녀가 정답을 안다면 우리에게 말해 줄 텐데.",note:"실제로는 모르는 현재 사실의 반대 가정.",words:[["answer","정답"]]},
{n:372,cat:"subj",lvl:3,pt:"완성-27",add:"if it were not for ~ (~이 없다면)",en:"If it were not for water, nothing could live.",pattern:"1",chunks:[["If it were not for water,","M"],["nothing","S"],["could live.","V"]],kr:"물이 없다면 아무것도 살 수 없을 것이다.",note:"if it were not for ~ = without ~ : 현재 ~이 없다면.",words:[["nothing","아무것도 ~않다"]]},
// 완성-28 가정법 과거완료 (과거 사실의 반대)
{n:373,cat:"subj",lvl:3,pt:"완성-28",add:"가정법 과거완료 (if had p.p., would have p.p.)",en:"If I had studied harder, I would have passed the exam.",pattern:"3",chunks:[["If I had studied harder,","M"],["I","S"],["would have passed","V"],["the exam.","O"]],kr:"내가 더 열심히 공부했더라면 시험에 합격했을 텐데.",note:"가정법 과거완료: 과거 사실의 반대. if + had p.p., 주절 would have p.p.",words:[["pass","합격하다"]]},
{n:374,cat:"subj",lvl:3,pt:"완성-28",add:"가정법 과거완료 (부정)",en:"If he had left earlier, he would not have missed the bus.",pattern:"3",chunks:[["If he had left earlier,","M"],["he","S"],["would not have missed","V"],["the bus.","O"]],kr:"그가 더 일찍 떠났더라면 버스를 놓치지 않았을 텐데.",note:"과거에 실제로는 일어난 일의 반대를 가정.",words:[["miss","놓치다"]]},
{n:375,cat:"subj",lvl:3,pt:"완성-28",add:"if 생략 → 도치 (Had+S+p.p.)",en:"Had I known the truth, I would have acted differently.",pattern:"1",chunks:[["Had I known the truth,","M"],["I","S"],["would have acted","V"],["differently.","M"]],kr:"내가 진실을 알았더라면 다르게 행동했을 텐데.",note:"가정법에서 if를 생략하면 (조)동사가 주어 앞으로 도치된다.",words:[["differently","다르게"]]},
// 완성-29 혼합가정법 / if~should / if~were to
{n:376,cat:"subj",lvl:3,pt:"완성-29",add:"혼합가정법 (과거 조건 → 현재 결과)",en:"If I had taken your advice, I would be happier now.",pattern:"2",chunks:[["If I had taken your advice,","M"],["I","S"],["would be","V"],["happier","SC"],["now.","M"]],kr:"내가 네 충고를 들었더라면 지금 더 행복할 텐데.",note:"혼합가정법: 조건절은 과거완료, 주절은 가정법 과거(현재 결과).",words:[["advice","충고"]]},
{n:377,cat:"subj",lvl:3,pt:"완성-29",add:"if ~ should (혹시라도 ~한다면)",en:"If you should need help, I will be there.",pattern:"1",chunks:[["If you should need help,","M"],["I","S"],["will be","V"],["there.","M"]],kr:"혹시라도 도움이 필요하면 내가 거기 있을게.",note:"if + should — 실현 가능성이 낮은 일에 대한 가정.",words:[["need","필요로 하다"]]},
{n:378,cat:"subj",lvl:3,pt:"완성-29",add:"if ~ were to (가능성 희박한 가정)",en:"If the sun were to rise in the west, I would change my mind.",pattern:"3",chunks:[["If the sun were to rise in the west,","M"],["I","S"],["would change","V"],["my mind.","O"]],kr:"해가 서쪽에서 뜬다면 내 마음을 바꾸겠다.",note:"if + were to — 실현 불가능하거나 매우 희박한 미래의 가정.",words:[["rise","뜨다"]]},
// 완성-30 wish / as if / if only
{n:379,cat:"subj",lvl:3,pt:"완성-30",add:"I wish + 가정법 과거",en:"I wish I could speak French fluently.",pattern:"3",chunks:[["I","S"],["wish","V"],["I could speak French fluently.","O"]],kr:"내가 프랑스어를 유창하게 할 수 있으면 좋을 텐데.",note:"I wish + 가정법 과거 — 현재 이루기 어려운 소망.",words:[["fluently","유창하게"]]},
{n:380,cat:"subj",lvl:3,pt:"완성-30",add:"as if + 가정법 과거",en:"He talks as if he knew everything.",pattern:"1",chunks:[["He","S"],["talks","V"],["as if he knew everything.","M"]],kr:"그는 마치 모든 것을 아는 것처럼 말한다.",note:"as if + 가정법 과거 — 사실은 그렇지 않은데 마치 ~인 것처럼.",words:[["as if","마치 ~인 것처럼"]]},
{n:381,cat:"subj",lvl:3,pt:"완성-30",add:"if only + 가정법 (~라면 좋을 텐데)",en:"If only she were here with us now.",pattern:"1",chunks:[["If only","M"],["she","S"],["were","V"],["here with us now.","M"]],kr:"그녀가 지금 우리와 함께 있다면 좋을 텐데.",note:"if only + 가정법 — I wish보다 강한 아쉬움·소망.",words:[["only","오직"]]},
// 완성-31 가정의 의미를 가지는 표현
{n:382,cat:"subj",lvl:3,pt:"완성-31",add:"without ~ (~이 없었다면)",en:"Without your help, I would have failed.",pattern:"1",chunks:[["Without your help,","M"],["I","S"],["would have failed.","V"]],kr:"네 도움이 없었다면 나는 실패했을 것이다.",note:"without ~ = if it had not been for ~ : 과거에 ~이 없었다면.",words:[["fail","실패하다"]]},
{n:383,cat:"subj",lvl:3,pt:"완성-31",add:"주어에 가정의 뜻 (~라면)",en:"A wise person would not make such a mistake.",pattern:"3",chunks:[["A wise person","S"],["would not make","V"],["such a mistake.","O"]],kr:"현명한 사람이라면 그런 실수를 하지 않을 텐데.",note:"주어(A wise person)에 '~라면'의 가정이 함축되어 would를 쓴다.",words:[["wise","현명한"]]},
{n:384,cat:"subj",lvl:3,pt:"완성-31",add:"but for ~ (~이 없었다면)",en:"But for the rain, we would have gone hiking.",pattern:"1",chunks:[["But for the rain,","M"],["we","S"],["would have gone","V"],["hiking.","M"]],kr:"비가 없었다면 우리는 하이킹을 갔을 텐데.",note:"but for ~ = without ~ : ~이 없(었)다면.",words:[["but for","~이 없다면"]]},

// ========================= 완성편 32~38 (준동사: 명사·형용사 역할) =========================
// 완성-32 S, SC로 쓰이는 to-v/v-ing
{n:385,cat:"toinf",lvl:3,pt:"완성-32",add:"to-v 주어",en:"To master a foreign language requires constant effort.",pattern:"3",chunks:[["To master a foreign language","S"],["requires","V"],["constant effort.","O"]],kr:"외국어를 통달하는 것은 끊임없는 노력을 요한다.",note:"to부정사구가 주어로 쓰인 명사적 용법(단수 취급).",words:[["master","통달하다"],["constant","끊임없는"]]},
{n:386,cat:"gerund",lvl:3,pt:"완성-32",add:"동명사 주어",en:"Keeping a diary every day improves your writing.",pattern:"3",chunks:[["Keeping a diary every day","S"],["improves","V"],["your writing.","O"]],kr:"매일 일기를 쓰는 것은 글쓰기를 향상시킨다.",note:"동명사구 주어는 단수 취급 → improves.",words:[["diary","일기"],["improve","향상시키다"]]},
{n:387,cat:"gerund",lvl:3,pt:"완성-32",add:"동명사 보어",en:"My biggest mistake was trusting him too easily.",pattern:"2",chunks:[["My biggest mistake","S"],["was","V"],["trusting him too easily.","SC"]],kr:"나의 가장 큰 실수는 그를 너무 쉽게 믿은 것이었다.",note:"동명사구가 주격보어로 쓰임.",words:[["trust","믿다"]]},
// 완성-33 for·of+O+to-v / be to-v
{n:388,cat:"toinf",lvl:3,pt:"완성-33",add:"for + 의미상 주어 + to-v",en:"It is difficult for beginners to understand this concept.",pattern:"2",chunks:[["It","S"],["is","V"],["difficult","SC"],["for beginners to understand this concept.","M"]],kr:"초보자들이 이 개념을 이해하기는 어렵다.",note:"It은 가주어, for beginners는 to-v의 의미상 주어.",words:[["beginner","초보자"],["concept","개념"]]},
{n:389,cat:"toinf",lvl:3,pt:"완성-33",add:"of + 의미상 주어 (성격 형용사)",en:"It was careless of you to leave the door open.",pattern:"2",chunks:[["It","S"],["was","V"],["careless","SC"],["of you to leave the door open.","M"]],kr:"문을 열어 둔 것은 네가 부주의했다.",note:"사람의 성격을 나타내는 형용사 뒤에는 of + 의미상 주어를 쓴다.",words:[["careless","부주의한"]]},
{n:390,cat:"toinf",lvl:3,pt:"완성-33",add:"be to-v (예정)",en:"The president is to visit Korea next month.",pattern:"3",chunks:[["The president","S"],["is to visit","V"],["Korea","O"],["next month.","M"]],kr:"대통령은 다음 달에 한국을 방문할 예정이다.",note:"be + to-v — 예정·의무·가능 등을 나타낸다(여기서는 예정).",words:[["president","대통령"]]},
// 완성-34 O로 쓰이는 to-v/v-ing
{n:391,cat:"toinf",lvl:3,pt:"완성-34",add:"to-v 목적어 (decide)",en:"She decided to give up her career for her family.",pattern:"3",chunks:[["She","S"],["decided","V"],["to give up her career for her family.","O"]],kr:"그녀는 가족을 위해 경력을 포기하기로 결심했다.",note:"decide·hope·want 등은 to부정사를 목적어로 취한다.",words:[["career","경력"]]},
{n:392,cat:"gerund",lvl:2,pt:"완성-34",add:"동명사 목적어 (avoid)",en:"He avoided answering the difficult question.",pattern:"3",chunks:[["He","S"],["avoided","V"],["answering the difficult question.","O"]],kr:"그는 그 어려운 질문에 답하는 것을 피했다.",note:"avoid·finish·mind 등은 동명사를 목적어로 취한다.",words:[["avoid","피하다"]]},
{n:393,cat:"toinf",lvl:3,pt:"완성-34",add:"forget to-v (앞으로 ~할 것을 잊다)",en:"I forgot to lock the door this morning.",pattern:"3",chunks:[["I","S"],["forgot","V"],["to lock the door","O"],["this morning.","M"]],kr:"나는 오늘 아침에 문 잠그는 것을 잊었다.",note:"forget to-v(할 일을 잊다) vs forget v-ing(한 일을 잊다)의 의미 차이.",words:[["lock","잠그다"]]},
// 완성-35 전치사+v-ing
{n:394,cat:"gerund",lvl:2,pt:"완성-35",add:"전치사 for + 동명사",en:"He apologized for being late again.",pattern:"1",chunks:[["He","S"],["apologized","V"],["for being late again.","M"]],kr:"그는 또 늦은 것에 대해 사과했다.",note:"전치사(for)의 목적어로 동명사가 온다.",words:[["apologize","사과하다"]]},
{n:395,cat:"gerund",lvl:3,pt:"완성-35",add:"there is no point in v-ing",en:"There is no point in arguing with him.",pattern:"1",chunks:[["There","M"],["is","V"],["no point","S"],["in arguing with him.","M"]],kr:"그와 논쟁해 봐야 소용없다.",note:"there is no point in v-ing — ~해도 소용없다.",words:[["argue","논쟁하다"]]},

{n:433,cat:"ncl",lvl:3,pt:"완성-48",add:"whether 명사절 주어",en:"Whether we succeed depends on our effort.",pattern:"1",chunks:[["Whether we succeed","S"],["depends","V"],["on our effort.","M"]],kr:"우리가 성공할지는 우리의 노력에 달려 있다.",note:"whether 명사절(~인지)이 주어. if는 주어로 쓸 수 없다.",words:[["depend on","~에 달려 있다"]]},
{n:434,cat:"ncl",lvl:2,pt:"완성-48",add:"if 명사절 목적어",en:"I wonder if he will come to the party.",pattern:"3",chunks:[["I","S"],["wonder","V"],["if he will come to the party.","O"]],kr:"나는 그가 파티에 올지 궁금하다.",note:"if 명사절(~인지)이 목적어로 쓰임.",words:[["wonder","궁금하다"]]},
{n:435,cat:"ncl",lvl:3,pt:"완성-48",add:"전치사 + whether to-v",en:"We talked about whether to accept the offer.",pattern:"1",chunks:[["We","S"],["talked","V"],["about whether to accept the offer.","M"]],kr:"우리는 그 제안을 받아들일지에 대해 이야기했다.",note:"전치사(about) 뒤에는 if가 아니라 whether(+to-v)를 쓴다.",words:[["accept","받아들이다"],["offer","제안"]]},
// 완성-49 의문사 명사절
{n:436,cat:"ncl",lvl:3,pt:"완성-49",add:"의문사 where 명사절 목적어",en:"Nobody knows where the treasure is hidden.",pattern:"3",chunks:[["Nobody","S"],["knows","V"],["where the treasure is hidden.","O"]],kr:"아무도 그 보물이 어디 숨겨져 있는지 모른다.",note:"의문사절은 「의문사+주어+동사」 어순(간접의문문).",words:[["treasure","보물"]]},
{n:437,cat:"ncl",lvl:3,pt:"완성-49",add:"의문사절 주어",en:"Why she left so suddenly remains unclear.",pattern:"2",chunks:[["Why she left so suddenly","S"],["remains","V"],["unclear.","SC"]],kr:"그녀가 왜 그렇게 갑자기 떠났는지는 여전히 불분명하다.",note:"의문사절이 주어로 쓰임(단수 취급).",words:[["suddenly","갑자기"],["unclear","불분명한"]]},
{n:438,cat:"ncl",lvl:3,pt:"완성-49",add:"의문사절 보어",en:"The question is how we can solve this problem.",pattern:"2",chunks:[["The question","S"],["is","V"],["how we can solve this problem.","SC"]],kr:"문제는 우리가 이것을 어떻게 풀 수 있느냐이다.",note:"의문사절이 주격보어로 쓰임.",words:[["solve","풀다"]]},
// 완성-50 상관접속사
{n:439,cat:"conj",lvl:2,pt:"완성-50",add:"both A and B",en:"Both the teacher and the students enjoyed the trip.",pattern:"3",chunks:[["Both the teacher and the students","S"],["enjoyed","V"],["the trip.","O"]],kr:"선생님과 학생들 모두 그 여행을 즐겼다.",note:"both A and B — 항상 복수 취급.",words:[["enjoy","즐기다"]]},
{n:440,cat:"conj",lvl:3,pt:"완성-50",add:"not only A but also B",en:"She is not only smart but also hardworking.",pattern:"2",chunks:[["She","S"],["is","V"],["not only smart but also hardworking.","SC"]],kr:"그녀는 똑똑할 뿐만 아니라 성실하다.",note:"not only A but also B = B as well as A — A뿐 아니라 B도.",words:[["hardworking","성실한"]]},
{n:441,cat:"conj",lvl:3,pt:"완성-50",add:"neither A nor B (동사는 B에 일치)",en:"Neither the manager nor the workers were satisfied.",pattern:"1",chunks:[["Neither the manager nor the workers","S"],["were satisfied.","V"]],kr:"관리자도 노동자들도 만족하지 않았다.",note:"neither A nor B — 동사는 가까운 B(the workers)에 일치.",words:[["manager","관리자"]]},
// 완성-51 병렬구조
{n:442,cat:"conj",lvl:2,pt:"완성-51",add:"명사 병렬 (A, B, and C)",en:"The job requires patience, creativity, and teamwork.",pattern:"3",chunks:[["The job","S"],["requires","V"],["patience, creativity, and teamwork.","O"]],kr:"그 일은 인내심, 창의력, 그리고 협동심을 요한다.",note:"and로 연결되는 말은 같은 품사(명사)로 맞춘다 — 병렬구조.",words:[["patience","인내심"],["creativity","창의력"]]},
{n:443,cat:"conj",lvl:3,pt:"완성-51",add:"to부정사 병렬 (to A and to B)",en:"She likes to read books and to listen to music.",pattern:"3",chunks:[["She","S"],["likes","V"],["to read books and to listen to music.","O"]],kr:"그녀는 책을 읽는 것과 음악을 듣는 것을 좋아한다.",note:"and로 연결된 두 to부정사구가 병렬을 이룬다.",words:[["listen to","~를 듣다"]]},
{n:444,cat:"conj",lvl:2,pt:"완성-51",add:"등위접속사 and로 절 연결",en:"He studied hard, and he passed the test.",pattern:"etc",chunks:[["He","S"],["studied","V"],["hard,","M"],["and","CONJ"],["he","S"],["passed","V"],["the test.","O"]],kr:"그는 열심히 공부했고, 시험에 합격했다.",note:"등위접속사 and가 두 개의 절을 대등하게 연결한다(중문).",words:[["pass","합격하다"]]},
// 완성-52 여러 의미의 if, as, when, while, since
{n:445,cat:"advcl",lvl:3,pt:"완성-52",add:"as (~함에 따라)",en:"As the temperature rose, the ice began to melt.",pattern:"3",chunks:[["As the temperature rose,","M"],["the ice","S"],["began","V"],["to melt.","O"]],kr:"기온이 올라감에 따라 얼음이 녹기 시작했다.",note:"as는 '~함에 따라(비례)'의 부사절도 이끈다.",words:[["temperature","기온"],["melt","녹다"]]},
{n:446,cat:"advcl",lvl:3,pt:"완성-52",add:"while (~인 반면: 대조)",en:"While some people love winter, others hate it.",pattern:"3",chunks:[["While some people love winter,","M"],["others","S"],["hate","V"],["it.","O"]],kr:"어떤 사람들은 겨울을 좋아하는 반면, 다른 사람들은 싫어한다.",note:"while은 '~인 반면(대조)'의 뜻도 가진다.",words:[["others","다른 사람들"]]},
{n:447,cat:"advcl",lvl:2,pt:"완성-52",add:"since (~때문에: 이유)",en:"Since you are busy, I will do it myself.",pattern:"3",chunks:[["Since you are busy,","M"],["I","S"],["will do","V"],["it","O"],["myself.","M"]],kr:"네가 바쁘니까 내가 직접 할게.",note:"since는 '~한 이후로(시간)'와 '~때문에(이유)' 두 뜻이 있다.",words:[["busy","바쁜"]]},
// 완성-53 때를 나타내는 부사절
{n:448,cat:"advcl",lvl:3,pt:"완성-53",add:"by the time (~할 무렵에는)",en:"By the time we got there, the show had already started.",pattern:"1",chunks:[["By the time we got there,","M"],["the show","S"],["had already started.","V"]],kr:"우리가 거기 도착했을 무렵 공연은 이미 시작되어 있었다.",note:"by the time + 현재/과거 → 주절은 완료시제와 자주 쓴다.",words:[["show","공연"]]},
{n:449,cat:"advcl",lvl:2,pt:"완성-53",add:"every time (~할 때마다)",en:"Every time I see this photo, I think of you.",pattern:"1",chunks:[["Every time I see this photo,","M"],["I","S"],["think","V"],["of you.","M"]],kr:"이 사진을 볼 때마다 나는 너를 생각한다.",note:"every time = whenever — ~할 때마다.",words:[["photo","사진"]]},
{n:450,cat:"advcl",lvl:2,pt:"완성-53",add:"before 부사절 (~하기 전에)",en:"She had left before I woke up.",pattern:"1",chunks:[["She","S"],["had left","V"],["before I woke up.","M"]],kr:"내가 일어나기 전에 그녀는 이미 떠나고 없었다.",note:"before절보다 더 이전의 일은 주절에 과거완료(had left)를 쓴다.",words:[["wake up","일어나다(woke)"]]},
// 완성-54 원인·이유·결과·목적 부사절
{n:451,cat:"advcl",lvl:3,pt:"완성-54",add:"now that (~이니까: 이유)",en:"Now that you mention it, I do remember him.",pattern:"3",chunks:[["Now that you mention it,","M"],["I","S"],["do remember","V"],["him.","O"]],kr:"네가 말하니까, 나는 그가 정말 기억난다.",note:"now that — ~이니까(이유). do는 동사 강조.",words:[["mention","언급하다"]]},
{n:452,cat:"advcl",lvl:3,pt:"완성-54",add:"so ~ that … (결과)",en:"It was so cold that the lake froze completely.",pattern:"2",chunks:[["It","S"],["was","V"],["so","M"],["cold","SC"],["that the lake froze completely.","M"]],kr:"너무 추워서 호수가 완전히 얼었다.",note:"so + 형용사 + that … — 정도·결과(너무 ~해서 …하다).",words:[["freeze","얼다(froze)"]]},
{n:453,cat:"advcl",lvl:3,pt:"완성-54",add:"so that ~ can (목적)",en:"He spoke louder so that everyone could hear.",pattern:"1",chunks:[["He","S"],["spoke","V"],["louder","M"],["so that everyone could hear.","M"]],kr:"그는 모두가 들을 수 있도록 더 크게 말했다.",note:"so that + 주어 + can/could — ~하기 위해(목적).",words:[["louder","더 크게"]]},
// 완성-55 조건·양보·방법 부사절
{n:454,cat:"advcl",lvl:3,pt:"완성-55",add:"as long as (~하는 한)",en:"You can stay here as long as you keep quiet.",pattern:"1",chunks:[["You","S"],["can stay","V"],["here","M"],["as long as you keep quiet.","M"]],kr:"조용히 하는 한 너는 여기 있어도 된다.",note:"as long as — ~하는 한(조건).",words:[["quiet","조용한"]]},
{n:455,cat:"advcl",lvl:2,pt:"완성-55",add:"even though (비록 ~일지라도)",en:"Even though he was exhausted, he kept running.",pattern:"3",chunks:[["Even though he was exhausted,","M"],["he","S"],["kept","V"],["running.","O"]],kr:"비록 그는 지쳤지만 계속 달렸다.",note:"even though — 실제 사실에 대한 양보(비록 ~이지만).",words:[["exhausted","지친"]]},
{n:456,cat:"advcl",lvl:3,pt:"완성-55",add:"no matter how (아무리 ~해도)",en:"No matter how hard she tried, she couldn't open it.",pattern:"3",chunks:[["No matter how hard she tried,","M"],["she","S"],["couldn't open","V"],["it.","O"]],kr:"아무리 애써도 그녀는 그것을 열 수 없었다.",note:"no matter how = however — 아무리 ~해도(양보).",words:[["try","애쓰다, 시도하다"]]},

// ========================= 완성편 56~61 (관계사) =========================
// 완성-56 who, whose, whom, which, that
{n:457,cat:"rel",lvl:2,pt:"완성-56",add:"주격 관계대명사 who",en:"The scientist who discovered the cure became famous.",pattern:"2",chunks:[["The scientist","S"],["who discovered the cure","M"],["became","V"],["famous.","SC"]],kr:"그 치료법을 발견한 과학자는 유명해졌다.",note:"주격 관계대명사 who절이 선행사(scientist)를 꾸민다.",words:[["discover","발견하다"],["cure","치료법"]]},
{n:458,cat:"rel",lvl:3,pt:"완성-56",add:"소유격 관계대명사 whose",en:"I met a man whose father is a famous painter.",pattern:"3",chunks:[["I","S"],["met","V"],["a man","O"],["whose father is a famous painter.","M"]],kr:"나는 아버지가 유명한 화가인 한 남자를 만났다.",note:"whose + 명사 — 선행사의 소유 관계를 나타낸다.",words:[["painter","화가"]]},
{n:459,cat:"rel",lvl:2,pt:"완성-56",add:"목적격 관계대명사 which",en:"The novel which she wrote became a bestseller.",pattern:"2",chunks:[["The novel","S"],["which she wrote","M"],["became","V"],["a bestseller.","SC"]],kr:"그녀가 쓴 그 소설은 베스트셀러가 되었다.",note:"목적격 관계대명사 which절이 선행사(novel)를 꾸민다.",words:[["novel","소설"]]},
// 완성-57 when, where, why, how, what
{n:460,cat:"rel",lvl:2,pt:"완성-57",add:"관계부사 where",en:"This is the village where I spent my childhood.",pattern:"2",chunks:[["This","S"],["is","V"],["the village","SC"],["where I spent my childhood.","M"]],kr:"이곳이 내가 어린 시절을 보낸 마을이다.",note:"관계부사 where가 장소(village)를 꾸민다.",words:[["village","마을"],["childhood","어린 시절"]]},
{n:461,cat:"rel",lvl:3,pt:"완성-57",add:"관계부사 when",en:"I'll never forget the moment when we first met.",pattern:"3",chunks:[["I","S"],["will never forget","V"],["the moment","O"],["when we first met.","M"]],kr:"나는 우리가 처음 만난 그 순간을 결코 잊지 못할 것이다.",note:"관계부사 when이 시간(moment)을 꾸민다.",words:[["moment","순간"]]},
{n:462,cat:"rel",lvl:3,pt:"완성-57",add:"관계대명사 what (~하는 것)",en:"What he said completely changed my opinion.",pattern:"3",chunks:[["What he said","S"],["completely","M"],["changed","V"],["my opinion.","O"]],kr:"그가 한 말이 내 의견을 완전히 바꿨다.",note:"what절(~하는 것)이 선행사를 포함한 명사절로 주어 역할.",words:[["opinion","의견"]]},
// 완성-58 관계사의 생략 / 전치사+관계대명사
{n:463,cat:"rel",lvl:2,pt:"완성-58",add:"목적격 관계대명사 생략",en:"The person I trusted most betrayed me.",pattern:"3",chunks:[["The person","S"],["I trusted most","M"],["betrayed","V"],["me.","O"]],kr:"내가 가장 믿었던 사람이 나를 배신했다.",note:"목적격 관계대명사(whom/that)가 생략되었다.",words:[["betray","배신하다"]]},
{n:464,cat:"rel",lvl:3,pt:"완성-58",add:"주격 관계대명사+be 생략(+분사)",en:"The building destroyed in the fire was a museum.",pattern:"2",chunks:[["The building","S"],["destroyed in the fire","M"],["was","V"],["a museum.","SC"]],kr:"화재로 파괴된 그 건물은 박물관이었다.",note:"which was가 생략되어 과거분사(destroyed)가 명사를 직접 꾸민다.",words:[["destroy","파괴하다"]]},
{n:465,cat:"rel",lvl:3,pt:"완성-58",add:"전치사+관계대명사 (with which)",en:"This is the tool with which the artist carved the statue.",pattern:"2",chunks:[["This","S"],["is","V"],["the tool","SC"],["with which the artist carved the statue.","M"]],kr:"이것이 그 예술가가 조각상을 새긴 도구이다.",note:"carve A with B에서 전치사 with가 관계대명사 which 앞으로 갔다.",words:[["carve","새기다, 조각하다"],["statue","조각상"]]},
// 완성-59 선행사와 떨어진 관계사 / 여러 개의 관계사절
{n:466,cat:"rel",lvl:3,pt:"완성-59",add:"선행사와 떨어진 관계사절",en:"A letter arrived this morning which changed everything.",pattern:"1",chunks:[["A letter","S"],["arrived","V"],["this morning","M"],["which changed everything.","M"]],kr:"오늘 아침에 모든 것을 바꾼 편지 한 통이 도착했다.",note:"관계사절(which ~)이 선행사(A letter)와 떨어져 문장 끝에 왔다.",words:[["arrive","도착하다"]]},
{n:467,cat:"rel",lvl:3,pt:"완성-59",add:"계속적 용법 (, who)",en:"He introduced me to his sister, who is a doctor.",pattern:"3",chunks:[["He","S"],["introduced","V"],["me","O"],["to his sister, who is a doctor.","M"]],kr:"그는 나를 그의 누나에게 소개했는데, 그녀는 의사이다.",note:"계속적 용법(, who)은 선행사에 정보를 덧붙이며 '그런데 그녀는'으로 해석.",words:[["introduce","소개하다"]]},
{n:468,cat:"rel",lvl:3,pt:"완성-59",add:"하나의 선행사에 두 관계사절",en:"She is the only friend that I have who really understands me.",pattern:"2",chunks:[["She","S"],["is","V"],["the only friend","SC"],["that I have who really understands me.","M"]],kr:"그녀는 내가 가진 유일한 친구이자 나를 진정으로 이해해 주는 친구다.",note:"한 선행사(friend)를 두 개의 관계사절이 함께 꾸민다.",words:[["understand","이해하다"]]},
// 완성-60 복합관계사
{n:469,cat:"rel",lvl:2,pt:"완성-60",add:"whoever (~하는 누구든)",en:"Whoever finishes first will get a prize.",pattern:"3",chunks:[["Whoever finishes first","S"],["will get","V"],["a prize.","O"]],kr:"먼저 끝내는 사람은 누구든 상을 받을 것이다.",note:"복합관계대명사 whoever = anyone who. 명사절 주어.",words:[["prize","상"]]},
{n:470,cat:"rel",lvl:2,pt:"완성-60",add:"whatever (~하는 무엇이든)",en:"You can order whatever you want from the menu.",pattern:"3",chunks:[["You","S"],["can order","V"],["whatever you want","O"],["from the menu.","M"]],kr:"너는 메뉴에서 원하는 것은 무엇이든 주문해도 된다.",note:"복합관계대명사 whatever = anything that. 명사절 목적어.",words:[["order","주문하다"]]},
{n:471,cat:"rel",lvl:3,pt:"완성-60",add:"however + 형용사 (아무리 ~해도)",en:"However tired you are, you must finish the work.",pattern:"3",chunks:[["However tired you are,","M"],["you","S"],["must finish","V"],["the work.","O"]],kr:"아무리 피곤해도 너는 그 일을 끝내야 한다.",note:"however + 형용사/부사 — 아무리 ~해도(양보의 부사절).",words:[["tired","피곤한"]]},
// 완성-61 여러 가지 의미의 that
{n:472,cat:"rel",lvl:2,pt:"완성-61",add:"명사절 접속사 that",en:"I am sure that everything will be fine.",pattern:"2",chunks:[["I","S"],["am","V"],["sure","SC"],["that everything will be fine.","M"]],kr:"나는 모든 것이 잘될 것이라고 확신한다.",note:"이 that은 명사절을 이끄는 접속사(뒤 문장이 완전).",words:[["sure","확신하는"]]},
{n:473,cat:"rel",lvl:2,pt:"완성-61",add:"관계대명사 that",en:"The house that stands on the hill is theirs.",pattern:"2",chunks:[["The house","S"],["that stands on the hill","M"],["is","V"],["theirs.","SC"]],kr:"언덕 위에 서 있는 그 집은 그들의 것이다.",note:"이 that은 the house를 꾸미는 관계대명사(뒤 문장에 주어가 빠짐).",words:[["hill","언덕"]]},

let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.cards){
      // 이전 버전 저장본에 없던 새 문장 카드를 보충 (없으면 dueList에서 오류)
      SENTENCES.forEach(s=>{if(!r.cards[s.n])r.cards[s.n]={box:0,due:0,seen:0,ok:0,no:0,star:false};});
      return r;
    }
  }catch(e){}
  return fresh();
}
function fresh(){
  const cards={};
  SENTENCES.forEach(s=>{cards[s.n]={box:0,due:0,seen:0,ok:0,no:0,star:false,weak:false};});
  return {cards, pts:0, streak:0, lastDay:null, doneDays:[], goal:8, todayCount:0, todayDate:todayStr(), adv:false};
}
let _cloudT=null;
// 통합 DB: 학습 기록은 플래너와 같은 곳(planner/{uid}/apps/sentence)에 저장. users/{uid}는 플래너 프로필 전용
function appRef(uid){ return fbDB.collection('planner').doc(uid||UID).collection('apps').doc('sentence'); }
function cloudPush(){
  try{
    const sum=buildShareSummary();
    appRef().set(Object.assign({},S,{summary:sum,updated:Date.now()}));
  }catch(e){}
}
function save(){
  // 통합 DB: 날짜별 학습 문장 수 기록 (플래너가 학습시간으로 인정)
  if(S.todayDate&&S.todayCount){ if(!S.dayLog)S.dayLog={}; S.dayLog[S.todayDate]=S.todayCount; }
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(CLOUD&&UID&&fbDB){
    clearTimeout(_cloudT);
    _cloudT=setTimeout(cloudPush, 800);
  }
}
// 예전 버전이 users/{uid}에 통째로 저장하던 천문장 필드 (플래너 프로필과 겹치지 않게 옮긴 뒤 지움)
const LEGACY_KEYS=['cards','pts','streak','lastDay','doneDays','goal','todayCount','todayDate','adv','shareCode'];
function backfillCards(st){
  if(!st.cards)st.cards={};
  if(!Array.isArray(st.doneDays))st.doneDays=[];
  SENTENCES.forEach(function(s){ if(!st.cards[s.n]) st.cards[s.n]={box:0,due:0,seen:0,ok:0,no:0,star:false}; });
  return st;
}
function cloudLoad(user){
  return appRef(user.uid).get().then(function(doc){
    if(doc.exists&&doc.data()&&doc.data().cards){ const d=doc.data(); delete d.summary; delete d.updated; return {st:d,migrated:false}; }
    // 새 위치에 없으면 예전 위치(users/{uid})에서 옮겨 옴
    return fbDB.collection('users').doc(user.uid).get().then(function(old){
      const o=old.exists?old.data():null;
      if(o&&o.cards){ const st={}; LEGACY_KEYS.forEach(function(k){ if(o[k]!==undefined) st[k]=o[k]; }); if(o.name) st.name=o.name; return {st:st,migrated:true}; }
      return {st:load(),migrated:false};
    });
  }).then(function(r){
    let st=r.st;
    backfillCards(st);
    if(!st.name&&user.displayName)st.name=user.displayName;
    if(!st.shareCode)st.shareCode=genCode();
    S=st;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(r.migrated){
      cloudPush();
      const del={}; LEGACY_KEYS.forEach(function(k){ del[k]=firebase.firestore.FieldValue.delete(); });
      fbDB.collection('users').doc(user.uid).update(del).catch(function(){});
    }
  }).catch(function(){ S=load(); });
}
function genCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';for(var i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c;}
function buildShareSummary(){
  var total=SENTENCES.length, mastered=masteredCount(), wl=weakList();
  return {
    ownerUid:UID, name:(S.name||USER_EMAIL||'학생'), updatedAt:Date.now(),
    goal:S.goal, streak:S.streak, todayCount:S.todayCount, adv:!!S.adv,
    mastered:mastered, total:total, pct:Math.round(mastered/total*100),
    pts:S.pts, weakCount:wl.length,
    weak: wl.slice(0,15).map(function(s){var c=S.cards[s.n];return {n:s.n,en:s.en,kr:s.kr,pt:s.pt,box:c.box,no:c.no};})
  };
}
function rollDay(){
  const t=todayStr();
  if(S.todayDate!==t){S.todayDate=t;S.todayCount=0;}
}
const byN=Object.fromEntries(SENTENCES.map(s=>[s.n,s]));

/* ---------- 학습 대상 선정 ---------- */
function dueList(){
  const now=Date.now();
  const due=SENTENCES.filter(s=>{const c=S.cards[s.n];return c && c.box<5 && (c.due<=now);});
  // 심화 모드: 어려운 레벨(절·심화) 우선. 기본: 미학습 먼저 → 책 순서
  due.sort((a,b)=>{
    if(S.adv){const d=(b.lvl||1)-(a.lvl||1); if(d)return d;}
    return (S.cards[a.n].seen-S.cards[b.n].seen)||(a.n-b.n);
  });
  return due;
}
// 틀렸거나 '아직 헷갈려요'로 표시된 약점 문장 — 숙달 전까지 집중 반복
function weakList(){
  return SENTENCES.filter(s=>{const c=S.cards[s.n];return c && c.weak && c.box<5;})
   .sort((a,b)=>{const ca=S.cards[a.n],cb=S.cards[b.n];return (ca.box-cb.box)||(cb.no-ca.no)||(a.n-b.n);});
}
function masteredCount(){return SENTENCES.filter(s=>S.cards[s.n].box>=5).length;}

/* ---------- 토스트 ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- 발음 ---------- */
function speak(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('en'));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function escAttr(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// 어디서든 data-spk가 붙은 요소를 누르면 그 텍스트를 읽어줌
document.addEventListener('click',function(e){
  const t=e.target.closest&&e.target.closest('[data-spk]');
  if(t){e.preventDefault();e.stopPropagation();speak(t.getAttribute('data-spk'));}
},true);

/* ---------- 라우터 ---------- */
let TAB='home';
function go(t){TAB=t;render();window.scrollTo(0,0);}

/* ---------- 성분분석 렌더 ---------- */
function renderAnalysis(s,{showLab=true}={}){
  return s.chunks.map(([t,r])=>{
    const col=cvar(ROLE[r].c), bg=cvar(ROLE[r].c+'-bg');
    const lab=showLab?`<span class="lab" style="color:#fff;background:${col}">${r}</span>`:'';
    return `<span class="chunk" style="background:${bg};color:${col}">${lab}${t}</span>`;
  }).join(' ');
}
function legend(s){
  const used=[...new Set(s.chunks.map(c=>c[1]))];
  return `<div class="legend">`+used.map(r=>{
    const col=cvar(ROLE[r].c),bg=cvar(ROLE[r].c+'-bg');
    return `<span class="lg" style="background:${bg};color:${col}">${r} ${ROLE[r].ko}</span>`;
  }).join('')+`</div>`;
}

/* ============================ 화면들 ============================ */
function render(){
  rollDay();save();
  document.body.classList.toggle('insession', !!SESSION);
  const app=$('#app');
  if(SESSION){app.innerHTML='';app.appendChild(renderSession());drawNav();return;}
  let v;
  if(TAB==='home')v=viewHome();
  else if(TAB==='book')v=viewBook();
  else if(TAB==='grammar')v=viewGrammar();
  else if(TAB==='stats')v=viewStats();
  else if(TAB==='settings')v=viewSettings();
  app.innerHTML='';app.appendChild(v);drawNav();
}
function appbar(){
  return `<div class="appbar"><h1>천문장 <span>단문장 트레이너</span></h1>
   <div class="chips"><span class="chip flame">🔥<b>${S.streak}</b></span>
   <span class="chip pts">⭐<b>${S.pts}</b></span></div></div>`;
}

/* ---- 홈 ---- */
function viewHome(){
  const due=dueList();
  const goal=S.goal, done=Math.min(S.todayCount,goal);

  const newCnt=due.filter(s=>S.cards[s.n].seen===0).length;
  const revCnt=due.length-newCnt;
  const weak=weakList();
  const canStart=due.length||weak.length;
  const v=el(`<div class="view">${appbar()}
    <div class="card hero">
      <div class="eyebrow">오늘의 학습${S.adv?' · 심화 모드':''}</div>
      <div class="ring-wrap">
        <div class="ring"><svg width="96" height="96">
          <circle cx="48" cy="48" r="${R}" fill="none" stroke="${cvar('--line')}" stroke-width="9"/>
          <circle cx="48" cy="48" r="${R}" fill="none" stroke="${cvar('--brand')}" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg><div class="num"><b>${done}/${goal}</b><small>문장</small></div></div>
        <div class="todo-info">
          <div class="big">${done>=goal?'오늘 목표 달성! 🎉':(canStart?'학습할 문장이 있어요':'복습할 문장 없음')}</div>
          <div class="sub">새 문장 ${newCnt} · 복습 ${revCnt}${weak.length?` · 집중 ${weak.length}`:''}</div>
        </div>
      </div>
      <button class="btn" id="start">${done>=goal&&canStart?'추가 학습하기':(canStart?'학습 시작':'단어장 보기')}</button>
    </div>
    ${weak.length?`<div class="card focus-card">
      <div class="fc-txt"><div class="t">🎯 집중 복습 <b>${weak.length}</b>문장</div>
        <div class="s">틀렸거나 '아직 헷갈려요'로 표시한 문장이에요. 숙달될 때까지 매일 학습에 일부가 자동으로 섞여 나옵니다.</div></div>
      <button class="tog" id="focusgo">집중 복습만</button></div>
    <div id="weakprev"></div>`:''}
    <div class="statgrid">
      <div class="card"><b>${mastered}</b><small>숙달</small></div>
      <div class="card"><b>${total-mastered}</b><small>학습 중</small></div>
      <div class="card"><b>${Math.round(mastered/total*100)}%</b><small>진도</small></div>
    </div>
    <div class="sect-h"><h2>학습 달력</h2></div>
    <div class="card cal" id="cal"></div>
  </div>`);
  v.querySelector('#start').onclick=()=>{ if(canStart)startSession(); else go('book'); };
  const fg=v.querySelector('#focusgo'); if(fg)fg.onclick=()=>startSession(weak.map(s=>s.n));
  const wp=v.querySelector('#weakprev');
  if(wp){
    wp.appendChild(el(`<div class="sect-h"><h2>눈에 익히기</h2><span class="u">자주 보면 익숙해져요</span></div>`));
    weak.slice(0,4).forEach(s=>{
      const p=POINTS[s.pt];
      const card=el(`<div class="card weak-item">
        <div class="wi-top"><span class="wi-pt">${p?p.book+' '+p.num+'. '+p.title:''}</span>
          <button class="sound" data-spk="${escAttr(s.en)}" title="듣기">🔊</button></div>
        <div class="an-line" style="font-size:15px;line-height:2.1">${renderAnalysis(s,{showLab:false})}</div>
        <div class="wi-kr">${s.kr}</div></div>`);
      card.onclick=(e)=>{ if(e.target.closest('[data-spk]'))return; startSession([s.n]); };
      wp.appendChild(card);
    });
    if(weak.length>4) wp.appendChild(el(`<div class="wi-more">그 외 ${weak.length-4}문장 더 · 위의 '집중 복습만'으로 전체 학습</div>`));
  }
  v.querySelector('#cal').appendChild(buildCal());
  return v;

function buildCal(){
  const now=new Date(); const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate();
  const wk=['일','월','화','수','목','금','토'];
  const wrap=el(`<div></div>`);
  wrap.innerHTML=`<div class="wk">${wk.map(d=>`<span>${d}</span>`).join('')}</div>`;
  let days='<div class="days">';
  for(let i=0;i<first;i++)days+='<div class="day blank"></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done=S.doneDays.includes(ds), today=ds===todayStr();
    days+=`<div class="day ${done?'done':''} ${today?'today':''}">${d}</div>`;
  }
  days+='</div>';
  wrap.insertAdjacentHTML('beforeend',days);
  return wrap;
}

/* ============================ 학습 세션 ============================ */
let SESSION=null;
function startSession(forceList){
  let list;
  if(forceList&&forceList.length){
    list=forceList.map(n=>byN[n]).filter(Boolean);
  } else {
    const due=dueList();
    const weak=weakList();
    const remain=S.todayCount>=S.goal ? S.goal : (S.goal-S.todayCount); // 목표 달성 후엔 한 묶음 더
    const cap=Math.max(remain,1);
    // 집중 복습: 약점 문장에 자리의 약 40%(최소 2개)를 우선 배정해 매일 반복 노출
    const focusN=weak.length?Math.min(weak.length, Math.max(2, Math.round(cap*0.4))):0;
    const focus=weak.slice(0,focusN);
    const fset=new Set(focus.map(s=>s.n));
    const rest=due.filter(s=>!fset.has(s.n));
    list=focus.concat(rest).slice(0,cap);
    if(!list.length){toast('복습할 문장이 없어요');return;}
  }
  SESSION={queue:list.map(s=>s.n), i:0, phase:'flash', ok:0, no:0, wrongAgain:[],
           startPts:S.pts, total:list.length, answered:false, _qtype:null};
  render();
}
function endSession(){
  const d=todayStr();
  if(!S.doneDays.includes(d))S.doneDays.push(d);
  if(S.lastDay!==d){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=d;
  }
  save();
}
function gradeCard(n,correct){
  const c=S.cards[n];c.seen++;
  // 통합 DB: 날짜별(현지 날짜) 맞힘/틀림 — 플래너가 정답률 보너스를 계산
  { const d=new Date(), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!S.dayStat)S.dayStat={}; const st=S.dayStat[k]||(S.dayStat[k]={ok:0,no:0}); if(correct)st.ok++; else st.no++; }
  if(correct){c.ok++;c.box=Math.min(c.box+1,5);S.pts+=10; if(c.box>=3)c.weak=false;}
  else{c.no++;c.box=Math.max(c.box-1,0);S.pts+=2; c.weak=true;}
  c.due=Date.now()+INTERVALS[c.box]*DAY;
  save();
}
function nextCard(){
  SESSION.i++; SESSION.phase='flash'; SESSION.answered=false;
  if(SESSION.i>=SESSION.queue.length){
    if(SESSION.wrongAgain.length){ // 틀린 문장 1회 더
      SESSION.queue=SESSION.wrongAgain.slice(); SESSION.wrongAgain=[]; SESSION.i=0;
    }else{ finishSession(); return; }
  }
  render();
}
function finishSession(){
  S.todayCount+=SESSION.total; endSession();
  const res=SESSION; SESSION='done_'+JSON.stringify({ok:res.ok,no:res.no,gain:S.pts-res.startPts,total:res.total});
  render();
}

function renderSession(){
  if(typeof SESSION==='string'&&SESSION.startsWith('done_')){
    const r=JSON.parse(SESSION.slice(5));
    const acc=r.ok+r.no?Math.round(r.ok/(r.ok+r.no)*100):100;
    const v=el(`<div class="view result">
      <div class="em pop">${acc>=80?'🎉':acc>=50?'👍':'💪'}</div>
      <h2>학습 완료!</h2><p>오늘도 한 걸음 나아갔어요</p>
      <div class="res-stat">
        <div><b>${r.total}</b><small>문장</small></div>
        <div><b style="color:${cvar('--good')}">${acc}%</b><small>정답률</small></div>
        <div><b style="color:${cvar('--gold')}">+${r.gain}</b><small>포인트</small></div>
      </div>
      <button class="btn" id="r-home">홈으로</button>
      <button class="btn ghost sm" id="r-more">더 학습하기</button>
    </div>`);
    v.querySelector('#r-home').onclick=()=>{SESSION=null;go('home');};
    v.querySelector('#r-more').onclick=()=>{SESSION=null;if(dueList().length)startSession();else{go('home');toast('복습할 문장이 없어요');}};
    return v;
  }
  const n=SESSION.queue[SESSION.i], s=byN[n];
  const prog=(SESSION.i)/SESSION.queue.length*100;
  const head=`<div class="session-top"><button class="x" id="s-x">✕</button>
     <div class="prog"><i style="width:${prog}%"></i></div>
     <span class="phase-tag">${SESSION.i+1} / ${SESSION.queue.length}</span></div>`;
  let body;
  if(SESSION.phase==='flash') body=stageFlash(s);
  else body=stageQuiz(s);
  const wrap=el(`<div>${head}<div id="stage"></div></div>`);
  wrap.querySelector('#stage').appendChild(body);
  wrap.querySelector('#s-x').onclick=()=>{if(confirm('학습을 끝낼까요? 지금까지 진행은 저장됩니다.')){if(SESSION.i>0){S.todayCount+=SESSION.i;endSession();}SESSION=null;go('home');}};
  return wrap;
}

/* ---- 1단계: 플래시카드 ---- */
function stageFlash(s){
  const pt=POINTS[s.pt];
  const st=el(`<div class="stage flash">
    <div class="fc-meta">
      <span class="badge">${pt?pt.title:''}</span>
      <span class="badge pat">${PAT_LABEL[s.pattern]}</span>
      <button class="sound" id="spk">🔊</button>
    </div>
    <div class="card sent-card" id="card">
      <div class="sent-en">${s.en}</div>
      <div class="tap-hint" id="hint">탭하면 성분 분석과 해석이 나와요 👆</div>
    </div>
    <div id="revealwrap"></div>
  </div>`);
  st.querySelector('#spk').onclick=()=>speak(s.en);
  let revealed=false;
  const reveal=()=>{
    if(revealed)return;revealed=true;
    st.querySelector('#hint').remove();
    const card=st.querySelector('#card');
    card.querySelector('.sent-en').classList.add('hidden');
    card.insertAdjacentHTML('beforeend',`<div class="analysis"><div class="an-line">${renderAnalysis(s)}</div></div>`+legend(s));
    st.querySelector('#revealwrap').innerHTML=
      `<div class="kr-box">${s.kr}</div>`+
      (s.note?`<div class="note-box">💡 ${s.note}</div>`:'')+
      (s.words?.length?`<div class="words-box">${s.words.map(w=>`<span class="wtag" data-spk="${escAttr(w[0])}"><b>${w[0]}</b> <span>${w[1]}</span> 🔈</span>`).join('')}</div>`:'');
    const row=el(`<div class="know-row">
       <button class="know-no" id="kn-no">아직 헷갈려요</button>
       <button class="know-yes" id="kn-yes">이해했어요</button></div>`);
    st.appendChild(row);
    row.querySelector('#kn-no').onclick=()=>{SESSION.phase='quiz';SESSION._hintWrong=true;render();};
    row.querySelector('#kn-yes').onclick=()=>{SESSION.phase='quiz';SESSION._hintWrong=false;render();};
  };
  st.querySelector('#card').onclick=reveal;
  return st;
}

/* ---- 2단계: 퀴즈 (문장마다 1유형 랜덤) ---- */
function pickQuizType(s){
  // 심화 모드: 쉬운 '해석 4지선다'를 빼고 분석·배열·형식 위주
  let pool = S.adv ? ['tag','order','pattern'] : ['translate','tag','order','pattern'];
  // 너무 짧은 문장(2덩어리 이하)은 태깅/배열 비중↓
  if(s.chunks.length<3) pool = S.adv ? ['pattern','order'] : ['translate','pattern','order'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function stageQuiz(s){
  if(!SESSION._qtype)SESSION._qtype=pickQuizType(s);
  const t=SESSION._qtype;
  if(t==='translate')return quizTranslate(s);
  if(t==='tag')return quizTag(s);
  if(t==='order')return quizOrder(s);
  return quizPattern(s);
}
function afterAnswer(s,correct,fb){
  SESSION._qtype=null;
  if(correct){SESSION.ok++;}
  else{SESSION.no++;if(!SESSION.wrongAgain.includes(s.n))SESSION.wrongAgain.push(s.n);}
  gradeCard(s.n,correct);
  if(SESSION._hintWrong){S.cards[s.n].weak=true;save();}
  fb.insertAdjacentHTML('beforeend',`<button class="btn q-next" id="qn">${SESSION.i+1>=SESSION.queue.length&&!SESSION.wrongAgain.length?'결과 보기':'다음'}</button>`);
  fb.querySelector('#qn').onclick=()=>nextCard();
}

/* 해석 4지선다 */
function quizTranslate(s){
  const others=SENTENCES.filter(x=>x.n!==s.n).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.kr);
  const opts=[s.kr,...others].sort(()=>Math.random()-.5);
  const st=el(`<div class="stage">
    <div class="q-instr">알맞은 우리말 해석을 고르세요</div>
    <div class="q-en">${s.en} <button class="sound" style="vertical-align:middle" id="spk">🔊</button></div>
    <div id="opts"></div><div id="fb"></div></div>`);
  st.querySelector('#spk').onclick=()=>speak(s.en);
  const ow=st.querySelector('#opts');
  opts.forEach(o=>{
    const b=el(`<button class="opt">${o}</button>`);
    b.onclick=()=>{
      if(SESSION.answered)return;SESSION.answered=true;
      const correct=o===s.kr;
      [...ow.children].forEach(c=>{if(c.textContent===s.kr)c.classList.add('correct');else if(c===b)c.classList.add('wrong');else c.classList.add('dim');});
      const fb=st.querySelector('#fb');
      fb.innerHTML=`<div class="feedback ${correct?'ok':'no'}">${correct?'정답이에요! ⭐':'아쉬워요'}<span class="kr">${s.en} → ${s.kr}</span></div>`;
      afterAnswer(s,correct,fb);
    };
    ow.appendChild(b);
  });
  return st;
}

/* 문형(형식) 판별 */
function quizPattern(s){
  const all=["1","2","3","4","5","etc"];
  const st=el(`<div class="stage">
    <div class="q-instr">이 문장의 형식은?</div>
    <div class="q-en">${renderAnalysis(s,{showLab:true})}</div>${legend(s)}
    <div id="opts" style="margin-top:14px"></div><div id="fb"></div></div>`);
  const ow=st.querySelector('#opts');
  all.forEach(p=>{
    const b=el(`<button class="opt" style="text-align:center">${PAT_LABEL[p]}</button>`);
    b.onclick=()=>{
      if(SESSION.answered)return;SESSION.answered=true;
      const correct=p===s.pattern;
      [...ow.children].forEach((c,idx)=>{if(all[idx]===s.pattern)c.classList.add('correct');else if(c===b)c.classList.add('wrong');else c.classList.add('dim');});
      const fb=st.querySelector('#fb');
      fb.innerHTML=`<div class="feedback ${correct?'ok':'no'}">${correct?'맞아요! ⭐':'정답: '+PAT_LABEL[s.pattern]}<span class="kr">${s.note||s.kr}</span></div>`;
      afterAnswer(s,correct,fb);
    };
    ow.appendChild(b);
  });
  return st;
}

/* 성분 태깅 */
function quizTag(s){
  const usedRoles=[...new Set(s.chunks.map(c=>c[1]))];
  // 팔레트: 실제 사용된 역할 + 약간의 distractor (최대 6개)
  let pal=[...usedRoles];
  ['S','V','O','SC','OC','M','IO','DO'].forEach(r=>{if(pal.length<Math.min(6,usedRoles.length+2)&&!pal.includes(r))pal.push(r);});
  pal.sort(()=>Math.random()-.5);
  const assign=new Array(s.chunks.length).fill(null);
  let active=null;
  const st=el(`<div class="stage">
    <div class="q-instr">각 덩어리에 알맞은 성분을 지정하세요<br><small style="color:var(--ink-faint)">역할 버튼을 누른 뒤 덩어리를 탭하세요</small></div>
    <div class="tag-sent" id="ts"></div>
    <div class="role-pal" id="pal"></div>
    <button class="btn sm" id="check" style="margin-top:16px">채점하기</button>
    <div id="fb"></div></div>`);
  const ts=st.querySelector('#ts');
  s.chunks.forEach((c,i)=>{
    const tk=el(`<div class="tag-chunk" data-i="${i}">${c[0]}</div>`);
    tk.onclick=()=>{
      if(SESSION.answered)return;
      if(active==null){toast('먼저 역할 버튼을 누르세요');return;}
      assign[i]=active; paint();
    };
    ts.appendChild(tk);
  });
  const palw=st.querySelector('#pal');
  pal.forEach(r=>{
    const col=cvar(ROLE[r].c),bg=cvar(ROLE[r].c+'-bg');
    const b=el(`<button class="role-btn" data-r="${r}" style="background:${bg};color:${col}">${r} ${ROLE[r].ko}</button>`);
    b.onclick=()=>{if(SESSION.answered)return;active=r;[...palw.children].forEach(x=>x.classList.toggle('active',x===b));};
    palw.appendChild(b);
  });
  function paint(){
    [...ts.children].forEach((tk,i)=>{
      tk.querySelector('.as')?.remove();
      tk.style.borderColor='';
      if(assign[i]){const col=cvar(ROLE[assign[i]].c);
        tk.style.borderColor=col;
        tk.insertAdjacentHTML('beforeend',`<span class="as" style="background:${col}">${assign[i]}</span>`);}
    });
  }
  st.querySelector('#check').onclick=()=>{
    if(SESSION.answered)return;
    if(assign.includes(null)){toast('모든 덩어리에 성분을 지정하세요');return;}
    SESSION.answered=true;
    let allok=true;
    [...ts.children].forEach((tk,i)=>{
      const ok=assign[i]===s.chunks[i][1];if(!ok)allok=false;
      tk.classList.add(ok?'ok':'no');
      if(!ok){const col=cvar(ROLE[s.chunks[i][1]].c);
        const as=tk.querySelector('.as');if(as){as.textContent=assign[i]+'→'+s.chunks[i][1];as.style.background=cvar('--bad');}}
    });
    const fb=st.querySelector('#fb');
    fb.innerHTML=`<div class="feedback ${allok?'ok':'no'}">${allok?'완벽해요! ⭐':'정답 분석을 확인하세요'}
      <span class="kr">${renderAnalysisText(s)} · ${s.kr}</span></div>`;
    afterAnswer(s,allok,fb);
  };
  return st;
}
function renderAnalysisText(s){return s.chunks.map(c=>`${c[0]}(${c[1]})`).join(' ');}

/* 어순 배열 */
function quizOrder(s){
  const toks=s.chunks.map((c,i)=>({t:c[0],i}));
  const shuffled=[...toks].sort(()=>Math.random()-.5);
  // 이미 순서대로면 한 번 더 섞기
  if(shuffled.every((x,i)=>x.i===i)&&shuffled.length>1)shuffled.reverse();
  const order=[];
  const st=el(`<div class="stage">
    <div class="q-instr">우리말 뜻에 맞게 문장을 배열하세요</div>
    <div class="kr-box" style="margin-top:8px">${s.kr}</div>
    <div class="wo-target" id="tg"></div>
    <div class="wo-pool" id="pool"></div>
    <button class="btn sm" id="check" style="margin-top:14px">채점하기</button>
    <button class="btn gray sm" id="reset">다시</button>
    <div id="fb"></div></div>`);
  const pool=st.querySelector('#pool'),tg=st.querySelector('#tg');
  function drawPool(){
    pool.innerHTML='';
    shuffled.forEach(tok=>{
      const used=order.includes(tok.i);
      const b=el(`<button class="wo-tok ${used?'used':''}">${tok.t}</button>`);
      b.onclick=()=>{if(SESSION.answered||used)return;order.push(tok.i);drawAll();};
      pool.appendChild(b);
    });
  }
  function drawTarget(){
    tg.innerHTML=order.length?'':'<span style="color:var(--ink-faint);font-size:13px;font-weight:600">여기에 순서대로 쌓여요</span>';
    order.forEach((oi,pos)=>{
      const tok=toks.find(x=>x.i===oi);
      const b=el(`<button class="wo-tok">${tok.t}</button>`);
      b.onclick=()=>{if(SESSION.answered)return;order.splice(pos,1);drawAll();};
      tg.appendChild(b);
    });
  }
  function drawAll(){drawTarget();drawPool();}
  drawAll();
  st.querySelector('#reset').onclick=()=>{if(SESSION.answered)return;order.length=0;drawAll();};
  st.querySelector('#check').onclick=()=>{
    if(SESSION.answered)return;
    if(order.length!==toks.length){toast('모든 덩어리를 배열하세요');return;}
    SESSION.answered=true;
    const correct=order.every((oi,i)=>oi===i);
    const fb=st.querySelector('#fb');
    fb.innerHTML=`<div class="feedback ${correct?'ok':'no'}">${correct?'정답이에요! ⭐':'정답 어순을 확인하세요'}
      <span class="kr">${s.en}</span></div>`;
    if(!correct)tg.querySelectorAll('.wo-tok').forEach((b,i)=>{b.style.borderColor=order[i]===i?cvar('--good'):cvar('--bad');});
    afterAnswer(s,correct,fb);
  };
  return st;
}

function drawBookList(list){
  const q=bookQuery.trim().toLowerCase();
  list.innerHTML='';
  if(q){ // 검색: 카테고리 무시하고 전체에서
    const hits=SENTENCES.filter(s=>s.en.toLowerCase().includes(q)||s.kr.includes(q));
    if(!hits.length){list.innerHTML='<div class="empty">검색 결과가 없어요</div>';return;}
    const g=el(`<div class="pt-group"><div class="pt-head">검색 결과 <span class="u">${hits.length}문장</span></div></div>`);
    hits.forEach(s=>g.appendChild(sentCard(s)));
    list.appendChild(g); return;
  }
  if(!bookCat){ // 카테고리 그리드
    const grps=[...new Set(CATS.map(c=>c.grp))];
    grps.forEach(grp=>{
      const wrap=el(`<div class="pt-group"><div class="pt-head">${grp}</div></div>`);
      const grid=el(`<div class="cat-grid"></div>`);
      CATS.filter(c=>c.grp===grp).forEach(c=>{
        const n=catCount(c.id);
        const card=el(`<div class="card cat-card">
          <div class="cat-name">${c.name}</div>
          <div class="cat-blurb">${c.blurb}</div>

        </div>`);
        if(n)card.onclick=()=>{bookCat=c.id;go('book');};
        else card.style.opacity=.5;
        grid.appendChild(card);
      });
      wrap.appendChild(grid); list.appendChild(wrap);
    });
    return;
  }
  // 카테고리 상세: 난이도별
  const cat=CATS.find(c=>c.id===bookCat);
  const mine=SENTENCES.filter(s=>s.cat===bookCat).sort((a,b)=>a.lvl-b.lvl||a.n-b.n);
  const top=el(`<div class="cat-detail-head">
    <button class="backbtn" id="bk-back">← 카테고리</button>
    <h3>${cat.name}</h3><div class="d">${cat.blurb}</div>

  </div>`);
  top.querySelector('#bk-back').onclick=()=>{bookCat=null;go('book');};
  top.querySelector('#bk-study').onclick=()=>startSession(mine.map(s=>s.n));
  list.appendChild(top);
  [...new Set(mine.map(s=>s.lvl))].sort().forEach(lv=>{
    const g=el(`<div class="pt-group"><div class="pt-head"><span class="lvl-badge lv${lv}">${LVL_LABEL[lv]}</span></div></div>`);
    mine.filter(s=>s.lvl===lv).forEach(s=>g.appendChild(sentCard(s)));
    list.appendChild(g);
  });
}

/* ============================ 문법 포인트 방 ============================ */
let grammarBook='기본', grammarUnit=null, grammarPoint=null;
function sentCount(pid){return SENTENCES.filter(s=>s.pt===pid).length;}
function viewGrammar(){
  const v=el(`<div class="view">${appbar()}
    <div class="sect-h"><h2>문법 포인트 방</h2></div>
    <div id="rooms"></div></div>`);
  const rooms=v.querySelector('#rooms');
  if(grammarPoint && POINTS[grammarPoint]) gRoomPoint(rooms);
  else if(grammarUnit) gRoomUnit(rooms);
  else gRoomUnits(rooms);
  return v;
}
// 1단계: 단원 카드 (책 전환)
function gRoomUnits(rooms){
  const books=[...new Set(Object.values(POINTS).map(p=>p.book))];
  const bk=el(`<div class="toolbar"></div>`);
  books.forEach(b=>{
    const tot=Object.keys(POINTS).filter(k=>POINTS[k].book===b).length;
    const ready=Object.keys(POINTS).filter(k=>POINTS[k].book===b&&sentCount(k)>0).length;
    const btn=el(`<button class="tog ${grammarBook===b?'on':''}">${b} <span style="opacity:.7">${ready}/${tot}</span></button>`);
    btn.onclick=()=>{grammarBook=b;grammarUnit=null;grammarPoint=null;go('grammar');};
    bk.appendChild(btn);
  });
  rooms.appendChild(bk);
  const ids=Object.keys(POINTS).filter(k=>POINTS[k].book===grammarBook).sort((a,b)=>POINTS[a].num-POINTS[b].num);
  const units=[];const seen={};
  ids.forEach(k=>{const u=POINTS[k].unit;if(!seen[u]){seen[u]=[];units.push(u);}seen[u].push(k);});
  const grid=el(`<div class="cat-grid"></div>`);
  units.forEach(u=>{
    const ks=seen[u];const ready=ks.filter(k=>sentCount(k)>0).length;
    const totSent=ks.reduce((a,k)=>a+sentCount(k),0);
    const card=el(`<div class="card cat-card">
      <div class="cat-name">${u}</div>
      <div class="cat-blurb">포인트 ${ks.length}개 · 문장 ${totSent}개</div>
      <span class="boxbadge" style="background:${ready?cvar('--brand'):cvar('--ink-faint')}">${ready}/${ks.length} 채움</span>
    </div>`);
    card.onclick=()=>{grammarUnit=u;grammarPoint=null;go('grammar');};
    grid.appendChild(card);
  });
  rooms.appendChild(grid);
}
// 2단계: 단원 안의 포인트(하위 카테고리) 목록
function gRoomUnit(rooms){
  const back=el(`<button class="backbtn" id="g-back">← 단원 목록</button>`);
  back.onclick=()=>{grammarUnit=null;go('grammar');};
  rooms.appendChild(back);
  rooms.appendChild(el(`<div class="cat-detail-head"><h3>${grammarUnit}</h3><div class="d">${grammarBook}편</div></div>`));
  const ks=Object.keys(POINTS).filter(k=>POINTS[k].book===grammarBook&&POINTS[k].unit===grammarUnit).sort((a,b)=>POINTS[a].num-POINTS[b].num);
  ks.forEach(k=>{
    const pt=POINTS[k];const cnt=sentCount(k);
    const card=el(`<div class="card gr-card"${cnt?' style="cursor:pointer"':''}>
      <h3>${pt.num}. ${pt.title}
        <span class="boxbadge" style="background:${cnt?cvar('--good'):cvar('--ink-faint')};margin-left:6px">${cnt?cnt+'문장':'준비 중'}</span></h3>
      <div class="d">${pt.desc}</div></div>`);
    if(cnt)card.onclick=()=>{grammarPoint=k;go('grammar');};
    else card.style.opacity=.55;
    rooms.appendChild(card);
  });
}
// 3단계: 포인트의 문장(분석)
function gRoomPoint(rooms){
  const pt=POINTS[grammarPoint];
  const back=el(`<button class="backbtn" id="g-back">← ${pt.unit}</button>`);
  back.onclick=()=>{grammarPoint=null;go('grammar');};
  rooms.appendChild(back);
  const mine=SENTENCES.filter(s=>s.pt===grammarPoint).sort((a,b)=>a.lvl-b.lvl||a.n-b.n);
  const top=el(`<div class="cat-detail-head">
    <h3>${pt.num}. ${pt.title}</h3><div class="d">${pt.desc}</div>
    ${mine.length?`<button class="btn sm" id="gp-study">이 포인트 학습 (${mine.length}문장)</button>`:''}</div>`);
  if(mine.length)top.querySelector('#gp-study').onclick=()=>startSession(mine.map(s=>s.n));
  rooms.appendChild(top);
  let lastLvl=null;
  mine.forEach(s=>{
    if(s.lvl!==lastLvl){lastLvl=s.lvl;
      rooms.appendChild(el(`<div class="pt-group"><div class="pt-head"><span class="lvl-badge lv${s.lvl}">${LVL_LABEL[s.lvl]}</span></div></div>`));}
    rooms.appendChild(sentCard(s));
  });
}
