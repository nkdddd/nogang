  {t:'mc',q:'빈칸에 알맞은 것은?  I heard someone ___ my name.',c:['to call','called','calling','calls'],a:2,exp:'지각동사 + 목적어 + 동사원형/현재분사. 보기 중 calling.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Let me help you.','She asked me to wait.','He had his son to carry the box.','I watched them play soccer.'],a:2,exp:'사역동사 have + 목적어 + 동사원형 → had his son carry.'},
  {t:'order',ko:'선생님은 우리가 조용히 하게 하셨다.',words:['The teacher','made','us','be quiet'],a:'The teacher made us be quiet.'},
  {t:'write',ko:'그녀는 나에게 창문을 열어 달라고 부탁했다.',hint:'(she, ask, me, open the window)',a:['She asked me to open the window.']}
 ],cards:[
  {f:'to부정사를 보어로 쓰는 동사',b:'want, ask, tell, advise, allow, expect'},{f:'사역동사 3개',b:'make, have, let'},{f:'사역동사의 목적격 보어',b:'동사원형'},{f:'지각동사의 목적격 보어',b:'동사원형 또는 현재분사'},{f:'let me + ?',b:'동사원형 (Let me go)'}
 ]}
]},
{id:2, title:'시제', units:[
 {id:'b2-1', title:'현재, 과거, 미래시제 / 진행형', concept:[
  {h:'기본 시제', body:'현재: 현재의 사실·습관·불변의 진리(The sun rises in the east). 과거: 과거의 일·역사적 사실. 미래: will / be going to.',
   ex:[{en:'Water <b>boils</b> at 100℃.',ko:'물은 100도에서 끓는다. (불변의 진리는 항상 현재)'},{en:'The Korean War <b>broke out</b> in 1950.',ko:'한국전쟁은 1950년에 발발했다. (역사적 사실은 항상 과거)'}]},
  {h:'진행형', body:'am/are/is + -ing(현재진행), was/were + -ing(과거진행). 왕래발착 동사(go, come, leave, arrive)의 현재진행형은 가까운 미래를 나타내기도 한다.',
   ex:[{en:'We <b>are leaving</b> for Jeju tomorrow.',ko:'우리는 내일 제주로 떠난다. (가까운 미래)'},{en:'He <b>was taking</b> a shower when I called.',ko:'내가 전화했을 때 그는 샤워 중이었다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The teacher said that the earth ___ round.',c:['was','is','will be','be'],a:1,exp:'불변의 진리는 항상 현재시제.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  King Sejong ___ Hangeul in 1443.',c:['creates','created','has created','will create'],a:1,exp:'역사적 사실은 과거시제.'},
  {t:'mc',q:'밑줄 친 부분이 「가까운 미래」를 나타내는 것은?',c:['She <u>is reading</u> now.','I <u>am coming</u> to your party tonight.','They <u>were dancing</u> then.','He <u>is sleeping</u> in his room.'],a:1,exp:'왕래발착 동사의 진행형 + 미래 표현(tonight) → 가까운 미래.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I am wanting a new phone.','It was snowing all day.','She takes a walk every morning.','We are going to move next month.'],a:0,exp:'want는 진행형으로 쓰지 않는다 → I want.'},
  {t:'order',ko:'내가 도착했을 때 그들은 저녁을 만들고 있었다.',words:['They','were making','dinner','when I arrived'],a:'They were making dinner when I arrived.'},
  {t:'write',ko:'그는 매일 아침 7시에 일어난다.',hint:'(he, get up, at seven, every morning)',a:['He gets up at seven every morning.']}
 ],cards:[
  {f:'불변의 진리의 시제',b:'항상 현재'},{f:'역사적 사실의 시제',b:'항상 과거'},{f:'왕래발착 동사 진행형의 특별한 뜻',b:'가까운 미래'},{f:'진행형 불가 동사',b:'want, know, like, have(가지다)'},{f:'과거진행형 형태',b:'was/were + -ing'}
 ]},
 {id:'b2-2', title:'현재완료', concept:[
  {h:'have/has + 과거분사(p.p.)', body:'과거의 일이 현재까지 영향을 미칠 때 쓴다. 부정문: have/has not(never) + p.p. 의문문: Have/Has + 주어 + p.p. ~?',
   table:{head:['용법','의미','자주 쓰는 표현'],rows:[['경험','~해 본 적 있다','ever, never, before, once'],['계속','(지금까지) 계속 ~해 왔다','for + 기간, since + 시점'],['완료','막 ~했다','just, already, yet'],['결과','~해 버렸다 (그 결과 지금…)','go → have gone(가 버리고 없다)']]},
   ex:[{en:'I <b>have been</b> to Gyeongju <b>twice</b>.',ko:'나는 경주에 두 번 가 봤다. (경험)'},{en:'She <b>has lived</b> here <b>since</b> 2020.',ko:'그녀는 2020년부터 여기 살고 있다. (계속)'},{en:'He <b>has just finished</b> lunch.',ko:'그는 막 점심을 끝냈다. (완료)'},{en:'Tom <b>has gone</b> to Canada.',ko:'톰은 캐나다로 가 버렸다. (결과 — 지금 없음)'}]},
  {h:'주의!', body:'현재완료는 명백한 과거 표현(yesterday, last ~, ago, when 의문문)과 함께 쓸 수 없다. have been to(가 본 적 있다) vs have gone to(가 버리고 없다) 구별.'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I ___ this movie three times.',c:['see','saw','have seen','am seeing'],a:2,exp:'「세 번 본 적 있다」 경험 → 현재완료.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['She has studied Chinese for two years.','We have met him yesterday.','Have you ever eaten Thai food?','He has already done his homework.'],a:1,exp:'yesterday(명백한 과거)와 현재완료는 함께 쓸 수 없다 → met.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  They have known each other ___ they were kids.',c:['for','since','during','ago'],a:1,exp:'시점(어렸을 때부터) → since.'},
  {t:'mc',q:'의미가 알맞은 것은?  Jane has gone to London.',c:['제인은 런던에 가 본 적이 있다.','제인은 런던에 가고 지금 여기 없다.','제인은 런던에 가는 중이다.','제인은 런던에 갈 것이다.'],a:1,exp:'have gone to = 가 버려서 지금 없다 (결과).'},
  {t:'order',ko:'너는 김치를 먹어 본 적이 있니?',words:['Have','you','ever','eaten','kimchi'],a:'Have you ever eaten kimchi?'},
  {t:'write',ko:'나는 5년 동안 부산에 살아 왔다.',hint:'(I, live in Busan, for five years) ※ 현재완료',a:['I have lived in Busan for five years.']}
 ],cards:[
  {f:'현재완료 형태',b:'have/has + 과거분사(p.p.)'},{f:'현재완료 4가지 용법',b:'경험, 계속, 완료, 결과'},{f:'for vs since',b:'for + 기간 / since + 시점'},{f:'have been to vs have gone to',b:'가 본 적 있다 / 가 버리고 없다'},{f:'현재완료와 못 쓰는 표현',b:'yesterday, last ~, ago, when'}
 ]}
]},
{id:3, title:'조동사', units:[
 {id:'b3-1', title:'can, may, will', concept:[
  {h:'can / could', body:'능력(= be able to)·허가·요청. Could you ~?는 더 공손한 요청.',
   ex:[{en:'<b>Could</b> you pass me the salt?',ko:'소금 좀 건네주시겠어요?'},{en:'She <b>will be able to</b> speak French soon. (조동사 두 개 연속 불가 → will can ✗)',ko:'그녀는 곧 프랑스어를 말할 수 있을 것이다.'}]},
  {h:'may / might', body:'허가(~해도 된다), 약한 추측(~일지도 모른다). might는 더 약한 추측.',
   ex:[{en:'He <b>may[might] be</b> at home now.',ko:'그는 지금 집에 있을지도 모른다.'}]},
  {h:'will / would', body:'미래·의지. Would you ~?는 공손한 요청. would like + 명사 / would like to + 동사원형(~하고 싶다).',
   ex:[{en:'<b>Would</b> you close the door, please?',ko:'문 좀 닫아 주시겠어요?'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He will ___ join us next time.',c:['can','be able to','is able to','could'],a:1,exp:'조동사는 연달아 쓸 수 없다 → will be able to.'},
  {t:'mc',q:'더 공손한 표현으로 바꾼 것은?  Can you help me?',c:['May you help me?','Could you help me?','Must you help me?','Will can you help me?'],a:1,exp:'Could you ~?가 더 공손한 요청.'},
  {t:'mc',q:'밑줄 친 may의 의미가 「추측」인 것은?',c:['You <u>may</u> use my computer.','<u>May</u> I come in?','It <u>may</u> be true.','You <u>may</u> go now.'],a:2,exp:'「사실일지도 모른다」 → 추측.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['She might know the answer.','I will can swim next year.','Could I borrow your pen?','He may not come today.'],a:1,exp:'will can 불가 → will be able to.'},
  {t:'order',ko:'제가 당신의 전화를 써도 될까요?',words:['May','I','use','your phone'],a:'May I use your phone?'},
  {t:'write',ko:'그녀는 내일 바쁠지도 모른다.',hint:'(she, may, busy, tomorrow)',a:['She may be busy tomorrow.']}
 ],cards:[
  {f:'조동사 두 개 연속?',b:'불가 → will be able to'},{f:'공손한 요청 2가지',b:'Could you ~? / Would you ~?'},{f:'may vs might',b:'might가 더 약한 추측'},{f:'would like to + ?',b:'동사원형 (~하고 싶다)'},{f:'can의 능력 = ?',b:'be able to'}
 ]},
 {id:'b3-2', title:'must, should', concept:[
  {h:'must', body:'의무(~해야 한다, = have to) / 강한 추측(~임에 틀림없다). 부정: must not(금지) vs don\'t have to(불필요). 강한 부정 추측은 cannot(~일 리가 없다).',
   ex:[{en:'She didn\'t sleep at all. She <b>must be</b> tired.',ko:'그녀는 한숨도 못 잤다. 피곤한 게 틀림없다.'},{en:'That <b>can\'t be</b> true!',ko:'그게 사실일 리 없어!'}]},
  {h:'should / ought to', body:'~하는 것이 좋다, ~해야 한다(도덕적 의무·충고). 부정: should not[shouldn\'t].',
   ex:[{en:'You <b>should apologize</b> to her.',ko:'너는 그녀에게 사과하는 게 좋겠다.'},{en:'We <b>shouldn\'t waste</b> food.',ko:'음식을 낭비해서는 안 된다.'}]},
  {h:'had to', body:'must(의무)의 과거는 had to로 나타낸다.',
   ex:[{en:'I <b>had to stay</b> home yesterday.',ko:'나는 어제 집에 있어야 했다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The light is on. Someone ___ be in the room.',c:['can\'t','must','should','has to not'],a:1,exp:'강한 추측 「있는 게 틀림없다」 → must.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He\'s only ten. He ___ be a college student.',c:['must','should','can\'t','doesn\'t have'],a:2,exp:'「~일 리가 없다」 강한 부정 추측 → can\'t.'},
  {t:'mc',q:'의미가 <u>다른</u> 하나는?',c:['You must follow the rules.','You have to follow the rules.','You should have followed.','You must be a fan of BTS.'],a:3,exp:'④는 강한 추측, 나머지 계열은 의무. (③은 형태만 다른 예)'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Yesterday I ___ finish the project, so I stayed up late.',c:['must','have to','had to','should'],a:2,exp:'must의 과거 의무 → had to.'},
  {t:'order',ko:'너는 도서관에서 조용히 해야 한다.',words:['You','should','be quiet','in the library'],a:'You should be quiet in the library.'},
  {t:'write',ko:'그는 천재임에 틀림없다.',hint:'(he, must, a genius)',a:['He must be a genius.']}
 ],cards:[
  {f:'must의 강한 추측',b:'~임에 틀림없다'},{f:'「~일 리가 없다」',b:'cannot[can\'t] + 동사원형'},{f:'must(의무)의 과거',b:'had to'},{f:'should의 의미',b:'~하는 것이 좋다 (충고)'},{f:'must not vs don\'t have to',b:'금지 / 불필요'}
 ]},
 {id:'b3-3', title:'would like to, had better, used to', concept:[
  {h:'would like to', body:'「~하고 싶다」(want to의 공손한 표현). Would you like to ~?(~하시겠어요?)',
   ex:[{en:'I<b>\'d like to order</b> a pizza.',ko:'피자를 주문하고 싶어요.'}]},
  {h:'had better', body:'「~하는 게 좋을 것이다」(강한 충고·경고). 부정: had better <b>not</b> + 동사원형.',
   ex:[{en:'You<b>\'d better take</b> an umbrella.',ko:'우산을 가져가는 게 좋을 거야.'},{en:'You\'d better <b>not be</b> late.',ko:'늦지 않는 게 좋을 거야.'}]},
  {h:'used to', body:'「(과거에) ~하곤 했다 / ~이었다」(지금은 아님). would도 과거의 반복된 행동을 나타내지만, 과거의 <b>상태</b>는 used to만 가능.',
   ex:[{en:'I <b>used to play</b> here when I was young.',ko:'어릴 때 여기서 놀곤 했다.'},{en:'There <b>used to be</b> a big tree here.',ko:'여기에 큰 나무가 있었다. (상태 → would ✗)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  You look sick. You ___ see a doctor.',c:['had better','would like','used to','had better not'],a:0,exp:'강한 충고 → had better.'},
  {t:'mc',q:'had better의 부정형은?',c:['had not better','don\'t had better','had better not','hadn\'t better to'],a:2,exp:'had better not + 동사원형.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  There ___ be a bakery on this corner, but it closed.',c:['would','used to','had better','would like to'],a:1,exp:'과거의 상태(있었다)는 used to만 가능.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I\'d like to try this on.','She used to have long hair.','Would you like some coffee?','He used to going fishing.'],a:3,exp:'used to + 동사원형 → used to go.'},
  {t:'order',ko:'나는 주스를 마시고 싶어요.',words:['I\'d like','to drink','some juice'],a:'I\'d like to drink some juice.'},
  {t:'write',ko:'그녀는 안경을 쓰곤 했다. (지금은 아님)',hint:'(she, used to, wear glasses)',a:['She used to wear glasses.']}
 ],cards:[
  {f:'would like to의 의미',b:'~하고 싶다 (공손)'},{f:'had better의 의미',b:'~하는 게 좋을 것이다 (강한 충고)'},{f:'had better의 부정',b:'had better not + 동사원형'},{f:'used to의 의미',b:'(과거에) ~하곤 했다 / ~이었다'},{f:'과거의 상태에 쓸 수 있는 것',b:'used to (would ✗)'}
 ]}
]},
{id:4, title:'to부정사', units:[
 {id:'b4-1', title:'명사적 용법의 to부정사', concept:[
  {h:'주어·목적어·보어', body:'「~하는 것」. 주어로 쓰일 때는 보통 가주어 It으로 바꾼다. 의문사 + to부정사는 명사구가 된다.',
   table:{head:['표현','의미'],rows:[['what to do','무엇을 할지'],['how to swim','수영하는 방법'],['when to start','언제 시작할지'],['where to go','어디로 갈지']]},
   ex:[{en:'<b>It</b> is important <b>to keep</b> your word.',ko:'약속을 지키는 것은 중요하다.'},{en:'I don\'t know <b>what to say</b>.',ko:'무슨 말을 해야 할지 모르겠다.'},{en:'Can you tell me <b>how to get</b> to the station?',ko:'역에 어떻게 가는지 알려 줄래요?'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ is exciting to watch e-sports games.',c:['This','That','It','There'],a:2,exp:'가주어 It.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He learned ___ to drive last year.',c:['what','how','why','who'],a:1,exp:'「운전하는 방법」 → how to drive.'},
  {t:'mc',q:'우리말과 일치하는 것은? 「나는 어디에 앉아야 할지 몰랐다.」',c:['I didn\'t know where to sit.','I didn\'t know where sitting.','I didn\'t know to where sit.','I didn\'t know sit where to.'],a:0,exp:'의문사 + to부정사: where to sit.'},
  {t:'mc',q:'밑줄 친 부분의 역할이 「보어」인 것은?',c:['<u>To read</u> novels is fun.','I hope <u>to see</u> you again.','Her plan is <u>to open</u> a cafe.','It is easy <u>to make</u> ramen.'],a:2,exp:'주어(Her plan)를 설명하는 보어.'},
  {t:'order',ko:'나는 언제 떠나야 할지 결정하지 못했다.',words:['I','couldn\'t decide','when','to leave'],a:'I couldn\'t decide when to leave.'},
  {t:'write',ko:'영어를 배우는 것은 재미있다. (가주어 It)',hint:'(it, fun, learn English)',a:['It is fun to learn English.']}
 ],cards:[
  {f:'명사적 용법의 해석',b:'~하는 것, ~하기'},{f:'가주어 구문',b:'It ~ to부정사'},{f:'how to + 동사원형',b:'~하는 방법'},{f:'what to do',b:'무엇을 할지'},{f:'where to go',b:'어디로 갈지'}
 ]},
 {id:'b4-2', title:'형용사적 용법의 to부정사', concept:[
  {h:'명사 뒤에서 수식', body:'「~할, ~하는」. 수식받는 명사가 전치사의 목적어면 전치사를 빠뜨리지 않는다.',
   ex:[{en:'I have many things <b>to do</b> today.',ko:'오늘 할 일이 많다.'},{en:'He needs a pen <b>to write with</b>.',ko:'그는 쓸 펜이 필요하다. (write with a pen)'},{en:'She wants a house <b>to live in</b>.',ko:'그녀는 살 집을 원한다. (live in a house)'},{en:'There is a chair <b>to sit on</b>.',ko:'앉을 의자가 있다.'}]},
  {h:'-thing/-one/-body + 형용사 + to부정사', body:'수식어 순서: something <b>cold to drink</b>(차가운 마실 것).'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Busan has many places ___ .',c:['visit','to visit','visiting','visited'],a:1,exp:'명사 수식 형용사적 용법.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I need a piece of paper to write ___ .',c:['×(없음)','on','at','of'],a:1,exp:'write on paper → 전치사 on 필요.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['He has no friends to play with.','I want something to eat.','She needs a house to live.','It\'s time to say goodbye.'],a:2,exp:'live in a house → a house to live in.'},
  {t:'mc',q:'어순이 알맞은 것은? 「뜨거운 마실 것」',c:['hot something to drink','something to drink hot','something hot to drink','to drink something hot'],a:2,exp:'-thing + 형용사 + to부정사.'},
  {t:'order',ko:'나는 너에게 말할 것이 있다.',words:['I','have','something','to tell you'],a:'I have something to tell you.'},
  {t:'write',ko:'그는 앉을 의자가 필요하다.',hint:'(he, need, a chair, sit on)',a:['He needs a chair to sit on.']}
 ],cards:[
  {f:'형용사적 용법의 위치',b:'명사·대명사 뒤'},{f:'a pen to write ___',b:'with (도구)'},{f:'a house to live ___',b:'in'},{f:'a chair to sit ___',b:'on'},{f:'-thing 수식 순서',b:'-thing + 형용사 + to부정사'}
 ]},
 {id:'b4-3', title:'부사적 용법의 to부정사', concept:[
  {h:'다섯 가지 의미', body:'① 목적(~하기 위해 = in order to) ② 감정의 원인(~해서) ③ 판단의 근거(~하다니) ④ 결과(…해서 결국 ~하다) ⑤ 형용사 수식(~하기에).',
   ex:[{en:'She studies hard <b>to pass</b> the exam. (= in order to pass)',ko:'시험에 합격하기 위해 열심히 공부한다. (목적)'},{en:'I\'m sorry <b>to hear</b> that.',ko:'그 말을 들으니 유감이다. (감정의 원인)'},{en:'He must be smart <b>to solve</b> the problem.',ko:'그 문제를 풀다니 그는 똑똑함에 틀림없다. (판단의 근거)'},{en:'This book is difficult <b>to understand</b>.',ko:'이 책은 이해하기에 어렵다. (형용사 수식)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He saved money ___ a new bike.',c:['buy','to buy','buying','bought'],a:1,exp:'「사기 위해」 목적의 부사적 용법.'},
  {t:'mc',q:'밑줄 친 부분의 의미가 「감정의 원인」인 것은?',c:['I got up early <u>to catch</u> the train.','She was surprised <u>to see</u> the result.','English is easy <u>to learn</u>.','He grew up <u>to be</u> a pilot.'],a:1,exp:'감정 형용사(surprised) + to부정사 → ~해서.'},
  {t:'mc',q:'같은 의미가 되도록 빈칸에 알맞은 것은?  I turned on the radio to listen to music. = I turned on the radio ___ to listen to music.',c:['in order','so that','because','for'],a:0,exp:'목적 = in order to.'},
  {t:'mc',q:'밑줄 친 부분의 용법이 나머지와 <u>다른</u> 것은?',c:['He came <u>to say</u> sorry.','I went out <u>to walk</u> my dog.','She called me <u>to ask</u> a favor.','I\'m happy <u>to be</u> here.'],a:3,exp:'④는 감정의 원인, 나머지는 목적.'},
  {t:'order',ko:'그녀는 그 소식을 듣고 기뻤다.',words:['She','was glad','to hear','the news'],a:'She was glad to hear the news.'},
  {t:'write',ko:'나는 책을 반납하기 위해 도서관에 갔다.',hint:'(I, go to the library, return the books)',a:['I went to the library to return the books.']}
 ],cards:[
  {f:'목적의 to부정사 = ?',b:'in order to + 동사원형'},{f:'감정 형용사 + to부정사',b:'감정의 원인 (~해서)'},{f:'판단의 근거',b:'~하다니 (must be ~ to ...)'},{f:'형용사 수식',b:'~하기에 (difficult to understand)'},{f:'부사적 용법 5가지',b:'목적, 감정의 원인, 판단의 근거, 결과, 형용사 수식'}
 ]},
 {id:'b4-4', title:'to부정사의 의미상 주어 / too ~ to, enough to', concept:[
  {h:'의미상의 주어', body:'to부정사의 행위 주체를 밝힐 때 <b>for + 목적격</b>. 단, 사람의 성격을 나타내는 형용사(kind, nice, foolish, polite) 뒤에는 <b>of + 목적격</b>.',
   ex:[{en:'It is hard <b>for me to get up</b> early.',ko:'내가 일찍 일어나는 것은 어렵다.'},{en:'It was kind <b>of you to help</b> me.',ko:'저를 도와주시다니 친절하시군요.'}]},
  {h:'too ~ to / enough to', body:'too + 형용사/부사 + to부정사: 너무 ~해서 …할 수 없다 (= so ~ that + 주어 + can\'t). 형용사/부사 + enough + to부정사: …할 만큼 충분히 ~하다 (= so ~ that + 주어 + can).',
   ex:[{en:'He is <b>too young to drive</b>. = He is <b>so</b> young <b>that</b> he <b>can\'t</b> drive.',ko:'그는 너무 어려서 운전할 수 없다.'},{en:'She is <b>strong enough to lift</b> the box. = She is <b>so</b> strong <b>that</b> she <b>can</b> lift the box.',ko:'그녀는 그 상자를 들 만큼 충분히 힘이 세다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  It is difficult ___ him to say no.',c:['of','for','to','with'],a:1,exp:'일반 형용사 → for + 목적격.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  It was nice ___ her to invite us.',c:['for','of','to','about'],a:1,exp:'성격 형용사(nice) → of + 목적격.'},
  {t:'mc',q:'같은 의미의 문장은?  The soup is too hot to eat.',c:['The soup is so hot that I can eat it.','The soup is hot enough to eat.','The soup is so hot that I can\'t eat it.','The soup is not hot to eat.'],a:2,exp:'too ~ to = so ~ that ... can\'t.'},
  {t:'mc',q:'어순이 알맞은 것은? 「그 문제를 풀 만큼 충분히 똑똑한」',c:['enough smart to solve','smart enough to solve','smart to solve enough','too smart to solve'],a:1,exp:'형용사 + enough + to부정사.'},
  {t:'order',ko:'그는 너무 피곤해서 걸을 수 없었다.',words:['He','was','too tired','to walk'],a:'He was too tired to walk.'},
  {t:'write',ko:'네가 진실을 말하는 것은 중요하다.',hint:'(it, important, for you, tell the truth)',a:['It is important for you to tell the truth.']}
 ],cards:[
  {f:'의미상의 주어 (일반)',b:'for + 목적격'},{f:'의미상의 주어 (성격 형용사)',b:'of + 목적격 (kind, nice, foolish)'},{f:'too ~ to의 의미',b:'너무 ~해서 …할 수 없다'},{f:'~ enough to의 의미',b:'…할 만큼 충분히 ~하다'},{f:'too ~ to = ?',b:'so ~ that + 주어 + can\'t'}
 ]}
]},
{id:5, title:'동명사', units:[
 {id:'b5-1', title:'동명사의 쓰임', concept:[
  {h:'주어·보어·목적어·전치사의 목적어', body:'동사원형 + -ing이 명사처럼 쓰인다. 동명사 주어는 <b>단수 취급</b>.',
   ex:[{en:'<b>Getting</b> up early <b>is</b> not easy.',ko:'일찍 일어나는 것은 쉽지 않다. (단수 취급)'},{en:'My hobby is <b>collecting</b> old coins.',ko:'내 취미는 옛날 동전을 모으는 것이다.'},{en:'He is interested in <b>learning</b> Japanese.',ko:'그는 일본어를 배우는 데 관심이 있다.'}]},
  {h:'동명사 관용 표현', body:'go -ing(~하러 가다), be busy -ing(~하느라 바쁘다), spend + 시간/돈 + -ing(~하는 데 쓰다), look forward to -ing(~을 기대하다), be worth -ing(~할 가치가 있다), feel like -ing(~하고 싶다), cannot help -ing(~하지 않을 수 없다), How[What] about -ing?(~하는 게 어때?)',
   ex:[{en:'I <b>feel like eating</b> tteokbokki.',ko:'떡볶이가 먹고 싶다.'},{en:'She <b>is busy preparing</b> for the test.',ko:'그녀는 시험 준비로 바쁘다.'},{en:'I\'m <b>looking forward to seeing</b> you.',ko:'너를 만나기를 기대하고 있어.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ pictures is her job.',c:['Take','Takes','Taking','Taken'],a:2,exp:'주어 자리의 동명사.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Thank you for ___ me the way.',c:['show','to show','showing','showed'],a:2,exp:'전치사 for의 목적어 → 동명사.'},
  {t:'mc',q:'어법상 알맞은 문장은?',c:['I\'m looking forward to see you.','He is busy to do his homework.','How about going to the beach?','Swimming in the sea are fun.'],a:2,exp:'How about -ing?. ①은 to seeing, ②는 busy doing, ④는 단수 is.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This museum is worth ___ .',c:['visit','to visit','visiting','visited'],a:2,exp:'be worth -ing: ~할 가치가 있다.'},
  {t:'order',ko:'나는 오늘 밤 외출하고 싶지 않다.',words:['I','don\'t feel like','going out','tonight'],a:'I don\'t feel like going out tonight.'},
  {t:'write',ko:'그는 숙제를 하느라 바쁘다.',hint:'(he, busy, do his homework)',a:['He is busy doing his homework.']}
 ],cards:[
  {f:'동명사 주어의 수 취급',b:'단수'},{f:'feel like -ing',b:'~하고 싶다'},{f:'be busy -ing',b:'~하느라 바쁘다'},{f:'look forward to + ?',b:'-ing (동명사!)'},{f:'be worth -ing',b:'~할 가치가 있다'}
 ]},
 {id:'b5-2', title:'동명사와 to부정사', concept:[
  {h:'목적어 형태에 따른 동사 분류', body:'',
   table:{head:['목적어','동사'],rows:[['동명사만','enjoy, finish, mind, keep, give up, avoid, practice'],['to부정사만','want, hope, wish, plan, decide, promise, expect, agree'],['둘 다 (뜻 같음)','like, love, hate, start, begin, continue'],['둘 다 (뜻 다름!)','remember, forget, try']]},
   ex:[]},
  {h:'뜻이 달라지는 동사', body:'remember/forget + <b>-ing</b>: (과거에) ~한 것을 기억하다/잊다. remember/forget + <b>to부정사</b>: (앞으로) ~할 것을 기억하다/잊다. try + -ing: 시험 삼아 해 보다 / try + to부정사: ~하려고 노력하다.',
   ex:[{en:'Remember <b>to lock</b> the door. (앞으로 할 일)',ko:'문 잠그는 것을 기억해라.'},{en:'I remember <b>meeting</b> her before. (과거의 일)',ko:'전에 그녀를 만난 것을 기억한다.'},{en:'He tried <b>to move</b> the rock.',ko:'그는 바위를 옮기려고 애썼다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  She avoided ___ my question.',c:['answer','to answer','answering','answered'],a:2,exp:'avoid는 동명사만 목적어로 쓴다.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Don\'t forget ___ the plants tomorrow.',c:['water','to water','watering','watered'],a:1,exp:'앞으로 할 일을 잊지 마라 → forget + to부정사.'},
  {t:'mc',q:'의미가 알맞은 것은?  I remember visiting the palace last year.',c:['작년에 궁을 방문할 것을 기억한다.','작년에 궁을 방문한 것을 기억한다.','궁을 방문하는 것을 잊었다.','궁을 방문하려고 노력했다.'],a:1,exp:'remember + -ing: 과거에 한 일을 기억.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['He gave up smoking.','They agreed to help us.','She practiced to play the flute.','I decided to study abroad.'],a:2,exp:'practice는 동명사만 → practiced playing.'},
  {t:'order',ko:'그는 시험 삼아 그 버튼을 눌러 보았다.',words:['He','tried','pressing','the button'],a:'He tried pressing the button.'},
  {t:'write',ko:'우표 사는 것을 기억해라. (앞으로 할 일)',hint:'(remember, buy stamps)',a:['Remember to buy stamps.']}
 ],cards:[
  {f:'동명사만 쓰는 동사',b:'enjoy, finish, mind, avoid, give up, practice'},{f:'to부정사만 쓰는 동사',b:'want, hope, plan, decide, promise, agree'},{f:'remember + -ing',b:'(과거에) ~한 것을 기억하다'},{f:'remember + to부정사',b:'(앞으로) ~할 것을 기억하다'},{f:'try -ing vs try to',b:'시험 삼아 해 보다 / ~하려고 노력하다'}
 ]}
]},
{id:6, title:'분사', units:[
 {id:'b6-1', title:'현재분사와 과거분사', concept:[
  {h:'분사의 두 종류', body:'현재분사(-ing): 능동·진행 「~하는, ~하고 있는」. 과거분사(p.p.): 수동·완료 「~된, ~해진」. 명사를 꾸미며, 분사가 다른 말과 함께 길어지면 명사 <b>뒤</b>에서 꾸민다.',
   ex:[{en:'Look at the <b>sleeping</b> baby.',ko:'자고 있는 아기를 봐. (능동)'},{en:'He fixed the <b>broken</b> window.',ko:'그는 깨진 창문을 고쳤다. (수동)'},{en:'The girl <b>wearing a red cap</b> is my sister.',ko:'빨간 모자를 쓴 소녀가 내 여동생이다. (뒤에서 수식)'}]},
  {h:'감정을 나타내는 분사', body:'감정을 <b>일으키면</b> 현재분사(-ing), 감정을 <b>느끼면</b> 과거분사(-ed). boring/bored, exciting/excited, interesting/interested, surprising/surprised, tiring/tired.',
   ex:[{en:'The movie was <b>boring</b>, so I was <b>bored</b>.',ko:'영화가 지루해서 나는 지루함을 느꼈다.'},{en:'The news was <b>surprising</b>. We were <b>surprised</b>.',ko:'그 소식은 놀라웠다. 우리는 놀랐다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Do you know the boy ___ over there?',c:['run','ran','running','to running'],a:2,exp:'「달리고 있는」 능동 → 현재분사, 구가 길어 명사 뒤 수식.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is a picture ___ by my grandfather.',c:['painting','painted','paints','to paint'],a:1,exp:'「그려진」 수동 → 과거분사.'},
  {t:'mc',q:'빈칸에 알맞은 짝은?  The game was ___ , and the fans were ___ .',c:['excited – exciting','exciting – excited','excite – excited','exciting – exciting'],a:1,exp:'감정을 일으키는 대상(-ing) / 느끼는 사람(-ed).'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I was interested in the story.','The barking dog is ours.','She was surprising at the news.','He bought a used car.'],a:2,exp:'놀란 감정을 느낀 것 → was surprised.'},
  {t:'order',ko:'나는 삶은 달걀 두 개를 먹었다.',words:['I','ate','two','boiled eggs'],a:'I ate two boiled eggs.'},
  {t:'write',ko:'그 수업은 지루했다.',hint:'(the class, boring)',a:['The class was boring.']}
 ],cards:[
  {f:'현재분사의 의미',b:'능동·진행 (~하는)'},{f:'과거분사의 의미',b:'수동·완료 (~된)'},{f:'감정을 일으키는 대상',b:'-ing (boring, exciting)'},{f:'감정을 느끼는 사람',b:'-ed (bored, excited)'},{f:'분사구가 길 때 위치',b:'명사 뒤에서 수식'}
 ]},
 {id:'b6-2', title:'분사구문', concept:[
  {h:'만드는 법', body:'부사절을 분사가 이끄는 구로 줄인 것. ① 접속사 생략 ② (주절과 같은) 주어 생략 ③ 동사를 <b>-ing</b>로. 부정은 분사 앞에 Not.',
   ex:[{en:'<b>When I saw</b> him, I waved. → <b>Seeing</b> him, I waved.',ko:'그를 봤을 때 나는 손을 흔들었다.'},{en:'<b>Because she was</b> tired, she went to bed. → <b>(Being) tired</b>, she went to bed.',ko:'피곤해서 그녀는 잠자리에 들었다.'},{en:'<b>Not knowing</b> the answer, I kept silent.',ko:'답을 몰라서 나는 조용히 있었다.'}]},
  {h:'해석', body:'시간(~할 때, ~하는 동안), 이유(~해서), 동시동작(~하면서), 조건(~하면) 등 문맥에 맞게 해석한다.',
   ex:[{en:'<b>Listening</b> to music, he did the dishes.',ko:'음악을 들으면서 그는 설거지를 했다. (동시동작)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ breakfast, I brushed my teeth.',c:['Have','Had','Having','To having'],a:2,exp:'After I had breakfast → Having breakfast.'},
  {t:'mc',q:'분사구문으로 바르게 바꾼 것은?  Because he was sick, he stayed home.',c:['Been sick, he stayed home.','Being sick, he stayed home.','Sick being, he stayed home.','To be sick, he stayed home.'],a:1,exp:'접속사·주어 생략, was → Being.'},

   ex:[{en:'The sequel is <b>much better than</b> the original.',ko:'속편이 원작보다 훨씬 낫다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Today is ___ colder than yesterday.',c:['very','much','more','too'],a:1,exp:'비교급 강조는 much (very ✗).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is ___ movie of the year.',c:['better','the best','best than','as good'],a:1,exp:'「올해 최고의」 → the + 최상급.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['She sings as well as a singer.','My room is bigger than his.','He is the tallest in his class.','This problem is more easier than that one.'],a:3,exp:'easy의 비교급은 easier (more 중복 ✗).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Health is ___ important thing of all.',c:['more','most','the most','much'],a:2,exp:'of all과 함께 최상급: the most important.'},
  {t:'order',ko:'이 다리는 저 다리보다 훨씬 더 길다.',words:['This bridge','is','much longer','than','that one'],a:'This bridge is much longer than that one.'},
  {t:'write',ko:'그녀는 나만큼 빨리 달린다.',hint:'(she, run, fast, I) ※ as ~ as',a:['She runs as fast as I.','She runs as fast as me.','She runs as fast as I do.']}
 ],cards:[
  {f:'비교급 강조 부사',b:'much, even, still, far, a lot (very ✗)'},{f:'the 최상급 + in vs of',b:'in + 장소·단체 / of + 복수(셋 이상)'},{f:'little의 비교급·최상급',b:'less – least'},{f:'not as ~ as의 의미',b:'~만큼 …하지 않은'},{f:'good – ? – ?',b:'better – best'}
 ]},
 {id:'b9-2', title:'비교 구문을 이용한 표현', concept:[
  {h:'원급·비교급 표현', body:'as + 원급 + as possible(가능한 한 ~하게 = as ~ as + 주어 + can), 배수사 + as + 원급 + as(…배만큼 ~한), 비교급 + and + 비교급(점점 더 ~한), The + 비교급 ~, the + 비교급 ...(~할수록 더 …하다), Which/Who ~ 비교급, A or B?',
   ex:[{en:'Call me <b>as soon as possible</b>. (= as soon as you can)',ko:'가능한 한 빨리 전화해.'},{en:'This room is <b>twice as large as</b> mine.',ko:'이 방은 내 방의 두 배만큼 크다.'},{en:'It\'s getting <b>warmer and warmer</b>.',ko:'점점 더 따뜻해지고 있다.'},{en:'<b>The more</b> you practice, <b>the better</b> you get.',ko:'연습할수록 더 나아진다.'}]},
  {h:'최상급 표현', body:'one of the + 최상급 + 복수명사(가장 ~한 것들 중 하나). 원급·비교급으로 최상급 뜻 나타내기: No (other) ~ as + 원급 + as A / No (other) ~ 비교급 + than A / A ~ 비교급 + than any other + 단수명사.',
   ex:[{en:'Seoul is <b>one of the busiest cities</b> in Asia.',ko:'서울은 아시아에서 가장 분주한 도시들 중 하나다.'},{en:'Mt. Everest is <b>higher than any other mountain</b> in the world.',ko:'에베레스트는 세계의 다른 어떤 산보다 높다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Please answer ___ soon as possible.',c:['very','as','so','much'],a:1,exp:'as soon as possible.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The days are getting ___ .',c:['long and long','longer and longer','longest and longest','more and long'],a:1,exp:'비교급 + and + 비교급: 점점 더.'},
  {t:'mc',q:'같은 의미의 문장은?  Run as fast as possible.',c:['Run as fast as you can.','Run faster than possible.','Run the fastest possible you.','Run as faster as you can.'],a:0,exp:'as ~ as possible = as ~ as + 주어 + can.'},
  {t:'mc',q:'어법상 <u>틀린</u> 것은?',c:['The higher we climb, the colder it gets.','He is one of the greatest player in history.','This rope is three times as long as that one.','No other subject is as fun as P.E.'],a:1,exp:'one of the + 최상급 + 복수명사 → players.'},
  {t:'order',ko:'네가 많이 읽을수록, 너는 더 많이 배운다.',words:['The more','you read',',','the more','you learn'],a:'The more you read , the more you learn.'},
  {t:'write',ko:'그것은 세계에서 가장 유명한 그림들 중 하나이다.',hint:'(it, one of, famous, paintings, in the world)',a:['It is one of the most famous paintings in the world.']}
 ],cards:[
  {f:'as ~ as possible = ?',b:'as ~ as + 주어 + can'},{f:'점점 더 ~한',b:'비교급 + and + 비교급'},{f:'~할수록 더 …하다',b:'The + 비교급 ~, the + 비교급 ...'},{f:'one of the 최상급 + ?',b:'복수명사'},{f:'…배만큼 ~한',b:'배수사 + as + 원급 + as'}
 ]}
]},
{id:10, title:'접속사', units:[
 {id:'b10-1', title:'시간, 이유, 결과의 접속사', concept:[
  {h:'시간', body:'when(~할 때), while(~하는 동안), as(~하면서·~할 때), since(~한 이래로), as soon as(~하자마자). 시간 부사절에서는 미래 대신 현재시제.',
   ex:[{en:'<b>As soon as</b> he saw me, he ran away.',ko:'그는 나를 보자마자 도망갔다.'}]},
  {h:'이유', body:'because, since, as(~하기 때문에).',
   ex:[{en:'<b>Since</b> it was late, we took a taxi.',ko:'늦었기 때문에 우리는 택시를 탔다.'}]},
  {h:'결과·정도', body:'so + 형용사/부사 + that ...(너무 ~해서 …하다), so that + 주어 + can(~하기 위해서 = 목적).',
   ex:[{en:'I was <b>so</b> sleepy <b>that</b> I couldn\'t focus.',ko:'너무 졸려서 집중할 수 없었다.'},{en:'Speak loudly <b>so that</b> everyone <b>can</b> hear you.',ko:'모두가 들을 수 있도록 크게 말해라. (목적)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ she entered the room, everyone stood up.',c:['As soon as','So that','Even though','Unless'],a:0,exp:'「들어오자마자」 → as soon as.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The box was ___ heavy that I couldn\'t lift it.',c:['very','too','so','such'],a:2,exp:'so ~ that ... can\'t: 너무 ~해서 …할 수 없다.'},
  {t:'mc',q:'밑줄 친 since의 의미가 「이유」인 것은?',c:['I have lived here <u>since</u> 2019.','<u>Since</u> you\'re tired, take a rest.','It has rained <u>since</u> last night.','We\'ve been friends <u>since</u> childhood.'],a:1,exp:'「피곤하니까」 → 이유. 나머지는 「~이래로」.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He saved money ___ he could buy a drone.',c:['so that','because of','so','that so'],a:0,exp:'목적: so that + 주어 + can[could].'},
  {t:'order',ko:'나는 너무 배가 고파서 피자를 두 판 먹었다.',words:['I was','so hungry','that','I ate','two pizzas'],a:'I was so hungry that I ate two pizzas.'},
  {t:'write',ko:'비가 오고 있었기 때문에, 우리는 집에 있었다. (because 사용)',hint:'(because, it, rain / we, stay home) ※ 과거진행',a:['Because it was raining, we stayed home.','We stayed home because it was raining.']}
 ],cards:[
  {f:'as soon as의 뜻',b:'~하자마자'},{f:'since의 두 가지 뜻',b:'~한 이래로(시간), ~하기 때문에(이유)'},{f:'so ~ that ... can\'t',b:'너무 ~해서 …할 수 없다 (= too ~ to)'},{f:'so that + 주어 + can',b:'~하기 위해서 (목적)'},{f:'while의 뜻',b:'~하는 동안'}
 ]},
 {id:'b10-2', title:'조건, 양보의 접속사 / 명령문 + and, or', concept:[
  {h:'조건', body:'if(만약 ~한다면), unless(~하지 않는다면 = if ~ not). 조건 부사절도 미래 대신 현재시제.',
   ex:[{en:'<b>Unless</b> you hurry, you\'ll miss the bus. (= If you don\'t hurry)',ko:'서두르지 않으면 버스를 놓칠 것이다.'}]},
  {h:'양보', body:'though, although, even though(비록 ~일지라도, ~에도 불구하고).',
   ex:[{en:'<b>Although</b> he was tired, he finished the race.',ko:'피곤했지만 그는 경주를 끝냈다.'}]},
  {h:'명령문 + and / or', body:'명령문, and ~: …해라, <b>그러면</b> ~ (= If you ...). 명령문, or ~: …해라, <b>그렇지 않으면</b> ~ (= If you don\'t / Unless you ...).',
   ex:[{en:'Exercise regularly, <b>and</b> you\'ll be healthier. (= If you exercise ~)',ko:'규칙적으로 운동해라, 그러면 더 건강해질 것이다.'},{en:'Get up now, <b>or</b> you\'ll be late. (= Unless you get up now)',ko:'지금 일어나라, 그렇지 않으면 늦을 것이다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ it rains tomorrow, we\'ll go camping.',c:['Unless','Although','So that','Since when'],a:0,exp:'「비가 오지 않는다면」 → Unless.'},
  {t:'mc',q:'같은 의미의 문장은?  Unless you study, you\'ll fail.',c:['If you study, you\'ll fail.','If you don\'t study, you\'ll fail.','Although you study, you\'ll fail.','Because you study, you\'ll fail.'],a:1,exp:'unless = if ~ not.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ she is young, she is very wise.',c:['If','Unless','Although','As soon as'],a:2,exp:'「어리지만」 양보 → Although.'},
  {t:'mc',q:'같은 의미의 문장은?  Hurry up, or you\'ll miss the train.',c:['If you hurry up, you\'ll miss the train.','If you don\'t hurry up, you\'ll miss the train.','Although you hurry up, you\'ll miss the train.','Hurry up, and you\'ll miss the train.'],a:1,exp:'명령문, or ~ = If you don\'t ~.'},
  {t:'order',ko:'열심히 연습해라, 그러면 너는 이길 것이다.',words:['Practice hard',', and','you','will win'],a:'Practice hard , and you will win.'},
  {t:'write',ko:'비록 추웠지만, 우리는 밖에서 놀았다.',hint:'(although, it, cold / we, play outside)',a:['Although it was cold, we played outside.']}
 ],cards:[
  {f:'unless = ?',b:'if ~ not (~하지 않는다면)'},{f:'양보의 접속사 3개',b:'though, although, even though'},{f:'명령문, and ~',b:'…해라, 그러면 ~'},{f:'명령문, or ~',b:'…해라, 그렇지 않으면 ~'},{f:'조건 부사절의 시제',b:'미래 대신 현재'}
 ]}
]},
{id:11, title:'관계사', units:[
 {id:'b11-1', title:'관계대명사', concept:[
  {h:'두 문장을 하나로', body:'관계대명사는 「접속사 + 대명사」 역할을 하며 앞의 명사(선행사)를 꾸미는 절을 이끈다.',
   table:{head:['선행사','주격','소유격','목적격'],rows:[['사람','who','whose','who(m)'],['사물·동물','which','whose / of which','which'],['둘 다','that','–','that']]},
   ex:[{en:'I have a friend <b>who lives</b> in Jeju.',ko:'나는 제주에 사는 친구가 있다. (주격 — 뒤에 동사)'},{en:'This is the book <b>which I bought</b> yesterday.',ko:'이것은 내가 어제 산 책이다. (목적격 — 뒤에 주어+동사)'},{en:'I met a boy <b>whose father</b> is a pilot.',ko:'나는 아버지가 조종사인 소년을 만났다. (소유격)'}]},
  {h:'주격 관계대명사절의 동사', body:'선행사의 인칭·수에 일치시킨다.',
   ex:[{en:'the students <b>who are</b> in the gym',ko:'체육관에 있는 학생들 (복수 선행사 → are)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  She is the singer ___ won the award.',c:['which','who','whose','whom'],a:1,exp:'사람 선행사 + 주격(뒤에 동사) → who.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is the house ___ roof is red.',c:['who','which','whose','that'],a:2,exp:'「그것의 지붕」 소유격 → whose.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The cake ___ she made was delicious.',c:['who','whose','which','what'],a:2,exp:'사물 선행사 + 목적격 → which.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I know a girl who speaks four languages.','He has a dog which run very fast.','The man whom I met was kind.','She lives in a house that has a garden.'],a:1,exp:'주격 관계대명사절의 동사는 선행사(a dog, 단수)에 일치 → runs.'},
  {t:'order',ko:'나는 파리에 사는 삼촌이 있다.',words:['I','have','an uncle','who','lives in Paris'],a:'I have an uncle who lives in Paris.'},
  {t:'write',ko:'이것은 그가 그린 그림이다.',hint:'(this, the picture, which, he, draw) ※ 과거',a:['This is the picture which he drew.']}
 ],cards:[
  {f:'사람 선행사 주격/목적격',b:'who / who(m)'},{f:'사물 선행사 주격/목적격',b:'which / which'},{f:'소유격 관계대명사',b:'whose'},{f:'주격 뒤 vs 목적격 뒤',b:'주격+동사 / 목적격+주어+동사'},{f:'주격 관계사절 동사의 수',b:'선행사에 일치'}
 ]},
 {id:'b11-2', title:'관계대명사 that, what / 관계대명사의 생략', concept:[
  {h:'that을 주로 쓰는 경우', body:'선행사가 「사람 + 동물/사물」, 최상급·서수·the only·all·every 등의 수식을 받을 때.',
   ex:[{en:'He is <b>the only</b> person <b>that</b> understands me.',ko:'그는 나를 이해하는 유일한 사람이다.'}]},
  {h:'관계대명사 what', body:'선행사를 <b>포함</b>: 「~하는 것(= the thing(s) which/that)」. 명사절을 이끌어 주어·목적어·보어가 된다.',
   ex:[{en:'<b>What</b> I need now is a good sleep.',ko:'내가 지금 필요한 것은 숙면이다.'},{en:'Show me <b>what</b> you bought.',ko:'네가 산 것을 보여 줘.'}]},
  {h:'생략', body:'① <b>목적격</b> 관계대명사는 생략 가능. ② 「주격 관계대명사 + be동사」도 함께 생략 가능(뒤에 분사·전치사구).',
   ex:[{en:'The movie <b>(which)</b> we watched was great.',ko:'우리가 본 영화는 훌륭했다.'},{en:'The boy <b>(who is)</b> playing the drums is Minho.',ko:'드럼을 치고 있는 소년은 민호다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ she said made everyone laugh.',c:['That','What','Which','Who'],a:1,exp:'선행사가 없고 「~한 것」 → what.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is the best movie ___ I have ever seen.',c:['what','who','that','whose'],a:2,exp:'최상급 수식 선행사 → that.'},
  {t:'mc',q:'생략할 수 있는 것은?',c:['I like the shirt <u>which</u> you\'re wearing.','She has a cat <u>which</u> has blue eyes.','He is a doctor <u>who</u> helps children.','<u>What</u> matters is your effort.'],a:0,exp:'목적격 관계대명사만 생략 가능. ②③은 주격, ④ what은 생략 불가.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Tell me what you want.','The man and his dog that passed by looked happy.','I believe what he is honest.','All that glitters is not gold.'],a:2,exp:'완전한 절 앞에는 접속사 that → I believe that he is honest.'},
  {t:'order',ko:'네가 말한 것은 사실이 아니다.',words:['What','you said','is','not true'],a:'What you said is not true.'},
  {t:'write',ko:'이것이 내가 원하는 것이다.',hint:'(this, what, I, want)',a:['This is what I want.']}
 ],cards:[
  {f:'that을 주로 쓰는 선행사',b:'최상급, 서수, the only, all, 사람+사물'},{f:'관계대명사 what의 의미',b:'~하는 것 (= the thing which)'},{f:'what과 선행사',b:'선행사를 포함 (선행사 없음)'},{f:'생략 가능한 관계대명사',b:'목적격 (+ 주격+be동사)'},{f:'The boy (___) playing drums',b:'who is (주격+be 생략)'}
 ]},
 {id:'b11-3', title:'관계부사', concept:[
  {h:'관계부사 = 전치사 + 관계대명사', body:'',
   table:{head:['선행사','관계부사','대신하는 것'],rows:[['시간 (the time, the day)','when','at/on/in which'],['장소 (the place, the city)','where','at/in which'],['이유 (the reason)','why','for which'],['방법 (the way)','how','in which — the way와 how는 함께 쓰지 않음!']]},
   ex:[{en:'I remember the day <b>when</b> we first met.',ko:'우리가 처음 만난 날을 기억한다.'},{en:'This is the town <b>where</b> I grew up.',ko:'여기는 내가 자란 마을이다.'},{en:'Tell me the reason <b>why</b> you were late.',ko:'네가 늦은 이유를 말해 줘.'},{en:'This is <b>how</b> he solved it. (= the way he solved it)',ko:'이것이 그가 그것을 푼 방법이다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Busan is the city ___ I was born.',c:['which','when','where','why'],a:2,exp:'장소 선행사 → where.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Do you know the reason ___ she cried?',c:['which','where','how','why'],a:3,exp:'이유 선행사 → why.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Sunday is the day when we rest.','This is the way how I study.','That\'s the hotel where we stayed.','I don\'t know why he left.'],a:1,exp:'the way와 how는 함께 쓸 수 없다. This is how ~ 또는 This is the way ~.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  2002 was the year ___ Korea hosted the World Cup.',c:['where','when','why','which'],a:1,exp:'시간 선행사(the year) → when.'},

{id:12, title:'가정법', units:[

{id:13, title:'일치와 화법', units:[
 {id:'b13-1', title:'시제의 일치', concept:[
  {h:'주절이 과거면 종속절도 과거(완료)', body:'주절 현재 → 종속절 모든 시제 가능. 주절 과거 → 종속절은 과거 또는 과거완료(had p.p.). 조동사도 과거형으로(will→would, can→could).',
   ex:[{en:'I think that he <b>is</b> busy. → I <b>thought</b> that he <b>was</b> busy.',ko:'나는 그가 바쁘다고 생각한다 → 생각했다.'},{en:'She says she <b>will</b> come. → She <b>said</b> she <b>would</b> come.',ko:'그녀는 오겠다고 말한다 → 말했다.'}]},
  {h:'시제 일치의 예외', body:'불변의 진리·과학적 사실·속담은 항상 <b>현재</b>. 역사적 사실은 항상 <b>과거</b>. 현재의 습관은 현재 가능.',

 ],probs:[

  {t:'mc',q:'빈칸에 알맞은 것은?  He said that he ___ me the next day.',c:['will call','calls','would call','can call'],a:2,exp:'주절 과거 → will은 would로.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The teacher said that water ___ at 0℃.',c:['froze','freezes','had frozen','would freeze'],a:1,exp:'과학적 사실은 항상 현재시제.'},

 ],cards:[

 ]},
 {id:'b13-2', title:'화법', concept:[
  {h:'평서문의 간접화법', body:'say → say / say to → tell. ① 인용부호 제거, that 연결 ② 인칭 대명사를 전달자 기준으로 ③ 시제 일치 ④ 부사어 조정(now→then, today→that day, tomorrow→the next day, here→there).',
   ex:[{en:'He said to me, "I <b>am</b> happy <b>now</b>." → He <b>told</b> me (that) he <b>was</b> happy <b>then</b>.',ko:'그는 나에게 지금 행복하다고 말했다.'}]},
  {h:'의문문의 간접화법', body:'의문사 의문문: ask + (목적어) + <b>의문사 + 주어 + 동사</b>(평서문 어순!). Yes/No 의문문: ask + (목적어) + <b>if[whether]</b> + 주어 + 동사.',
   ex:[{en:'She said to me, "Where <b>do you live</b>?" → She asked me <b>where I lived</b>.',ko:'그녀는 내가 어디 사는지 물었다.'},{en:'He said, "<b>Are</b> you hungry?" → He asked <b>if I was</b> hungry.',ko:'그는 내가 배고픈지 물었다.'}]}
 ],probs:[

  {t:'mc',q:'빈칸에 알맞은 것은?  He asked me ___ I could swim.',c:['that','what','if','who'],a:2,exp:'Yes/No 의문문의 간접화법 → if[whether].'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She asked him where ___ .',c:['did he go','he went','does he go','he goes did'],a:1,exp:'간접의문문은 평서문 어순: 의문사 + 주어 + 동사.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['He asked me if I was okay.','She told me that she would leave the next day.','I asked her what time was it.','They told us that they were busy.'],a:2,exp:'평서문 어순 → what time it was.'},
  {t:'order',ko:'그는 나에게 내가 어디 출신인지 물었다.',words:['He','asked me','where','I was from'],a:'He asked me where I was from.'},
  {t:'write',ko:'그녀는 나에게 배가 고픈지 물었다. (if 사용)',hint:'(she, ask me, if, I, hungry) ※ 시제 일치',a:['She asked me if I was hungry.']}
 ],cards:[
  {f:'say to의 간접화법 동사',b:'tell'},{f:'Yes/No 의문문 간접화법 연결어',b:'if 또는 whether'},{f:'간접의문문의 어순',b:'의문사 + 주어 + 동사 (평서문 어순)'},{f:'now / today / tomorrow 전환',b:'then / that day / the next day'},{f:'인칭 대명사 전환 기준',b:'전달자 기준으로 바꿈'}
 ]}
]}

  {h:'미래완료 will have + p.p.', body:'미래의 특정 시점까지 완료·계속될 일. by, by the time, next~와 자주 쓴다.',
   ex:[{en:'By next month, I <b>will have finished</b> this project.',ko:'다음 달이면 이 프로젝트를 끝냈을 것이다.'},{en:'By 2030, she <b>will have worked</b> here for 20 years.',ko:'2030년이면 그녀는 여기서 20년을 일한 것이 된다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The movie ___ when we got to the theater.',c:['already started','has already started','had already started','starts'],a:2,exp:'도착(과거)보다 앞선 일 → 과거완료.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  By the end of this year, he ___ three novels.',c:['wrote','has written','will write','will have written'],a:3,exp:'미래 시점까지의 완료 → 미래완료.'},
  {t:'mc',q:'어법상 알맞은 것은?  I realized that I ___ my wallet at home.',c:['leave','have left','had left','will leave'],a:2,exp:'깨달은 시점(과거)보다 앞선 일 → 과거완료.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She had lived in Seoul for five years before she ___ to Busan.',c:['moves','moved','had moved','has moved'],a:1,exp:'before절은 나중 일 → 단순과거, 주절이 대과거.'},
  {t:'order',ko:'그가 왔을 때 우리는 이미 저녁을 먹은 상태였다.',words:['We','had already eaten','dinner','when he came'],a:'We had already eaten dinner when he came.'},
  {t:'write',ko:'나는 그를 전에 만난 적이 없다는 것을 깨달았다.',hint:'(I, realize / that, I, never meet him before) ※ 과거완료',a:['I realized that I had never met him before.']}
 ],cards:[
  {f:'과거완료 형태와 의미',b:'had + p.p. / 과거보다 더 이전(대과거)'},{f:'미래완료 형태',b:'will have + p.p.'},{f:'미래완료의 단서',b:'by, by the time, next~'},{f:'대과거를 쓰는 이유',b:'두 과거 사건의 순서를 밝히려고'},{f:'과거완료 용법',b:'경험·계속·완료·결과를 과거 기준으로'}
 ]}
]},
{id:2, title:'조동사', units:[
 {id:'c2-1', title:'can, may, must, should', concept:[
  {h:'추측의 조동사 (확신 강도)', body:'must(~임에 틀림없다, 강한 확신) > may/might(~일지도 모른다) > can\'t(~일 리 없다, 강한 부정 확신).',
   ex:[{en:'She <b>must be</b> exhausted after the marathon.',ko:'마라톤 후라 지쳤음에 틀림없다.'},{en:'He <b>can\'t be</b> serious.',ko:'그가 진심일 리 없다.'}]},
  {h:'조동사 + have + p.p. (과거에 대한 추측·후회)', body:'',
   table:{head:['표현','의미'],rows:[['must have p.p.','~했음에 틀림없다 (과거 확신)'],['may/might have p.p.','~했을지도 모른다'],['can\'t have p.p.','~했을 리 없다'],['should have p.p.','~했어야 했는데 (안 한 것에 대한 후회)'],['shouldn\'t have p.p.','~하지 말았어야 했는데']]},
   ex:[{en:'You <b>should have told</b> me earlier.',ko:'나에게 더 일찍 말했어야 했는데. (후회)'},{en:'She <b>must have forgotten</b> the meeting.',ko:'그녀는 회의를 잊었음에 틀림없다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The ground is wet. It ___ last night.',c:['must rain','must have rained','should rain','can\'t have rained'],a:1,exp:'과거에 대한 강한 확신 → must have p.p.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I ___ harder for the test. I failed it.',c:['should study','should have studied','must study','can\'t have studied'],a:1,exp:'하지 못한 일에 대한 후회 → should have p.p.'},
  {t:'mc',q:'의미가 알맞은 것은?  He can\'t have said that.',c:['그가 그렇게 말했음에 틀림없다.','그가 그렇게 말했을 리 없다.','그가 그렇게 말해야 한다.','그가 그렇게 말할 것이다.'],a:1,exp:'can\'t have p.p. = ~했을 리 없다.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  You look pale. You ___ a ghost!',c:['may see','must have seen','should see','can see'],a:1,exp:'창백한 근거로 과거를 확신 → must have seen.'},
  {t:'order',ko:'너는 그렇게 많이 먹지 말았어야 했다.',words:['You','shouldn\'t','have','eaten','so much'],a:'You shouldn\'t have eaten so much.'},
  {t:'write',ko:'그녀는 그 소식을 들었을지도 모른다.',hint:'(she, may, hear the news) ※ 과거 추측',a:['She may have heard the news.','She might have heard the news.']}
 ],cards:[
  {f:'must have p.p.',b:'~했음에 틀림없다 (과거 확신)'},{f:'should have p.p.',b:'~했어야 했는데 (후회)'},{f:'can\'t have p.p.',b:'~했을 리 없다'},{f:'may/might have p.p.',b:'~했을지도 모른다'},{f:'추측 확신 강도 순서',b:'must > may/might > can\'t'}
 ]},
 {id:'c2-2', title:'had better, ought to, used to, would', concept:[
  {h:'had better / ought to', body:'had better + 동사원형: ~하는 게 좋을 것이다(강한 충고, 부정 had better not). ought to + 동사원형: ~해야 한다(= should, 부정 ought not to).',
   ex:[{en:'You <b>had better not</b> skip breakfast.',ko:'아침을 거르지 않는 게 좋을 거야.'},{en:'We <b>ought to</b> respect our elders.',ko:'우리는 어른을 공경해야 한다.'}]},
  {h:'used to / would', body:'used to + 동사원형: 과거의 습관·상태(지금은 아님). would + 동사원형: 과거의 불규칙한 습관(~하곤 했다). 과거의 <b>상태</b>는 used to만 가능.',
   ex:[{en:'There <b>used to be</b> a theater here. (상태 → would 불가)',ko:'여기에 극장이 있었다.'},{en:'We <b>would often play</b> together after school.',ko:'우리는 방과 후에 자주 함께 놀곤 했다.'}]},
  {h:'be used to의 구별', body:'be used to + <b>-ing</b>: ~에 익숙하다. be used to + <b>동사원형</b>: ~하는 데 사용되다(수동).',
   ex:[{en:'I <b>am used to living</b> alone.',ko:'나는 혼자 사는 것에 익숙하다.'},{en:'This tool <b>is used to open</b> cans.',ko:'이 도구는 캔을 여는 데 사용된다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  There ___ a big tree in front of my house.',c:['would be','used to be','is used to','had better be'],a:1,exp:'과거의 상태 → used to (would 불가).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She is used to ___ in public.',c:['speak','speaks','speaking','be spoken'],a:2,exp:'be used to + -ing: ~에 익숙하다.'},
  {t:'mc',q:'의미가 알맞은 것은?  This machine is used to cut paper.',c:['이 기계는 종이를 자르는 데 익숙하다.','이 기계는 종이를 자르는 데 사용된다.','이 기계는 종이를 자르곤 했다.','이 기계는 종이를 잘라야 한다.'],a:1,exp:'be used to + 동사원형 = ~하는 데 사용되다.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['You had better see a doctor.','We ought to help the poor.','I would have a dog when I was young.','He used to smoke, but he quit.'],a:2,exp:'과거의 상태는 used to → I used to have a dog. (would는 반복 행동만)'},
  {t:'order',ko:'너는 그렇게 늦게까지 깨어 있지 않는 게 좋겠다.',words:['You','had better not','stay up','so late'],a:'You had better not stay up so late.'},
  {t:'write',ko:'나는 매운 음식을 먹는 데 익숙하다.',hint:'(I, be used to, eat spicy food)',a:['I am used to eating spicy food.',"I'm used to eating spicy food."]}
 ],cards:[
  {f:'had better not',b:'~하지 않는 게 좋겠다'},{f:'ought to = ?',b:'should (~해야 한다)'},{f:'be used to + -ing',b:'~에 익숙하다'},{f:'be used to + 동사원형',b:'~하는 데 사용되다 (수동)'},{f:'과거의 상태를 나타내는 것',b:'used to (would 불가)'}
 ]}
]},
{id:3, title:'수동태', units:[
 {id:'c3-1', title:'수동태의 의미와 형태', concept:[
  {h:'be + p.p. (+ by 행위자)', body:'시제별: 현재 is/are + p.p. / 과거 was/were + p.p. / 미래 will be + p.p. / 완료 have been + p.p. / 진행 be being + p.p. / 조동사 조동사 + be + p.p.',
   ex:[{en:'The bridge <b>is being built</b> now.',ko:'다리가 지금 건설되고 있다. (진행 수동)'},{en:'The letter <b>has been delivered</b>.',ko:'편지가 배달되었다. (완료 수동)'}]},
  {h:'부정문·의문문', body:'부정: be동사 + not + p.p. 의문문: Be동사 + 주어 + p.p. ~?',
   ex:[{en:'The problem <b>has not been solved</b> yet.',ko:'문제가 아직 해결되지 않았다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The new stadium ___ next year.',c:['will build','will be built','is building','has built'],a:1,exp:'미래 수동태: will be + p.p.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The road ___ at the moment.',c:['is repairing','is being repaired','has repaired','repairs'],a:1,exp:'진행형 수동태: be being + p.p.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This rule ___ by everyone.',c:['must follow','must be followed','must following','must been followed'],a:1,exp:'조동사 수동태: 조동사 + be + p.p.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The song has been sung many times.','The window was broken by the storm.','A new law is being discussed.','The cake was make by my mom.'],a:3,exp:'be + 과거분사 → was made.'},
  {t:'order',ko:'그 결정은 아직 내려지지 않았다.',words:['The decision','has not','been made','yet'],a:'The decision has not been made yet.'},
  {t:'write',ko:'그 다리는 100년 전에 지어졌다.',hint:'(the bridge, build, 100 years ago) ※ 수동태',a:['The bridge was built 100 years ago.']}
 ],cards:[
  {f:'완료 수동태',b:'have/has been + p.p.'},{f:'진행 수동태',b:'be being + p.p.'},{f:'조동사 수동태',b:'조동사 + be + p.p.'},{f:'수동태 부정문',b:'be + not + p.p.'},{f:'미래 수동태',b:'will be + p.p.'}
 ]},
 {id:'c3-2', title:'4형식, 5형식 문장의 수동태', concept:[
  {h:'4형식 수동태', body:'목적어가 두 개이므로 수동태도 두 개 가능. 직접목적어를 주어로 할 때는 간접목적어 앞에 전치사(to/for/of)를 붙인다.',
   ex:[{en:'He gave me a book. → I <b>was given</b> a book. / A book <b>was given to</b> me.',ko:'나는 책을 받았다. / 책이 나에게 주어졌다.'},{en:'buy, make, get 등은 직접목적어만 주어로 가능 (간접목적어 수동태 어색)',ko:'주의'}]},
  {h:'5형식 수동태', body:'목적격 보어는 그대로 둔다. <b>지각·사역동사</b>의 목적격 보어인 동사원형은 수동태에서 <b>to부정사</b>로 바뀐다.',
   ex:[{en:'They made him work. → He <b>was made to work</b>.',ko:'그는 일하도록 강요받았다.'},{en:'I saw her enter. → She <b>was seen to enter</b>.',ko:'그녀가 들어가는 것이 목격되었다.'},{en:'We call him a genius. → He <b>is called</b> a genius.',ko:'그는 천재라고 불린다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The children were made ___ their room.',c:['clean','to clean','cleaning','cleaned'],a:1,exp:'사역동사 수동태 → 동사원형이 to부정사로.'},
  {t:'mc',q:'수동태로 바르게 바꾼 것은?  She told me the secret.',c:['I was told the secret.','The secret was told me.','I told the secret.','The secret told to me.'],a:0,exp:'간접목적어(me)를 주어로: I was told ~.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He was seen ___ the building.',c:['leave','left','to leave','leaving'],a:2,exp:'지각동사 수동태 → to부정사(또는 -ing).'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The baby was named Sora.','He was elected president.','A cake was bought me.','The door was kept open.'],a:2,exp:'buy는 간접목적어 수동태 어색 → A cake was bought for me.'},
  {t:'order',ko:'그는 반장으로 선출되었다.',words:['He','was elected','class president'],a:'He was elected class president.'},
  {t:'write',ko:'나는 그 방을 나가도록 요구받았다.',hint:'(I, ask, leave the room) ※ 수동태, to부정사',a:['I was asked to leave the room.']}
 ],cards:[
  {f:'4형식 수동태 개수',b:'최대 2개 (간접·직접목적어 각각)'},{f:'직접목적어 주어일 때',b:'간접목적어 앞 전치사 (to/for/of)'},{f:'5형식 수동태의 보어',b:'그대로 둠'},{f:'사역·지각동사 수동태의 보어',b:'동사원형 → to부정사'},{f:'He was made ___ work',b:'to (to work)'}
 ]},
 {id:'c3-3', title:'주의해야 할 수동태', concept:[
  {h:'동사구 수동태', body:'동사구는 한 덩어리로. look after(돌보다), laugh at(비웃다), take care of, put off(미루다), bring up(기르다), turn on/off.',
   ex:[{en:'The meeting <b>was put off</b> until Friday.',ko:'회의가 금요일로 미뤄졌다.'},{en:'He <b>was brought up by</b> his grandmother.',ko:'그는 할머니 손에 자랐다.'}]},
  {h:'by 이외의 전치사', body:'be interested in, be filled with, be covered with, be satisfied with, be surprised at, be known to/for/as, be pleased with, be worried about, be made of/from.',
   ex:[{en:'The mountain <b>is covered with</b> snow.',ko:'산이 눈으로 덮여 있다.'},{en:'He <b>is known for</b> his kindness.',ko:'그는 친절함으로 유명하다.'}]},
  {h:'that절을 목적어로 하는 수동태', body:'say, think, believe, know + that절 → It is said that ~ / 주어 + be said + to부정사.',
   ex:[{en:'People say that he is rich. → It <b>is said that</b> he is rich. = He <b>is said to be</b> rich.',ko:'그가 부자라고들 한다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The baby is well taken ___ by the nanny.',c:['care','care of','of care','after'],a:1,exp:'take care of는 통째로 → taken care of by.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She is known ___ her beautiful voice.',c:['to','for','of','with'],a:1,exp:'be known for: ~로 유명하다.'},
  {t:'mc',q:'같은 의미의 문장은?  It is believed that he is a genius.',c:['He believes to be a genius.','He is believed to be a genius.','He is believing a genius.','That he is a genius believes.'],a:1,exp:'It is believed that ~ = 주어 + be believed + to부정사.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The plan was put off.','I was satisfied with the result.','The bottle is filled by water.','He was laughed at by everyone.'],a:2,exp:'be filled with → is filled with water.'},
  {t:'order',ko:'그 경기는 비 때문에 연기되었다.',words:['The game','was put off','because of','the rain'],a:'The game was put off because of the rain.'},
  {t:'write',ko:'그녀는 모두에게 알려져 있다.',hint:'(she, know, everyone) ※ be known to',a:['She is known to everyone.']}
 ],cards:[
  {f:'take care of 수동태',b:'be taken care of by'},{f:'be known to / for / as',b:'~에게 알려진 / ~로 유명한 / ~로서 알려진'},{f:'It is said that ~ = ?',b:'주어 + be said + to부정사'},{f:'be filled ___ / be covered ___',b:'with / with'},{f:'동사구 수동태 원칙',b:'동사구를 한 덩어리로 취급'}
 ]}
]},
{id:4, title:'부정사', units:[
 {id:'c4-1', title:'명사적 용법의 to부정사', concept:[
  {h:'주어·목적어·보어', body:'「~하는 것」. 가주어 It / 가목적어 it 구문에 주목. 의문사 + to부정사.',
   ex:[{en:'I found <b>it</b> hard <b>to</b> concentrate. (가목적어 it)',ko:'나는 집중하기가 어렵다는 것을 알았다.'},{en:'The problem is <b>how to solve</b> it.',ko:'문제는 그것을 어떻게 푸느냐이다.'}]},
  {h:'가목적어 구문', body:'think/find/make/believe + <b>it</b> + 형용사 + <b>to부정사</b>: it이 가목적어, to부정사가 진목적어.',
   ex:[{en:'She <b>made it clear to</b> refuse the offer.',ko:'그녀는 제안을 거절하겠다는 것을 분명히 했다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I think ___ important to keep promises.',c:['this','that','it','which'],a:2,exp:'가목적어 it (진목적어는 to keep).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She hasn\'t decided ___ to invite.',c:['what','who','how','when'],a:1,exp:'「누구를」 초대할지 → who(m) to invite.'},
  {t:'mc',q:'밑줄 친 부분의 역할이 「진주어」인 것은?',c:['<u>To err</u> is human.','It is fun <u>to travel</u>.','I want <u>to sleep</u>.','My hope is <u>to win</u>.'],a:1,exp:'It(가주어) ~ to travel(진주어).'},
  {t:'mc',q:'어법상 알맞은 것은?',c:['I found that difficult to believe.','She made it clear to leave.','It is important keeping calm.','He thinks that easy to do.'],a:1,exp:'가목적어 it + to부정사: made it clear to leave.'},
  {t:'order',ko:'나는 그 규칙을 이해하는 것이 불가능하다는 것을 알았다.',words:['I','found','it','impossible','to understand the rule'],a:'I found it impossible to understand the rule.'},
  {t:'write',ko:'새 언어를 배우는 것은 쉽지 않다. (가주어 It)',hint:'(it, not easy, learn a new language)',a:['It is not easy to learn a new language.',"It isn't easy to learn a new language."]}
 ],cards:[
  {f:'가주어 구문',b:'It ~ to부정사'},{f:'가목적어 구문',b:'동사 + it + 형용사 + to부정사'},{f:'가목적어를 쓰는 동사',b:'think, find, make, believe'},{f:'who to invite',b:'누구를 초대할지'},{f:'명사적 용법 3역할',b:'주어, 목적어, 보어'}
 ]},
 {id:'c4-2', title:'형용사적·부사적 용법의 to부정사', concept:[
  {h:'형용사적 용법', body:'명사 뒤 수식(~할, ~하는). be to 용법: be + to부정사 = 예정(~할 것이다)·의무(~해야 한다)·가능(~할 수 있다)·운명·의도.',
   ex:[{en:'The president <b>is to visit</b> Korea next week.',ko:'대통령이 다음 주 한국을 방문할 예정이다. (예정)'},{en:'You <b>are to finish</b> this by noon.',ko:'너는 정오까지 이것을 끝내야 한다. (의무)'}]},
  {h:'부사적 용법', body:'목적(~하기 위해, = in order to / so as to), 감정의 원인, 판단의 근거, 결과(…해서 결국 ~), 조건(~한다면), 형용사 수식(~하기에).',
   ex:[{en:'He grew up <b>to become</b> a famous scientist. (결과)',ko:'그는 자라서 유명한 과학자가 되었다.'},{en:'She must be foolish <b>to believe</b> such a lie. (판단의 근거)',ko:'그런 거짓말을 믿다니 그녀는 어리석음에 틀림없다.'}]}
 ],probs:[
  {t:'mc',q:'밑줄 친 be to의 의미가 「예정」인 것은?',c:['You <u>are to</u> obey the rules.','We <u>are to</u> meet at 6 tomorrow.','Nothing <u>was to</u> be seen.','If you <u>are to</u> succeed, work hard.'],a:1,exp:'내일 6시에 만날 예정 → 예정.'},
  {t:'mc',q:'같은 의미가 되도록 빈칸에 알맞은 것은?  He studied hard to pass the exam. = He studied hard ___ pass the exam.',c:['in order to','so that','because of','due to'],a:0,exp:'목적 = in order to / so as to.'},
  {t:'mc',q:'밑줄 친 부분의 의미가 「결과」인 것은?',c:['I was glad <u>to see</u> you.','He worked hard <u>to succeed</u>.','She awoke <u>to find</u> herself famous.','This water is safe <u>to drink</u>.'],a:2,exp:'깨어 보니 유명해져 있었다 → 결과.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  You are ___ leave the room immediately. (의무)',c:['to','for','of','about'],a:0,exp:'be to 용법(의무): are to leave.'},
  {t:'order',ko:'그 회의는 다음 달에 열릴 예정이다.',words:['The meeting','is to','be held','next month'],a:'The meeting is to be held next month.'},
  {t:'write',ko:'그는 버스를 잡기 위해 빨리 달렸다. (in order to)',hint:'(he, run fast, in order to, catch the bus)',a:['He ran fast in order to catch the bus.']}
 ],cards:[
  {f:'be to 용법 5가지',b:'예정, 의무, 가능, 운명, 의도'},{f:'목적의 to부정사 = ?',b:'in order to / so as to'},{f:'부사적 용법 6가지',b:'목적, 감정의 원인, 판단의 근거, 결과, 조건, 형용사 수식'},{f:'grew up to become',b:'자라서 ~가 되었다 (결과)'},{f:'~하다니 (판단의 근거)',b:'must be ~ to + 동사원형'}
 ]},
 {id:'c4-3', title:'to부정사의 의미상 주어, 시제, 태', concept:[
  {h:'의미상의 주어', body:'for + 목적격(일반), of + 목적격(성격 형용사: kind, nice, wise, foolish, rude, careless).',
   ex:[{en:'It was careless <b>of you to</b> lose the key.',ko:'열쇠를 잃어버리다니 부주의했다.'}]},
  {h:'to부정사의 시제', body:'단순부정사 to + 동사원형(본동사와 같은 때). 완료부정사 to have + p.p.(본동사보다 <b>이전</b>의 때).',
   ex:[{en:'He seems <b>to be</b> rich. (지금 부자인 듯)',ko:'그는 부유한 것 같다.'},{en:'He seems <b>to have been</b> rich. (전에 부유했던 듯)',ko:'그는 부유했던 것 같다.'}]},
  {h:'to부정사의 태', body:'수동: to be + p.p. / 완료수동: to have been + p.p.',
   ex:[{en:'She wants <b>to be invited</b> to the party.',ko:'그녀는 파티에 초대받고 싶어 한다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  It was kind ___ you to help the old man.',c:['for','of','to','with'],a:1,exp:'성격 형용사(kind) → of + 목적격.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He is said ___ a great scientist in his time.',c:['to be','to have been','being','to been'],a:1,exp:'본동사(is said)보다 이전 → 완료부정사 to have been.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Everyone wants to ___ by others.',c:['love','be loved','have loved','loving'],a:1,exp:'사랑받고 싶다 (수동) → to be loved.'},
  {t:'mc',q:'의미가 알맞은 것은?  She seems to have been sick.',c:['그녀는 지금 아픈 것 같다.','그녀는 전에 아팠던 것 같다.','그녀는 아플 것 같다.','그녀는 아프고 싶어 한다.'],a:1,exp:'완료부정사 = 본동사보다 이전 시제.'},
  {t:'order',ko:'그런 실수를 하다니 그는 어리석었다.',words:['It was','foolish','of him','to make such a mistake'],a:'It was foolish of him to make such a mistake.'},
  {t:'write',ko:'그는 그 상을 받았던 것 같다.',hint:'(he, seem, win the prize) ※ 완료부정사',a:['He seems to have won the prize.']}
 ],cards:[
  {f:'의미상 주어 (일반)',b:'for + 목적격'},{f:'의미상 주어 (성격 형용사)',b:'of + 목적격'},{f:'단순부정사 vs 완료부정사',b:'to+원형(같은 때) / to have p.p.(이전)'},{f:'to부정사 수동태',b:'to be + p.p.'},{f:'seems to have been',b:'~였던 것 같다 (이전 시제)'}
 ]},
 {id:'c4-4', title:'목적격 보어로 쓰이는 부정사', concept:[
  {h:'to부정사를 보어로', body:'want, ask, tell, advise, allow, expect, enable, force, cause + 목적어 + to부정사.',
   ex:[{en:'The rain <b>caused the game to be</b> canceled.',ko:'비 때문에 경기가 취소되었다.'},{en:'The app <b>enables us to learn</b> anywhere.',ko:'그 앱은 우리가 어디서든 배울 수 있게 해 준다.'}]},
  {h:'사역동사 + 동사원형', body:'make, have, let + 목적어 + 동사원형. (help는 to부정사·동사원형 모두 가능) get은 사역의 뜻이지만 to부정사를 쓴다: get + 목적어 + to부정사.',
   ex:[{en:'I <b>got him to fix</b> my bike. (get은 to부정사)',ko:'나는 그에게 자전거를 고치게 했다.'},{en:'She <b>helped me (to) carry</b> the bags.',ko:'그녀는 내가 가방 옮기는 것을 도와주었다.'}]},
  {h:'지각동사 + 동사원형/현재분사', body:'see, hear, watch, feel + 목적어 + 동사원형(완료·전체) / 현재분사(진행 강조).',
   ex:[{en:'I <b>saw him cross</b> the road. (건너는 것을 다 봄)',ko:'그가 길을 건너는 것을 보았다.'},{en:'I <b>saw him crossing</b> the road. (건너는 중을 봄)',ko:'그가 길을 건너고 있는 것을 보았다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  My parents don\'t allow me ___ out late.',c:['stay','to stay','staying','stayed'],a:1,exp:'allow + 목적어 + to부정사.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I finally got my brother ___ me with my homework.',c:['help','to help','helped','helping'],a:1,exp:'get + 목적어 + to부정사.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['She let me use her phone.','He made me to wait.','I heard someone shout.','They helped us move.'],a:1,exp:'사역동사 make + 동사원형 → made me wait.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The medicine enabled her ___ again.',c:['walk','to walk','walking','walked'],a:1,exp:'enable + 목적어 + to부정사.'},
  {t:'order',ko:'그 소음이 나를 잠에서 깨게 했다.',words:['The noise','caused','me','to wake up'],a:'The noise caused me to wake up.'},
  {t:'write',ko:'선생님은 우리에게 조용히 하라고 말씀하셨다.',hint:'(the teacher, tell, us, be quiet)',a:['The teacher told us to be quiet.']}
 ],cards:[
  {f:'to부정사 보어 동사',b:'want, ask, tell, allow, expect, enable, force, cause'},{f:'사역동사 3개 + 보어',b:'make/have/let + 동사원형'},{f:'get + 목적어 + ?',b:'to부정사 (사역 뜻)'},{f:'help + 목적어 + ?',b:'(to) 동사원형 (둘 다 가능)'},{f:'지각동사 보어 (진행 강조)',b:'현재분사(-ing)'}
 ]},
 {id:'c4-5', title:'to부정사 구문, 독립부정사', concept:[
  {h:'too ~ to / enough to', body:'too + 형/부 + to부정사(너무 ~해서 …할 수 없다 = so ~ that ... can\'t). 형/부 + enough + to부정사(…할 만큼 충분히 ~ = so ~ that ... can).',
   ex:[{en:'It\'s <b>too good to be</b> true.',ko:'너무 좋아서 사실일 리 없다.'},{en:'He is <b>old enough to vote</b>.',ko:'그는 투표할 만큼 나이가 들었다.'}]},
  {h:'seem/appear + to부정사', body:'~인 것 같다 (= It seems that + 주어 + 동사).',
   ex:[{en:'They <b>seem to know</b> the answer. = It seems that they know ~.',ko:'그들은 답을 아는 것 같다.'}]},
  {h:'독립부정사 (관용 표현)', body:'to be honest(솔직히 말해서), to tell the truth(사실을 말하면), to begin with(우선), so to speak(말하자면), strange to say(이상한 말이지만), needless to say(말할 필요도 없이), to make matters worse(설상가상으로).',
   ex:[{en:'<b>To be honest</b>, I don\'t like this plan.',ko:'솔직히 말해서, 나는 이 계획이 마음에 안 든다.'}]}
 ],probs:[
  {t:'mc',q:'같은 의미의 문장은?  He is too weak to lift the box.',c:['He is so weak that he can lift the box.','He is so weak that he can\'t lift the box.','He is weak enough to lift the box.','He is not weak to lift the box.'],a:1,exp:'too ~ to = so ~ that ... can\'t.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ honest, I forgot your birthday.',c:['To be','Being','For being','It is'],a:0,exp:'독립부정사 To be honest: 솔직히 말해서.'},
  {t:'mc',q:'같은 의미의 문장은?  It seems that she is tired.',c:['She seems tired to be.','She seems to be tired.','She is seemed tired.','It seems her to be tired.'],a:1,exp:'It seems that S+V = S seems to+동사원형.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ matters worse, it started to rain.',c:['To make','Making','For make','To be'],a:0,exp:'독립부정사 to make matters worse: 설상가상으로.'},
  {t:'order',ko:'그녀는 그 시험을 통과할 만큼 충분히 똑똑하다.',words:['She','is','smart enough','to pass','the exam'],a:'She is smart enough to pass the exam.'},
  {t:'write',ko:'솔직히 말해서, 나는 그를 믿지 않는다.',hint:'(to be honest / I, don\'t trust him)',a:['To be honest, I don\'t trust him.']}
 ],cards:[
  {f:'too ~ to = ?',b:'so ~ that ... can\'t'},{f:'~ enough to = ?',b:'so ~ that ... can'},{f:'It seems that S+V = ?',b:'S + seem(s) + to부정사'},{f:'to be honest',b:'솔직히 말해서'},{f:'to make matters worse',b:'설상가상으로'}
 ]}
]},
{id:5, title:'동명사', units:[
 {id:'c5-1', title:'동명사의 역할', concept:[

   ex:[{en:'<b>His[Him] being late</b> annoyed everyone.',ko:'그가 늦은 것이 모두를 짜증나게 했다.'},{en:'Would you mind <b>my opening</b> the window?',ko:'제가 창문을 열어도 될까요?'}]},
  {h:'동명사의 시제·태', body:'완료동명사 having + p.p.(본동사보다 이전). 수동 being + p.p. / 완료수동 having been + p.p.',
   ex:[{en:'He is proud of <b>having won</b> the prize.',ko:'그는 상을 탄 것을 자랑스러워한다. (이전 일)'},{en:'I don\'t like <b>being interrupted</b>.',ko:'나는 방해받는 것을 좋아하지 않는다. (수동)'}]},
  {h:'동명사 관용 표현', body:'be worth -ing, feel like -ing, cannot help -ing(= cannot but + 동사원형), be busy -ing, have difficulty (in) -ing, spend + 시간/돈 + -ing, on -ing(~하자마자), be used to -ing(~에 익숙하다).',

 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I couldn\'t help ___ at his joke.',c:['laugh','to laugh','laughing','laughed'],a:2,exp:'cannot help + -ing: ~하지 않을 수 없다.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ home, he turned on the TV.',c:['On arriving','To arrive','Arrive','For arriving'],a:0,exp:'on + -ing: ~하자마자.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She is proud of ___ the contest last year.',c:['winning','having won','being won','to win'],a:1,exp:'작년 일(본동사보다 이전) → 완료동명사 having won.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['This book is worth reading.','I spent two hours doing it.','He is busy to prepare dinner.','I feel like taking a walk.'],a:2,exp:'be busy + -ing → busy preparing.'},
  {t:'order',ko:'그는 그 질문에 답하는 데 어려움을 겪었다.',words:['He','had difficulty','answering','the question'],a:'He had difficulty answering the question.'},
  {t:'write',ko:'그녀는 방해받는 것을 싫어한다.',hint:'(she, hate, interrupt) ※ 수동 동명사',a:['She hates being interrupted.']}
 ],cards:[
  {f:'동명사 주어의 수',b:'단수 취급'},{f:'완료동명사',b:'having + p.p. (이전 시제)'},{f:'수동 동명사',b:'being + p.p.'},{f:'cannot help -ing = ?',b:'cannot but + 동사원형'},{f:'on -ing의 의미',b:'~하자마자'}
 ]},
 {id:'c5-2', title:'동명사 vs. to부정사', concept:[
  {h:'목적어 형태로 뜻이 달라지는 동사', body:'',
   table:{head:['동사','+ -ing','+ to부정사'],rows:[['remember/forget','(과거) ~한 것을','(미래) ~할 것을'],['try','시험 삼아 해 보다','~하려고 노력하다'],['stop','~하는 것을 멈추다','~하기 위해 멈추다(부사적)'],['regret','~한 것을 후회하다','~하게 되어 유감이다']]},
   ex:[{en:'He <b>stopped smoking</b>. (담배를 끊었다)',ko:'그는 담배를 끊었다.'},{en:'He <b>stopped to smoke</b>. (담배를 피우려고 멈췄다)',ko:'그는 담배를 피우려고 멈췄다.'},{en:'I <b>regret to tell</b> you the bad news.',ko:'나쁜 소식을 전하게 되어 유감이다.'}]},
  {h:'목적어 형태가 정해진 동사', body:'동명사만: enjoy, finish, mind, avoid, give up, keep, practice, suggest, consider, deny, admit, quit, postpone. to부정사만: want, hope, wish, decide, plan, promise, expect, agree, refuse, offer, manage.',
   ex:[{en:'He <b>suggested going</b> out. / He <b>refused to answer</b>.',ko:'그는 나가자고 제안했다. / 답하기를 거부했다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  On his way home, he stopped ___ some flowers.',c:['buying','to buy','buy','bought'],a:1,exp:'꽃을 사려고 멈췄다 → stop + to부정사(목적).'},
  {t:'mc',q:'의미가 알맞은 것은?  I regret telling him the secret.',c:['그에게 비밀을 말하게 되어 유감이다.','그에게 비밀을 말한 것을 후회한다.','그에게 비밀을 말할 것이다.','그에게 비밀을 말하려고 한다.'],a:1,exp:'regret + -ing: (과거에) ~한 것을 후회하다.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  They decided ___ the trip.',c:['postponing','to postpone','postpone','postponed'],a:1,exp:'decide는 to부정사만.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['He admitted stealing the money.','She managed to finish on time.','I avoided to meet him.','Would you consider joining us?'],a:2,exp:'avoid는 동명사만 → avoided meeting.'},
  {t:'order',ko:'문 잠그는 것을 잊지 마라.',words:['Don\'t forget','to lock','the door'],a:'Don\'t forget to lock the door.'},
