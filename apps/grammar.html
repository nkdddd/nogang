<!DOCTYPE html>
<html lang="ko" data-app="grammar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그래머 인사이드 트레이너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>/* 통합 플래너 안(iframe)에서 열렸는지 표시 */if(window.self!==window.top)document.documentElement.classList.add('in-planner');</script>
<style>
:root{
 --ink:#1C1B24; --ink2:#6D6B7A; --paper:#F3F2F7; --card:#FFFFFF;
 --hl:#FFE34D; --hl-soft:#FFF6C4; --blue:#6A58E6; --blue-soft:#EFECFD;
 --good:#2FA26B; --good-soft:#E4F5EC; --bad:#E4573D; --bad-soft:#FCEAE6;
 --line:#E4E8F2; --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55}
button{font-family:inherit;border:none;cursor:pointer;background:none}
input{font-family:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.eng{font-family:Georgia,'Times New Roman',serif}
mark,.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 2px;font-weight:700;color:var(--ink)}
.top{padding:18px 18px 8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.top .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.wrap{padding:10px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:12px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.btn.yellow{background:var(--hl);color:var(--ink)}
.btn.small{padding:9px 14px;font-size:13px;width:auto;display:inline-block;border-radius:9px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--ink2);font-size:12.5px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;z-index:50}
.nav button{flex:1;padding:9px 0 max(9px,env(safe-area-inset-bottom));font-size:10.5px;color:#8F8D9B;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--ink)}
.nav .ic{font-size:19px;line-height:1}
/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px}
.auth .logo{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.auth .logo .hl{font-weight:900}
.auth p{color:var(--ink2);margin-bottom:26px;font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;background:var(--card)}
.field input:focus{outline:none;border-color:var(--blue)}
.aerr{color:var(--bad);font-size:13px;margin:8px 0;min-height:18px}
.aswitch{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink2)}
.aswitch b{color:var(--blue);cursor:pointer}
/* home */
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,227,77,.16)}
.hero .hi{font-size:17px;font-weight:800}
.hero .stats{display:flex;gap:18px;margin-top:14px}
.hero .st b{font-size:21px;display:block}
.hero .st span{font-size:11px;opacity:.75}
.prog-line{height:8px;background:#E9EDF7;border-radius:5px;overflow:hidden}
.prog-line i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .3s}
.prog-line.yellow i{background:var(--hl)}
.sect{font-size:14px;font-weight:800;margin:18px 2px 8px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:10.5px;color:#B9C1D4}
.badge .bi{font-size:21px;display:block;margin-bottom:3px;filter:grayscale(1);opacity:.4}
.badge.got{color:var(--ink);border-color:var(--hl);background:var(--hl-soft)}
.badge.got .bi{filter:none;opacity:1}
/* level tabs & chapters */
.ltabs{display:flex;gap:8px;margin-bottom:14px}
.ltabs button{flex:1;padding:10px 0;border-radius:11px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13.5px;color:var(--ink2)}
.ltabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ltabs button.lock{opacity:.5}
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.chap-h{display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer}
.chap-no{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--hl);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chap-h .t{font-weight:800;font-size:14.5px}
.chap-h .m{font-size:11.5px;color:var(--ink2)}
.chap-h .arr{margin-left:auto;color:#B9C1D4;transition:transform .2s}
.chap.open .arr{transform:rotate(90deg)}
.units{display:none;border-top:1px solid var(--line)}
.chap.open .units{display:block}
.unit-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.unit-row:last-child{border-bottom:none}
.u-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.u-dot.done{background:var(--good);border-color:var(--good)}
.u-dot.half{border-color:var(--hl);background:var(--hl-soft)}
.unit-row .ut{font-size:13.5px;font-weight:600}
.unit-row .us{font-size:11px;color:var(--ink2)}
/* unit view */
.uhead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.back{font-size:21px;color:var(--ink2);padding:4px 8px 4px 0}
.uhead .t{font-weight:800;font-size:16px}
.uhead .c{font-size:11.5px;color:var(--ink2)}
.steps{display:flex;gap:6px;padding:8px 16px 4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--hl)}
.steps span.done{background:var(--good)}
.con-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.con-sec h3{font-size:14.5px;margin-bottom:8px}
.con-sec h3::before{content:'';display:inline-block;width:8px;height:8px;background:var(--hl);border-radius:2px;margin-right:7px}
.con-sec .body{font-size:14px;color:#2C3A58;margin-bottom:8px}
.gtable{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.gtable th{background:var(--blue-soft);color:var(--ink);padding:7px 8px;border:1px solid var(--line);font-weight:700}
.gtable td{padding:7px 8px;border:1px solid var(--line)}
.ex{border-left:3px solid var(--hl);padding:6px 10px;margin:8px 0;background:#FDFCF5;border-radius:0 8px 8px 0}
.ex .en{font-size:14.5px}
.ex .ko{font-size:12.5px;color:var(--ink2);margin-top:1px}
.ex b{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 1px}
/* quiz */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:12px}
.qno{font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:6px}
.qtext{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5}
.choices button{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:14px;background:var(--card)}
.choices button.sel{border-color:var(--ink);background:var(--blue-soft);font-weight:700}
.choices button.ok{border-color:var(--good);background:var(--good-soft);font-weight:700}
.choices button.no{border-color:var(--bad);background:var(--bad-soft)}
.chips,.built{display:flex;flex-wrap:wrap;gap:8px}
.built{min-height:46px;border:1.5px dashed var(--line);border-radius:11px;padding:8px;margin-bottom:10px;background:#FBFCFE}
.chip{padding:8px 13px;border-radius:9px;background:var(--card);border:1.5px solid var(--ink);font-weight:600;font-size:14px}
.built .chip{background:var(--hl-soft);border-color:var(--hl)}
.chip.used{opacity:.25;pointer-events:none}
.winput{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:10px}
.winput:focus{outline:none;border-color:var(--blue)}
.fb{border-radius:11px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.fb.ok{background:var(--good-soft);color:#19603E}
.fb.no{background:var(--bad-soft);color:#8F3320}
.result-big{text-align:center;padding:26px 0 10px}
.result-big .score{font-size:44px;font-weight:900}
.result-big .msg{color:var(--ink2);margin-top:4px;font-size:14px}
/* memorize */
.deck-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer}
.deck-card .ic{font-size:26px}
.deck-card .t{font-weight:800;font-size:14.5px}
.deck-card .m{font-size:12px;color:var(--ink2)}
.flash{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;margin-bottom:14px;cursor:pointer}
.flash .front{font-size:19px;font-weight:800}
.flash .back{font-size:18px;color:var(--blue);font-weight:800;margin-top:12px}
.flash .desc{font-size:13px;color:var(--ink2);font-weight:500;margin-top:10px;line-height:1.55}
.flash .cex{font-size:13.5px;margin-top:12px;padding:8px 10px;background:#FDFCF5;border-left:3px solid var(--hl);border-radius:0 8px 8px 0;width:100%;box-sizing:border-box}
.flash .cex .en{font-family:Georgia,serif}
.flash .cex .en b{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 1px}
.flash .cex .ko{font-size:11.5px;color:var(--ink2);margin-top:2px}
.flash.open{justify-content:flex-start}
.flash .tap{font-size:11.5px;color:#B9C1D4;margin-top:14px}
.fbtns{display:flex;gap:10px}
.fbtns .btn{flex:1}
.fbtns .know{background:var(--good)}
.fbtns .dont{background:var(--bad)}
/* rank */
.lb-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.lb-row.me{border-color:var(--hl);background:var(--hl-soft)}
.lb-rank{font-weight:900;font-size:16px;width:26px;text-align:center}
.lb-name{font-weight:700;font-size:14px}
.lb-sub{font-size:11.5px;color:var(--ink2)}
.lb-pts{margin-left:auto;font-weight:800;font-size:14px}
.code-box{background:var(--ink);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}
.code-box .code{font-size:26px;font-weight:900;letter-spacing:5px;color:var(--hl);margin:6px 0}
.code-box .m{font-size:12px;opacity:.75}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.lock-note{text-align:center;padding:40px 20px;color:var(--ink2)}
.lock-note .big{font-size:38px;margin-bottom:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/theme.js" defer></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// 필수 암기 (강화판) — 카드 = {f:질문, b:답, desc:설명, ex:{en,ko}}
const SVO_VERBS = {
 title:'문장의 5형식 대표동사',
 groups:[
  {t:'1형식 (S+V)', cards:[
   {f:'1형식 문장이란?',b:'주어 + 동사만으로 완전한 문장',desc:'보어나 목적어 없이 뜻이 완성된다. 뒤의 부사(구)는 수식어일 뿐 문장 형식에 포함되지 않는다.',ex:{en:'The sun <b>rises</b> in the east.',ko:'해는 동쪽에서 뜬다.'}},
   {f:'1형식 대표동사 (이동·존재)',b:'go, come, run, walk, live, arrive',desc:'가다·오다·달리다·살다처럼 목적어 없이 쓰이는 완전자동사. arrive는 arrive at/in처럼 전치사와 함께 쓴다.',ex:{en:'We <b>arrived</b> at the station.',ko:'우리는 역에 도착했다.'}},
   {f:'1형식 대표동사 (발생·출현)',b:'happen, occur, appear, disappear, exist',desc:'일어나다·나타나다·존재하다. 목적어를 취하지 않는다.',ex:{en:'A strange thing <b>happened</b> yesterday.',ko:'어제 이상한 일이 일어났다.'}},
   {f:'"There + be동사" 구문의 형식',b:'1형식 (There is/are + 주어)',desc:'There는 형식상의 주어(유도부사)이고, be동사 뒤의 명사가 진짜 주어다.',ex:{en:'<b>There is</b> a book on the desk.',ko:'책상 위에 책이 한 권 있다.'}}
  ]},
  {t:'2형식 (S+V+C)', cards:[
   {f:'2형식 문장이란?',b:'주어 + 동사 + 주격 보어 (S+V+C)',desc:'동사만으로는 뜻이 불완전해 주어를 설명하는 보어(명사·형용사)가 필요하다. 보어 자리에 부사는 올 수 없다.',ex:{en:'She <b>is</b> a doctor. / He <b>looks</b> happy.',ko:'그녀는 의사다. / 그는 행복해 보인다.'}},
   {f:'2형식 대표동사 (상태·변화)',b:'be, become, get, turn, grow, keep, stay, remain',desc:'~이다(be), ~이 되다·~해지다(become/get/turn/grow), 계속 ~한 상태이다(keep/stay/remain). 뒤에 형용사가 온다.',ex:{en:'The leaves <b>turned</b> red.',ko:'나뭇잎이 빨갛게 변했다.'}},
   {f:'2형식 감각동사',b:'look, sound, smell, taste, feel',desc:'감각동사 뒤에는 형용사가 온다(부사 ✗). 뒤에 명사가 오면 like를 붙인다.',ex:{en:'This soup <b>smells</b> good. / It <b>tastes like</b> honey.',ko:'이 수프는 좋은 냄새가 난다. / 그것은 꿀 같은 맛이 난다.'}},
   {f:'seem / appear의 뜻과 형식',b:'~인 것 같다 (2형식)',desc:'뒤에 형용사나 to부정사가 온다. It seems that ~으로도 쓴다.',ex:{en:'He <b>seems</b> tired today.',ko:'그는 오늘 피곤해 보인다.'}}
  ]},
  {t:'3형식 (S+V+O)', cards:[
   {f:'3형식 문장이란?',b:'주어 + 동사 + 목적어 (S+V+O)',desc:'동사의 대상이 되는 목적어 하나를 취하는 완전타동사 구문. 「~을/를」로 해석된다.',ex:{en:'I <b>like</b> music.',ko:'나는 음악을 좋아한다.'}},
   {f:'3형식 대표동사',b:'like, love, hate, have, make, want, know, enjoy',desc:'목적어 하나를 취한다. enjoy는 목적어로 동명사를 쓴다(enjoy -ing).',ex:{en:'She <b>enjoys</b> reading books.',ko:'그녀는 책 읽는 것을 즐긴다.'}},
   {f:'전치사 없이 목적어를 취하는 타동사',b:'discuss, marry, enter, resemble',desc:'우리말에 「~에 대해/~와/~에」가 있어 전치사를 붙이기 쉽지만, 바로 목적어가 온다. (discuss about ✗)',ex:{en:'We <b>discussed</b> the problem.',ko:'우리는 그 문제에 대해 논의했다.'}},
   {f:'진행형으로 쓰지 않는 3형식 동사',b:'know, like, love, want, have(가지다)',desc:'상태·감정·소유를 나타내는 동사는 진행형으로 쓰지 않는다. have가 「먹다」일 때는 진행형 가능.',ex:{en:'I <b>know</b> the answer. (I am knowing ✗)',ko:'나는 답을 안다.'}}
  ]},
  {t:'4형식 (S+V+IO+DO)', cards:[
   {f:'4형식 문장이란?',b:'주어+동사+간접목적어(~에게)+직접목적어(~을)',desc:'수여동사가 목적어를 두 개 취한다. 「~에게 …을 (해)주다」로 해석. 3형식으로 바꿀 수 있다.',ex:{en:'He <b>gave me a book</b>.',ko:'그는 나에게 책을 주었다.'}},
   {f:'3형식 전환 시 to를 쓰는 수여동사',b:'give, send, show, teach, tell, lend, write',desc:'직접목적어를 앞으로 보낼 때 간접목적어 앞에 전치사 to를 붙인다.',ex:{en:'He gave a book <b>to</b> me.',ko:'그는 나에게 책을 주었다.'}},
   {f:'3형식 전환 시 for를 쓰는 수여동사',b:'buy, make, cook, get, find',desc:'상대를 위해 해 주는 뉘앙스의 동사는 for를 쓴다.',ex:{en:'She made lunch <b>for</b> us.',ko:'그녀는 우리에게 점심을 만들어 주었다.'}},
   {f:'3형식 전환 시 of를 쓰는 수여동사',b:'ask',desc:'ask만 전치사 of를 쓴다.',ex:{en:'He asked a question <b>of</b> me.',ko:'그는 나에게 질문을 했다.'}}
  ]},
  {t:'5형식 (S+V+O+OC)', cards:[
   {f:'5형식 문장이란?',b:'주어+동사+목적어+목적격 보어 (S+V+O+OC)',desc:'목적어를 설명하는 보어(명사·형용사·to부정사·분사·동사원형)가 필요하다. 「O가 OC하다/이다」 관계.',ex:{en:'We <b>call him a hero</b>.',ko:'우리는 그를 영웅이라고 부른다.'}},
   {f:'목적격 보어로 명사·형용사를 쓰는 동사',b:'make, call, name, keep, find, elect',desc:'make O 형용사(~을 …하게 만들다), call/name O 명사(~을 …라고 부르다/이름 짓다).',ex:{en:'The news made me <b>sad</b>.',ko:'그 소식은 나를 슬프게 만들었다.'}},

   table:{head:['시제·주어','의문문','대답'],rows:[['현재 · 일반 주어','Do + 주어 + 동사원형 ~?','Yes, ~ do. / No, ~ don\'t.'],['현재 · 3인칭 단수','Does + 주어 + 동사원형 ~?','Yes, ~ does. / No, ~ doesn\'t.'],['과거','Did + 주어 + 동사원형 ~?','Yes, ~ did. / No, ~ didn\'t.']]},
   ex:[{en:'<b>Do</b> you <b>like</b> baseball? — Yes, I <b>do</b>.',ko:'너 야구 좋아하니? — 응, 좋아해.'},{en:'<b>Does</b> she <b>play</b> the piano? — No, she <b>doesn\'t</b>.',ko:'그녀는 피아노를 치니? — 아니.'},{en:'<b>Did</b> they <b>win</b> the game? — Yes, they <b>did</b>.',ko:'그들이 경기에서 이겼니? — 응.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ your father cook well?',c:['Do','Does','Is','Did he'],a:1,exp:'주어 your father(3인칭 단수)의 현재 의문문 → Does.'},
  {t:'mc',q:'어법상 알맞은 문장은?',c:['Does he likes music?','Did you saw the movie?','Do they live in Seoul?','Does your sister plays tennis?'],a:2,exp:'Do/Does/Did 뒤에는 동사원형. like, see, play가 되어야 한다.'},
  {t:'mc',q:'대답으로 알맞은 것은?  Did Sumin call you last night?',c:['Yes, she does.','No, she didn\'t.','Yes, she is.','No, she doesn\'t.'],a:1,exp:'Did로 물으면 did/didn\'t로 대답한다.'},
  {t:'mc',q:'의문문으로 바르게 바꾼 것은?  He bought a new phone.',c:['Did he bought a new phone?','Did he buy a new phone?','Does he bought a new phone?','Do he buy a new phone?'],a:1,exp:'과거 의문문 Did + 주어 + 동사원형(buy).'},
  {t:'order',ko:'너는 매일 아침을 먹니?',words:['Do','you','eat breakfast','every day'],a:'Do you eat breakfast every day?'},
  {t:'write',ko:'그녀는 어제 학교에 왔니?',hint:'(she, come to school, yesterday)',a:['Did she come to school yesterday?']}
 ],cards:[
  {f:'일반동사 현재 의문문 (3인칭 단수)',b:'Does + 주어 + 동사원형 ~?'},{f:'일반동사 과거 의문문',b:'Did + 주어 + 동사원형 ~?'},{f:'Did you ~?의 긍정 대답',b:'Yes, I did.'},{f:'Does she ~?의 부정 대답',b:'No, she doesn\'t.'},{f:'Do/Does/Did 뒤 동사 형태',b:'항상 동사원형'}
 ]}
]},
{id:3, title:'조동사', units:[
 {id:'3-1', title:'can, may', concept:[
  {h:'조동사의 기본 성질', body:'조동사는 동사 앞에서 의미를 더해 준다. ① 뒤에는 항상 <b>동사원형</b> ② 주어가 3인칭 단수여도 형태가 변하지 않음 ③ 부정문은 조동사 + not, 의문문은 조동사 + 주어 ~?'},
  {h:'can', body:'「~할 수 있다(능력) / ~해도 된다(허가)」. 능력의 can은 be able to로 바꿔 쓸 수 있고, 과거형은 could.',
   ex:[{en:'She <b>can swim</b> very well. (= is able to swim)',ko:'그녀는 수영을 아주 잘할 수 있다.'},{en:'<b>Can</b> I use your pen?',ko:'네 펜 좀 써도 될까? (허가)'},{en:'He <b>can\'t(cannot) ride</b> a bike.',ko:'그는 자전거를 못 탄다.'}]},
  {h:'may', body:'「~해도 된다(허가) / ~일지도 모른다(약한 추측)」.',
   ex:[{en:'<b>May</b> I come in?',ko:'들어가도 될까요? (공손한 허가)'},{en:'It <b>may rain</b> tomorrow.',ko:'내일 비가 올지도 모른다. (추측)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  My little brother can ___ his name in English.',c:['write','writes','writing','wrote'],a:0,exp:'조동사 뒤에는 항상 동사원형.'},
  {t:'mc',q:'밑줄 친 may의 의미가 「추측」인 것은?',c:['<u>May</u> I sit here?','You <u>may</u> go home now.','She <u>may</u> be sick today.','<u>May</u> I ask a question?'],a:2,exp:'「아플지도 모른다」는 약한 추측. 나머지는 허가.'},
  {t:'mc',q:'같은 의미가 되도록 빈칸에 알맞은 것은?  He can fix the computer. = He ___ fix the computer.',c:['is able to','has to','may','must'],a:0,exp:'능력의 can = be able to.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Can you help me?','She cans play the violin.','It may snow tonight.','I can\'t find my key.'],a:1,exp:'조동사는 주어가 3인칭 단수여도 -s를 붙이지 않는다. → She can play.'},
  {t:'order',ko:'제가 창문을 열어도 될까요?',words:['May','I','open','the window'],a:'May I open the window?'},
  {t:'write',ko:'그는 중국어를 말할 수 있다.',hint:'(he, speak Chinese, can)',a:['He can speak Chinese.']}
 ],cards:[
  {f:'조동사 뒤 동사 형태',b:'동사원형'},{f:'능력의 can = ?',b:'be able to'},{f:'can의 과거형',b:'could'},{f:'may의 두 가지 뜻',b:'허가(~해도 된다), 추측(~일지도 모른다)'},{f:'cannot의 축약형',b:'can\'t'}
 ]},
 {id:'3-2', title:'must, have to, should', concept:[
  {h:'must / have to', body:'「~해야 한다(의무)」. have to는 주어가 3인칭 단수면 has to, 과거는 had to. 부정의 뜻이 서로 다른 것에 주의!',
   table:{head:['형태','의미'],rows:[['must not (mustn\'t)','~하면 안 된다 (금지)'],['don\'t/doesn\'t have to','~할 필요가 없다 (불필요) = need not']]},
   ex:[{en:'You <b>must wear</b> a helmet. (= have to)',ko:'너는 헬멧을 써야 한다.'},{en:'You <b>must not run</b> here.',ko:'여기서 뛰면 안 된다. (금지)'},{en:'You <b>don\'t have to hurry</b>.',ko:'서두를 필요 없다. (불필요)'}]},
  {h:'must의 또 다른 뜻: 강한 추측', body:'「~임에 틀림없다」.',
   ex:[{en:'He <b>must be</b> tired after the long trip.',ko:'그는 긴 여행 후라 피곤한 게 틀림없다.'}]},
  {h:'should', body:'「~하는 것이 좋겠다, ~해야 한다(충고·조언)」. must보다 약한 의무.',
   ex:[{en:'You <b>should get</b> some rest.',ko:'너는 좀 쉬는 게 좋겠다.'},{en:'You <b>shouldn\'t eat</b> too much candy.',ko:'사탕을 너무 많이 먹지 않는 게 좋다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Sena ___ to finish the report by Friday.',c:['must','have','has','should'],a:2,exp:'빈칸 뒤 to가 있으므로 have to 구문, 주어가 3인칭 단수 → has to.'},
  {t:'mc',q:'「~할 필요가 없다」의 의미를 가진 것은?',c:['must not','don\'t have to','should not','cannot'],a:1,exp:'don\'t have to = 불필요. must not은 금지.'},
  {t:'mc',q:'밑줄 친 must의 의미가 <u>다른</u> 하나는?',c:['You <u>must</u> follow the rules.','I <u>must</u> clean my room today.','She <u>must</u> be a genius.','We <u>must</u> save water.'],a:2,exp:'「천재임에 틀림없다」는 강한 추측. 나머지는 의무.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  It\'s a secret. You ___ tell anyone.',c:['must not','don\'t have to','should','have to'],a:0,exp:'「말하면 안 된다」는 금지 → must not.'},
  {t:'order',ko:'너는 일찍 잠자리에 드는 것이 좋겠다.',words:['You','should','go to bed','early'],a:'You should go to bed early.'},
  {t:'write',ko:'우리는 오늘 그 일을 끝내야 한다.',hint:'(we, must, finish the work, today)',a:['We must finish the work today.']}
 ],cards:[
  {f:'must not의 의미',b:'~하면 안 된다 (금지)'},{f:'don\'t have to의 의미',b:'~할 필요가 없다 (불필요)'},{f:'must의 두 가지 뜻',b:'의무(~해야 한다), 강한 추측(~임에 틀림없다)'},{f:'have to (3인칭 단수 현재)',b:'has to'},{f:'should의 의미',b:'~하는 것이 좋겠다 (충고·조언)'}
 ]}
]},
{id:4, title:'진행형과 미래시제', units:[
 {id:'4-1', title:'진행형', concept:[
  {h:'현재진행형: am/are/is + -ing', body:'「(지금) ~하고 있다」. 과거진행형은 was/were + -ing 「~하고 있었다」.',
   table:{head:['-ing 만들기','예'],rows:[['대부분 + -ing','reading, playing'],['-e로 끝나면 e 빼고 + -ing','make → making, write → writing'],['단모음+단자음 → 자음 한 번 더','run → running, sit → sitting'],['-ie로 끝나면 ie → y + -ing','lie → lying, die → dying']]},
   ex:[{en:'She <b>is reading</b> a webtoon now.',ko:'그녀는 지금 웹툰을 보고 있다.'},{en:'They <b>were playing</b> soccer at 4 p.m.',ko:'그들은 오후 4시에 축구를 하고 있었다.'}]},
  {h:'부정문과 의문문', body:'부정문은 be동사 뒤에 not, 의문문은 be동사를 주어 앞으로.',
   ex:[{en:'I\'<b>m not sleeping</b>.',ko:'나는 자고 있지 않다.'},{en:'<b>Is</b> he <b>doing</b> his homework? — Yes, he is.',ko:'그는 숙제하고 있니? — 응.'}]},
  {h:'진행형으로 쓰지 않는 동사', body:'소유·감정·인식을 나타내는 동사(have(가지다), like, love, know, want 등)는 원칙적으로 진행형으로 쓰지 않는다. 단, have가 「먹다」의 뜻일 때는 진행형 가능. (I\'m having lunch.)'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Look! The baby ___ .',c:['cry','cries','is crying','was crying'],a:2,exp:'Look!(지금 봐)은 현재진행형과 어울린다.'},
  {t:'mc',q:'-ing형이 <u>잘못된</u> 것은?',c:['run – running','make – makeing','lie – lying','sit – sitting'],a:1,exp:'-e로 끝나는 동사는 e를 빼고 -ing → making.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I am knowing the answer.','She is taking a shower.','We were watching TV then.','He is not listening to me.'],a:0,exp:'know는 인식 동사로 진행형으로 쓰지 않는다. → I know the answer.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ you studying math at 9 last night?',c:['Are','Do','Was','Were'],a:3,exp:'last night(과거) + 주어 you → Were you -ing?'},
  {t:'order',ko:'내 동생은 지금 게임을 하고 있다.',words:['My brother','is','playing','a game','now'],a:'My brother is playing a game now.'},
  {t:'write',ko:'그들은 그때 저녁을 먹고 있었다.',hint:'(they, have dinner, then)',a:['They were having dinner then.']}
 ],cards:[
  {f:'현재진행형 형태',b:'am/are/is + 동사원형-ing'},{f:'과거진행형 형태',b:'was/were + 동사원형-ing'},{f:'-ing형: lie →',b:'lying'},{f:'-ing형: run →',b:'running'},{f:'진행형으로 못 쓰는 동사 예',b:'know, like, love, want, have(가지다)'}
 ]},
 {id:'4-2', title:'will, be going to', concept:[
  {h:'will + 동사원형', body:'「~할 것이다(미래·의지)」. 부정은 will not(won\'t), 의문문은 Will + 주어 ~?',
   ex:[{en:'I <b>will call</b> you tonight.',ko:'오늘 밤에 전화할게. (의지)'},{en:'She <b>won\'t come</b> to the meeting.',ko:'그녀는 회의에 오지 않을 것이다.'},{en:'<b>Will</b> you <b>join</b> us? — Yes, I will.',ko:'우리와 함께할래? — 응.'}]},
  {h:'be going to + 동사원형', body:'「~할 예정이다(계획된 미래) / ~할 것 같다(근거 있는 예측)」. be동사는 주어에 맞춘다.',
   ex:[{en:'We <b>are going to visit</b> Grandma this weekend.',ko:'우리는 이번 주말에 할머니를 뵈러 갈 예정이다.'},{en:'Look at the clouds! It <b>is going to rain</b>.',ko:'구름 좀 봐! 비가 올 것 같아.'}]},
  {h:'미래를 나타내는 표현', body:'tomorrow, next week, soon, in the future 등이 미래시제와 자주 쓰인다.'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He ___ be fourteen next year.',c:['is','will','was','won\'t to'],a:1,exp:'next year(미래) → will + 동사원형.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  They ___ going to build a new library here.',c:['is','am','are','will'],a:2,exp:'be going to의 be동사는 주어(They)에 맞춰 are.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I will studying hard.','She is going to buy a gift.','Will you open the door?','It won\'t take long.'],a:0,exp:'will 뒤에는 동사원형 → I will study hard.'},
  {t:'mc',q:'대답으로 알맞은 것은?  Will Jimin come to your birthday party?',c:['Yes, he is.','Yes, he will.','No, he doesn\'t.','Yes, he comes.'],a:1,exp:'Will로 물으면 will로 대답한다.'},
  {t:'order',ko:'나는 내일 조부모님을 방문할 예정이다.',words:['I','am going to','visit','my grandparents','tomorrow'],a:'I am going to visit my grandparents tomorrow.'},
  {t:'write',ko:'우리는 내년에 제주도에 갈 것이다.',hint:'(we, will, go to Jeju, next year)',a:['We will go to Jeju next year.']}
 ],cards:[
  {f:'will not의 축약형',b:'won\'t'},{f:'be going to의 의미',b:'~할 예정이다 (계획), ~할 것 같다 (예측)'},{f:'will 뒤 동사 형태',b:'동사원형'},{f:'미래를 나타내는 부사 예',b:'tomorrow, next week, soon'},{f:'Will you ~?의 긍정 대답',b:'Yes, I will.'}
 ]}
]}
];

 {id:'5-1', title:'감각동사 + 형용사', concept:[

 ],probs:[

  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The pizza smells delicious.','You look tired.','This candy tastes sweetly.','Her voice sounds lovely.'],a:2,exp:'감각동사 + 형용사 → tastes sweet.'},

  {t:'order',ko:'그 이야기는 이상하게 들린다.',words:['The story','sounds','strange'],a:'The story sounds strange.'},

 ],cards:[

 ]},
 {id:'5-2', title:'목적어가 두 개 필요한 동사', concept:[
  {h:'수여동사: ~에게 …을 주다', body:'give, send, show, teach, buy, make, ask 등은 「간접목적어(~에게) + 직접목적어(…을)」 두 개의 목적어를 가진다. (4형식)',
   ex:[{en:'Dad <b>gave me a present</b>.',ko:'아빠가 나에게 선물을 주셨다.'},{en:'Ms. Kim <b>teaches us English</b>.',ko:'김 선생님은 우리에게 영어를 가르치신다.'}]},
  {h:'3형식으로 바꾸기: 전치사에 주의', body:'「직접목적어 + 전치사 + 간접목적어」 순서로 바꿀 수 있다. 동사에 따라 전치사가 다르다.',
   table:{head:['전치사','동사'],rows:[['to','give, send, show, teach, tell, write, lend'],['for','buy, make, cook, get, find'],['of','ask']]},
   ex:[{en:'Dad gave a present <b>to</b> me.',ko:'아빠가 나에게 선물을 주셨다.'},{en:'Mom made cookies <b>for</b> us.',ko:'엄마가 우리에게 쿠키를 만들어 주셨다.'},{en:'He asked a question <b>of</b> me.',ko:'그는 나에게 질문을 했다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  She sent a letter ___ her friend.',c:['for','to','of','with'],a:1,exp:'send는 3형식 전환 시 전치사 to를 쓴다.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  My mom bought a new bag ___ me.',c:['to','of','for','at'],a:2,exp:'buy는 전치사 for.'},
  {t:'mc',q:'문장 전환이 <u>잘못된</u> 것은?',c:['He gave me a book. → He gave a book to me.','She made him lunch. → She made lunch for him.','I asked her a favor. → I asked a favor to her.','They showed us the photos. → They showed the photos to us.'],a:2,exp:'ask는 전치사 of를 쓴다. → a favor of her.'},
  {t:'mc',q:'어법상 알맞은 문장은?',c:['Please show to me your ticket.','He teaches math us.','I will write you a letter.','She bought to her son a toy.'],a:2,exp:'4형식: 동사 + 간접목적어(you) + 직접목적어(a letter).'},
  {t:'order',ko:'나는 그에게 내 사진들을 보여 주었다.',words:['I','showed','him','my pictures'],a:'I showed him my pictures.'},
  {t:'write',ko:'그녀는 나에게 이메일을 보냈다.',hint:'(she, send, an email, me) ※ 목적어 2개 순서로',a:['She sent me an email.']}
 ],cards:[
  {f:'전치사 to를 쓰는 수여동사',b:'give, send, show, teach, tell, write'},{f:'전치사 for를 쓰는 수여동사',b:'buy, make, cook, get, find'},{f:'전치사 of를 쓰는 수여동사',b:'ask'},{f:'4형식 어순',b:'동사 + 간접목적어(~에게) + 직접목적어(~을)'},{f:'수여동사의 의미',b:'~에게 …을 (해) 주다'}
 ]},
 {id:'5-3', title:'목적격 보어가 필요한 동사', concept:[
  {h:'동사 + 목적어 + 목적격 보어 (5형식)', body:'make, call, name, keep, find, think 등은 목적어 뒤에 목적어를 설명하는 말(목적격 보어)이 필요하다. 보어 자리에는 명사나 형용사가 온다.',
   ex:[{en:'The news <b>made her sad</b>.',ko:'그 소식은 그녀를 슬프게 만들었다. (형용사 보어)'},{en:'We <b>call him Captain</b>.',ko:'우리는 그를 캡틴이라고 부른다. (명사 보어)'},{en:'They <b>named the dog Choco</b>.',ko:'그들은 그 개를 초코라고 이름 지었다.'},{en:'Keep your room <b>clean</b>. (<s>cleanly</s> ✗)',ko:'네 방을 깨끗하게 유지해라.'}]},
  {h:'주의!', body:'목적격 보어 자리에 부사를 쓰지 않는다. The movie made me <b>happy</b>. (<s>happily</s> ✗)'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  The song always makes me ___ .',c:['happily','happy','happiness to','be happily'],a:1,exp:'목적격 보어 자리에는 형용사 happy.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['We call her Queen.','The blanket keeps me warmly.','I found the book easy.','They named their baby Haneul.'],a:1,exp:'보어 자리에 부사 불가 → keeps me warm.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  People ___ the tower Namsan Tower.',c:['call','say','tell','speak'],a:0,exp:'「A를 B라고 부르다」는 call A B.'},
  {t:'mc',q:'문장의 형식이 나머지와 <u>다른</u> 것은?',c:['She made me a sandwich.','The movie made him famous.','Exercise makes us healthy.','The gift made her happy.'],a:0,exp:'①은 「나에게 샌드위치를 만들어 주었다」(4형식, 목적어 2개). 나머지는 목적격 보어가 있는 5형식.'},
  {t:'order',ko:'그 코트는 그녀를 따뜻하게 해 준다.',words:['The coat','keeps','her','warm'],a:'The coat keeps her warm.'},
  {t:'write',ko:'우리는 그 고양이를 나비라고 부른다.',hint:'(we, call, the cat, Nabi)',a:['We call the cat Nabi.']}
 ],cards:[
  {f:'5형식 어순',b:'동사 + 목적어 + 목적격 보어'},{f:'목적격 보어 자리에 올 수 있는 것',b:'명사, 형용사 (부사 ✗)'},{f:'call A B의 의미',b:'A를 B라고 부르다'},{f:'make + 목적어 + 형용사',b:'~을 …하게 만들다'},{f:'name A B의 의미',b:'A를 B라고 이름 짓다'}
 ]}
]},
{id:6, title:'명사와 관사', units:[
 {id:'6-1', title:'셀 수 있는 명사 vs. 셀 수 없는 명사', concept:[
  {h:'셀 수 있는 명사의 복수형', body:'하나(단수)일 때 a/an을 붙이고, 둘 이상(복수)일 때 -(e)s를 붙인다.',
   table:{head:['규칙','예'],rows:[['대부분 + -s','books, apples'],['-s, -ch, -sh, -x, -o + -es','buses, watches, potatoes'],['자음+y → i로 바꾸고 -es','baby → babies, city → cities'],['-f, -fe → v로 바꾸고 -es','leaf → leaves, knife → knives'],['불규칙','man→men, foot→feet, child→children, tooth→teeth, mouse→mice, sheep→sheep, fish→fish']]},
   ex:[{en:'Two <b>children</b> are playing with three <b>sheep</b>.',ko:'두 아이가 양 세 마리와 놀고 있다.'}]},
  {h:'셀 수 없는 명사', body:'물질명사(water, bread, money), 추상명사(love, time, homework), 고유명사(Korea, Mina)는 a/an을 붙이지 않고 복수형도 없다. 물질명사는 용기·단위로 센다.',
   ex:[{en:'a <b>cup of</b> coffee / two <b>glasses of</b> water',ko:'커피 한 잔 / 물 두 잔'},{en:'a <b>piece of</b> cake / three <b>slices of</b> pizza / a <b>loaf of</b> bread',ko:'케이크 한 조각 / 피자 세 조각 / 빵 한 덩이'}]}
 ],probs:[
  {t:'mc',q:'복수형이 <u>잘못된</u> 것은?',c:['city – cities','knife – knives','foot – foots','watch – watches'],a:2,exp:'foot의 복수형은 불규칙 feet.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I drank two ___ of milk this morning.',c:['glass','glasses','glassies','cup'],a:1,exp:'물질명사는 단위명사를 복수형으로 → two glasses of.'},
  {t:'mc',q:'어법상 알맞은 문장은?',c:['I need an information.','She has many moneys.','He bought a loaf of bread.','We saw three sheeps.'],a:2,exp:'bread는 a loaf of로 센다. information·money는 셀 수 없고 sheep의 복수는 sheep.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  There are five ___ in the room.',c:['child','childs','children','childrens'],a:2,exp:'child의 복수형은 children.'},
  {t:'order',ko:'나는 매일 아침 물 한 잔을 마신다.',words:['I','drink','a glass of','water','every morning'],a:'I drink a glass of water every morning.'},
  {t:'write',ko:'탁자 위에 사과 두 개가 있다.',hint:'(there, two apples, on the table)',a:['There are two apples on the table.']}
 ],cards:[
  {f:'복수형: child →',b:'children'},{f:'복수형: tooth →',b:'teeth'},{f:'복수형: leaf →',b:'leaves'},{f:'커피 한 잔',b:'a cup of coffee'},{f:'빵 한 덩이 / 케이크 한 조각',b:'a loaf of bread / a piece of cake'}
 ]},
 {id:'6-2', title:'관사', concept:[
  {h:'부정관사 a / an', body:'셀 수 있는 명사의 단수형 앞에 쓴다. 발음이 <b>모음 소리</b>로 시작하면 an. (철자가 아니라 소리 기준!)',
   ex:[{en:'<b>a</b> book, <b>a</b> university ([ju] 자음 소리)',ko:'책 한 권, 대학교'},{en:'<b>an</b> apple, <b>an</b> hour (h가 묵음, 모음 소리)',ko:'사과 하나, 한 시간'}]},
  {h:'정관사 the', body:'① 앞에 나온 명사를 다시 말할 때 ② 서로 아는 것 ③ 세상에 하나뿐인 것(the sun, the moon) ④ 악기 이름 앞(play the piano)',
   ex:[{en:'I have a cat. <b>The</b> cat is very lazy.',ko:'나는 고양이가 있다. 그 고양이는 아주 게으르다.'},{en:'She plays <b>the</b> violin.',ko:'그녀는 바이올린을 연주한다.'}]},
  {h:'관사를 쓰지 않는 경우', body:'식사(have breakfast), 운동(play soccer), by + 교통수단(by bus), 본래 목적의 장소(go to school 학교에 공부하러 가다, go to bed 자다).'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He is ___ honest boy.',c:['a','an','the','×(없음)'],a:1,exp:'honest는 h가 묵음이라 모음 소리로 시작 → an.'},
  {t:'mc',q:'빈칸에 the가 필요한 것은?',c:['We had ___ lunch at noon.','She goes to school by ___ bus.','Can you play ___ guitar?','They play ___ basketball.'],a:2,exp:'악기 이름 앞에는 the. 식사·교통수단·운동 앞에는 관사를 쓰지 않는다.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The sun rises in the east.','I go to bed at ten.','He waited for an hour.','She bought an useful book.'],a:3,exp:'useful은 [ju] 자음 소리로 시작 → a useful book.'},
  {t:'mc',q:'빈칸에 알맞은 짝은?  I saw ___ dog in the park. ___ dog was very big.',c:['a – A','a – The','the – A','an – The'],a:1,exp:'처음 언급 → a, 다시 언급 → the.'},
  {t:'order',ko:'그녀는 하루에 한 번 피아노를 친다.',words:['She','plays','the piano','once a day'],a:'She plays the piano once a day.'},
  {t:'write',ko:'나는 버스로 학교에 간다.',hint:'(I, go to school, by bus)',a:['I go to school by bus.']}
 ],cards:[
  {f:'an을 쓰는 기준',b:'모음 소리로 시작 (철자 아님)'},{f:'an hour인 이유',b:'h가 묵음 → 모음 소리 시작'},{f:'a university인 이유',b:'[ju] 자음 소리로 시작'},{f:'악기 이름 앞 관사',b:'the (play the piano)'},{f:'관사를 안 쓰는 경우',b:'식사, 운동, by 교통수단, go to school/bed'}
 ]}
]},
{id:7, title:'대명사', units:[
 {id:'7-1', title:'인칭대명사, 재귀대명사', concept:[
  {h:'인칭대명사의 격변화', body:'문장에서의 역할에 따라 형태가 바뀐다.',
   table:{head:['주격(~은/는)','소유격(~의)','목적격(~을/에게)','소유대명사(~의 것)'],rows:[['I','my','me','mine'],['you','your','you','yours'],['he','his','him','his'],['she','her','her','hers'],['it','its','it','–'],['we','our','us','ours'],['they','their','them','theirs']]},
   ex:[{en:'<b>She</b> likes <b>him</b>, but he doesn\'t know <b>her</b> name.',ko:'그녀는 그를 좋아하지만, 그는 그녀의 이름을 모른다.'},{en:'This bag is <b>mine</b>, not <b>yours</b>.',ko:'이 가방은 내 것이지 네 것이 아니다.'}]},
  {h:'재귀대명사: -self / -selves', body:'「~ 자신」. 주어와 목적어가 같을 때(재귀 용법, 생략 불가) 또는 강조할 때(강조 용법, 생략 가능) 쓴다. myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.',
   ex:[{en:'She looked at <b>herself</b> in the mirror.',ko:'그녀는 거울 속 자신을 보았다. (재귀)'},{en:'I made this cake <b>myself</b>.',ko:'내가 직접 이 케이크를 만들었다. (강조)'},{en:'by oneself = 혼자서 / Help yourself. = 마음껏 드세요.',ko:'관용 표현'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  This is not my umbrella. ___ is blue.',c:['My','Mine','Me','I'],a:1,exp:'「나의 것」= mine (소유대명사).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Mr. Park teaches ___ science.',c:['we','our','us','ours'],a:2,exp:'동사의 목적어 자리 → 목적격 us.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He introduced ___ to the class.',c:['him','his','himself','he'],a:2,exp:'주어(He)와 목적어가 같은 사람 → 재귀대명사 himself.'},
  {t:'mc',q:'밑줄 친 부분을 생략할 수 있는 것은?',c:['She hurt <u>herself</u>.','I <u>myself</u> cleaned the house.','He talked to <u>himself</u>.','Look at <u>yourself</u>.'],a:1,exp:'강조 용법(직접 ~했다)만 생략 가능. 재귀 용법은 생략 불가.'},
  {t:'order',ko:'그들의 개는 우리를 좋아한다.',words:['Their dog','likes','us'],a:'Their dog likes us.'},
  {t:'write',ko:'나는 나 자신이 자랑스럽다.',hint:'(I, proud of, myself)',a:['I am proud of myself.',"I'm proud of myself."]}
 ],cards:[
  {f:'she의 목적격 / 소유대명사',b:'her / hers'},{f:'they의 소유격 / 목적격',b:'their / them'},{f:'we의 재귀대명사',b:'ourselves'},{f:'by oneself의 의미',b:'혼자서, 스스로'},{f:'재귀 용법 vs 강조 용법',b:'재귀: 생략 불가 / 강조: 생략 가능'}
 ]},
 {id:'7-2', title:'this, that, it', concept:[
  {h:'지시대명사 this / that', body:'this(이것, 가까운 것) ↔ that(저것, 먼 것). 복수형은 these / those. 명사 앞에서 「이 ~, 저 ~」로 꾸며 주기도 한다(지시형용사).',
   ex:[{en:'<b>This</b> is my desk, and <b>that</b> is yours.',ko:'이것은 내 책상이고, 저것은 네 것이다.'},{en:'<b>These</b> shoes are too small.',ko:'이 신발은 너무 작다.'}]},
  {h:'비인칭 주어 it', body:'시간, 날짜, 요일, 날씨, 거리, 명암 등을 나타낼 때 주어로 쓰는 it. 「그것」이라고 해석하지 않는다.',
   ex:[{en:'<b>It</b> is Monday. / <b>It</b> is sunny today.',ko:'월요일이다. / 오늘은 화창하다.'},{en:'<b>It</b> is 3 kilometers from here to the station.',ko:'여기서 역까지 3킬로미터이다.'},{en:'A: What time is it?  B: <b>It</b>\'s seven thirty.',ko:'몇 시야? — 7시 30분이야.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ books on the shelf are mine.',c:['This','That','Those','It'],a:2,exp:'books(복수) 앞이므로 복수형 지시형용사 Those.'},
  {t:'mc',q:'밑줄 친 It의 쓰임이 나머지와 <u>다른</u> 것은?',c:['<u>It</u> is raining outside.','<u>It</u> is far from here.','<u>It</u> is my new phone.','<u>It</u> is December 25th.'],a:2,exp:'③은 「그것」(대명사). 나머지는 날씨·거리·날짜의 비인칭 주어.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  A: How\'s the weather?  B: ___ is snowy.',c:['This','That','It','There'],a:2,exp:'날씨를 나타내는 비인칭 주어 it.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['These are my parents.','That building is a museum.','This oranges are sweet.','Those were good days.'],a:2,exp:'oranges(복수) 앞에는 These → These oranges.'},
  {t:'order',ko:'오늘은 날씨가 매우 춥다.',words:['It','is','very cold','today'],a:'It is very cold today.'},
  {t:'write',ko:'이 사람들은 내 친구들이다.',hint:'(these, my friends)',a:['These are my friends.']}
 ],cards:[
  {f:'this / that의 복수형',b:'these / those'},{f:'비인칭 주어 it이 나타내는 것',b:'시간, 날짜, 요일, 날씨, 거리, 명암'},{f:'비인칭 주어 it의 해석',b:'해석하지 않음 (「그것」 ✗)'},{f:'「이 신발들」',b:'these shoes'},{f:'What time is it?의 대답',b:'It\'s + 시각'}
 ]},
 {id:'7-3', title:'one, some, any', concept:[
  {h:'부정대명사 one', body:'앞에 나온 명사와 <b>같은 종류의 불특정한 것</b>을 가리킨다. (it은 바로 그것!) 복수형은 ones.',
   ex:[{en:'I lost my pen, so I need to buy <b>one</b>. (아무 펜이나 하나)',ko:'펜을 잃어버려서 하나 사야 한다.'},{en:'I lost my pen. I can\'t find <b>it</b>. (잃어버린 바로 그 펜)',ko:'펜을 잃어버렸는데 그것을 못 찾겠다.'}]},
  {h:'some / any', body:'「몇몇의, 약간(의)」. some은 긍정문과 권유 의문문에, any는 부정문·의문문에 주로 쓴다.',
   ex:[{en:'I have <b>some</b> questions.',ko:'질문이 몇 개 있어요. (긍정문)'},{en:'Do you have <b>any</b> questions?',ko:'질문 있나요? (의문문)'},{en:'I don\'t have <b>any</b> money.',ko:'나는 돈이 하나도 없다. (부정문)'},{en:'Would you like <b>some</b> tea?',ko:'차 좀 드실래요? (권유는 some)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  My phone is old. I want to buy a new ___ .',c:['it','one','ones','any'],a:1,exp:'같은 종류의 불특정한 것 → one.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  There isn\'t ___ milk in the fridge.',c:['some','any','one','a'],a:1,exp:'부정문에는 any.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Would you like ___ cookies?',c:['any','one','some','it'],a:2,exp:'권유하는 의문문에는 some.'},
  {t:'mc',q:'밑줄 친 부분이 어법상 <u>틀린</u> 것은?',c:['I need <u>some</u> help.','Do you have <u>any</u> plans?','She doesn\'t have <u>some</u> friends here.','These shoes are old. I\'ll buy new <u>ones</u>.'],a:2,exp:'부정문에는 any → doesn\'t have any friends.'},
  {t:'order',ko:'나는 약간의 빵과 우유를 샀다.',words:['I','bought','some','bread and milk'],a:'I bought some bread and milk.'},

{id:10, title:'전치사', units:[
 {id:'10-1', title:'장소를 나타내는 전치사', concept:[
  {h:'at / on / in', body:'at: 하나의 지점(at the bus stop, at the door) / on: 표면 위에 접촉(on the desk, on the wall) / in: 공간 안(in the box, in Busan, in Korea).',
   ex:[{en:'She is waiting <b>at</b> the bus stop.',ko:'그녀는 버스 정류장에서 기다리고 있다.'},{en:'The picture is <b>on</b> the wall.',ko:'그림이 벽에 걸려 있다.'},{en:'My uncle lives <b>in</b> Seoul.',ko:'삼촌은 서울에 사신다.'}]},
  {h:'여러 가지 위치 전치사', body:'under(아래), over(바로 위), in front of(앞), behind(뒤), next to[by, beside](옆), between A and B(A와 B 사이), near(근처), across from(맞은편).',
   ex:[{en:'The cat is <b>under</b> the table.',ko:'고양이가 탁자 아래에 있다.'},{en:'The bank is <b>between</b> the bakery <b>and</b> the cafe.',ko:'은행은 빵집과 카페 사이에 있다.'},{en:'He sat <b>next to</b> me.',ko:'그는 내 옆에 앉았다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  There is a clock ___ the wall.',c:['at','on','in','under'],a:1,exp:'벽면에 접촉해 있으므로 on.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  My school is ___ the library and the park.',c:['next','between','among','behind'],a:1,exp:'between A and B: A와 B 사이.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  We arrived ___ the airport at six.',c:['at','on','in front','between'],a:0,exp:'공항이라는 지점 → at the airport.'},
  {t:'mc',q:'그림 설명이 어법상 <u>틀린</u> 것은? (공이 상자 안, 가방이 의자 뒤에 있는 상황)',c:['The ball is in the box.','The bag is behind the chair.','The ball is on the box.','The bag is not in front of the chair.'],a:2,exp:'공은 상자 「안」에 있으므로 in.'},
  {t:'order',ko:'우체국은 은행 맞은편에 있다.',words:['The post office','is','across from','the bank'],a:'The post office is across from the bank.'},
  {t:'write',ko:'내 신발은 침대 아래에 있다.',hint:'(my shoes, under the bed)',a:['My shoes are under the bed.']}
 ],cards:[
  {f:'표면 위 접촉',b:'on'},{f:'공간 안',b:'in'},{f:'하나의 지점',b:'at'},{f:'「A와 B 사이에」',b:'between A and B'},{f:'「~ 옆에」 (3가지)',b:'next to, by, beside'}
 ]},
 {id:'10-2', title:'시간을 나타내는 전치사', concept:[
  {h:'at / on / in', body:'at + 시각·시점(at 7, at noon, at night) / on + 요일·날짜·특정한 날(on Monday, on May 5th, on my birthday) / in + 월·계절·연도·오전/오후(in July, in winter, in 2026, in the morning).',
   ex:[{en:'The class starts <b>at</b> nine.',ko:'수업은 9시에 시작한다.'},{en:'We don\'t go to school <b>on</b> Sundays.',ko:'우리는 일요일에는 학교에 가지 않는다.'},{en:'It snows a lot <b>in</b> winter.',ko:'겨울에는 눈이 많이 온다.'}]},
  {h:'그 밖의 시간 전치사', body:'before(~전에), after(~후에), for + 숫자 기간(for two hours), during + 특정 기간(during the vacation), until(~까지 계속), by(~까지 완료).',
   ex:[{en:'Wash your hands <b>before</b> lunch.',ko:'점심 먹기 전에 손을 씻어라.'},{en:'I studied <b>for</b> three hours.',ko:'나는 세 시간 동안 공부했다.'},{en:'He slept <b>during</b> the movie.',ko:'그는 영화 보는 동안 잤다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  My birthday is ___ October 12th.',c:['at','on','in','for'],a:1,exp:'날짜 앞에는 on.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The movie starts ___ 7:30.',c:['on','in','at','during'],a:2,exp:'시각 앞에는 at.'},
  {t:'mc',q:'빈칸에 알맞은 짝은?  I exercise ___ the morning ___ 30 minutes.',c:['in – for','at – during','on – for','in – during'],a:0,exp:'in the morning + for + 숫자 기간.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He read a book ___ the summer vacation.',c:['for','during','at','on'],a:1,exp:'특정 기간(방학) 앞에는 during.'},
  {t:'order',ko:'우리는 저녁 식사 후에 산책을 한다.',words:['We','take a walk','after','dinner'],a:'We take a walk after dinner.'},
  {t:'write',ko:'나는 밤에 우유를 마신다.',hint:'(I, drink milk, at night)',a:['I drink milk at night.']}
 ],cards:[
  {f:'시각 앞 전치사',b:'at (at 7, at noon)'},{f:'요일·날짜 앞 전치사',b:'on (on Monday, on May 5th)'},{f:'월·계절·연도 앞 전치사',b:'in (in July, in 2026)'},{f:'for vs during',b:'for + 숫자 기간 / during + 특정 기간'},{f:'until vs by',b:'until: ~까지 계속 / by: ~까지 완료'}
 ]},
 {id:'10-3', title:'기타 전치사', concept:[
  {h:'수단·도구', body:'by + 교통·통신 수단(by bus, by email — 관사 없음!), with + 도구(with a knife), in + 언어(in English).',
   ex:[{en:'She goes to work <b>by subway</b>.',ko:'그녀는 지하철로 출근한다.'},{en:'Cut the paper <b>with</b> scissors.',ko:'가위로 종이를 잘라라.'},{en:'Please write your name <b>in</b> English.',ko:'이름을 영어로 써 주세요.'}]},
  {h:'그 밖의 전치사', body:'about(~에 관해), for(~을 위해), like(~처럼), without(~ 없이), from A to B(A부터 B까지).',
   ex:[{en:'This book is <b>about</b> Korean history.',ko:'이 책은 한국사에 관한 것이다.'},{en:'I can\'t live <b>without</b> music.',ko:'나는 음악 없이는 살 수 없다.'},{en:'The store is open <b>from</b> 9 <b>to</b> 6.',ko:'가게는 9시부터 6시까지 연다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He went to Jeju ___ plane.',c:['with','by','in','on a'],a:1,exp:'교통수단은 by + 무관사 명사.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She opened the box ___ a key.',c:['by','in','with','about'],a:2,exp:'도구는 with.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  We talked ___ our favorite webtoons.',c:['about','with','for','from'],a:0,exp:'「~에 관해」 이야기하다 → about.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I go to school by a bus.','Say it in Korean.','He is like his father.','The bank is open from Monday to Friday.'],a:0,exp:'by + 교통수단에는 관사를 쓰지 않는다 → by bus.'},
  {t:'order',ko:'너는 물 없이 살 수 없다.',words:['You','can\'t','live','without','water'],a:'You can\'t live without water.'},
  {t:'write',ko:'그는 택시로 집에 갔다.',hint:'(he, go home, by taxi)',a:['He went home by taxi.']}
 ],cards:[
  {f:'교통·통신 수단',b:'by + 무관사 명사 (by bus)'},{f:'도구',b:'with (with a knife)'},{f:'「~에 관해」',b:'about'},{f:'「~ 없이」',b:'without'},{f:'「A부터 B까지」',b:'from A to B'}
 ]}
]},
{id:11, title:'접속사', units:[
 {id:'11-1', title:'and, but, or, so', concept:[
  {h:'등위접속사', body:'단어와 단어, 구와 구, 문장과 문장을 <b>대등하게</b> 연결한다. and(그리고), but(그러나), or(또는), so(그래서 — 문장만 연결).',
   ex:[{en:'I like ramen <b>and</b> kimbap.',ko:'나는 라면과 김밥을 좋아한다.'},{en:'He is young <b>but</b> wise.',ko:'그는 어리지만 현명하다.'},{en:'Do you want juice <b>or</b> milk?',ko:'주스 줄까, 우유 줄까?'},{en:'It rained, <b>so</b> we stayed home.',ko:'비가 와서 우리는 집에 있었다.'}]},
  {h:'연결할 때 주의', body:'and, but, or로 연결되는 말은 문법적으로 같은 형태여야 한다(병렬). She likes singing and <b>dancing</b>. (<s>to dance</s> ✗)'}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I was tired, ___ I went to bed early.',c:['but','or','so','because of'],a:2,exp:'「피곤했다, 그래서 일찍 잤다」 → so.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The bag is nice ___ too expensive.',c:['and','but','so','or'],a:1,exp:'「좋지만 너무 비싸다」 → 반대 내용 연결 but.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Which do you like better, spring ___ fall?',c:['and','but','or','so'],a:2,exp:'선택 → or.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['He can sing and dance.','I want to read and writing.','She is smart and kind.','You can walk or take a bus.'],a:1,exp:'병렬 구조: to read and (to) write.'},
  {t:'order',ko:'나는 배가 고파서 샌드위치를 만들었다.',words:['I was hungry',',','so','I made a sandwich'],a:'I was hungry , so I made a sandwich.'},
  {t:'write',ko:'그녀는 사과와 바나나를 샀다.',hint:'(she, buy, apples and bananas)',a:['She bought apples and bananas.']}
 ],cards:[
  {f:'and / but / or / so의 뜻',b:'그리고 / 그러나 / 또는 / 그래서'},{f:'등위접속사가 연결하는 것',b:'문법적으로 대등한 말 (병렬)'},{f:'so가 연결할 수 있는 것',b:'문장과 문장만'},{f:'「A와 B 중 어느 것?」',b:'A or B'},{f:'singing and ___ (병렬)',b:'dancing (같은 형태)'}
 ]},
 {id:'11-2', title:'when, before, after, until', concept:[
  {h:'시간의 접속사', body:'when(~할 때), before(~하기 전에), after(~한 후에), until(~할 때까지), while(~하는 동안). 「접속사 + 주어 + 동사」 절을 이끈다.',
   ex:[{en:'<b>When</b> I was young, I lived in Daegu.',ko:'나는 어렸을 때 대구에 살았다.'},{en:'Brush your teeth <b>before</b> you go to bed.',ko:'자기 전에 이를 닦아라.'},{en:'<b>After</b> he finished dinner, he watched TV.',ko:'그는 저녁을 다 먹은 후에 TV를 봤다.'},{en:'Wait here <b>until</b> I come back.',ko:'내가 돌아올 때까지 여기서 기다려.'}]},
  {h:'주의! 시간 부사절의 시제', body:'시간을 나타내는 접속사가 이끄는 절에서는 미래의 일이라도 <b>현재시제</b>를 쓴다.',
   ex:[{en:'I will call you <b>when</b> I <b>arrive</b>. (<s>will arrive</s> ✗)',ko:'도착하면 전화할게.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ it rains, I stay at home.',c:['When','Until','So','Or'],a:0,exp:'「비가 올 때」 → When.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Look both ways ___ you cross the street.',c:['after','before','until','so'],a:1,exp:'「길을 건너기 전에」 양쪽을 살펴라 → before.'},
  {t:'mc',q:'어법상 알맞은 것은?  I will wait until she ___ .',c:['comes','will come','came','coming'],a:0,exp:'시간 부사절에서는 미래 대신 현재시제.'},
  {t:'mc',q:'두 문장을 한 문장으로 알맞게 연결한 것은?  He washed his hands. Then he ate lunch.',c:['He ate lunch before he washed his hands.','After he washed his hands, he ate lunch.','He washed his hands after he ate lunch.','Until he ate lunch, he washed his hands.'],a:1,exp:'손을 씻은 후에 점심을 먹었다 → After he washed ~.'},
  {t:'order',ko:'내가 집에 왔을 때, 엄마는 요리하고 계셨다.',words:['When','I came home',',','my mom','was cooking'],a:'When I came home , my mom was cooking.'},
  {t:'write',ko:'저녁을 먹은 후에 나는 숙제를 했다.',hint:'(after, I, have dinner / do my homework) ※ 과거시제',a:['After I had dinner, I did my homework.','I did my homework after I had dinner.']}
 ],cards:[
  {f:'when / while의 뜻',b:'~할 때 / ~하는 동안'},{f:'before / after의 뜻',b:'~하기 전에 / ~한 후에'},{f:'until의 뜻',b:'~할 때까지'},{f:'시간 부사절의 시제 규칙',b:'미래 대신 현재시제'},{f:'I\'ll call you when I ___ (arrive)',b:'arrive (현재형!)'}
 ]},
 {id:'11-3', title:'because, if, that', concept:[
  {h:'because: ~하기 때문에', body:'이유를 나타내는 절을 이끈다. because + 주어 + 동사 / because of + 명사(구).',
   ex:[{en:'I was late <b>because</b> I missed the bus.',ko:'버스를 놓쳐서 늦었다.'},{en:'The game was canceled <b>because of</b> the rain.',ko:'비 때문에 경기가 취소되었다.'}]},
  {h:'if: 만약 ~한다면', body:'조건의 절을 이끈다. 조건 부사절에서도 미래 대신 <b>현재시제</b>!',
   ex:[{en:'<b>If</b> you <b>hurry</b>, you will catch the train.',ko:'서두르면 기차를 탈 수 있을 것이다.'},{en:'<b>If</b> it <b>is</b> sunny tomorrow, we will go hiking.',ko:'내일 맑으면 하이킹 갈 것이다.'}]},
  {h:'that: ~라는 것', body:'명사절을 이끌어 think, know, believe, hope 등의 목적어가 된다. 목적어절의 that은 생략 가능.',
   ex:[{en:'I think <b>(that)</b> this problem is easy.',ko:'나는 이 문제가 쉽다고 생각한다.'},{en:'We know <b>(that)</b> she is honest.',ko:'우리는 그녀가 정직하다는 것을 안다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He stayed home ___ he was sick.',c:['if','that','because','or'],a:2,exp:'이유(아팠기 때문에) → because.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  We couldn\'t play outside ___ the heavy snow.',c:['because','because of','if','that'],a:1,exp:'뒤에 명사구(the heavy snow) → because of.'},
  {t:'mc',q:'어법상 알맞은 것은?  If it ___ tomorrow, I will take an umbrella.',c:['rains','will rain','rained','raining'],a:0,exp:'조건 부사절에서는 현재시제가 미래를 대신한다.'},
  {t:'mc',q:'밑줄 친 that을 생략할 수 있는 것은?',c:['I hope <u>that</u> you feel better soon.','<u>That</u> is my favorite song.','<u>That</u> movie was boring.','Look at <u>that</u>!'],a:0,exp:'목적어절을 이끄는 접속사 that만 생략 가능. 나머지는 지시대명사·지시형용사.'},
  {t:'order',ko:'만약 네가 열심히 공부하면, 너는 시험에 통과할 것이다.',words:['If','you study hard',',','you will pass','the test'],a:'If you study hard , you will pass the test.'},
  {t:'write',ko:'나는 그가 옳다고 생각한다.',hint:'(I, think, that, he, right)',a:['I think that he is right.','I think he is right.']}
 ],cards:[
  {f:'because vs because of',b:'because + 주어·동사 / because of + 명사'},{f:'if의 뜻',b:'만약 ~한다면 (조건)'},{f:'조건 부사절의 시제',b:'미래 대신 현재시제'},{f:'접속사 that의 뜻',b:'~라는 것 (명사절)'},{f:'생략 가능한 that',b:'목적어절을 이끄는 that'}
 ]}
]},
{id:12, title:'의문문, 명령문, 감탄문', units:[
 {id:'12-1', title:'의문사 who, what, which', concept:[
  {h:'의문사 의문문의 어순', body:'의문사 + be동사 + 주어 ~? / 의문사 + do/does/did + 주어 + 동사원형 ~? 의문사 의문문에는 Yes/No로 대답하지 않는다.',
   ex:[{en:'<b>Who</b> is that girl? — She is my cousin.',ko:'저 여자애는 누구니? — 내 사촌이야.'},{en:'<b>What</b> did you eat for lunch? — I ate bibimbap.',ko:'점심으로 뭐 먹었어? — 비빔밥 먹었어.'}]},
  {h:'who / what / which', body:'who(누구), what(무엇 / 무슨 ~), which(어느 것 / 어느 ~ — 정해진 범위에서 선택). what과 which는 뒤에 명사를 붙여 쓸 수 있다.',
   ex:[{en:'<b>What</b> color do you like?',ko:'무슨 색을 좋아하니?'},{en:'<b>Which</b> do you prefer, tea <b>or</b> coffee?',ko:'차와 커피 중 어느 것을 더 좋아하세요?'},{en:'<b>Who</b> made this cake? — Mom did. (의문사가 주어면 「의문사+동사」 어순)',ko:'누가 이 케이크를 만들었어? — 엄마가.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ is your favorite subject? — It\'s science.',c:['Who','What','Which of','When'],a:1,exp:'「무엇」이 가장 좋아하는 과목인지 → What.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ bag is yours, the red one or the blue one?',c:['What','Who','Which','Whose is'],a:2,exp:'정해진 둘 중 선택 → Which.'},
  {t:'mc',q:'어순이 알맞은 것은?',c:['What you did buy?','What did you buy?','What you bought?','What did you bought?'],a:1,exp:'의문사 + did + 주어 + 동사원형.'},
  {t:'mc',q:'대답으로 알맞은 것은?  Who broke the window?',c:['Yes, he did.','Minsu did.','No, he didn\'t.','It was broke.'],a:1,exp:'의문사 의문문은 Yes/No 대답 불가. 주어를 밝혀 대답.'},
  {t:'order',ko:'너는 아침으로 무엇을 먹니?',words:['What','do','you','eat','for breakfast'],a:'What do you eat for breakfast?'},
  {t:'write',ko:'저 남자는 누구니?',hint:'(who, that man)',a:['Who is that man?']}
 ],cards:[
  {f:'who / what / which의 뜻',b:'누구 / 무엇 / (정해진 것 중) 어느 것'},{f:'의문사 의문문의 대답',b:'Yes/No로 답하지 않음'},{f:'일반동사 의문사 의문문 어순',b:'의문사 + do/does/did + 주어 + 동사원형'},{f:'which를 쓰는 상황',b:'정해진 범위에서 선택할 때'},{f:'의문사가 주어일 때 어순',b:'의문사 + 동사 (Who made ~?)'}
 ]},
 {id:'12-2', title:'의문사 when, where, why, how', concept:[
  {h:'when / where / why', body:'when(언제), where(어디서), why(왜 — 대답은 Because ~).',
   ex:[{en:'<b>When</b> does the concert start? — At seven.',ko:'콘서트는 언제 시작해? — 7시에.'},{en:'<b>Where</b> did you find my key? — Under the sofa.',ko:'내 열쇠 어디서 찾았어? — 소파 밑에서.'},{en:'<b>Why</b> are you so happy? — <b>Because</b> I got an A.',ko:'왜 그렇게 기분이 좋아? — A를 받았거든.'}]},
  {h:'how와 「how + 형용사/부사」', body:'how(어떻게, 어떤 상태로). how old(나이), how many + 복수명사(수), how much(양·가격), how often(빈도), how long(기간·길이), how far(거리), how tall(키).',
   ex:[{en:'<b>How</b> do you go to school? — By bike.',ko:'학교에 어떻게 가? — 자전거로.'},{en:'<b>How many</b> books do you have?',ko:'책이 몇 권 있니?'},{en:'<b>How much</b> is this cap?',ko:'이 모자는 얼마예요?'},{en:'<b>How often</b> do you exercise? — Three times a week.',ko:'얼마나 자주 운동해? — 일주일에 세 번.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ were you late? — Because I got up late.',c:['When','Where','Why','How'],a:2,exp:'Because로 대답 → 이유를 묻는 Why.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ is the museum from here? — About two kilometers.',c:['How long','How far','How often','How much'],a:1,exp:'거리를 물을 때는 How far.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ many students are there in your class?',c:['How','What','Which','Who'],a:0,exp:'수를 묻는 How many + 복수명사.'},
  {t:'mc',q:'질문과 대답이 어울리지 <u>않는</u> 것은?',c:['When is the test? — Next Friday.','Where is he? — In the gym.','How often do you swim? — For an hour.','How old is she? — She is fourteen.'],a:2,exp:'How often(빈도)의 대답은 once a week 등. For an hour는 How long의 대답.'},
  {t:'order',ko:'너는 어디에 사니?',words:['Where','do','you','live'],a:'Where do you live?'},
  {t:'write',ko:'이 티셔츠는 얼마예요?',hint:'(how much, this T-shirt)',a:['How much is this T-shirt?']}
 ],cards:[
  {f:'when / where / why의 뜻',b:'언제 / 어디서 / 왜'},{f:'why 의문문의 대답',b:'Because + 주어 + 동사'},{f:'수를 물을 때 / 양·가격을 물을 때',b:'How many + 복수명사 / How much'},{f:'How often의 뜻과 대답 예',b:'얼마나 자주 / once a week'},{f:'How long vs How far',b:'기간·길이 / 거리'}
 ]},
 {id:'12-3', title:'부가의문문', concept:[
  {h:'~, 그렇지 (않니)?', body:'평서문 뒤에 붙여 확인·동의를 구하는 의문문. 규칙: ① 긍정문 → 부정 부가의문문, 부정문 → 긍정 부가의문문 ② 동사는 be동사·조동사는 그대로, 일반동사는 do/does/did ③ 주어는 대명사로 ④ 부정형은 반드시 축약형.',
   ex:[{en:'It is cold today, <b>isn\'t it</b>?',ko:'오늘 춥다, 그렇지?'},{en:'You like pizza, <b>don\'t you</b>?',ko:'너 피자 좋아하지, 그렇지?'},{en:'She didn\'t call you, <b>did she</b>?',ko:'그녀가 전화 안 했지, 그렇지?'},{en:'Tom can swim, <b>can\'t he</b>?',ko:'톰은 수영할 수 있지, 그렇지?'}]},
  {h:'대답하는 법', body:'대답의 내용이 긍정이면 Yes, 부정이면 No. (우리말 해석과 반대일 수 있으니 주의!)',
   ex:[{en:'You don\'t like carrots, do you? — <b>No</b>, I don\'t. (응, 안 좋아해.)',ko:'대답이 부정 내용이면 No.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Mina is your classmate, ___ ?',c:['is she','isn\'t she','does she','doesn\'t she'],a:1,exp:'긍정문 + be동사 → 부정 축약 + 대명사: isn\'t she?'},
  {t:'mc',q:'빈칸에 알맞은 것은?  You watched the drama last night, ___ ?',c:['didn\'t you','did you','don\'t you','weren\'t you'],a:0,exp:'일반동사 과거 긍정문 → didn\'t you?'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Your brother can\'t drive, ___ ?',c:['can\'t he','can he','does he','isn\'t he'],a:1,exp:'부정문 → 긍정 부가의문문: can he?'},
  {t:'mc',q:'어법상 <u>틀린</u> 것은?',c:['She is a nurse, isn\'t she?','They went home, didn\'t they?','Jiho likes math, doesn\'t Jiho?','You aren\'t angry, are you?'],a:2,exp:'부가의문문의 주어는 대명사로 → doesn\'t he?'},
  {t:'order',ko:'너 피곤하구나, 그렇지?',words:['You','are','tired',', aren\'t you?'],a:'You are tired , aren\'t you?'},
  {t:'write',ko:'그는 축구를 좋아해, 그렇지?',hint:'(he, like soccer) + 부가의문문',a:['He likes soccer, doesn\'t he?']}
 ],cards:[
  {f:'긍정문 뒤 부가의문문',b:'부정 축약형 (isn\'t she? 등)'},{f:'부정문 뒤 부가의문문',b:'긍정형 (can he? 등)'},{f:'일반동사 문장의 부가의문문 동사',b:'do / does / did'},{f:'부가의문문의 주어',b:'대명사로 바꿔 씀'},{f:'You like it, ___ ?',b:'don\'t you?'}
 ]},
 {id:'12-4', title:'부정의문문, 선택의문문', concept:[
  {h:'부정의문문: ~하지 않니?', body:'「부정 축약형 + 주어 ~?」로 시작. 대답은 부가의문문처럼 <b>내용이 긍정이면 Yes, 부정이면 No</b>. (우리말과 반대!)',
   ex:[{en:'<b>Don\'t</b> you like horror movies? — <b>Yes</b>, I do. (아니, 좋아해.) / <b>No</b>, I don\'t. (응, 안 좋아해.)',ko:'공포 영화 안 좋아해?'},{en:'<b>Isn\'t</b> she a singer? — Yes, she is.',ko:'그녀는 가수 아니야? — 맞아, 가수야.'}]},
  {h:'선택의문문: A 또는 B?', body:'or로 연결해 둘 중 하나를 고르게 하는 의문문. Yes/No로 답하지 않고 <b>선택한 것으로 대답</b>한다.',
   ex:[{en:'<b>Which</b> do you like better, summer <b>or</b> winter? — I like winter better.',ko:'여름과 겨울 중 뭐가 더 좋아? — 겨울이 더 좋아.'},{en:'<b>Is</b> this bag yours <b>or</b> hers? — It\'s hers.',ko:'이 가방 네 거야, 그녀 거야? — 그녀 거야.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ you hungry? You didn\'t eat lunch.',c:['Aren\'t','Don\'t','Doesn\'t','Isn\'t'],a:0,exp:'주어 you + 형용사(hungry) → be동사 부정의문문 Aren\'t you ~?'},
  {t:'mc',q:'대답으로 알맞은 것은?  Which do you want, juice or water?',c:['Yes, please.','No, I don\'t.','Juice, please.','Yes, juice.'],a:2,exp:'선택의문문은 Yes/No 없이 선택한 것으로 대답.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Doesn\'t he live in Busan? — ___ , he lives in Ulsan.',c:['Yes','No','So','Because'],a:1,exp:'사는 곳이 부산이 아니므로 내용이 부정 → No.'},
  {t:'mc',q:'어법상 알맞은 문장은?',c:['Isn\'t not she your teacher?','Don\'t you have any plans?','Do you want tea or do coffee?','Aren\'t he tired?'],a:1,exp:'부정 축약형으로 시작: Don\'t you ~? ④는 Isn\'t he가 되어야 함.'},
  {t:'order',ko:'너는 걸어서 가니, 아니면 버스로 가니?',words:['Do you go','on foot','or','by bus'],a:'Do you go on foot or by bus?'},
  {t:'write',ko:'너는 고양이를 좋아하지 않니?',hint:'(don\'t, you, like cats)',a:["Don't you like cats?"]}
 ],cards:[
  {f:'부정의문문의 시작',b:'부정 축약형 (Don\'t / Isn\'t / Can\'t ...)'},{f:'부정의문문 대답 규칙',b:'내용이 긍정이면 Yes, 부정이면 No'},{f:'선택의문문의 연결어',b:'or'},{f:'선택의문문의 대답',b:'Yes/No ✗, 선택한 것으로 답'},{f:'Don\'t you like it? (좋아할 때 대답)',b:'Yes, I do.'}
 ]},
 {id:'12-5', title:'명령문, 감탄문', concept:[
  {h:'명령문', body:'주어(You)를 생략하고 <b>동사원형</b>으로 시작. 부정 명령문은 Don\'t + 동사원형. 「~하자」는 Let\'s + 동사원형(부정: Let\'s not).',
   ex:[{en:'<b>Be</b> quiet in the library.',ko:'도서관에서는 조용히 해라.'},{en:'<b>Don\'t touch</b> the painting.',ko:'그림을 만지지 마라.'},{en:'<b>Let\'s play</b> basketball after school.',ko:'방과 후에 농구 하자.'},{en:'명령문, and ~: …해라, 그러면 ~ / 명령문, or ~: …해라, 그렇지 않으면 ~',ko:'Hurry up, <b>or</b> you\'ll be late.'}]},
  {h:'감탄문', body:'What + a/an + 형용사 + 명사 (+ 주어 + 동사)! / How + 형용사·부사 (+ 주어 + 동사)!',
   ex:[{en:'<b>What a</b> beautiful day (it is)!',ko:'정말 아름다운 날이구나!'},{en:'<b>How</b> fast he runs!',ko:'그는 정말 빨리 달리는구나!'},{en:'<b>What</b> cute puppies they are! (복수·셀 수 없는 명사엔 a/an ✗)',ko:'정말 귀여운 강아지들이구나!'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ careful when you cross the street.',c:['Do','Be','Being','You are'],a:1,exp:'형용사(careful) 앞이므로 be동사의 원형 Be로 시작.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ a wonderful idea it is!',c:['How','What','So','Very'],a:1,exp:'a + 형용사 + 명사 구조 → What 감탄문.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ kind she is!',c:['What','What a','How','So'],a:2,exp:'형용사만 있는 감탄문 → How + 형용사!'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Get up now, ___ you will miss the school bus.',c:['and','or','so','but'],a:1,exp:'명령문, or ~: 그렇지 않으면 ~.'},
  {t:'order',ko:'수업 중에 휴대폰을 사용하지 마라.',words:['Don\'t','use','your phone','in class'],a:'Don\'t use your phone in class.'},
  {t:'write',ko:'정말 흥미로운 이야기구나! (What 감탄문)',hint:'(what, an interesting story)',a:['What an interesting story!','What an interesting story it is!']}
 ],cards:[
  {f:'명령문의 시작',b:'동사원형 (주어 You 생략)'},{f:'부정 명령문',b:'Don\'t + 동사원형'},{f:'「~하자」 / 「~하지 말자」',b:'Let\'s + 동사원형 / Let\'s not + 동사원형'},{f:'What 감탄문 어순',b:'What + a/an + 형용사 + 명사 (+주어+동사)!'},{f:'How 감탄문 어순',b:'How + 형용사/부사 (+주어+동사)!'}
 ]}
]}
