  {h:'간접의문문', body:'의문문이 다른 문장의 일부(명사절)가 된 것. 어순은 <b>의문사 + 주어 + 동사</b>(평서문 어순). 의문사가 없으면 if/whether. 주절 동사가 think, believe, guess, suppose이면 의문사를 <b>문장 맨 앞</b>으로.',
   ex:[{en:'Do you know <b>where he lives</b>? (평서문 어순)',ko:'그가 어디 사는지 아니?'},{en:'<b>What do you think</b> this is? (think류는 의문사 앞으로)',ko:'이게 뭐라고 생각하니?'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Not only she but also they ___ invited.',c:['is','are','was','be'],a:1,exp:'가까운 주어 they에 일치 → are.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Neither he nor I ___ responsible.',c:['is','are','am','be'],a:2,exp:'가까운 주어 I에 일치 → am.'},
  {t:'mc',q:'어순이 알맞은 것은?  I wonder ___ .',c:['where does she live','where she lives','where lives she','does where she live'],a:1,exp:'간접의문문: 의문사 + 주어 + 동사.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ do you think he is?',c:['Do you know who','Who','That who','If who'],a:1,exp:'think류는 의문사를 문장 맨 앞으로 → Who do you think ~?'},
  {t:'order',ko:'나는 그가 언제 도착할지 모른다.',words:['I','don\'t know','when','he will arrive'],a:'I don\'t know when he will arrive.'},
  {t:'write',ko:'너는 그녀가 왜 화났는지 아니?',hint:'(do you know, why, she, angry) ※ 간접의문문',a:['Do you know why she is angry?']}
 ],cards:[
  {f:'not only A but also B = ?',b:'B as well as A (A뿐 아니라 B도)'},{f:'상관접속사의 수 일치',b:'가까운 주어 B에 일치 (both 제외)'},{f:'both A and B의 수',b:'복수'},{f:'간접의문문 어순',b:'의문사 + 주어 + 동사'},{f:'think류 간접의문문',b:'의문사를 문장 맨 앞으로'}
 ]}
]},
{id:9, title:'관계사', units:[
 {id:'c9-1', title:'관계대명사', concept:[
  {h:'격에 따른 관계대명사', body:'주격 who/which/that(+동사), 목적격 who(m)/which/that(+주어+동사, 생략 가능), 소유격 whose/of which. 관계대명사 what(= the thing which, 선행사 포함).',
   ex:[{en:'The house <b>whose roof</b> is red is mine.',ko:'지붕이 빨간 집이 내 것이다.'},{en:'<b>What</b> he said surprised us.',ko:'그가 말한 것이 우리를 놀라게 했다.'}]},
  {h:'전치사 + 관계대명사', body:'전치사를 관계대명사 앞으로 보낼 수 있다(that·who는 불가). the way / the reason 등.',
   ex:[{en:'This is the house <b>in which</b> I was born. (= which I was born in)',ko:'이곳은 내가 태어난 집이다.'},{en:'She is the friend <b>with whom</b> I traveled.',ko:'그녀는 나와 함께 여행한 친구다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I have a friend ___ mother is a doctor.',c:['who','which','whose','whom'],a:2,exp:'「그의 어머니」 소유격 → whose.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ matters most is your health.',c:['That','What','Which','Who'],a:1,exp:'선행사 없이 「~한 것」 → what.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is the pen ___ I write.',c:['which','that','with which','who'],a:2,exp:'write with a pen → with which.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['The man with whom I spoke was kind.','The book which I read was great.','This is the reason for that he left.','What I need is time.'],a:2,exp:'that 앞에는 전치사 불가 → for which 또는 the reason (why) he left.'},
  {t:'order',ko:'그것이 내가 그를 좋아하는 이유이다.',words:['That is','the reason','why','I like him'],a:'That is the reason why I like him.'},
  {t:'write',ko:'그가 원하는 것은 약간의 휴식이다.',hint:'(what, he, want, some rest)',a:['What he wants is some rest.']}
 ],cards:[
  {f:'소유격 관계대명사',b:'whose (of which)'},{f:'관계대명사 what',b:'the thing which (선행사 포함)'},{f:'전치사 + 관계대명사',b:'that·who 앞에는 전치사 불가'},{f:'in which = ?',b:'관계부사 where와 유사'},{f:'목적격 관계대명사',b:'생략 가능'}
 ]},
 {id:'c9-2', title:'관계부사', concept:[
  {h:'관계부사 = 전치사 + 관계대명사', body:'when(시간, = on/in/at which), where(장소, = in/at which), why(이유, = for which), how(방법, = in which). the way와 how는 함께 쓰지 않는다.',
   ex:[{en:'I know the reason <b>why</b> he was absent.',ko:'그가 결석한 이유를 안다.'},{en:'This is <b>how</b> she learned English. (= the way she learned)',ko:'이것이 그녀가 영어를 배운 방법이다.'}]},
  {h:'관계부사의 생략·계속적 용법', body:'선행사(the time, the place, the reason)나 관계부사를 생략하기도 한다. 계속적 용법(콤마)도 가능.',
   ex:[{en:'That\'s (the reason) <b>why</b> I\'m here.',ko:'그것이 내가 여기 있는 이유다.'},{en:'We went to Jeju, <b>where</b> we stayed for a week.',ko:'우리는 제주에 갔고, 거기서 일주일 머물렀다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Tell me the day ___ you can come.',c:['which','when','where','why'],a:1,exp:'시간 선행사(the day) → when.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  This is the town ___ I grew up.',c:['which','when','where','why'],a:2,exp:'장소 선행사 → where.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['This is the way how he did it.','I remember the day when we met.','Show me the place where you found it.','Tell me the reason why you cried.'],a:0,exp:'the way와 how는 함께 못 씀.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  2020 was the year ___ the pandemic began.',c:['where','when','why','which'],a:1,exp:'시간(the year) → when.'},
  {t:'order',ko:'여기가 그 사고가 일어난 곳이다.',words:['This is','the place','where','the accident happened'],a:'This is the place where the accident happened.'},
  {t:'write',ko:'그것이 그가 늦은 이유이다.',hint:'(that, the reason why, he, late)',a:['That is the reason why he was late.']}
 ],cards:[
  {f:'when / where / why / how',b:'시간 / 장소 / 이유 / 방법'},{f:'관계부사 = ?',b:'전치사 + 관계대명사'},{f:'the way와 how',b:'함께 쓸 수 없음'},{f:'where = ?',b:'in/at which'},{f:'관계부사 계속적 용법',b:', where / , when (콤마 + 관계부사)'}
 ]},
 {id:'c9-3', title:'주의해야 할 관계사', concept:[
  {h:'계속적 용법 (콤마 +)', body:'선행사에 대한 부가 설명. 「접속사 + 대명사」로 풀 수 있다. that과 what은 계속적 용법 불가. which는 앞 문장 전체를 받을 수 있다.',
   ex:[{en:'He passed the exam, <b>which</b> surprised everyone. (앞 문장 전체 = 그가 합격한 것)',ko:'그는 시험에 합격했는데, 그것이 모두를 놀라게 했다.'},{en:'I met Suji, <b>who</b> is my old friend.',ko:'나는 수지를 만났는데, 그녀는 내 오랜 친구다.'}]},
  {h:'제한적 vs 계속적', body:'제한적(콤마 없음): 선행사를 한정. 계속적(콤마): 부가 정보. 뜻이 달라진다.',
   ex:[{en:'He has two sons <b>who</b> are doctors. (의사인 아들 외에 더 있을 수 있음)',ko:'제한적'},{en:'He has two sons, <b>who</b> are doctors. (아들은 둘뿐, 둘 다 의사)',ko:'계속적'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  She won first prize, ___ made her parents proud.',c:['that','what','which','who'],a:2,exp:'앞 문장 전체를 받는 계속적 용법 → which (that 불가).'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I have a friend, who lives in Paris.','My car, which is red, is fast.','Seoul, that is the capital, is big.','He said nothing, which annoyed me.'],a:2,exp:'계속적 용법에 that 불가 → which.'},
  {t:'mc',q:'두 문장의 의미 차이로 알맞은 것은?  (가) He has two dogs which are white. (나) He has two dogs, which are white.',c:['둘 다 개는 정확히 두 마리다.','(가)는 개가 더 있을 수 있고, (나)는 개가 두 마리뿐이다.','(나)는 개가 더 있을 수 있다.','차이가 없다.'],a:1,exp:'제한적(가)은 한정, 계속적(나)은 「둘뿐」의 부가 설명.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I visited Busan, ___ I saw the sea.',c:['that','which','where','what'],a:2,exp:'계속적 용법의 장소 관계부사 → , where.'},
  {t:'order',ko:'그는 지각했는데, 그것이 선생님을 화나게 했다.',words:['He was late',',','which','made the teacher angry'],a:'He was late , which made the teacher angry.'},
  {t:'write',ko:'나는 지호를 만났는데, 그는 내 사촌이다. (계속적 용법)',hint:'(I, meet Jiho / who, my cousin)',a:['I met Jiho, who is my cousin.']}
 ],cards:[
  {f:'계속적 용법의 형태',b:', (콤마) + 관계사'},{f:'계속적 용법 불가 관계사',b:'that, what'},{f:'앞 문장 전체를 받는 것',b:'which (계속적 용법)'},{f:'제한적 용법',b:'콤마 없음, 선행사 한정'},{f:'계속적 which = ?',b:'and/but + it/that'}
 ]},
 {id:'c9-4', title:'복합관계사', concept:[
  {h:'복합관계대명사 (-ever)', body:'명사절 또는 양보 부사절을 이끈다. whoever(~하는 누구든지 / 누가 ~하더라도), whichever(~하는 어느 것이든), whatever(~하는 무엇이든 / 무엇을 ~하더라도).',
   table:{head:['복합관계대명사','명사절','양보 부사절'],rows:[['whoever','~하는 사람은 누구든지 (anyone who)','누가 ~하더라도 (no matter who)'],['whatever','~하는 것은 무엇이든 (anything that)','무엇을 ~하더라도 (no matter what)'],['whichever','~하는 어느 것이든','어느 것을 ~하더라도']]},
   ex:[{en:'<b>Whoever</b> comes will be welcome. (명사절: 오는 누구든)',ko:'오는 사람은 누구든 환영이다.'},{en:'<b>Whatever</b> happens, don\'t give up. (양보: 무슨 일이 있어도)',ko:'무슨 일이 있어도 포기하지 마라.'}]},
  {h:'복합관계부사 (-ever)', body:'whenever(~할 때는 언제나 / 언제 ~하더라도), wherever(~하는 곳은 어디든 / 어디서 ~하더라도), however(아무리 ~하더라도 — however + 형용사/부사 + 주어 + 동사).',
   ex:[{en:'<b>However</b> hard it is, I\'ll try.',ko:'아무리 어렵더라도 나는 시도할 것이다.'},{en:'<b>Wherever</b> you go, I\'ll follow.',ko:'네가 어디를 가든 나는 따라갈 것이다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ you decide, I\'ll support you.',c:['However','Whatever','Wherever','Whenever'],a:1,exp:'「무엇을 결정하더라도」 → Whatever.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ tired you are, finish it.',c:['Whatever','Whoever','However','Wherever'],a:2,exp:'however + 형용사(tired): 아무리 ~하더라도.'},
  {t:'mc',q:'같은 의미의 표현은?  Anyone who wants to join is welcome.',c:['Whatever wants','Whoever wants','However wants','Wherever wants'],a:1,exp:'anyone who = whoever.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ I visit her, she is busy.',c:['Whatever','However','Whenever','Whichever'],a:2,exp:'「방문할 때마다」 → Whenever.'},
  {t:'order',ko:'네가 어디를 가든지, 조심해라.',words:['Wherever','you go',',','be careful'],a:'Wherever you go , be careful.'},
  {t:'write',ko:'아무리 바쁘더라도, 아침을 먹어라. (however)',hint:'(however, busy, you are / eat breakfast)',a:['However busy you are, eat breakfast.']}
 ],cards:[
  {f:'whoever = ?',b:'anyone who / no matter who'},{f:'whatever = ?',b:'anything that / no matter what'},{f:'however + ?',b:'형용사/부사 + 주어 + 동사'},{f:'whenever의 의미',b:'~할 때마다 / 언제 ~하더라도'},{f:'복합관계사가 이끄는 절',b:'명사절 또는 양보 부사절'}
 ]}
]},
{id:10, title:'가정법', units:[
 {id:'c10-1', title:'가정법 과거·과거완료·혼합', concept:[
  {h:'가정법 과거 / 과거완료', body:'과거(현재 반대): If + 과거형(were), 주어 + would/could/might + 동사원형. 과거완료(과거 반대): If + had p.p., 주어 + would/could/might have p.p.',
   ex:[{en:'If I <b>knew</b> her number, I <b>would call</b> her. (지금 모름)',ko:'번호를 안다면 전화할 텐데.'},{en:'If you <b>had left</b> earlier, you <b>would have caught</b> it. (안 떠남)',ko:'더 일찍 떠났다면 잡았을 텐데.'}]},
  {h:'혼합 가정법', body:'과거의 일이 <b>현재</b>에 영향을 미칠 때: If + had p.p. ~, 주어 + would/could + 동사원형 (now/today와 함께).',
   ex:[{en:'If I <b>had studied</b> harder, I <b>would be</b> a doctor <b>now</b>.',ko:'더 열심히 공부했더라면 지금 의사일 텐데.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  If I ___ rich, I would help the poor.',c:['am','were','had been','will be'],a:1,exp:'가정법 과거의 be동사 → were.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  If she had studied, she ___ the test.',c:['would pass','would have passed','passed','will pass'],a:1,exp:'가정법 과거완료: would have p.p.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  If he had taken the medicine, he ___ fine now.',c:['would be','would have been','is','was'],a:0,exp:'혼합 가정법: 과거 조건 + 현재 결과(now) → would + 동사원형.'},
  {t:'mc',q:'의미가 알맞은 것은?  If I had had more time, I would have visited you.',c:['시간이 있어서 방문했다.','시간이 없어서 방문하지 못했다.','시간이 생기면 방문할 것이다.','시간이 없지만 방문한다.'],a:1,exp:'가정법 과거완료 = 과거 사실의 반대(실제로 못 함).'},
  {t:'order',ko:'내가 새라면, 너에게 날아갈 텐데.',words:['If I were a bird',',','I would fly','to you'],a:'If I were a bird , I would fly to you.'},
  {t:'write',ko:'내가 그때 더 조심했더라면, 지금 다치지 않았을 텐데. (혼합 가정법)',hint:'(if, I, be more careful then / I, not be hurt now)',a:['If I had been more careful then, I would not be hurt now.',"If I had been more careful then, I wouldn't be hurt now."]}
 ],cards:[
  {f:'가정법 과거',b:'If + 과거형, would/could + 동사원형 (현재 반대)'},{f:'가정법 과거완료',b:'If + had p.p., would/could have p.p. (과거 반대)'},{f:'혼합 가정법',b:'If + had p.p. ~, 주어 + would + 동사원형 (+now)'},{f:'혼합 가정법의 단서',b:'주절에 now/today'},{f:'가정법의 be동사',b:'were (인칭 무관)'}
 ]},
 {id:'c10-2', title:'I wish, as if, It\'s time + 가정법', concept:[
  {h:'I wish + 가정법', body:'과거(현재 소망): I wish + 주어 + 과거형(were). 과거완료(과거 아쉬움): I wish + 주어 + had p.p.',
   ex:[{en:'<b>I wish</b> I <b>could speak</b> five languages.',ko:'5개 국어를 할 수 있으면 좋을 텐데.'},{en:'<b>I wish</b> I <b>had taken</b> that chance.',ko:'그 기회를 잡았더라면 좋았을 텐데.'}]},
  {h:'as if[though] + 가정법', body:'과거(주절과 같은 때, 사실 반대): as if + 과거형. 과거완료(주절보다 이전, 사실 반대): as if + had p.p.',
   ex:[{en:'He talks <b>as if</b> he <b>knew</b> everything. (사실은 모름)',ko:'그는 모든 것을 아는 것처럼 말한다.'},{en:'She acts <b>as if</b> nothing <b>had happened</b>. (전에 일이 있었음)',ko:'그녀는 아무 일도 없었던 것처럼 행동한다.'}]},
  {h:'It\'s time + 가정법 과거', body:'It\'s (high/about) time + 주어 + <b>과거형</b>: 「~할 때가 되었다(아직 안 함)」.',
   ex:[{en:'<b>It\'s time</b> you <b>went</b> to bed.',ko:'네가 잘 시간이다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  I wish I ___ taller.',c:['am','were','have been','will be'],a:1,exp:'I wish + 가정법 과거 → were.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  He speaks as if he ___ there, but he wasn\'t.',c:['is','were','had been','will be'],a:2,exp:'주절보다 이전의 사실 반대 → as if + had p.p.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  It\'s time you ___ your own decisions.',c:['make','made','will make','have made'],a:1,exp:'It\'s time + 주어 + 과거형.'},
  {t:'mc',q:'의미가 알맞은 것은?  I wish I had studied harder.',c:['더 열심히 공부해서 좋다.','더 열심히 공부했더라면 좋았을 텐데.','더 열심히 공부할 것이다.','더 열심히 공부하고 있다.'],a:1,exp:'I wish + 과거완료 = 과거에 대한 아쉬움.'},
  {t:'order',ko:'그녀는 마치 여왕인 것처럼 행동한다.',words:['She','behaves','as if','she were','a queen'],a:'She behaves as if she were a queen.'},
  {t:'write',ko:'내가 그 답을 안다면 좋을 텐데.',hint:'(I wish, I, know the answer)',a:['I wish I knew the answer.']}
 ],cards:[
  {f:'I wish + 과거형',b:'~라면 좋을 텐데 (현재 소망)'},{f:'I wish + had p.p.',b:'~했더라면 좋았을 텐데 (과거 아쉬움)'},{f:'as if + 과거형',b:'마치 ~인 것처럼 (주절과 같은 때, 사실 반대)'},{f:'as if + had p.p.',b:'마치 ~였던 것처럼 (이전, 사실 반대)'},{f:'It\'s time + 주어 + ?',b:'과거형 (~할 때가 되었다)'}
 ]},
 {id:'c10-3', title:'주의해야 할 가정법', concept:[
  {h:'if의 생략과 도치', body:'if를 생략하면 (were/had/should)가 주어 앞으로 도치된다. Were I ~ / Had I known ~ / Should you need ~.',
   ex:[{en:'<b>Were I</b> you, I would accept it. (= If I were you)',ko:'내가 너라면 그것을 받아들일 텐데.'},{en:'<b>Had I known</b>, I would have helped. (= If I had known)',ko:'알았더라면 도왔을 텐데.'}]},
  {h:'without / but for', body:'「~이 없다면/없었다면」. = If it were not for(가정법 과거) / If it had not been for(가정법 과거완료).',
   ex:[{en:'<b>Without</b> water, we couldn\'t live. (= If it were not for)',ko:'물이 없다면 우리는 살 수 없을 것이다.'},{en:'<b>But for</b> your help, I would have failed.',ko:'네 도움이 없었다면 나는 실패했을 것이다.'}]},
  {h:'I wish 외 소망 표현', body:'if only(~라면 좋을 텐데, I wish보다 강한 소망).',
   ex:[{en:'<b>If only</b> I had more money!',ko:'돈이 더 있다면 좋을 텐데!'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ I known the truth, I would have told you.',c:['If','Had','Were','Should'],a:1,exp:'If I had known → 도치 Had I known.'},
  {t:'mc',q:'같은 의미의 문장은?  If it were not for music, life would be boring.',c:['With music, life would be boring.','Without music, life would be boring.','But for boring, life would be music.','If music, life boring.'],a:1,exp:'If it were not for = Without.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  ___ you need help, call me.',c:['Should','Were','Had','If not'],a:0,exp:'If you should need → 도치 Should you need.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Were I rich, I would travel.','But for your advice, I would have failed.','If had I more time, I would rest.','Without air, nothing could live.'],a:2,exp:'도치는 Had I more time (조동사가 주어 앞).'},
  {t:'order',ko:'네 도움이 없었다면, 나는 그것을 끝내지 못했을 것이다.',words:['But for','your help',',','I couldn\'t have finished it'],a:'But for your help , I couldn\'t have finished it.'},
  {t:'write',ko:'내가 너라면, 나는 사과할 텐데. (if 생략·도치)',hint:'(were, I, you / I would apologize)',a:['Were I you, I would apologize.']}
 ],cards:[
  {f:'if 생략 시 도치',b:'were/had/should를 주어 앞으로'},{f:'Had I known = ?',b:'If I had known'},{f:'without / but for = ?',b:'If it were not for / If it had not been for'},{f:'if only의 의미',b:'~라면 좋을 텐데 (강한 소망)'},{f:'Should you need = ?',b:'If you should need'}
 ]}
]},
{id:11, title:'일치와 화법', units:[
 {id:'c11-1', title:'수의 일치', concept:[
  {h:'주어와 동사의 수 일치', body:'단수 취급: each/every + 명사, -one/-body/-thing, 동명사·to부정사 주어, 「the number of + 복수명사(~의 수)」, 학문명(mathematics, physics), 시간·거리·금액(하나의 단위). 복수 취급: 「a number of + 복수명사(많은 ~)」, both/several.',
   ex:[{en:'<b>The number of</b> students <b>is</b> increasing.',ko:'학생 수가 증가하고 있다. (단수)'},{en:'<b>A number of</b> students <b>are</b> absent.',ko:'많은 학생이 결석했다. (복수)'},{en:'Ten years <b>is</b> a long time.',ko:'10년은 긴 시간이다. (단위 → 단수)'}]},
  {h:'상관접속사·부분 표현', body:'both A and B(복수). 나머지 상관접속사·「A of B」는 <b>가까운/뒤 명사</b>에 일치. most/some/half/부분 of + 명사는 of 뒤 명사에 일치.',
   ex:[{en:'<b>Most of</b> the water <b>is</b> gone. / <b>Most of</b> the students <b>are</b> here.',ko:'물 대부분이 없어졌다 / 학생 대부분이 여기 있다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  Each of the boys ___ a uniform.',c:['wear','wears','are wearing','were'],a:1,exp:'each of + 복수 → 단수동사 wears.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  A number of people ___ waiting outside.',c:['is','was','are','has'],a:2,exp:'a number of + 복수명사 = 복수 취급.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  Most of the information ___ useful.',c:['are','were','is','have'],a:2,exp:'of 뒤 명사(information, 불가산) → 단수 is.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['Physics is difficult.','Five dollars is enough.','Reading books are fun.','The number of cars has grown.'],a:2,exp:'동명사 주어는 단수 → Reading books is fun.'},
  {t:'order',ko:'학생들 대부분이 그 시험을 통과했다.',words:['Most of','the students','passed','the exam'],a:'Most of the students passed the exam.'},
  {t:'write',ko:'많은 관광객들이 그 도시를 방문한다.',hint:'(a number of, tourists, visit the city) ※ 복수 일치',a:['A number of tourists visit the city.']}
 ],cards:[
  {f:'the number of + 복수명사',b:'~의 수 (단수 취급)'},{f:'a number of + 복수명사',b:'많은 ~ (복수 취급)'},{f:'동명사·to부정사 주어의 수',b:'단수'},{f:'시간·거리·금액(단위)',b:'단수 취급'},{f:'most/some of + 명사',b:'of 뒤 명사에 일치'}
 ]},
 {id:'c11-2', title:'시제의 일치', concept:[
  {h:'기본 원칙', body:'주절 현재 → 종속절 모든 시제. 주절 과거 → 종속절 과거 또는 과거완료. will→would, can→could, may→might, must→had to.',
   ex:[{en:'I think he <b>is</b> honest. → I thought he <b>was</b> honest.',ko:'그가 정직하다고 생각한다 → 생각했다.'}]},
  {h:'예외', body:'불변의 진리·과학적 사실·속담 → 항상 현재. 역사적 사실 → 항상 과거. 가정법 → 시제 일치 영향 없음. 현재의 습관 → 현재.',
   ex:[{en:'She said that the sun <b>rises</b> in the east.',ko:'해가 동쪽에서 뜬다고 말했다. (진리 → 현재)'},{en:'We learned that the Korean War <b>broke out</b> in 1950.',ko:'한국전쟁이 1950년에 일어났다고 배웠다. (역사 → 과거)'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  He said that he ___ busy then.',c:['is','was','will be','has been'],a:1,exp:'주절 과거 → 종속절 과거.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  The teacher told us that light ___ faster than sound.',c:['traveled','travels','had traveled','would travel'],a:1,exp:'과학적 사실은 항상 현재.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She said she ___ help me the next day.',c:['will','would','can','may'],a:1,exp:'주절 과거 → will은 would로.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['I knew that she had left.','He said water boils at 100℃.','We learned that Sejong invents Hangeul.','They thought he was right.'],a:2,exp:'역사적 사실은 과거 → invented.'},
  {t:'order',ko:'나는 그가 이미 떠났다고 생각했다.',words:['I','thought','that','he had already left'],a:'I thought that he had already left.'},
  {t:'write',ko:'그녀는 다음 날 올 것이라고 말했다.',hint:'(she, say, that, she, come, the next day) ※ 시제 일치',a:['She said that she would come the next day.']}
 ],cards:[
  {f:'주절 과거 → 종속절',b:'과거 또는 과거완료'},{f:'주절 과거일 때 조동사',b:'would/could/might/had to'},{f:'과학적 사실·진리',b:'항상 현재 (일치 예외)'},{f:'역사적 사실',b:'항상 과거'},{f:'가정법과 시제 일치',b:'영향 없음'}
 ]},
 {id:'c11-3', title:'화법', concept:[
  {h:'평서문·의문문의 간접화법', body:'평서문: say(to) → say/tell + that절. 의문문: ask + (목적어) + 의문사/if(whether) + 주어 + 동사(평서문 어순). 인칭·시제·부사어 조정.',
   ex:[{en:'He said, "I\'ll help you." → He said (that) he <b>would help</b> me.',ko:'그는 나를 돕겠다고 말했다.'},{en:'She asked, "Are you okay?" → She asked <b>if I was</b> okay.',ko:'그녀는 내가 괜찮은지 물었다.'}]},
  {h:'명령문·제안문의 간접화법', body:'명령문: tell/order/advise/ask + 목적어 + <b>to부정사</b>(부정은 not to). 제안: suggest + (동)명사/that절.',
   ex:[{en:'He said to me, "Open the door." → He <b>told me to open</b> the door.',ko:'그는 나에게 문을 열라고 말했다.'},{en:'She said, "Don\'t be late." → She <b>told me not to be</b> late.',ko:'그녀는 나에게 늦지 말라고 말했다.'}]},
  {h:'부사(구) 전환', body:'now→then, today→that day, tomorrow→the next day, yesterday→the day before, ago→before, here→there, this→that.'}
 ],probs:[
  {t:'mc',q:'간접화법으로 바르게 바꾼 것은?  He said to me, "Close the window."',c:['He told me close the window.','He told me to close the window.','He said me to close the window.','He asked me closing the window.'],a:1,exp:'명령문: tell + 목적어 + to부정사.'},
  {t:'mc',q:'빈칸에 알맞은 것은?  She told me ___ worry.',c:['don\'t','not to','to not','not'],a:1,exp:'부정 명령문 간접화법 → not to + 동사원형.'},
  {t:'mc',q:'간접화법으로 바르게 바꾼 것은?  He said, "Where do you live?"',c:['He asked where do I live.','He asked where I lived.','He asked where did I live.','He said where I live.'],a:1,exp:'의문사 + 주어 + 동사, 시제 일치.'},
  {t:'mc',q:'어법상 <u>틀린</u> 문장은?',c:['She asked if I was hungry.','He told me to be quiet.','She said that she would come the next day.','He asked me what time was it.'],a:3,exp:'간접의문문 어순 → what time it was.'},
  {t:'order',ko:'그는 나에게 그를 도와 달라고 부탁했다.',words:['He','asked','me','to help him'],a:'He asked me to help him.'},
  {t:'write',ko:'그녀는 나에게 그날 바쁜지 물었다. (if 사용)',hint:'(she, ask me, if, I, busy, that day)',a:['She asked me if I was busy that day.']}
 ],cards:[
  {f:'평서문 간접화법 연결',b:'say/tell + that절'},{f:'의문문 간접화법 (의문사 없음)',b:'ask + if/whether + 주어 + 동사'},{f:'명령문 간접화법',b:'tell/order + 목적어 + to부정사'},{f:'부정 명령문 간접화법',b:'not to + 동사원형'},{f:'tomorrow / ago 전환',b:'the next day / before'}
 ]}
]},
{id:12, title:'기타 구문', units:[
 {id:'c12-1', title:'강조, 부정구문, 병렬', concept:[
  {h:'강조', body:'It is[was] ~ that ... 강조구문(주어·목적어·부사구 강조: 「…한 것은 바로 ~이다」). 동사 강조: do/does/did + 동사원형. 명사 강조: the very. 의문사 강조: on earth, in the world.',
   ex:[{en:'<b>It was</b> Minsu <b>that</b> broke the window. (범인은 바로 민수)',ko:'창문을 깬 것은 바로 민수였다.'},{en:'I <b>do</b> want to go.',ko:'나는 정말 가고 싶다.'}]},
  {h:'부정구문', body:'부분 부정: not + all/every/always/both(모두/항상 ~인 것은 아니다). 전체 부정: no, none, neither, never. 이중 부정 주의.',
   ex:[{en:'<b>Not all</b> birds can fly.',ko:'모든 새가 날 수 있는 것은 아니다. (부분 부정)'},{en:'<b>Neither</b> of them <b>knows</b> the answer.',ko:'둘 다 답을 모른다. (전체 부정)'}]},
  {h:'병렬', body:'and, but, or로 연결되는 말은 문법적으로 대등한 형태(병렬 구조).',
   ex:[{en:'She likes <b>swimming, running, and cycling</b>.',ko:'그녀는 수영, 달리기, 자전거 타기를 좋아한다.'}]}
 ],probs:[
  {t:'mc',q:'빈칸에 알맞은 것은?  It was in the park ___ I found the wallet.',c:['who','which','that','what'],a:2,exp:'It is ~ that 강조구문 (부사구 강조).'},
  {t:'mc',q:'빈칸에 알맞은 것은?  I ___ believe you. Trust me.',c:['do','does','did','am'],a:0,exp:'동사 강조 do + 동사원형.'},
  {t:'mc',q:'의미가 알맞은 것은?  Not every student passed.',c:['모든 학생이 통과했다.','모든 학생이 통과한 것은 아니다.','어떤 학생도 통과하지 못했다.','학생이 없다.'],a:1,exp:'not every = 부분 부정.'},
  {t:'mc',q:'병렬 구조가 <u>어색한</u> 것은?',c:['He is smart and kind.','I like to read and to write.','She enjoys singing and to dance.','We can walk or run.'],a:2,exp:'병렬: singing and dancing (형태 통일).'},
  {t:'order',ko:'내가 그를 만난 것은 바로 어제였다.',words:['It was','yesterday','that','I met him'],a:'It was yesterday that I met him.'},
  {t:'write',ko:'나는 정말 그 영화를 좋아한다. (동사 강조 do)',hint:'(I, do, like the movie)',a:['I do like the movie.']}
 ],cards:[
  {f:'It is ~ that 강조구문',b:'…한 것은 바로 ~이다'},{f:'동사 강조',b:'do/does/did + 동사원형'},{f:'부분 부정',b:'not + all/every/always/both'},{f:'전체 부정',b:'no, none, neither, never'},{f:'병렬 구조',b:'and/but/or로 대등한 형태 연결'}
 ]},
 {id:'c12-2', title:'도치, 생략, 동격', concept:[
  {h:'도치', body:'부정어(never, little, hardly, not only, no sooner)나 부사구가 문장 앞에 오면 「(조)동사 + 주어」로 도치. There/Here + 동사 + 주어. so/neither + (조)동사 + 주어(~도 그렇다/아니다).',
   ex:[{en:'<b>Never have I seen</b> such a mess.',ko:'그런 엉망진창은 본 적이 없다.'},{en:'A: I\'m tired. B: <b>So am I</b>.',ko:'나 피곤해. — 나도 그래.'},{en:'A: I don\'t like it. B: <b>Neither do I</b>.',ko:'나는 그거 안 좋아해. — 나도 안 좋아해.'}]},
  {h:'생략', body:'반복되는 어구, 부사절의 「주어 + be동사」 생략(주절과 주어가 같을 때).',
   ex:[{en:'When (you are) in doubt, ask.',ko:'의심스러우면 물어봐라.'}]},
  {h:'동격', body:'명사(구)를 다른 명사(구)로 다시 설명. 콤마, of, that(동격절)로 나타낸다.',
   ex:[{en:'the fact <b>that</b> he lied (그가 거짓말했다는 사실)',ko:'동격의 that절'},{en:'Seoul, <b>the capital of Korea</b>, is huge.',ko:'한국의 수도인 서울은 거대하다.'}]}

function loadLocal(){ try{ const r=localStorage.getItem(lsKey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveState(now){
  if(!U||!S) return;
  // 통합 DB: 날짜별 학습 기록 (플래너가 집중 시간을 학습시간으로 인정)
  const dl=S.daily; if(dl&&dl.date){ if(!S.dayLog||typeof S.dayLog!=='object') S.dayLog={}; S.dayLog[dl.date]={sec:dl.activeSec||0, answered:dl.answered||0, correct:dl.correct||0, cards:dl.cards||0}; }
  localStorage.setItem(lsKey(), JSON.stringify(S));
  if(LOCAL) return;
  clearTimeout(saveTimer);
  const doSave=()=>{
    // 학습 기록 전체 → 플래너와 같은 곳 (부모는 플래너 가족 연결로 열람)
    appRef().set({...S, summary:giSummary(), updatedAt:Date.now()}).catch(()=>{});
    // 친구 랭킹용 공개 요약만 giUsers에
    db.collection('giUsers').doc(U.uid).set({...giSummary(), email:(U.email||'').toLowerCase()},{merge:true}).catch(()=>{});
  };
  if(now) doSave(); else saveTimer=setTimeout(doSave, 1200);
}
function touchStreak(){
  const t=todayStr();
  if(S.lastDay===t) return;
  S.streak = (S.lastDay===yesterStr()) ? (S.streak||0)+1 : 1;
  S.lastDay=t;
}
function checkBadges(){
  const got=[];
  BADGES.forEach(b=>{ if(!S.badges.includes(b.id) && b.chk(S)){ S.badges.push(b.id); got.push(b); } });
  if(got.length) toast('🎖️ 배지 획득: '+got.map(b=>b.t).join(', '));
}

if(LOCAL){ document.readyState==='loading' ? document.addEventListener('DOMContentLoaded', startLocal) : startLocal(); }
else auth.onAuthStateChanged(async user=>{
  U=user;
  if(!user){ S=null; renderAuth(); return; }
  const local=loadLocal();
  let fresh=false;
  try{
    const doc=await appRef(user.uid).get();
    if(doc.exists){ const d=doc.data(); delete d.summary; S={...defaultState(), ...d}; }
    else { S = local || migrateLocal() || defaultState(user.displayName); fresh=!local; }
  }catch(e){ S = local || migrateLocal() || defaultState(user.displayName); }
  sanitizeS();
  if(pendingName){ S.name=pendingName; pendingName=null; }
  if(!S.name) S.name=user.displayName||'학습자';
  saveState(true);
  loadFriends();
  // 통합 전 기록이 있을 수 있으니 처음 한 번 가져오기 화면을 보여 줌
  VIEW=(fresh&&!S.importChecked&&doneCount(S)===0)?'import':'home'; render();
});

async function loadFriends(){
  FRIENDS=[]; PENDING_FRIEND_REQUESTS=[];
  if(LOCAL||!U) return;
  try{
    const [received,sent]=await Promise.all([
      db.collection('giFriendRequests').where('toUid','==',U.uid).get(),
      db.collection('giFriendRequests').where('fromUid','==',U.uid).get()
    ]);
    const friendIds=new Set();
    received.forEach(d=>{ const r={id:d.id,...d.data()}; if(r.status==='pending') PENDING_FRIEND_REQUESTS.push(r); if(r.status==='accepted') friendIds.add(r.fromUid); });
    sent.forEach(d=>{ const r=d.data(); if(r.status==='accepted') friendIds.add(r.toUid); });
    await Promise.all([...friendIds].map(async uid=>{ try{ const d=await db.collection('giUsers').doc(uid).get(); if(d.exists) FRIENDS.push({uid,...d.data()}); }catch(e){} }));
  }catch(e){ console.warn('친구 목록을 불러오지 못했습니다',e); }
  if(VIEW==='rank') render();
}

  else if(VIEW==='rank') html=vRank();

  if(VIEW==='set') bindSet();

}

function vLearn(){
  let body='';
  if(curLevel>=1&&curLevel<=3){
    body = LEVELS[curLevel].map(ch=>{
      const dn=ch.units.filter(u=>S.prog[u.id]&&S.prog[u.id].d).length;
      return `<div class="chap ${openChap===ch.id?'open':''}" data-ch="${ch.id}">
        <div class="chap-h"><div class="chap-no">${String(ch.id).padStart(2,'0')}</div>
          <div><div class="t">${esc(ch.title)}</div><div class="m">${dn}/${ch.units.length} 유닛 완료</div></div>
          ${BOSS_CHAPTERS[curLevel].includes(ch.id)?`<button class="btn small ghost" data-boss="${ch.id}" style="margin-right:8px">👑 보스전</button>`:''}<span class="arr">›</span></div>
        <div class="units">${ch.units.map(u=>{
          const p=S.prog[u.id]||{};
          const dot=p.d?'done':(p.c?'half':'');
          const st=p.d?`완료 · 퀴즈 ${p.q}/${p.qt||6}`:(p.c?'개념 학습함 · 퀴즈 미통과':'미학습');
          return `<div class="unit-row" data-u="${u.id}"><div class="u-dot ${dot}">${p.d?'✓':''}</div>
            <div><div class="ut">Unit ${u.id.split('-')[1]}. ${esc(u.title)}</div><div class="us">${st}</div></div></div>`;
        }).join('')}</div></div>`;
    }).join('');
  } else {
    body=`<div class="lock-note"><div class="big">🔒</div><b>Level ${curLevel}는 준비 중입니다</b><div class="muted" style="margin-top:6px">Level 1·2를 먼저 완주해 보세요!</div></div>`;
  }
  return `<div class="top"><h1>학습 지도</h1><div class="sub">개념 → 퀴즈(6문제 중 ${PASS_NEED}개 이상) → 완료</div></div>
  <div class="wrap"><div class="ltabs">
    <button data-l="1" class="${curLevel===1?'on':''}">Level 1</button>
    <button data-l="2" class="${curLevel===2?'on':''}">Level 2</button>
    <button data-l="3" class="${curLevel===3?'on':''}">Level 3</button>

function startBoss(chId){
  if(!BOSS_CHAPTERS[curLevel].includes(chId)) return;
  if((S.energy||0)<20){ toast('⚡ Energy 20이 필요해요. 집중 학습·암기로 충전하세요!'); return; }
  const ch=LEVELS[curLevel].find(c=>c.id===chId); if(!ch) return;
  S.energy-=20; saveState();
  const probs=shuffle(ch.units.flatMap(u=>u.pool&&u.pool.length?u.pool:u.probs)).slice(0,10);
  if(!probs.length){ toast('보스전 문제를 준비 중입니다'); return; }
  curUnit={id:'boss-'+curLevel+'-'+chId,chId,title:'Grammar Boss — '+ch.title,chTitle:'Chapter '+String(chId).padStart(2,'0'),concept:[]};
  quiz={boss:true,bossKey:curUnit.id,adaptive:false,probs,total:probs.length,idx:0,answers:[],picked:null,builtIdx:[],typed:'',checked:false,shuf:null}; curStep=1; VIEW='unit'; render();
}
function openUnit(id){
  curUnit = ALL_UNITS.find(u=>u.id===id);
  curStep = 0; quiz=null;

function pickAdaptive(pool, used, targetDiff, dir){
  // 미출제 문제 중 targetDiff에 가장 가까운 것. 동거리면 진행 방향(dir: +1 상승/-1 하강) 쪽을 우선.
  const remain = pool.map((p,i)=>i).filter(i=>!used.includes(i));
  if(!remain.length) return -1;
  const score=i=>{ const d=pool[i].d||3, gap=Math.abs(d-targetDiff);
    // 방향 보정: 상승 중이면 더 높은 난이도를, 하강 중이면 더 낮은 난이도를 살짝 선호
    const bias = dir ? (dir>0 ? (5-d) : (d-1))*0.01 : 0;
    return gap + bias; };
  let best=[], bestSc=1e9;
  remain.forEach(i=>{ const s=score(i); if(s<bestSc-1e-9){ bestSc=s; best=[i]; } else if(Math.abs(s-bestSc)<1e-9) best.push(i); });
  return best[Math.floor(Math.random()*best.length)];
}
function startQuiz(){
  if(curUnit.pool && curUnit.pool.length){
    const len=Math.min(QUIZ_LEN, curUnit.pool.length);
    quiz={adaptive:true, pool:curUnit.pool, used:[], seq:[], diff:START_DIFF, total:len,
          idx:0, answers:[], picked:null, builtIdx:[], typed:'', checked:false, shuf:null, diffTrace:[]};
    const first=pickAdaptive(quiz.pool, quiz.used, quiz.diff, 0);
    quiz.used.push(first); quiz.seq.push(first);
    quiz.probs=[quiz.pool[first]];
  } else {
    quiz={adaptive:false, probs:curUnit.probs, total:curUnit.probs.length,
          idx:0, answers:[], picked:null, builtIdx:[], typed:'', checked:false, shuf:null};
  }
  curStep=1;
}
function passNeed(){ return quiz.adaptive ? Math.ceil(quiz.total*0.6) : PASS_NEED; }
function normalize(s){ return (s||'').toLowerCase().replace(/[.?!]/g,'').replace(/\s+,/g,',').replace(/,/g,' ').replace(/’/g,"'").replace(/\s+/g,' ').trim(); }
function bindUnit(){
  document.getElementById('u-back').onclick=()=>{ VIEW='learn'; render(); };
  if(curStep===0){
    document.getElementById('to-quiz').onclick=()=>{
      if(!S.prog[curUnit.id]) S.prog[curUnit.id]={};
      S.prog[curUnit.id].c=1; touchStreak(); saveState();
      startQuiz(); render();
    };
    return;
  }
  if(curStep===1){
    const p=quiz.probs[quiz.idx];
    if(p.t==='mc') document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{ if(quiz.checked) return; quiz.picked=+b.dataset.i; render(); });
    if(p.t==='order'){
      document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{ if(quiz.checked) return; quiz.builtIdx.push(+b.dataset.w); render(); });

    }
    if(p.t==='write'){ const w=document.getElementById('w-in'); w.oninput=()=>quiz.typed=w.value; }
    document.getElementById('q-go').onclick=()=>{
      if(!quiz.checked){
        let ok=false;
        if(p.t==='mc'){ if(quiz.picked===null){ toast('보기를 선택해 주세요'); return; } ok = quiz.picked===p.a; }
        else if(p.t==='order'){ if(quiz.builtIdx.length<p.words.length){ toast('모든 단어를 사용해 주세요'); return; }
          ok = normalize(quiz.builtIdx.map(i=>p.words[i]).join(' '))===normalize(p.a); }
        else { const t=quiz.typed.trim(); if(!t){ toast('문장을 입력해 주세요'); return; }
          const ans=Array.isArray(p.a)?p.a:[p.a]; ok = ans.some(a=>normalize(a)===normalize(t)); }
        quiz.checked=true; quiz.answers.push(ok);
        if(ok){ gainXP(PTS_PROBLEM); }
        recordAnswer(ok,p);
        const fb=document.getElementById('fb');
        const right = p.t==='mc' ? ('①②③④'[p.a]+' '+p.c[p.a]) : (Array.isArray(p.a)?p.a[0]:p.a);
        fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'⭕ 정답! +'+PTS_PROBLEM+' XP':'❌ 오답'}</b><br>정답: <span class="eng">${p.t==='mc'?right:esc(right)}</span>${p.exp?`<div class="muted" style="margin-top:3px">${esc(p.exp)}</div>`:''}</div>`;
        if(p.t==='mc') document.querySelectorAll('.choices button').forEach((b,i)=>{ if(i===p.a) b.classList.add('ok'); else if(i===quiz.picked) b.classList.add('no'); });
        document.getElementById('q-go').textContent = quiz.idx+1<quiz.probs.length ? '다음 문제' : '결과 보기';
        saveState();
      } else {
        // 적응형: 방금 정오로 난이도 조정
        if(quiz.adaptive){
          const lastOk=quiz.answers[quiz.answers.length-1];
          quiz.diffTrace.push(quiz.diff);
          quiz.diff = Math.max(1, Math.min(5, quiz.diff + (lastOk?1:-1)));
        }
        quiz.idx++; quiz.picked=null; quiz.builtIdx=[]; quiz.typed=''; quiz.checked=false; quiz.shuf=null;
        if(quiz.idx>=quiz.total){
          const score=quiz.answers.filter(a=>a).length;
          if(quiz.boss){ if(score>=passNeed()&&!S.boss[quiz.bossKey]){ S.boss[quiz.bossKey]=1; gainXP(PTS_BOSS,'👑 보스 클리어'); } }
          else { const pr=S.prog[curUnit.id]||(S.prog[curUnit.id]={}); pr.q=Math.max(pr.q||0, score); pr.qt=quiz.total; if(score>=passNeed() && !pr.d){ pr.d=1; gainXP(PTS_UNIT,'🎉 단원 완료'); } }
          touchStreak(); checkBadges(); saveState(true);
          curStep=2;
        } else {
          if(quiz.adaptive){
            const lastOk=quiz.answers[quiz.answers.length-1];
            const ni=pickAdaptive(quiz.pool, quiz.used, quiz.diff, lastOk?1:-1);
            quiz.used.push(ni); quiz.seq.push(ni); quiz.probs.push(quiz.pool[ni]);
          }
        }
        render();
      }
    };
    return;
  }
  document.getElementById('r-retry').onclick=()=>{ startQuiz(); render(); };
  document.getElementById('r-done').onclick=()=>{
    const pass=quiz.answers.filter(a=>a).length>=passNeed();
    if(pass){ VIEW='learn'; } else { curStep=0; }
    render();
  };
}

        <div><div class="lb-name">${esc(S.name)} (나)</div><div class="lb-sub">완료 ${doneCount(S)}/${TOTAL_UNITS} · 🔥${S.streak||0}일</div></div>
        <div class="lb-pts">${S.pts}P</div></div>
      <div class="card muted" style="margin-top:12px;line-height:1.7">친구 이메일 신청·수락은 온라인 연동 기능이에요.<br>Firebase 설정 후 로그인하면 사용할 수 있습니다.</div>
    </div>`;
  }
  const rows=[{name:S.name+' (나)', pts:S.pts, streak:S.streak||0, done:doneCount(S), total:TOTAL_UNITS, me:true},
    ...FRIENDS.map(c=>({name:c.name, pts:c.pts||0, streak:c.streak||0, done:(c.done!=null?c.done:doneCount(c)), total:TOTAL_UNITS}))]
    .sort((a,b)=>b.pts-a.pts);
  return `<div class="top"><h1>친구 랭킹</h1><div class="sub">XP 순 · 친구와 함께 성장해요!</div></div>
  <div class="wrap">
    ${rows.map((r,i)=>`<div class="lb-row ${r.me?'me':''}"><div class="lb-rank">${['🥇','🥈','🥉'][i]||i+1}</div>
      <div><div class="lb-name">${esc(r.name)}</div><div class="lb-sub">완료 ${r.done}/${r.total} · 🔥${r.streak}일</div></div>
      <div class="lb-pts">${r.pts} XP</div></div>`).join('')}
    <div class="sect">친구 신청</div>
    <div class="card"><div class="row">
      <input class="winput" id="f-email" placeholder="친구 이메일 주소" type="email" style="margin:0">
      <button class="btn small" id="f-send" style="flex-shrink:0">신청</button></div>
      <div class="muted" style="margin-top:9px">상대방이 수락하면 자동으로 친구 랭킹에 표시됩니다.</div>
    </div>
    ${PENDING_FRIEND_REQUESTS.length?`<div class="sect">받은 친구 신청</div>${PENDING_FRIEND_REQUESTS.map(r=>`<div class="card" style="margin-bottom:8px"><div class="row"><div><b>${esc(r.fromName||r.fromEmail)}</b><div class="muted" style="margin-top:3px">${esc(r.fromEmail||'')}</div></div><button class="btn small" data-accept="${r.id}">수락</button><button class="btn small ghost" data-decline="${r.id}">거절</button></div></div>`).join('')}`:''}
  </div>`;
}
function bindRank(){
  if(LOCAL) return;
  document.getElementById('f-send').onclick=async ()=>{
    const email=document.getElementById('f-email').value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast('이메일 주소를 확인해 주세요'); return; }
    if(email===(U.email||'').toLowerCase()){ toast('내 이메일로는 신청할 수 없어요'); return; }
    try{
      const found=await db.collection('giUsers').where('email','==',email).limit(1).get();
      if(found.empty){ toast('해당 이메일의 사용자를 찾을 수 없습니다. 상대방이 먼저 로그인해야 해요'); return; }
      const target=found.docs[0];
      await db.collection('giFriendRequests').add({fromUid:U.uid,fromName:S.name,fromEmail:U.email||'',toUid:target.id,toEmail:email,status:'pending',createdAt:Date.now()});
      toast('친구 신청을 보냈습니다'); document.getElementById('f-email').value='';
    }catch(e){ toast('신청 중 오류가 발생했습니다'); }
  };
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async ()=>{ try{ await db.collection('giFriendRequests').doc(b.dataset.accept).update({status:'accepted',acceptedAt:Date.now()}); toast('친구 신청을 수락했습니다'); loadFriends(); }catch(e){ toast('수락 중 오류가 발생했습니다'); } });
  document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=async ()=>{ try{ await db.collection('giFriendRequests').doc(b.dataset.decline).update({status:'declined'}); loadFriends(); }catch(e){ toast('처리 중 오류가 발생했습니다'); } });
}

/* ================= 설정 ================= */
function vSet(){
  return `<div class="top"><h1>설정</h1></div>
  <div class="wrap">
    <div class="card"><div class="field"><label>이름 (랭킹 표시)</label><input id="s-name" value="${esc(S.name)}"></div>
      <button class="btn small" id="s-save">이름 저장</button></div>
    ${LOCAL?`<div class="card"><b style="font-size:14px">📴 로컬 모드</b><div class="muted" style="margin-top:6px;line-height:1.7">기록은 이 기기의 브라우저에 저장됩니다. Firebase 설정을 붙여넣으면 계정 로그인·가족 랭킹이 켜지고 기록도 이어집니다.</div>
      <div style="margin-top:10px"><button class="btn ghost" id="s-reset" style="border-color:var(--bad);color:var(--bad)">기록 전체 초기화</button></div></div>`
    :`<div class="card"><div class="muted">계정: ${esc(U.email||'')} · 플래너와 같은 계정</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="s-import">예전 기록 가져오기</button><button class="btn ghost" id="s-out">로그아웃</button></div></div>`}
    <div class="muted" style="text-align:center;margin-top:14px">Grammar Inside Trainer · Level 1<br>교재와 함께 사용하는 가족 학습용 앱</div>
  </div>`;
}
function bindSet(){
  document.getElementById('s-save').onclick=()=>{ const n=document.getElementById('s-name').value.trim(); if(!n) return; S.name=n; saveState(true); toast('저장되었습니다'); };
  const si=document.getElementById('s-import');
  if(si) si.onclick=()=>{ VIEW='import'; render(); };
  const so=document.getElementById('s-out');
  if(so) so.onclick=async ()=>{ localStorage.removeItem(lsKey()); await auth.signOut(); };
  const sr=document.getElementById('s-reset');
  if(sr) sr.onclick=()=>{ if(confirm('모든 학습 기록을 삭제할까요? 되돌릴 수 없습니다.')){ localStorage.removeItem('gi_state_local'); S=null; U=null; renderLocalSetup(); } };
}
